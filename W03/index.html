/* ---------- Copyright toast + smart right-click / shortcut guard ---------- */
(function(){
  var MSG = 'Intellectual Property of Prof. Shihmin Lo';
  var el = null, timer = null;
  window.showCopyrightToast = function(){
    if (!el) {
      el = document.createElement('div');
      el.style.cssText = 'position:fixed;left:50%;bottom:48px;transform:translateX(-50%);background:#004030;color:#D8C3A5;padding:10px 20px;border-radius:10px;font-family:Inter,sans-serif;font-size:13px;z-index:9999;box-shadow:0 8px 24px rgba(0,0,0,.3);opacity:0;transition:opacity .25s';
      el.textContent = MSG;
      document.body.appendChild(el);
    }
    el.style.opacity = '1';
    clearTimeout(timer);
    timer = setTimeout(function(){ el.style.opacity = '0'; }, 2000);
  };
  document.addEventListener('contextmenu', function(e){
    var tag = (e.target.tagName || '').toLowerCase();
    if (tag === 'input' || tag === 'textarea' || tag === 'select') return true;
    var sel = window.getSelection().toString().trim();
    if (sel.length > 0) return true;
    e.preventDefault(); window.showCopyrightToast();
  });
  document.addEventListener('keydown', function(e){
    var k = (e.key || '').toLowerCase();
    if (e.key === 'F12') { e.preventDefault(); window.showCopyrightToast(); return; }
    if (e.ctrlKey && k === 'u') { e.preventDefault(); window.showCopyrightToast(); return; }
    if (e.ctrlKey && e.shiftKey && ['i','j','c'].indexOf(k) >= 0) { e.preventDefault(); window.showCopyrightToast(); return; }
  });
  document.addEventListener('dragstart', function(e){
    if (e.target.tagName === 'IMG' || (e.target.closest && e.target.closest('svg'))) e.preventDefault();
  });
})();

    m0_nav: "0. Executive Summary",
    m0_title: "How to Use This Worksheet",
    m0_intro: "This is the pre-class worksheet for W3 of PMCS. Two required materials this week: AIWE · The Layered Model of an AI Work Environment (the main one, with the original nine-layer diagram inside) and AIWF · AI Workflow Methodology. After reading them, you will use the nine-layer model to survey your own working environment — which machine your files sit on, which platform holds your account, which container your project lives in, and which layers break the moment you switch computers. This is not an abstract knowledge test but a field survey: by the end you should be able to say precisely where the repository, the knowledge base, and the memory of your Term Project will each live. The six sections take forty to fifty minutes of individual work; with group discussion and presentation preparation the total lands at roughly two hours, which is exactly the out-of-class investment this course expects. Your entries save automatically in this browser. When you finish, go to Completion & Export and export both formats: the CSV goes to Moodle, and the Markdown stays with you — it can become the very first file of your own knowledge base.",

    m0_why_desc: "The most common frustration students hit with AI is not a badly written prompt. It is not knowing where the files are, whether the AI can see them, and why everything breaks on a different computer. If this layer stays fuzzy, the four engineering dimensions, the harness, and deployment will all jam later. So the first foundation of the semester is knowing where you are standing.",

    m1_overview: "Fill in the administrative details first, then settle the presentation split during group discussion. Two groups present each week for 10 minutes, and every member must speak for one to two minutes — this section pins down who covers what and for how long, so nobody is being volunteered at the podium.",

    m1_deep: "Splitting the work is not the same as dividing it. The point of a jigsaw is that the part you own is a part nobody else read, so what you say carries real information for your teammates. The nine layers split naturally: two people take three layers each, or one person takes one or two layers plus the break-point diagnosis. Write the seconds down — that is the only way the total stays under control.",

    m2_nav: "2. Nine-Layer Survey", m2_title: "Nine-Layer Survey: My Working Environment",
    m2_overview: "The core task of the week. Write your own actual situation layer by layer — not the textbook definition, but yours. One sentence minimum per box; the more concrete you are, the sharper the break-point diagnosis in section 3 becomes.",
    m2_highlights: ["Device","Account","Platform","Container","Task","Context Window"],
    m2_deep: "Here is a test you can run on yourself while writing. If your sentence would still be true after swapping you for any classmate, you have not yet written about yourself. \"I use Claude\" does not count. \"I use a personal paid Claude account registered with my university email and I belong to no team workspace, so shared team files are invisible to me\" does. The two boxes most likely to come out vague are layer 7, the working container, and layer 9, the context window. Spend extra time on those two.",
    m2_svg_cap: "The nine layers, from the physical machine up to what the model can see right now",
    m2_terms: [
      { front: "Device", back: "Laptop, desktop, server, tablet or phone. Determines which machine your local files and tools actually sit on." },
      { front: "AI Platform", back: "Each platform carries its own projects, history, permissions and product names; cloud records rarely cross between platforms." },
      { front: "Account / Workspace", back: "Within one platform: which account you signed in with, which plan you pay for, which company or school workspace you belong to. Cloud chats and projects usually follow this layer." },
      { front: "Interface", back: "Web, desktop or mobile. Different interfaces, different capabilities; reading local files generally needs the desktop app plus local permission." },
      { front: "Working Mode", back: "The core distinction is pure conversation versus the ability to operate on files and tools. Names vary by platform; capabilities vary a lot." },
      { front: "Working Container", back: "Ordinary chat, cloud project, local folder, or synced cloud drive. Determines where your work actually sits and whether it survives a change of device." },
      { front: "Task", back: "A persistent unit of work, not a single model call. It remembers conversation history, working state, permissions, and possibly a bound working folder." },
      { front: "Context Window", back: "The span of context the model can directly see right now. It is not a folder, not a project, and not account storage; when it gets long it is compressed or summarised." }
    ],
    m2_q: [
      { q: "Cloud project records under the same platform and the same account most likely follow which layer?", opts: ["The device layer","The account / workspace layer","The interface layer","The context window"], ans: _A1, exp: "Cloud chats and projects are normally bound to the account, plan and workspace layer, so signing into the same account on another machine usually still finds them." },
      { q: "Which statement correctly describes the context window?", opts: ["A cloud folder that stores files","The same thing as your project space","The span of context the model can directly see right now","The storage limit of your account"], ans: _A2, exp: "The context window is only the model's current field of view, not storage. When it gets long it is compressed or summarised, though it is usually still the same task." },
      { q: "A classmate says \"my files are inside the AI.\" What is the main problem with that sentence?", opts: ["It does not separate local space from cloud space","It does not say which model","It does not mention the subscription plan","It does not mention prompting technique"], ans: _A0, exp: "Local files follow a specific machine and path; cloud records follow the account and workspace. Conflating the two is exactly what produces \"it vanished when I changed computers.\"" },
      { q: "To let an AI read a folder on your own computer, you generally need which of the following?", opts: ["Simply upload the folder into the chat history","A desktop interface plus local permission","A longer context window","A more expensive subscription plan"], ans: _A1, exp: "A pure cloud web interface normally cannot reach local files; reading and writing a local folder generally requires the desktop app and an explicitly authorised local path." }
    ],
    m2_wrapup: "Checkpoint: all nine boxes are filled, and every one of them passes the \"would not be true for anyone else\" test.",

    m3_nav: "3. Break-Point Diagnosis", m3_title: "Break-Point Diagnosis: What Breaks on Another Machine?",
    m3_overview: "Stress-test what you wrote in section 2. Imagine your laptop goes in for repair tomorrow and you must continue the Term Project on a university machine or the desktop at home. Tick the layers that break, then explain why and how you would fix it.",
    m3_highlights: ["Cross-device continuity","Local vs cloud","Fallback","Portability"],
    m3_deep: "The rule of thumb is simple. Whatever follows your account or workspace usually survives a change of device; whatever follows a particular machine and a particular path has to be re-specified, or simply does not exist there. The real danger is not that something breaks — it is that you assumed it would not. Once you have filled this section in, your instinct about where the Term Project belongs will be completely different.",
    m3_check_label: "Tick: this layer breaks or must be reconfigured on another computer",
    m3_why_label: "Explain: why do those layers break?",
    m3_why_ph: "e.g. D:\\PMCS-TP exists only on my own laptop; the university machine has no such path, and the desktop app would need reinstalling and re-authorising the folder.",
    m3_fix_label: "Fix: how would you stop it breaking?",
    m3_fix_ph: "e.g. Move the working folder into a synced cloud drive, or straight into a GitHub repository, so any machine can clone it and carry on.",
    m3_count: "Layers you judged to break",
    m3_wrapup: "Checkpoint: at least one layer is ticked, and the explanation names a concrete path, account or tool rather than speaking in generalities.",

    m4_nav: "4. Language Lab", m4_title: "EMI Language Lab",
    m4_overview: "This course is taught in English, and the output of this section goes straight into your Coggle mindmap. Pick five new words or phrases from this week's required material, plus three words you stumble over when reading aloud.",
    m4_highlights: ["Five new terms","Three hard words","In your own words","Example sentences"],
    m4_deep: "Do not copy the source definition into the \"in your own words\" column. Copying proves only that you found it; rewriting proves you understood it. For the example sentences, write about your own Term Project — that way one effort does two jobs, exercising the language and clarifying the project at the same time.",

    m5_nav: "5. Group Synthesis", m5_title: "Group Synthesis: Comparing Six Nine-Layer Maps",
    m5_overview: "This section is the real work of the group discussion. Not taking turns reading out your own nine layers, but putting all six side by side — one course, and yet six completely different working environments. Which of those differences are mere personal habit, and which will actually bite you when you build the Term Project together?",
    m5_highlights: ["Select, do not dump","Difference audit","Shared risk","A group rule"],
    m5_deep: "One rule is mandatory here: this week's compiler must NOT dump all six individual exports into an AI and ask for a summary. Selection is the point; dumping is not. That idea gets its formal name next week under Context Engineering, but you need to get it right this week. The correct move is for the group to decide which three layers to compare, then take only those three from each member.",
    m5_focus_label: "The three layers we chose to compare (tick three)",
    m5_focus_why: "Why did we skip the others?",
    m5_focus_why_ph: "e.g. Layers 1 and 2 are nearly identical for all six of us, so there was nothing to learn. We picked layers 4, 7 and 9.",
    m5_diff_label: "Where do the biggest differences appear? Give two concrete examples",
    m5_diff_ph: "e.g. A signs in with a university workspace account while the other five use personal accounts, so cloud projects visible to A are invisible to everyone else; C has no local working folder at all.",
    m5_risk_label: "Which of those differences is most likely to bite us during the Term Project?",
    m5_risk_ph: "e.g. Only two of us can install the desktop app, so the other four cannot reach local files and the division of labour will jam.",
    m5_rule_label: "From this comparison, our group sets one rule",
    m5_rule_ph: "e.g. Every Term Project file of this group lives in the shared cloud folder; nobody may keep the only copy on their own machine.",
    m5_rule_note: "These rules accumulate towards the Term Project. When you build the KB in W10, they become the first entries of business_rules.md.",
    m5_wrapup: "Checkpoint: only three layers were compared (nothing was dumped wholesale into an AI), and the rule you set is checkable rather than an aspiration.",

    m6_nav: "6. Bridge to Your TP", m6_title: "Bridge to Your Term Project: Where Will It Live?",
    m6_overview: "Every worksheet in this course carries this section. The nine-layer model is not there to be memorised; it is there to decide where your Term Project goes. Your answers here will directly shape the repository structure you build in W10.",
    m6_highlights: ["Container choice","KB location","Memory location","Riskiest layer"],
    m6_deep: "The Term Project is a system that must run by itself every day and survive to the end of the semester. That means it cannot live inside a single conversation, and it cannot live only on your laptop. When choosing a container, weigh three things at once: whether teammates need to edit it too, whether it must run unattended on a schedule, and whether somebody else could pick it up if you withdrew or your machine died.",
    m6_container_label: "The main working container for my TP",
    m6_container_opts: ["Ordinary chat (AI cloud conversation history)","Cloud project space","Local folder (one specific computer)","Synced cloud drive folder","Git repository (GitHub or similar)"],
    m6_container_why: "Why that one? (address teammate collaboration and scheduled execution)",
    m6_container_why_ph: "e.g. A Git repository. Teammates can clone and push independently and the scheduler can run directly against it; a local folder would mean only my machine can run it.",
    m6_kb_label: "Which layer will my KB files live in?",
    m6_kb_ph: "e.g. In the KB/ folder of the repository — layer 7, the working container, not layer 9, the context window.",
    m6_mem_label: "Where will Memory (state across runs) live?",
    m6_mem_ph: "e.g. A state.json inside the repository, updated daily by the scheduler; it depends on no conversation's memory.",
    m6_risk_label: "Which layer do you judge most likely to cause trouble, and why?",
    m6_risk_ph: "e.g. Layer 6, working mode. One teammate has only the web app and cannot reach local files, so I must avoid assigning them work that needs local permissions.",
    m6_wrapup: "Checkpoint: the reasoning behind the container choice covers both teammate collaboration and scheduled execution.",

const SEMESTER_DEFAULT = '1151';
const WEEK_CODE = 'W03';
const TOPIC_CAMEL = 'WorkEnvironment';

const parseSdlKb = (text) => {
  try {
    const t = String(text || '').replace(/\r\n/g, '\n').trim();
    if (!t) return { ok: false, error: 'empty' };
    const fm = t.match(/^---\n([\s\S]*?)\n---/);
    const meta = {};
    if (fm) {
      fm[1].split('\n').forEach(line => {
        if (/^\s/.test(line)) return;               // skip nested (sources / interaction)
        const m = line.match(/^([A-Za-z_]+):\s*(.*)$/);
        if (m) meta[m[1]] = m[2].replace(/^["']|["']$/g, '').trim();
      });
    }
    const sections = {};
    const parts = t.split(/^##\s*§/m);
    parts.shift();
    parts.forEach(part => {
      const n = part.match(/^(\d)/);
      if (!n) return;
      sections['s' + n[1]] = part.replace(/^\d[^\n]*\n?/, '').trim();
    });
    const hasAny = Object.keys(meta).length > 0 || Object.keys(sections).length > 0;
    if (!hasAny) return { ok: false, error: 'format' };
    return { ok: true, meta, sections, raw: t };
  } catch (e) { return { ok: false, error: 'format' }; }
};

const SdlImport = ({ t, sdl, onImport, onClear }) => {
  const [text, setText] = useState('');
  const [msg, setMsg] = useState(null);
  const fileRef = useRef(null);
  const doParse = (raw) => {
    const r = parseSdlKb(raw);
    if (!r.ok) { setMsg({ ok: false, text: r.error === 'empty' ? t.sdl_err_empty : t.sdl_err_format }); return; }
    onImport(r);
    setMsg({ ok: true, text: t.sdl_ok });
    setText('');
  };
  const onFile = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => doParse(rd.result);
    rd.readAsText(f);
    e.target.value = '';
  };
  return (
    <div className="rounded-xl border-2 border-sky-200 dark:border-sky-800/60 bg-sky-50/50 dark:bg-sky-900/10 p-5">
      <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5]">{t.sdl_title}</h3>
      <p className="text-sm text-slate-500 dark:text-slate-400 mt-1 mb-3 leading-relaxed">{t.sdl_desc}</p>

          </p>
          <button onClick={onClear} className="mt-3 px-3 py-1.5 text-xs border border-red-400 text-red-600 dark:text-red-400 rounded-lg">{t.sdl_clear}</button>
        </div>
      ) : (

/* ================= FlipCardDeck ================= */
const FlipCardDeck = ({ terms, t, moduleId, onCardRead }) => {
  const [groupIdx, setGroupIdx] = useState(0);
  const [flipped, setFlipped] = useState({});
  const [readSet, setReadSet] = useState(new Set());
  const [shownSet, setShownSet] = useState(new Set());
  const [shuffledOrder] = useState(() => [...Array(terms.length).keys()].sort(() => Math.random() - 0.5));
  const groupSize = 2;
  const totalGroups = Math.ceil(terms.length / groupSize);
  const startIdx = groupIdx * groupSize;
  const currentCardIndices = shuffledOrder.slice(startIdx, startIdx + groupSize);

  useEffect(() => {
    const newShown = new Set(shownSet);
    currentCardIndices.forEach(idx => newShown.add(idx));
    if (newShown.size !== shownSet.size) setShownSet(newShown);
  }, [groupIdx]);

  const handleFlip = (origIdx) => {
    setFlipped(f => ({ ...f, [origIdx]: !f[origIdx] }));
    if (!readSet.has(origIdx)) {
      const newRead = new Set(readSet); newRead.add(origIdx); setReadSet(newRead);
      if (onCardRead) onCardRead(moduleId, newRead.size, shownSet.size, terms.length);
    }
  };

  const statusText = t.flip_status.replace('{read}', readSet.size).replace('{shown}', shownSet.size).replace('{total}', terms.length);

  return (
    <div className="mt-8">
      <h3 className="text-lg font-bold uppercase tracking-wider text-slate-500 mb-2">{t.key_terms}</h3>
      <p className="text-sm text-slate-400 mb-4">{statusText}</p>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        {currentCardIndices.map((origIdx) => {
          const term = terms[origIdx];
          return (
            <div key={origIdx} className="perspective cursor-pointer h-40" onClick={() => handleFlip(origIdx)}>
              <div className={`transform-style-3d relative w-full h-full transition-transform duration-500 ${flipped[origIdx] ? 'rotate-y-180' : ''}`}>
                <div className="backface-hidden absolute inset-0 bg-white dark:bg-slate-800 rounded-xl p-4 flex flex-col items-center justify-center border border-slate-200 dark:border-slate-700 shadow-sm">
                  <p className="font-serif font-bold text-center text-[#004030] dark:text-[#D8C3A5]">{term.front}</p>
                  <p className="text-xs text-slate-400 mt-2">{t.flip_prompt}</p>
                </div>
                <div className="backface-hidden rotate-y-180 absolute inset-0 bg-[#004030] dark:bg-slate-700 rounded-xl p-4 flex items-center justify-center overflow-y-auto">
                  <p className="text-sm text-center text-[#D8C3A5] dark:text-slate-200 leading-relaxed">{term.back}</p>
                </div>
              </div>
            </div>
          );
        })}
      </div>
      <div className="flex items-center gap-3 mt-4">
        <button onClick={() => { setGroupIdx(0); setFlipped({}); }}
          className="px-4 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">{t.flip_retry}</button>
        <button onClick={() => groupIdx < totalGroups-1 && setGroupIdx(groupIdx+1)} disabled={groupIdx >= totalGroups-1}
          className="px-4 py-2 text-sm bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.flip_next}</button>
      </div>
    </div>
  );
};

/* ================= ModuleQuiz ================= */
const ModuleQuiz = ({ questions, t, moduleId, onQuizSubmit, moduleName }) => {
  const [selected, setSelected] = useState({});
  const [submitted, setSubmitted] = useState({});
  const [groupIdx, setGroupIdx] = useState(0);
  const groupSize = 2;
  const [quizIndices] = useState(() => [...Array(questions.length).keys()].sort(() => Math.random() - 0.5));
  const totalGroups = Math.ceil(quizIndices.length / groupSize);
  const [shuffledMaps] = useState(() => quizIndices.map(qIdx => {
    const n = questions[qIdx].opts.length;
    return [...Array(n).keys()].sort(() => Math.random() - 0.5);
  }));

  const totalAnswered = Object.keys(selected).length;
  const computeCorrect = () => {
    let c = 0;
    quizIndices.forEach((qIdx, qi) => {
      if (selected[qi] === undefined) return;
      if (shuffledMaps[qi][selected[qi]] === _d(questions[qIdx].ans)) c++;
    });
    return c;
  };
  const statusText = t.quiz_status.replace('{correct}', computeCorrect()).replace('{answered}', totalAnswered).replace('{total}', quizIndices.length);
  const currentStart = groupIdx * groupSize;
  const currentIndices = quizIndices.slice(currentStart, currentStart + groupSize);

  const handleGroupSubmit = () => {
    const allDone = currentIndices.every((_, i) => selected[currentStart + i] !== undefined);
    if (!allDone) return;
    setSubmitted(s => ({ ...s, [groupIdx]: true }));
    if (groupIdx === totalGroups - 1 || Object.keys(submitted).length + 1 === totalGroups) {
      const wrongQs = []; let correct = 0;
      quizIndices.forEach((qIdx, qi) => {
        if (selected[qi] === undefined) return;
        if (shuffledMaps[qi][selected[qi]] === _d(questions[qIdx].ans)) correct++;
        else wrongQs.push(questions[qIdx].q);
      });
      onQuizSubmit(moduleId, correct, quizIndices.length, wrongQs, moduleName);
    }
  };

  return (
    <div className="mt-8 bg-slate-50 dark:bg-slate-900/50 rounded-2xl p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="text-lg font-bold font-serif text-[#004030] dark:text-[#D8C3A5] mb-2">{t.quiz_title}</h3>
      <p className="text-sm text-slate-400 mb-6">{statusText}</p>
      {currentIndices.map((qIdx, localI) => {
        const qi = currentStart + localI;
        const q = questions[qIdx];
        const sMap = shuffledMaps[qi];
        const isGrpSub = !!submitted[groupIdx];
        return (
          <div key={qIdx} className="mb-6">
            <p className="font-bold mb-3">{qi+1}. {q.q}</p>
            <div className="space-y-2">
              {sMap.map((origIdx, dIdx) => {
                const isCorrect = origIdx === _d(q.ans);
                const isSel = selected[qi] === dIdx;
                return (
                  <button key={dIdx} onClick={() => !isGrpSub && setSelected(s => ({...s, [qi]: dIdx}))}
                    className={`w-full text-left px-4 py-3 rounded-lg border transition-all text-sm
                      ${isGrpSub
                        ? isCorrect ? 'bg-green-100 border-green-500 dark:bg-green-900/30'
                          : isSel ? 'bg-red-100 border-red-400 dark:bg-red-900/30' : 'border-slate-200 dark:border-slate-700'
                        : isSel ? 'border-[#004030] dark:border-[#D8C3A5] bg-[#004030]/5' : 'border-slate-200 dark:border-slate-700 hover:border-slate-400'}`}>
                    {q.opts[origIdx]}
                  </button>
                );
              })}
            </div>
            {isGrpSub && (
              <p className={`mt-2 text-sm italic ${shuffledMaps[qi][selected[qi]] === _d(q.ans) ? 'text-green-600 dark:text-green-400' : 'text-red-500 dark:text-red-400'}`}>
                {shuffledMaps[qi][selected[qi]] === _d(q.ans) ? `✓ ${t.correct}` : `✗ ${t.incorrect}`} — {t.explanation}：{q.exp}
              </p>
            )}
          </div>
        );
      })}
      <div className="flex items-center gap-3 flex-wrap">
        {!submitted[groupIdx]
          ? <button onClick={handleGroupSubmit} disabled={!currentIndices.every((_,i) => selected[currentStart+i] !== undefined)}
              className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.submit}</button>
          : <>
              {groupIdx < totalGroups-1 && (
                <button onClick={() => setGroupIdx(groupIdx+1)} className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg">{t.quiz_next}</button>
              )}
              <button onClick={() => { setGroupIdx(0); setSelected({}); setSubmitted({}); }}
                className="px-6 py-2 border border-[#004030] dark:border-[#D8C3A5] text-[#004030] dark:text-[#D8C3A5] font-bold rounded-lg">{t.quiz_retry}</button>
            </>}
      </div>
    </div>
  );
};

      <div className="space-y-2">
        {t.layers.map((l, i) => (
          <div key={l.id} className="flex items-center justify-between gap-3 py-1.5 border-b border-slate-100 dark:border-slate-700 last:border-0">
            <span className="text-sm truncate">{l.name}</span>
            <button onClick={() => { setLocal(s => ({...s, [l.id]: !s[l.id]})); onTouch && onTouch(); }}
              className={`shrink-0 text-xs px-3 py-1.5 rounded-full font-bold transition
                ${local[l.id] ? 'bg-red-100 text-red-700 dark:bg-red-900/40 dark:text-red-300' : 'bg-green-100 text-green-700 dark:bg-green-900/40 dark:text-green-300'}`}>
              {local[l.id] ? t.lab1_local : t.lab1_cloud}

          </div>
        ))}
      </div>
      <div className="mt-4 p-4 rounded-lg bg-slate-50 dark:bg-slate-900/50">
        <p className="font-bold">{t.lab1_result.replace('{n}', n)}</p>
        <p className={`text-sm mt-1 ${tone}`}>{verdict}</p>
      </div>

  );
};

const LabContainer = ({ t, onTouch }) => {
  const [a, setA] = useState({ q1:null, q2:null, q3:null });
  const answered = a.q1 !== null && a.q2 !== null && a.q3 !== null;
  const yes = [a.q1, a.q2, a.q3].filter(v => v === true).length;
  const rec = !answered ? null : yes >= 2 ? t.lab2_rec_git : yes === 1 ? t.lab2_rec_project : t.lab2_rec_folder;
  const Q = ({ k, label }) => (
    <div className="flex items-center justify-between gap-3 py-2 border-b border-slate-100 dark:border-slate-700">
      <span className="text-sm">{label}</span>
      <div className="flex gap-2 shrink-0">
        {[true,false].map(v => (
          <button key={String(v)} onClick={() => { setA(s => ({...s, [k]: v})); onTouch && onTouch(); }}
            className={`text-xs px-3 py-1.5 rounded-full font-bold border transition
              ${a[k] === v ? 'bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] border-transparent' : 'border-slate-300 dark:border-slate-600'}`}>
            {v ? t.lab2_yes : t.lab2_no}
          </button>
        ))}
      </div>
    </div>
  );
  return (
    <div className="bg-white dark:bg-slate-800 rounded-xl p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-1">{t.lab2_title}</h3>
      <p className="text-sm text-slate-500 dark:text-slate-400 mb-4">{t.lab2_desc}</p>
      <Q k="q1" label={t.lab2_q1} />
      <Q k="q2" label={t.lab2_q2} />
      <Q k="q3" label={t.lab2_q3} />
      {rec && (
        <div className="mt-4 p-4 rounded-lg bg-[#004030]/5 dark:bg-[#D8C3A5]/10 border-l-4 border-[#D8C3A5]">
          <p className="text-xs font-bold uppercase tracking-wider text-slate-500 mb-1">{t.lab2_rec_label}</p>
          <p className="text-sm">{rec}</p>
        </div>
      )}
    </div>
  );
};

const LabContext = ({ t, onTouch }) => {
  const [len, setLen] = useState(20);
  const visible = Math.max(5, 100 - Math.max(0, len - 40) * 1.4);
  const note = len < 45 ? t.lab3_note_ok : len < 80 ? t.lab3_note_warn : t.lab3_note_bad;
  const tone = len < 45 ? 'text-green-600 dark:text-green-400' : len < 80 ? 'text-amber-600 dark:text-amber-400' : 'text-red-500 dark:text-red-400';
  return (
    <div className="bg-white dark:bg-slate-800 rounded-xl p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-1">{t.lab3_title}</h3>
      <p className="text-sm text-slate-500 dark:text-slate-400 mb-4">{t.lab3_desc}</p>
      <label className="block text-sm font-bold mb-2">{t.lab3_len}: {len}%</label>
      <input type="range" min="0" max="100" value={len} onChange={e => { setLen(+e.target.value); onTouch && onTouch(); }}
        className="w-full accent-[#004030] dark:accent-[#D8C3A5]" />
      <div className="mt-4 h-8 w-full rounded-lg overflow-hidden flex border border-slate-200 dark:border-slate-700">
        <div className="bg-[#004030] dark:bg-[#D8C3A5] h-full transition-all" style={{ width: visible + '%' }}></div>
        <div className="bg-slate-300 dark:bg-slate-600 h-full transition-all" style={{ width: (100 - visible) + '%' }}></div>
      </div>
      <div className="flex justify-between text-xs mt-2 text-slate-500 dark:text-slate-400">
        <span>{t.lab3_visible} {Math.round(visible)}%</span>
        <span>{t.lab3_compressed} {Math.round(100-visible)}%</span>
      </div>
      <p className={`text-sm mt-3 italic ${tone}`}>{note}</p>
    </div>
  );
};

/* ================= App ================= */
function App() {
  const LS_ANS = 'PMCS_W3_answers';
  const LS_ANA = 'PMCS_W3_analytics';
  const LS_STU = 'PMCS_W3_student';
  const loadLS = (key, fb) => { try { const v = localStorage.getItem(key); return v ? JSON.parse(v) : fb; } catch { return fb; } };

  const [lang, setLang] = useState('en');
  const [isDark, setIsDark] = useState(true);
  const [module, setModule] = useState(0);
  const [menuOpen, setMenuOpen] = useState(false);
  const [ttsState, setTtsState] = useState('idle');
  const [answers, setAnswers] = useState(() => loadLS(LS_ANS, {}));
  const [brk, setBrk] = useState(() => loadLS(LS_ANS + '_brk', {}));
  const [focus, setFocus] = useState(() => loadLS(LS_ANS + '_focus', {}));
  const [memberCount, setMemberCount] = useState(() => loadLS(LS_ANS + '_mc', DEFAULT_MEMBERS));
  const [sdl, setSdl] = useState(() => loadLS(LS_ANS + '_sdl', null));
  const [studentInfo, setStudentInfo] = useState(() => loadLS(LS_STU, { group:'', dept:'', id:'', nameEn:'', nameZh:'', compiler:'' }));
  const [analytics, setAnalytics] = useState(() => loadLS(LS_ANA, {
    time: Array(TOTAL).fill(0), clicks: Array(TOTAL).fill(0),
    quizCorrect: Array(TOTAL).fill(0), quizTotal: Array(TOTAL).fill(0),
    cardsRead: Array(TOTAL).fill(0), cardsTotal: Array(TOTAL).fill(0),
    wrongTopics: {}
  }));
  const menuRef = useRef(null);
  const t = dict[lang];

  useEffect(() => { document.documentElement.classList.toggle('dark', isDark); }, [isDark]);
  useEffect(() => { try { localStorage.setItem(LS_ANS, JSON.stringify(answers)); } catch {} }, [answers]);
  useEffect(() => { try { localStorage.setItem(LS_ANS + '_brk', JSON.stringify(brk)); } catch {} }, [brk]);
  useEffect(() => { try { localStorage.setItem(LS_ANS + '_focus', JSON.stringify(focus)); } catch {} }, [focus]);
  useEffect(() => { try { localStorage.setItem(LS_ANS + '_mc', JSON.stringify(memberCount)); } catch {} }, [memberCount]);
  useEffect(() => { try { sdl ? localStorage.setItem(LS_ANS + '_sdl', JSON.stringify(sdl)) : localStorage.removeItem(LS_ANS + '_sdl'); } catch {} }, [sdl]);
  useEffect(() => { try { localStorage.setItem(LS_ANA, JSON.stringify(analytics)); } catch {} }, [analytics]);
  useEffect(() => { try { localStorage.setItem(LS_STU, JSON.stringify(studentInfo)); } catch {} }, [studentInfo]);

  useEffect(() => {
    const id = setInterval(() => setAnalytics(a => { const ti = [...a.time]; ti[module] += 5; return {...a, time: ti}; }), 5000);
    return () => clearInterval(id);
  }, [module]);

  useEffect(() => {
    const onDoc = (e) => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false); };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, []);

  const importSdl = (r) => {
    setSdl({ meta: r.meta, sections: r.sections });
    setStudentInfo(st => ({
      ...st,
      group: r.meta.group || st.group,
      id: (r.meta.student_id || st.id || '').replace(/[^0-9]/g, '').slice(0, 12),
      nameEn: /^[\x00-\x7F]+$/.test(r.meta.student || '') ? (r.meta.student || st.nameEn) : st.nameEn,
      nameZh: /^[\x00-\x7F]+$/.test(r.meta.student || '') ? st.nameZh : (r.meta.student || st.nameZh)
    }));
    if (r.meta.group) setA('g_group', r.meta.group);
    if (r.meta.date) setA('g_date', r.meta.date);
  };
  const sdlFileName = () => {
    if (!sdl) return '';
    const m = sdl.meta;
    const who = m.student || 'NA';
    return `${m.course || 'PMCS'}_${m.semester || SEMESTER_DEFAULT}${m.week || WEEK_CODE}_${(m.topic || TOPIC_CAMEL).replace(/\s+/g,'')}_${m.group || 'NA'}-${who}_${(m.date || '').replace(/-/g,'')}.md`;
  };
  const bump = () => setAnalytics(a => { const c = [...a.clicks]; c[module] += 1; return {...a, clicks: c}; });
  const setA = (id, val) => { setAnswers(s => ({ ...s, [id]: val })); };

  const handleQuizSubmit = (mid, correct, total, wrongQs) => {
    setAnalytics(a => {
      const qc = [...a.quizCorrect], qt = [...a.quizTotal];
      qc[mid] = correct; qt[mid] = total;
      const wt = { ...a.wrongTopics }; wt[mid] = wrongQs || [];
      return { ...a, quizCorrect: qc, quizTotal: qt, wrongTopics: wt };
    });
  };
  const handleCardRead = (mid, readCount, shownCount, totalCount) => {
    setAnalytics(a => {
      const cr = [...a.cardsRead], ct = [...a.cardsTotal];
      cr[mid] = readCount; ct[mid] = totalCount;
      return { ...a, cardsRead: cr, cardsTotal: ct };
    });
  };

  const filled = (id) => { const v = answers[id]; return v !== undefined && String(v).trim() !== ''; };
  const sectionPct = (n) => {
    const core = CORE[n]; if (!core || !core.length) return 100;
    return Math.round(core.filter(filled).length / core.length * 100);
  };
  const pctPersonal = Math.round(PERSONAL_SECTIONS.reduce((s,n) => s + sectionPct(n), 0) / PERSONAL_SECTIONS.length);
  const pctGroup = Math.round(GROUP_SECTIONS.reduce((s,n) => s + sectionPct(n), 0) / GROUP_SECTIONS.length);

  const modulesList = [
    { id:0, num:'0', icon:'📋', title:t.m0_nav, kind:null },
    { id:1, num:'1', icon:'👥', title:t.m1_nav, kind:'G' },
    { id:2, num:'2', icon:'🗂️', title:t.m2_nav, kind:'P' },
    { id:3, num:'3', icon:'🔌', title:t.m3_nav, kind:'P' },
    { id:4, num:'4', icon:'🗣️', title:t.m4_nav, kind:'P' },
    { id:5, num:'5', icon:'🔍', title:t.m5_nav, kind:'G' },
    { id:6, num:'6', icon:'🎯', title:t.m6_nav, kind:'G' },
    { id:7, num:'7', icon:'🎤', title:t.m7_nav, kind:'G' },
    { id:IDX_LAB, num:String(IDX_LAB), icon:'⚡', title:t.mlab_nav, kind:null },
    { id:IDX_RES, num:String(IDX_RES), icon:'🌐', title:t.mres_nav, kind:null },
    { id:IDX_ANA, num:String(IDX_ANA), icon:'📊', title:t.analytics_title, kind:null }
  ];

  const go = (m) => { setModule(m); setMenuOpen(false); window.scrollTo({top:0,behavior:'smooth'}); };

  /* ---------- TTS ---------- */
  const handleTTS = (action) => {
    if (!('speechSynthesis' in window)) return;
    if (action === 'stop') { speechSynthesis.cancel(); setTtsState('idle'); return; }
    if (action === 'pause') { speechSynthesis.pause(); setTtsState('paused'); return; }
    if (ttsState === 'paused') { speechSynthesis.resume(); setTtsState('playing'); return; }
    speechSynthesis.cancel();
    const sep = lang === 'zh' ? '。 ' : '. ';
    let texts = [];
    if (module === 0) {
      texts = [t.m0_title, t.m0_intro, t.m0_why, t.m0_why_desc,
        ...t.m0_stats.map(s => `${s.label}: ${s.val}`),
        ...t.m0_modules.map(m => `${m.title}. ${m.desc}`)];
    } else if (module >= 1 && module <= NUM_LEARN) {
      const k = `m${module}`;
      texts = [t[`${k}_title`], t[`${k}_overview`], ...(t[`${k}_highlights`]||[]), t[`${k}_deep`], t[`${k}_wrapup`]];
      if (module === 2) texts.push(...t.layers.map(l => `${l.name}. ${l.hint}`), ...t.m2_terms.flatMap(x => [x.front, x.back]));
      if (module === 3) texts.push(t.m3_check_label, t.m3_why_label, t.m3_fix_label);
    } else if (module === IDX_LAB) {
      texts = [t.mlab_title, t.mlab_desc, t.lab1_title, t.lab1_desc, t.lab2_title, t.lab2_desc, t.lab3_title, t.lab3_desc, t.lab4_title, t.lab4_desc];
    } else if (module === IDX_RES) {
      texts = [t.mres_title, t.mres_desc, ...t.res_req.map(r => `${r.label}. ${r.desc}`), ...t.res_opt.map(r => `${r.label}. ${r.desc}`)];
    } else if (module === IDX_ANA) {
      texts = [t.analytics_title, t.analytics_desc,
        `${t.analytics_pct_personal}: ${pctPersonal}%`, `${t.analytics_pct_group}: ${pctGroup}%`,
        `${t.analytics_total_time}: ${analytics.time.reduce((a,b)=>a+b,0)}${t.analytics_sec}`];
      const weak = [1,2,3,4,5,6,7].filter(n => sectionPct(n) < 100);
      if (weak.length) {
        texts.push(t.analytics_wp_tts_intro);
        weak.forEach(n => texts.push(t.analytics_wp_tts_module.replace('{name}', t[`m${n}_nav`]).replace('{acc}', sectionPct(n))));
      } else texts.push(t.analytics_wp_tts_allpass);
    }
    texts = texts.filter(Boolean);
    const utt = new SpeechSynthesisUtterance(texts.join(sep));
    utt.rate = 0.95;
    const voices = speechSynthesis.getVoices();
    if (lang === 'zh') {
      const v = voices.find(v=>v.lang==='zh-TW'&&v.name.includes('Yating')) || voices.find(v=>v.lang==='zh-TW') || voices.find(v=>v.lang.startsWith('zh'));
      if (v) utt.voice = v; utt.lang = 'zh-TW';
    } else {
      const v = voices.find(v=>v.lang==='en-GB'&&(v.name.includes('Male')||v.name.includes('Daniel'))) || voices.find(v=>v.lang==='en-GB') || voices.find(v=>v.lang.startsWith('en'));
      if (v) utt.voice = v; utt.lang = 'en-GB';
    }
    utt.onend = () => setTtsState('idle');
    utt.onerror = () => setTtsState('idle');
    speechSynthesis.speak(utt);
    setTtsState('playing');
  };

  /* ---------- Export ---------- */
  const dstamp = () => { const d = new Date(), p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`; };
  const stamp = () => {
    const d = new Date(), p = (n) => String(n).padStart(2,'0');
    return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}_${p(d.getHours())}${p(d.getMinutes())}${p(d.getSeconds())}`;
  };
  const download = (content, filename, mime) => {
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = filename; document.body.appendChild(a); a.click();
    document.body.removeChild(a); setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
  const okPersonal = !!(studentInfo.nameEn || studentInfo.nameZh);
  const okGroup = !!(studentInfo.group && studentInfo.compiler);

  const exportPersonal = () => {
    if (!okPersonal) return;
    const L = [];
    L.push(`# PMCS W3 個人學習單 — ${dict.zh.subtitle}`);
    L.push('');
    L.push(`- 姓名：${studentInfo.nameEn} ${studentInfo.nameZh}　學號：${studentInfo.id}　系級：${studentInfo.dept}`);

    L.push(`- 個人完成度：${pctPersonal}%`);
    if (sdl) L.push(`- 來源 SDL KB：${sdlFileName()}`);
    L.push('');
    L.push('## 2. 九層盤點');
    dict.zh.layers.forEach(l => { L.push(`### ${l.name}`); L.push(answers[`layer_${l.id}`] || '_(未填)_'); L.push(''); });
    L.push('## 3. 斷點診斷');
    L.push(`- 判定會斷的層級：${LAYER_IDS.filter(id => brk[id]).join(', ') || '（無）'}`);
    L.push(`- 為什麼：${answers.brk_why || '_(未填)_'}`);
    L.push(`- 怎麼補救：${answers.brk_fix || '_(未填)_'}`);
    L.push('');
    L.push('## 4. 語言實驗室');
    L.push('| 詞彙 | 自己的話 | 例句 |'); L.push('|---|---|---|');
    [0,1,2,3,4].forEach(i => { if (filled(`t_term_${i}`)) L.push(`| ${answers[`t_term_${i}`]||''} | ${answers[`t_mean_${i}`]||''} | ${answers[`t_sent_${i}`]||''} |`); });
    L.push('');
    L.push('| 難發音 | 難在哪 | 記憶方法 |'); L.push('|---|---|---|');
    [0,1,2].forEach(i => { if (filled(`p_word_${i}`)) L.push(`| ${answers[`p_word_${i}`]||''} | ${answers[`p_hard_${i}`]||''} | ${answers[`p_tip_${i}`]||''} |`); });
    L.push(''); L.push('---');
    L.push('_本檔為個人學習歷程檔案，不繳交。W10 建立知識庫時請從中挑選要保留的部分。_');
    const who = (sanitizeName(studentInfo.nameEn).replace(/\s+/g,'') || studentInfo.id || 'me').replace(/[^\w-]/g,'') || 'me';
    const sem = (sdl && sdl.meta.semester) || SEMESTER_DEFAULT;
    const grp = studentInfo.group || 'NA';
    download(L.join('\n'), `PMCS_${sem}W03_WorkEnvironment_${grp}-${who}_${dstamp()}.md`, 'text/markdown;charset=utf-8;');
  };

  const exportGroupCSV = () => {
    if (!okGroup) return;
    const rows = [['Section','Field','Value']];
    rows.push(['Info','Group', studentInfo.group]);
    rows.push(['Info','Compiler', studentInfo.compiler]);
    GROUP_SECTIONS.forEach(sec => FIELDS[sec].forEach(id => rows.push(['S'+sec, id, String(answers[id] ?? '')])));
    rows.push(['S5','ComparedLayers', LAYER_IDS.filter(id => focus[id]).join(' ')]);
    /* --- 自我描述欄位：讓教師端彙整台無需內建設定即可正確顯示本週的檢查點措辭 --- */
    rows.push(['Meta','WeekTitleZH', dict.zh.subtitle]);
    rows.push(['Meta','WeekTitleEN', dict.en.subtitle]);
    rows.push(['Meta','CompareKey', 'ComparedLayers']);
    rows.push(['Meta','CompareN', '3']);
    rows.push(['Meta','S6Fields', "[{\"id\": \"tp_container\", \"zh\": \"選定的工作容器\", \"en\": \"Chosen container\"}, {\"id\": \"tp_why\", \"zh\": \"理由\", \"en\": \"Reason\"}, {\"id\": \"tp_kb\", \"zh\": \"KB 放哪一層\", \"en\": \"KB location\"}, {\"id\": \"tp_mem\", \"zh\": \"Memory 放哪一層\", \"en\": \"Memory location\"}, {\"id\": \"tp_risk\", \"zh\": \"最大風險\", \"en\": \"Biggest risk\"}]"]);
    rows.push(['Meta','Categorical', 'tp_container']);
    rows.push(['Meta','CategoricalZH', '各組選定的工作容器']);
    rows.push(['Meta','CategoricalEN', 'Container chosen by each group']);
    rows.push(['Meta','CP5ZH', dict.zh.m5_wrapup]);
    rows.push(['Meta','CP5EN', dict.en.m5_wrapup]);
    rows.push(['Meta','CP6ZH', dict.zh.m6_wrapup]);
    rows.push(['Meta','CP6EN', dict.en.m6_wrapup]);
    rows.push(['Meta','CP7ZH', dict.zh.m7_wrapup]);
    rows.push(['Meta','CP7EN', dict.en.m7_wrapup]);
    rows.push(['Meta','GroupCompletionPct', String(pctGroup)]);
    rows.push(['Meta','TimeSec', String(analytics.time.reduce((a,b)=>a+b,0))]);
    const qc = analytics.quizCorrect.reduce((a,b)=>a+b,0), qt = analytics.quizTotal.reduce((a,b)=>a+b,0);
    rows.push(['Meta','SelfCheck', `${qc}/${qt}`]);
    const esc = (v) => `"${String(v).replace(/"/g,'""')}"`;
    const csv = '\uFEFF' + rows.map(r => r.map(esc).join(',')).join('\r\n');
    download(csv, `PMCS_${(sdl && sdl.meta.semester) || SEMESTER_DEFAULT}W03_WorkEnvironment_${studentInfo.group}-ALL_${dstamp()}.csv`, 'text/csv;charset=utf-8;');
  };

  const exportGroupMD = () => {
    if (!okGroup) return;

    L.push(`# PMCS W3 小組學習單 — ${dict.zh.subtitle}`);
    L.push('');
    L.push(`- 組別：${studentInfo.group}　本週彙整人：${studentInfo.compiler}　日期：${answers.g_date || ''}`);
    L.push(`- 小組完成度：${pctGroup}%`);
    L.push('');
    L.push('## 1. 小組與分工');
    L.push('| 姓名 | 學號 | 負責段落 | 秒數 |'); L.push('|---|---|---|---|');
    MEMBER_IDX.forEach(i => { if (filled(`m_name_${i}`)) L.push(`| ${answers[`m_name_${i}`]||''} | ${answers[`m_id_${i}`]||''} | ${answers[`m_part_${i}`]||''} | ${answers[`m_sec_${i}`]||''} |`); });
    L.push('');
    L.push('## 5. 小組綜整');
    L.push(`- 比對的三個層級：${LAYER_IDS.filter(id => focus[id]).join(', ') || '_(未選)_'}`);
    L.push(`- 略過其他層的理由：${answers.syn_focus_why || '_(未填)_'}`);

                        <button onClick={() => go(n)} className="text-xs font-bold text-[#004030] dark:text-[#D8C3A5] hover:underline shrink-0">{t.analytics_wp_goto}</button>
                      </div>))}
              </div>
            </div>}


        <div className="mt-8 rounded-xl border-2 border-sky-200 dark:border-sky-800/60 bg-sky-50/50 dark:bg-sky-900/10 p-5">
          <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5]">{t.analytics_personal_title}</h3>
          <p className="text-sm text-slate-500 dark:text-slate-400 mt-1 mb-4">{t.analytics_personal_desc}</p>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
            <InfoInput id="nameEn" label={t.analytics_name_en} ph={t.analytics_name_en_ph} value={studentInfo.nameEn} onChange={setInfo} />
            <InfoInput id="nameZh" label={t.analytics_name_zh} ph={t.analytics_name_zh_ph} value={studentInfo.nameZh} onChange={setInfo} />
            <InfoInput id="id" label={t.analytics_id} ph={t.analytics_id_ph} value={studentInfo.id} onChange={setInfo} san={sanitizeStudentId} />
            <InfoInput id="dept" label={t.analytics_dept} ph={t.analytics_dept_ph} value={studentInfo.dept} onChange={setInfo} />
          </div>
          <button onClick={exportPersonal} disabled={!okPersonal}
            className="mt-4 px-5 py-2.5 bg-sky-700 dark:bg-sky-300 text-white dark:text-sky-950 font-bold rounded-lg disabled:opacity-40">{t.analytics_export_personal}</button>
          {!okPersonal && <p className="text-xs text-amber-600 dark:text-amber-400 mt-2">{t.analytics_need_personal}</p>}
        </div>

        <div className="mt-5 rounded-xl border-2 border-[#D8C3A5] dark:border-[#D8C3A5]/50 bg-[#D8C3A5]/10 p-5">
          <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5]">{t.analytics_group_title}</h3>
          <p className="text-sm text-slate-500 dark:text-slate-400 mt-1 mb-4">{t.analytics_group_desc}</p>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div><label className="block text-xs font-bold text-slate-500 mb-1">{t.analytics_group}</label>
              <select className={inputCls} value={studentInfo.group} onChange={e => setStudentInfo(st => ({...st, group: e.target.value}))}>
                <option value="">{t.analytics_group_select}</option>
                {t.group_options.map(g => <option key={g} value={g}>{g}</option>)}
              </select></div>
            <InfoInput id="compiler" label={t.analytics_compiler} ph={t.analytics_compiler_ph} value={studentInfo.compiler} onChange={setInfo} />
          </div>
          <div className="flex flex-wrap gap-3 mt-4">
            <button onClick={exportGroupCSV} disabled={!okGroup} className="px-5 py-2.5 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.analytics_export_csv}</button>
            <button onClick={exportGroupMD} disabled={!okGroup} className="px-5 py-2.5 border-2 border-[#004030] dark:border-[#D8C3A5] text-[#004030] dark:text-[#D8C3A5] font-bold rounded-lg disabled:opacity-40">{t.analytics_export_md}</button>
          </div>
          {!okGroup && <p className="text-xs text-amber-600 dark:text-amber-400 mt-2">{t.analytics_need_group}</p>}
        </div>

        <div className="mt-6 flex items-center gap-3 flex-wrap">
          <button onClick={clearAll} className="px-5 py-2.5 border border-red-400 text-red-600 dark:text-red-400 font-bold rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20">{t.analytics_wp_clear}</button>
        </div>
        <p className="text-xs text-slate-400 mt-3">💾 {t.analytics_wp_saved}</p>
      </>
    );
  };

  const renderM0 = () => (
    <>
      <div className="rounded-2xl bg-[#004030] dark:bg-slate-800 text-white p-6 sm:p-10 border border-[#D8C3A5]/30">
        <p className="text-[#D8C3A5] font-serif tracking-widest text-sm mb-2">{t.brand} · {t.title}</p>
        <h1 className="font-serif font-black text-3xl sm:text-4xl md:text-5xl leading-tight mb-4">{t.subtitle}</h1>
        <p className="text-slate-200 leading-relaxed text-base">{t.m0_intro}</p>
        <button onClick={() => go(1)} className="mt-6 px-6 py-3 bg-[#D8C3A5] text-[#004030] font-bold rounded-lg hover:brightness-110 transition">{t.m0_start}</button>
      </div>
      <div className="grid grid-cols-2 lg:grid-cols-4 gap-3">
        {t.m0_stats.map((s,i) => (
          <div key={i} className="bg-white dark:bg-slate-800 rounded-xl p-4 border border-slate-200 dark:border-slate-700 text-center">
            <p className="font-serif font-black text-3xl text-[#004030] dark:text-[#D8C3A5]">{s.val}</p>
            <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">{s.label}</p>
          </div>
        ))}
      </div>
      <div className="bg-[#004030]/5 dark:bg-[#D8C3A5]/5 rounded-xl p-5 border-l-4 border-[#D8C3A5]">
        <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-2">{t.m0_why}</h3>
        <p>{t.m0_why_desc}</p>
      </div>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        {t.m0_modules.map((m,i) => (
          <button key={i} onClick={() => go(i+1)} className="text-left bg-white dark:bg-slate-800 rounded-xl p-4 border border-slate-200 dark:border-slate-700 hover:border-[#004030] dark:hover:border-[#D8C3A5] hover:shadow-md transition">
            <span className="font-serif font-black text-[#D8C3A5] text-lg">{m.num}</span>
            <p className="font-bold text-[#004030] dark:text-[#D8C3A5] mt-1">{m.title}</p>
            <p className="text-sm text-slate-500 dark:text-slate-400 mt-1 leading-relaxed">{m.desc}</p>
          </button>
        ))}
      </div>
      <SdlImport t={t} sdl={sdl} onImport={importSdl} onClear={() => setSdl(null)} />
      <SavedHint />
    </>
  );

  const body = () => {
    if (module === 0) return renderM0();
    if (module === 1) return renderM1();
    if (module === 2) return renderM2();
    if (module === 3) return renderM3();
    if (module === 4) return renderM4();
    if (module === 5) return renderM5();
    if (module === 6) return renderM6();
    if (module === 7) return renderM7();
    if (module === IDX_LAB) return renderLab();
    if (module === IDX_RES) return renderRes();
    return renderAna();
  };

  const cur = modulesList[module];

  return (
    <div className="min-h-screen flex flex-col pt-16 overflow-x-hidden">
      <header className="fixed top-0 left-0 right-0 h-16 bg-[#004030] dark:bg-slate-900 text-white z-50 shadow-lg border-b border-[#D8C3A5]/30">
        <div className="max-w-7xl mx-auto px-3 sm:px-4 h-16 flex items-center justify-between">
          <div className="flex items-center gap-1 sm:gap-2 min-w-0">
            <div className="relative" ref={menuRef}>
              <button onClick={() => setMenuOpen(!menuOpen)} className="p-2 hover:bg-white/10 rounded-lg" aria-label={t.nav_modules}>
                {menuOpen ? <IconX/> : <IconMenu/>}
              </button>
              {menuOpen && (
                <div className="absolute top-full left-0 mt-1 w-64 max-w-[calc(100vw-2rem)] max-h-[calc(100vh-5rem)] overflow-y-auto bg-white dark:bg-slate-800 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 z-[100]">
                  {modulesList.map(m => (
                    <button key={m.id} onClick={() => go(m.id)}
                      className={`w-full flex items-center gap-3 px-4 py-3 text-sm transition ${module === m.id ? 'bg-[#004030]/10 dark:bg-[#D8C3A5]/10 text-[#004030] dark:text-[#D8C3A5] font-bold' : 'text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700'}`}>
                      <span className="ui-decoration">{m.icon}</span><span className="truncate">{m.title}</span>
                    </button>
                  ))}
                </div>
              )}
            </div>
            <button onClick={() => go(0)} className="p-2 hover:bg-white/10 rounded-lg" aria-label={t.nav_home}><IconHome size={18}/></button>
            <button onClick={() => window.scrollTo({top:0,behavior:'smooth'})} className="flex items-center gap-2 min-w-0">
              <span className="font-serif font-black text-[#D8C3A5] text-lg tracking-widest">{t.brand}</span>
              <span className="hidden sm:inline font-serif font-bold text-sm md:text-base truncate">{t.title}</span>
            </button>
          </div>
          <div className="flex items-center gap-1 sm:gap-2">
            <button onClick={() => handleTTS(ttsState === 'playing' ? 'pause' : 'play')} className="p-2 hover:bg-white/10 rounded-lg" aria-label={t.audio_read}>
              {ttsState === 'playing' ? <IconPause size={18}/> : <IconPlay size={18}/>}
            </button>
            <button onClick={() => handleTTS('stop')} className="p-2 hover:bg-white/10 rounded-lg" aria-label="Stop"><IconSquare size={18}/></button>
            <button onClick={() => setLang(lang === 'en' ? 'zh' : 'en')} className="px-2 py-2 hover:bg-white/10 rounded-lg flex items-center gap-1">
              <IconGlobe size={18}/><span className="text-xs font-bold">{lang === 'en' ? '中' : 'EN'}</span>
            </button>
            <button onClick={() => setIsDark(!isDark)} className="p-2 hover:bg-white/10 rounded-lg" aria-label="Theme">
              {isDark ? <IconSun size={18}/> : <IconMoon size={18}/>}
            </button>
          </div>
        </div>
      </header>

      <div className="flex-1 w-full max-w-7xl mx-auto flex">
        <aside className="hidden md:block w-64 shrink-0 border-r border-slate-200 dark:border-slate-700 py-8 px-3">
          <p className="text-xs font-bold uppercase tracking-wider text-slate-400 px-3 mb-3">{t.nav_modules}</p>
          {modulesList.map(m => (
            <button key={m.id} onClick={() => go(m.id)}
              className={`w-full flex items-center gap-3 px-3 py-2.5 rounded-lg text-sm mb-1 transition ${module === m.id ? 'bg-[#004030]/10 dark:bg-[#D8C3A5]/10 text-[#004030] dark:text-[#D8C3A5] font-bold' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}`}>
              <span className="ui-decoration shrink-0">{m.icon}</span>
              <span className="truncate text-left flex-1">{m.title}</span>
              {m.kind && <span className={`text-[10px] font-bold px-1 rounded shrink-0 ${m.kind === 'P' ? 'text-sky-700 dark:text-sky-300' : 'text-[#004030] dark:text-[#D8C3A5]'}`}>{m.kind}</span>}
            </button>
          ))}
          <div className="mt-6 px-3 space-y-3">
            <div>
              <p className="text-xs text-slate-400 mb-1">{t.analytics_pct_personal}</p>
              <div className="h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden"><div className={`h-full ${pctPersonal === 100 ? 'bg-green-500' : 'bg-sky-600 dark:bg-sky-400'}`} style={{width: pctPersonal + '%'}}></div></div>
              <p className="text-xs font-bold text-sky-700 dark:text-sky-300 mt-1">{pctPersonal}%</p>
            </div>
            <div>
              <p className="text-xs text-slate-400 mb-1">{t.analytics_pct_group}</p>
              <div className="h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden"><div className={`h-full ${pctGroup === 100 ? 'bg-green-500' : 'bg-[#004030] dark:bg-[#D8C3A5]'}`} style={{width: pctGroup + '%'}}></div></div>
              <p className="text-xs font-bold text-[#004030] dark:text-[#D8C3A5] mt-1">{pctGroup}%</p>
            </div>
          </div>
        </aside>

        <main className="flex-1 min-w-0 py-8 px-4 sm:px-6">
          <div key={`${module}-${lang}`} className="space-y-6 text-lg leading-relaxed text-slate-700 dark:text-slate-300 animate-fade-in">
            {module !== 0 && (
              <div>
                <H2 icon={cur.icon} number={cur.num}>{module <= NUM_LEARN ? t[`m${module}_title`] : module === IDX_LAB ? t.mlab_title : module === IDX_RES ? t.mres_title : t.analytics_title}</H2>
                {cur.kind && <Badge kind={cur.kind} t={t} />}
              </div>
            )}
            {body()}
            <div className="mt-12 flex justify-between items-center pt-8 border-t border-slate-300 dark:border-slate-700 no-print">
              <button onClick={() => go(Math.max(0, module-1))} disabled={module === 0}
                className="px-5 py-2.5 border border-slate-300 dark:border-slate-600 rounded-lg text-sm font-bold hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-0">← {t.nav_prev}</button>
              <button onClick={() => go(Math.min(TOTAL-1, module+1))} disabled={module === TOTAL-1}
                className="px-5 py-2.5 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] rounded-lg text-sm font-bold disabled:opacity-0">{t.nav_next} →</button>
            </div>
          </div>
        </main>
      </div>

      <footer className="h-8 bg-[#004030] flex items-center justify-between px-4 shrink-0">
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs truncate">{t.date} · {t.copyright}</span>
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs flex items-center gap-3 shrink-0">
          <span className="hidden sm:inline">{t.architect_label}&nbsp;<a href={t.architect_url} target="_blank" rel="noopener noreferrer" className="text-[#D8C3A5] hover:text-white underline">Prof. Shihmin Lo</a></span>
          <button onClick={() => window.scrollTo({top:0,behavior:'smooth'})} className="text-[#D8C3A5] hover:text-white font-bold">Top ↑</button>
        </span>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
