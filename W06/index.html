    m2_nav: "2. Stage-Gate 定位", m2_title: "Stage-Gate 定位：PM 在六個階段各做什麼決定",
    m2_overview: "本週的個人核心任務之一。挑一個你熟悉的產品——硬體軟體都可以，只要你講得出它長什麼樣、賣給誰——把它放進 NPD 的六個階段，逐格寫出「PM 在這一階段要做的決定」。寫「決定」不是寫「工作」：開會、追進度不是決定，選哪一個規格、砍哪一個功能、什麼時候放行才是。",
    m2_highlights: ["六個階段","PM 的決定","Kick-off gate","Discover→Deliver"],
    m2_deep: "接力的順序是 GM／Strategy → MKT／SA → PM → RD／DQA →〔NPD〕→ TE／QA → PE／PUR／PC／MC → MFG／QC／FAE／CS → EOL。注意 [NPD] 這個標記出現的位置：在它之前，做的是機會辨識、提案與可行性分析，產出是三份 Spec；在它之後，才是真正的開發執行。這條線就是 PM 與 PjM 的分界——PM 管到 Spec 定案，PjM 管定案之後的執行。所以最後一題不是背答案，是要你說出為什麼那道 gate 應該落在那裡；如果你把 kick off 畫在第一階段之前，等於承認提案還沒寫就開工了。",
    m2_prod_label: "你挑的產品是什麼？（硬體軟體皆可，一句話講清楚它是什麼、賣給誰）",
    m2_prod_ph: "例：一款給國小學童的英語聽力練習 App，賣給家長，走訂閱制。",
    m2_why_label: "為什麼挑它？",
    m2_why_ph: "例：我自己付錢用過兩年，看得到它每一版改了什麼，也知道它為什麼砍掉離線下載功能。",
    m2_stage_hint: "填好哪一階段，上方流程圖的那一格就會亮起來。",
    m2_gate_label: "你認為正式 kick off 的那道 gate 在哪兩個階段之間？為什麼？",
    m2_gate_ph: "例：在 [2] 與 [3] 之間。因為三份 Spec 在 [2] 結束時才定案，定案前開工等於讓工程端追著會變的目標跑。",
    m2_svg_cap: "NPD Stage-Gate 六階段與接力單位；正式 kick off 的 gate 落在 Spec 定案之後",
    m2_terms: [
      { front: "Stage-Gate", back: "把新產品開發切成數個階段，每兩個階段之間放一道 gate，通過才准往下走。gate 不是報告，是一次投資決策：繼續、修正、暫停或終止。" },
      { front: "NPD 前端", back: "機會辨識與 BD → 新產品提案 → 可行性分析與 POC → 決定 Marketing Spec／Design Spec／QA Spec。這一段做完，才輪到正式 kick off。" },
      { front: "Kick-off gate", back: "PM 與 PjM 的分界線。PM 管到 Spec 定案，PjM 管定案之後的執行；跨過這道 gate，主角就換人了。" },
      { front: "PM vs PjM", back: "兩者的差別在管理對象，不在高低。PM 管的是產品，PjM 管的是專案——專案可以是一整個產品專案，也可以只是其中一部分。" },
      { front: "RPM／TPM／OPM", back: "PjM 依主責單位分成研發端、工程端與生產端三種變體。它們是 PjM 的分支，不是與 PM 平行的另一條線。" },
      { front: "三份 Spec", back: "Marketing Spec 說要賣給誰、賣什麼價；Design Spec 說要做成什麼樣；QA Spec 說做到什麼程度算合格。三份都定案，才叫 Spec 定案。" },
      { front: "四段節奏", back: "Discover → Define → Develop → Deliver。六個階段可以收攏成這四段；愈往右，改一件事的代價愈高。" },
      { front: "EOL", back: "End of Life，產品生命週期的終點。決定何時停產、庫存怎麼去化，同樣是 PM 的決定，不是業務或生產的決定。" }

      { q: "PM 與 PjM 的分界線，最準確的說法是下列哪一個？", opts: ["PM 管到 Spec 定案，PjM 管定案之後的執行","PM 管硬體產品，PjM 管軟體專案的開發","PM 層級高於 PjM，PjM 是 PM 的下屬職位","PM 負責對外溝通，PjM 負責對內的會議"], ans: _A0, exp: "兩者的差別在管理對象與交棒點，不在高低，也不在硬體軟體之分；分界就是 NPD 的 kick-off gate。" },

      { q: "關於 PM 與 PjM 的職稱混用，下列敘述何者正確？", opts: ["多數是名義上叫 PM，實際做的是 PjM 的工作","多數是名義上叫 PjM，實際做的是 PM 的工作","兩個方向的混用比例大致相同，很難分辨","職稱與工作內容一致，混用的情形其實很少"], ans: _A0, exp: "混用是單向的：掛 PM 之名行 PjM 之實的很多，反過來很少。所以判定一律回去讀工作內容，不採信職稱。" }

    m2_wrapup: "檢查點：六個階段都寫了 PM 的具體決定，而且 kick off gate 的位置有寫出理由，不是只標一個位置。",

    m3_nav: "3. 兩軸判定", m3_title: "兩軸判定：四則職缺片段",
    m3_overview: "下面四則是依 104 職缺頁的欄位結構合成的複合範例，不是任何一則真實職缺的原文。逐則做兩件事：判它落在管理對象哪一軸、層級哪一格，然後——這一節真正的重點——寫出你是引用工作內容裡的哪一句話才這樣判的。職稱不算依據。",
    m3_highlights: ["管理對象軸","層級軸","引用原句","職稱不算數"],
    m3_deep: "偏 PM 的詞：產品藍圖、產品生命週期、產品損益、市場需求、競品分析、定價、規格定義、停產。偏 PjM 的詞：時程、里程碑、資源調配、風險管控、跨部門協調、進度追蹤、交付驗收、工作分解結構與甘特圖。層級則看三件事一起判：工作經歷欄的年資、管理責任欄有沒有寫要帶人、以及工作內容裡的動詞往哪邊倒——執行與協助是一層，協調與追蹤是一層，制定與決策又是一層，帶領團隊與負損益是最上面那一層。四則裡有一則的職稱和實質是矛盾的，也有一則的資訊少到你可以合理判「無法判定」——那不是逃避，那是誠實。",
    m3_axis_label: "管理對象軸的判定",
    m3_level_label: "層級軸的判定",
    m3_evi_label: "依據：引用工作內容的哪一句讓你這樣判？",
    m3_evi_ph: "例：因為工作內容寫「建立並維護工作分解結構與甘特圖，逐週追蹤各單位交付進度」，這是管專案不是管產品。",
    m3_pattern_label: "四則看完，你觀察到什麼規律？",
    m3_pattern_ph: "例：職稱裡有沒有 PM 兩個字跟實際做什麼幾乎無關；反而是「管理責任」欄和年資，比工作內容更快把層級定位出來。",
    m3_count: "已完成判定的則數",
    m3_wrapup: "檢查點：四則都做了兩軸判定，而且每一則的依據引用的是工作內容的原句，不是職稱。",

    m4_nav: "4. 語言實驗室", m4_title: "EMI 語言實驗室",

    m4_highlights: ["新詞五個","難發音三個","自己的話","例句"],
    m4_deep: "本週的教材詞彙密度很高，像 stage-gate、feasibility、tooling validation、pilot run、reliability、portfolio、end of life 都值得挑。「用自己的話解釋」不要抄原文定義——抄定義只證明你找得到，改寫才證明你讀懂了。例句請寫跟你的期末專案有關的句子，這樣同一份力氣可以用兩次。",

    m5_nav: "5. 小組綜整", m5_title: "小組綜整：六個人的判定差在哪裡",
    m5_overview: "這一節才是小組討論真正的工作。不是輪流念自己的答案，而是把六個人對同一則案例的判定攤開來比——同樣一段工作內容，六個人可能判出三種結果。差異最大的那一則，通常就是標準最模糊的地方，而那正是你們要一起補起來的洞。",
    m5_highlights: ["只挑三則","差異最大","標準模糊處","組內通則"],
    m5_deep: "彙整方式有一條硬性規定：本週彙整人不得把六份個人匯出檔全部丟給 AI 叫它總結。要先由小組決定這一次只比對四則裡的哪三則，再只取那三則的六人份判定與依據。理由跟前幾週一樣——選取才是重點，全丟進去只會讓模型幫你們把差異抹平，而差異正是這一節要看的東西。訂通則時請訂成可以檢查的樣子：「看到哪一類詞就往哪一軸判」是可以檢查的，「要小心看內容」不是。",
    m5_focus_label: "我們決定比對的三則案例（勾選三則）",
    m5_focus_why: "為什麼略過剩下那一則？",
    m5_focus_why_ph: "例：案例 C 六個人都判 PM／Director 以上，完全沒有分歧，比對不出東西。",
    m5_diff_label: "六人判定差異最大的是哪一則？",
    m5_why_label: "為什麼會判不同？",
    m5_why_ph: "例：案例 D 的工作內容全是「協助」「依指示執行」，三個人抓「協助產品經理」判 PM，另外三個人認為資訊不足判無法判定。",
    m5_case_label: "我們拿來重新判一次的是哪一則？重判後的結論是什麼？",
    m5_case_ph: "例：案例 B。重判後全組一致判 PjM／Engineer，因為工作內容從頭到尾沒有出現任何一個跟產品損益或定價有關的動詞。",
    m5_rule_label: "從這次比對，我們訂下一條組內通則",
    m5_rule_ph: "例：本組判定一律先數詞——工作內容裡出現三個以上的時程類動詞就判 PjM，除非同時出現定價或損益，才回到 PM。",
    m5_rule_note: "這條通則會累積到期末專案。W10 建 KB 時，這些通則就是 business_rules.md 的第一批內容。",
    m5_wrapup: "檢查點：只比對了三則（不是全部丟給 AI），且訂出的通則是可以檢查的，不是「要小心看內容」這種。",

    m6_nav: "6. 接到期末專案", m6_title: "接到期末專案：你們的晨報是寫給誰看的",
    m6_overview: "每一份學習單都有這一節。這一週要決定的不是技術，是讀者。一份每天自己跑的 PM 職缺晨報，如果沒有指定讀者，抓回來的東西就會是一堆沒有立場的清單。先把人寫具體，篩選條件才有辦法定。",
    m6_highlights: ["具體的讀者","PM 還是 PjM","層級全收","本週一件事"],
    m6_deep: "讀者不能寫「想找工作的人」——那等於沒寫。要寫到一個你想像得出來的人與他的處境：大四下、投了十封沒有回音、只想留在中部、家裡希望他考公職但他想試試看科技業。有了這個人，你才知道晨報該把哪些職缺放前面。至於層級，本課的期末專案刻意規定層級全收不過濾：從產品專員一路到產品長都留下來，因為要讓你們看見完整的階梯——看得到 Senior 的門檻寫什麼，才知道 Junior 的自己還差哪幾格。過濾會讓階梯消失，那就失去了這份晨報最有價值的部分。",
    m6_reader_label: "我們的晨報是給誰看的？（要具體到人與情境）",
    m6_reader_ph: "例：大四下的資管系學生，投了十封履歷沒有回音，只想留在中部，正在猶豫要不要先進科技業做產品助理。",
    m6_axis_label: "他要找的是 PM 還是 PjM？",
    m6_level_label: "哪些層級要留下來？",
    m6_level_ph: "例：全部留下來——Specialist、Engineer、Junior、Senior、Director 以上都收，讓他看得到整條階梯。",
    m6_why_label: "為什麼？（把選擇對回那個人的處境）",
    m6_why_ph: "例：他現在只投得上 Specialist，但看得到 Senior 的條件要求，才知道兩年後要補的是哪幾項技能。",
    m6_action_label: "針對這個讀者，我們這一週要做的一件事",
    m6_action_ph: "例：這週先手動抓 20 則中部的職缺，把它們照兩軸貼到一張表上，確認我們的判定標準真的分得開。",
    m6_note: "本課的期末專案規定：層級全收不過濾，讓讀者看見完整階梯。你們可以決定排序，但不要在抓取階段就把層級砍掉。",
    m6_wrapup: "檢查點：讀者寫的是具體的人與情境，而且 PM／PjM 與層級的選擇有對應到那個人的處境。",

    m7_nav: "7. 簡報計畫", m7_title: "簡報計畫與提問",

    m2_nav: "2. Stage-Gate Positioning", m2_title: "Stage-Gate Positioning: The PM's Decision at Each Stage",
    m2_overview: "One of this week's two individual core tasks. Pick a product you know well — hardware or software, as long as you can describe what it is and who buys it — drop it into the six NPD stages, and write the decision a PM has to make at each one. A decision is not an activity: holding a meeting or chasing progress is not a decision; choosing a specification, cutting a feature, or releasing to the next stage is.",
    m2_highlights: ["Six stages","The PM's decision","Kick-off gate","Discover→Deliver"],
    m2_deep: "The relay runs GM／Strategy → MKT／SA → PM → RD／DQA → [NPD] → TE／QA → PE／PUR／PC／MC → MFG／QC／FAE／CS → EOL. Watch where the [NPD] marker sits. Before it come opportunity identification, the proposal and feasibility analysis, and the output is three specs. Only after it does real development begin. That line is the PM／PjM boundary: the PM owns everything up to spec freeze, the PjM owns execution after it. So the last question is not a memory test — you have to say why the gate belongs where you put it. If you draw kick-off before the first stage, you are admitting that work began before the proposal was even written.",
    m2_prod_label: "Which product did you pick? (hardware or software; one sentence on what it is and who buys it)",
    m2_prod_ph: "e.g. An English listening-practice app for primary school pupils, sold to parents on subscription.",
    m2_why_label: "Why that one?",
    m2_why_ph: "e.g. I have paid for it myself for two years, I can see what changed in every release, and I know why offline download was cut.",
    m2_stage_hint: "Fill in a stage and its cell lights up in the diagram above.",
    m2_gate_label: "Between which two stages does the formal kick-off gate sit, and why?",
    m2_gate_ph: "e.g. Between [2] and [3], because the three specs are only frozen at the end of [2]; starting earlier makes engineering chase a target that is still moving.",
    m2_svg_cap: "The six NPD stage-gate stages and the units that carry them; the formal kick-off gate sits after spec freeze",
    m2_terms: [
      { front: "Stage-Gate", back: "New product development cut into stages, with a gate between each pair that must be passed before work continues. A gate is not a report — it is an investment decision: go, revise, hold or kill." },
      { front: "The NPD front end", back: "Opportunity identification and BD → new product proposal → feasibility analysis and POC → deciding the marketing, design and QA specs. Only when this is finished does formal kick-off happen." },
      { front: "Kick-off gate", back: "The boundary between PM and PjM. The PM owns everything up to spec freeze; the PjM owns execution after it. Cross this gate and the lead role changes hands." },
      { front: "PM vs PjM", back: "The difference is what they manage, not rank. A PM manages a product; a PjM manages a project — which may be a whole product programme or only one part of one." },
      { front: "RPM／TPM／OPM", back: "PjM variants by owning unit: R&D side, engineering side and production side. They are branches of PjM, not a separate line running parallel to PM." },
      { front: "The three specs", back: "The marketing spec says who buys it and at what price; the design spec says what it must be; the QA spec says what counts as good enough. Spec freeze means all three are settled." },
      { front: "The four beats", back: "Discover → Define → Develop → Deliver. The six stages collapse into these four; the further right you go, the more a change costs." },
      { front: "EOL", back: "End of life. Deciding when to stop production and how to clear inventory is a PM decision too — not a sales or a manufacturing one." }
    ],
    m2_q: [
      { q: "Between which two stages does the formal NPD kick-off gate sit?", opts: ["Between [1] Marketing Plan and [2] Feasibility Spec","Between [2] Feasibility Spec and [3] Product Design","Between [3] Product Design and [4] Tooling Validation","Between [4] Tooling Validation and [5] Pilot-Run"], ans: _A1, exp: "The front end must finish the proposal and the feasibility analysis and freeze the marketing, design and QA specs before formal kick-off; real development starts at [3]." },
      { q: "Which statement draws the PM／PjM boundary most accurately?", opts: ["PM owns the spec until freeze; PjM owns execution after that","PM owns hardware products, while PjM owns software projects only","PM outranks PjM, and every PjM reports to a PM in that line","PM handles outside parties, while PjM handles internal meetings"], ans: _A0, exp: "The difference lies in what is managed and where the handover happens — not in rank, and not in hardware versus software. The boundary is the NPD kick-off gate." },
      { q: "In the seven PDMA／NPDP knowledge areas, which two are weighted at 20% each?", opts: ["Strategy, and product innovation management","Portfolio management, and PDD tools and metrics","The PI process, and PI market research work","Culture and teams, and the PI process itself"], ans: _A0, exp: "Strategy at 20% and PI management at 20% are the two heaviest; the rest are portfolio 10%, PI process 15%, PDD tools 15%, market research 10%, culture and teams 10%." },
      { q: "Which statement about mixed PM／PjM titles is correct?", opts: ["Most are called PM but actually do PjM work","Most are called PjM but actually do PM work","Both directions occur at roughly equal rates","Titles and duties match, so mislabelling is rare"], ans: _A0, exp: "The mix-up runs one way: plenty of PjM work carries a PM title, but rarely the reverse. So every call goes back to the job description, never the title." }
    ],
    m2_wrapup: "Checkpoint: all six stages carry a concrete PM decision, and the kick-off gate comes with a stated reason rather than just a marked position.",

    m3_nav: "3. Two-Axis Calls", m3_title: "Two-Axis Calls: Four Posting Extracts",
    m3_overview: "The four extracts below are composite examples built from the field structure of a job board page. None of them reproduces the wording of any real posting. For each one do two things: place it on the what-you-manage axis and on the level axis, and then — the real point of this section — write which sentence in the job description made you call it that way. A job title is not evidence.",
    m3_highlights: ["What is managed","Level","Quote the line","Titles do not count"],
    m3_deep: "Words that lean PM: roadmap, product life cycle, product P&L, market requirement, competitor analysis, pricing, specification definition, end of life. Words that lean PjM: schedule, milestone, resource allocation, risk control, cross-functional coordination, progress tracking, delivery acceptance, work breakdown structure and Gantt chart. Level takes three signals together: the years in the experience field, whether the management-duty field asks for direct reports, and which way the verbs in the job description lean — assist and execute is one band, coordinate and track another, define and decide another, and lead a team while carrying the P&L is the top one. One of the four extracts has a title that contradicts its substance, and one carries so little information that \"cannot tell\" is a defensible call — that is honesty, not evasion.",
    m3_axis_label: "Call on the what-you-manage axis",
    m3_level_label: "Call on the level axis",
    m3_evi_label: "Evidence: which sentence in the job description made you call it that way?",
    m3_evi_ph: "e.g. Because the description says it \"builds and maintains the work breakdown structure and Gantt chart and tracks each unit's delivery weekly\" — that is managing a project, not a product.",
    m3_pattern_label: "Having read all four, what pattern do you see?",
    m3_pattern_ph: "e.g. Whether the title contains the letters PM says almost nothing about the work; the management-duty field and the years of experience pin the level down faster than the description does.",
    m3_count: "Cases called",
    m3_wrapup: "Checkpoint: all four cases carry both calls, and each piece of evidence quotes a line from the job description rather than the title.",

    m4_nav: "4. Language Lab", m4_title: "EMI Language Lab",
    m4_overview: "This course is taught in English. Pick five new words or phrases from this week's required materials, plus three words you stumble over. What you produce here feeds class discussion and bonus work directly.",
    m4_highlights: ["Five new terms","Three hard words","In your own words","Example sentences"],
    m4_deep: "This week's material is dense in vocabulary: stage-gate, feasibility, tooling validation, pilot run, reliability, portfolio and end of life are all worth taking. Do not copy the source definition into the \"in your own words\" column — copying proves only that you found it; rewriting proves you understood it. Write the example sentences about your own Term Project so one effort does two jobs.",

    m4_col_term: "Term / phrase", m4_col_mean: "In your own words", m4_col_sent: "Your own sentence",
    m4_pron_label: "Three words you stumble over",

    m4_wrapup: "Checkpoint: not one of the five explanations is copied verbatim from the source.",

    m5_nav: "5. Group Synthesis", m5_title: "Group Synthesis: Where Six Calls Diverge",
    m5_overview: "This section is the real work of the group discussion. Not taking turns reading out your answers, but laying six calls on the same case side by side — the same paragraph of duties can produce three different verdicts. The case with the widest spread is usually where your criteria are vaguest, and that is the hole you fill together.",
    m5_highlights: ["Only three cases","Widest spread","Vague criteria","A group rule"],
    m5_deep: "One rule is mandatory here: this week's compiler must NOT dump all six individual exports into an AI and ask for a summary. The group first decides which three of the four cases to compare, then takes only those three calls and their evidence from each member. The reason is the same as in earlier weeks — selection is the point, and dumping everything in simply lets the model smooth the disagreement away, when disagreement is exactly what this section exists to look at. Write the rule so it can be checked: \"this family of words sends the call to that axis\" is checkable; \"read the content carefully\" is not.",
    m5_focus_label: "The three cases we chose to compare (tick three)",
    m5_focus_why: "Why did we skip the remaining one?",
    m5_focus_why_ph: "e.g. All six of us called Case C PM at director level with no disagreement at all, so there was nothing to compare.",
    m5_diff_label: "Which case produced the widest spread across the six of us?",
    m5_why_label: "Why did we call it differently?",
    m5_why_ph: "e.g. Case D is all \"assist\" and \"as instructed\"; three of us seized on \"supports the product manager\" and called PM, while three called it undecidable for lack of information.",
    m5_case_label: "Which case did we re-call together, and what did we conclude?",
    m5_case_ph: "e.g. Case B. On the second pass all six agreed on PjM at engineer level, because not one verb in the description touches pricing or P&L.",
    m5_rule_label: "From this comparison, our group sets one rule",
    m5_rule_ph: "e.g. We count words first: three or more schedule verbs in the description sends it to PjM, unless pricing or P&L also appears, which sends it back to PM.",
    m5_rule_note: "These rules accumulate towards the Term Project. When you build the KB in W10, they become the first entries of business_rules.md.",
    m5_wrapup: "Checkpoint: only three cases were compared (nothing was dumped wholesale into an AI), and the rule you set is checkable rather than \"read the content carefully\".",

    m6_nav: "6. Bridge to Your TP", m6_title: "Bridge to Your TP: Who Is the Morning Brief For?",
    m6_overview: "Every worksheet carries this section. What you decide this week is not technical — it is the reader. A daily unattended PM job brief with no named reader produces a list with no point of view. Name the person first; only then can the filters be defined.",
    m6_highlights: ["A named reader","PM or PjM","All levels kept","One action this week"],
    m6_deep: "\"People looking for a job\" is not a reader. Write someone you can actually picture, in a situation: final-semester senior, ten applications with no reply, wants to stay in central Taiwan, family pushing the civil service exam while they would rather try the tech sector. With that person in view you know which postings belong at the top of the brief. On levels, this course deliberately requires the Term Project to keep every level and filter none out: from specialist all the way to CPO, everything stays, because the point is to let readers see the whole ladder — you only learn what you are missing as a junior by reading what a senior posting demands. Filtering makes the ladder disappear, and with it the most valuable thing this brief has to offer.",
    m6_reader_label: "Who is our morning brief for? (be specific about the person and the situation)",
    m6_reader_ph: "e.g. A final-semester information management student, ten applications with no reply, wants to stay in central Taiwan, unsure whether to start as a product assistant in the tech sector.",
    m6_axis_label: "Is that person after a PM or a PjM?",
    m6_level_label: "Which levels do we keep?",
    m6_level_ph: "e.g. All of them — specialist, engineer, junior, senior and director and above — so the whole ladder stays visible.",
    m6_why_label: "Why? (tie the choice back to that person's situation)",
    m6_why_ph: "e.g. Right now they can only reach specialist postings, but seeing what a senior posting demands tells them which skills to build over the next two years.",
    m6_action_label: "One action we will take this week for that reader",
    m6_action_ph: "e.g. Pull twenty central-Taiwan postings by hand this week and place them on the two axes in one table, to check that our criteria actually separate them.",
    m6_note: "Course rule for the Term Project: keep every level, filter none out, so the reader sees the whole ladder. You may rank them, but do not drop levels at the collection stage.",
    m6_wrapup: "Checkpoint: the reader is a specific person in a specific situation, and the PM／PjM and level choices map back to that person's circumstances.",

const parseSdlKb = (text) => {
  try {
    const t = String(text || '').replace(/\r\n/g, '\n').trim();
    if (!t) return { ok: false, error: 'empty' };
    const fm = t.match(/^---\n([\s\S]*?)\n---/);
    const meta = {};
    if (fm) {
      fm[1].split('\n').forEach(line => {
        if (/^\s/.test(line)) return;               // skip nested (sources / interaction)
        const m = line.match(/^([A-Za-z_]+):\s*(.*)$/);
        if (m) meta[m[1]] = m[2].replace(/^["']|["']$/g, '').trim();
      });
    }
    const sections = {};
    const parts = t.split(/^##\s*§/m);
    parts.shift();
    parts.forEach(part => {
      const n = part.match(/^(\d)/);
      if (!n) return;
      sections['s' + n[1]] = part.replace(/^\d[^\n]*\n?/, '').trim();
    });
    const hasAny = Object.keys(meta).length > 0 || Object.keys(sections).length > 0;
    if (!hasAny) return { ok: false, error: 'format' };
    return { ok: true, meta, sections, raw: t };
  } catch (e) { return { ok: false, error: 'format' }; }
};

const SdlImport = ({ t, sdl, onImport, onClear }) => {
  const [text, setText] = useState('');
  const [msg, setMsg] = useState(null);
  const fileRef = useRef(null);
  const doParse = (raw) => {
    const r = parseSdlKb(raw);
    if (!r.ok) { setMsg({ ok: false, text: r.error === 'empty' ? t.sdl_err_empty : t.sdl_err_format }); return; }
    onImport(r);
    setMsg({ ok: true, text: t.sdl_ok });
    setText('');
  };
  const onFile = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => doParse(rd.result);
    rd.readAsText(f);
    e.target.value = '';
  };
  return (
    <div className="rounded-xl border-2 border-sky-200 dark:border-sky-800/60 bg-sky-50/50 dark:bg-sky-900/10 p-5">
      <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5]">{t.sdl_title}</h3>
      <p className="text-sm text-slate-500 dark:text-slate-400 mt-1 mb-3 leading-relaxed">{t.sdl_desc}</p>

            {[sdl.meta.course, sdl.meta.semester, sdl.meta.week, sdl.meta.topic].filter(Boolean).join(' · ')}

/* ================= FlipCardDeck ================= */
const FlipCardDeck = ({ terms, t, moduleId, onCardRead }) => {
  const [groupIdx, setGroupIdx] = useState(0);
  const [flipped, setFlipped] = useState({});
  const [readSet, setReadSet] = useState(new Set());
  const [shownSet, setShownSet] = useState(new Set());
  const [shuffledOrder] = useState(() => [...Array(terms.length).keys()].sort(() => Math.random() - 0.5));
  const groupSize = 2;
  const totalGroups = Math.ceil(terms.length / groupSize);
  const currentCardIndices = shuffledOrder.slice(groupIdx*groupSize, groupIdx*groupSize + groupSize);
  useEffect(() => {
    const ns = new Set(shownSet); currentCardIndices.forEach(i => ns.add(i));
    if (ns.size !== shownSet.size) setShownSet(ns);
  }, [groupIdx]);
  const handleFlip = (i) => {
    setFlipped(f => ({...f, [i]: !f[i]}));
    if (!readSet.has(i)) { const nr = new Set(readSet); nr.add(i); setReadSet(nr); onCardRead && onCardRead(moduleId, nr.size, shownSet.size, terms.length); }
  };
  const statusText = t.flip_status.replace('{read}', readSet.size).replace('{shown}', shownSet.size).replace('{total}', terms.length);
  return (
    <div className="mt-8">
      <h3 className="text-lg font-bold uppercase tracking-wider text-slate-500 mb-2">{t.key_terms}</h3>
      <p className="text-sm text-slate-400 mb-4">{statusText}</p>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        {currentCardIndices.map(i => (
          <div key={i} className="perspective cursor-pointer h-44" onClick={() => handleFlip(i)}>
            <div className={`transform-style-3d relative w-full h-full transition-transform duration-500 ${flipped[i] ? 'rotate-y-180' : ''}`}>
              <div className="backface-hidden absolute inset-0 bg-white dark:bg-slate-800 rounded-xl p-4 flex flex-col items-center justify-center border border-slate-200 dark:border-slate-700 shadow-sm">
                <p className="font-serif font-bold text-center text-[#004030] dark:text-[#D8C3A5]">{terms[i].front}</p>
                <p className="text-xs text-slate-400 mt-2">{t.flip_prompt}</p>
              </div>
              <div className="backface-hidden rotate-y-180 absolute inset-0 bg-[#004030] dark:bg-slate-700 rounded-xl p-4 flex items-center justify-center overflow-y-auto">
                <p className="text-sm text-center text-[#D8C3A5] dark:text-slate-200 leading-relaxed">{terms[i].back}</p>
              </div>
            </div>
          </div>
        ))}
      </div>
      <div className="flex items-center gap-3 mt-4">
        <button onClick={() => { setGroupIdx(0); setFlipped({}); }} className="px-4 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">{t.flip_retry}</button>
        <button onClick={() => groupIdx < totalGroups-1 && setGroupIdx(groupIdx+1)} disabled={groupIdx >= totalGroups-1}
          className="px-4 py-2 text-sm bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.flip_next}</button>
      </div>
    </div>
  );
};

/* ================= ModuleQuiz ================= */
const ModuleQuiz = ({ questions, t, moduleId, onQuizSubmit }) => {
  const [selected, setSelected] = useState({});
  const [submitted, setSubmitted] = useState({});
  const [groupIdx, setGroupIdx] = useState(0);
  const groupSize = 2;
  const [quizIndices] = useState(() => [...Array(questions.length).keys()].sort(() => Math.random() - 0.5));
  const totalGroups = Math.ceil(quizIndices.length / groupSize);
  const [shuffledMaps] = useState(() => quizIndices.map(qi => [...Array(questions[qi].opts.length).keys()].sort(() => Math.random() - 0.5)));
  const computeCorrect = () => { let c = 0; quizIndices.forEach((qIdx, qi) => { if (selected[qi] !== undefined && shuffledMaps[qi][selected[qi]] === _d(questions[qIdx].ans)) c++; }); return c; };
  const statusText = t.quiz_status.replace('{correct}', computeCorrect()).replace('{answered}', Object.keys(selected).length).replace('{total}', quizIndices.length);
  const currentStart = groupIdx * groupSize;
  const currentIndices = quizIndices.slice(currentStart, currentStart + groupSize);
  const handleGroupSubmit = () => {
    if (!currentIndices.every((_, i) => selected[currentStart+i] !== undefined)) return;
    setSubmitted(s => ({...s, [groupIdx]: true}));
    if (groupIdx === totalGroups - 1 || Object.keys(submitted).length + 1 === totalGroups) {
      const wrong = []; let correct = 0;
      quizIndices.forEach((qIdx, qi) => {
        if (selected[qi] === undefined) return;
        if (shuffledMaps[qi][selected[qi]] === _d(questions[qIdx].ans)) correct++; else wrong.push(questions[qIdx].q);
      });
      onQuizSubmit(moduleId, correct, quizIndices.length, wrong);
    }
  };
  return (
    <div className="mt-8 bg-slate-50 dark:bg-slate-900/50 rounded-2xl p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="text-lg font-bold font-serif text-[#004030] dark:text-[#D8C3A5] mb-2">{t.quiz_title}</h3>
      <p className="text-sm text-slate-400 mb-6">{statusText}</p>
      {currentIndices.map((qIdx, localI) => {
        const qi = currentStart + localI, q = questions[qIdx], sMap = shuffledMaps[qi], isSub = !!submitted[groupIdx];
        return (
          <div key={qIdx} className="mb-6">
            <p className="font-bold mb-3">{qi+1}. {q.q}</p>
            <div className="space-y-2">
              {sMap.map((origIdx, dIdx) => {
                const isCorrect = origIdx === _d(q.ans), isSel = selected[qi] === dIdx;
                return (
                  <button key={dIdx} onClick={() => !isSub && setSelected(s => ({...s, [qi]: dIdx}))}
                    className={`w-full text-left px-4 py-3 rounded-lg border transition-all text-sm ${isSub
                      ? isCorrect ? 'bg-green-100 border-green-500 dark:bg-green-900/30'
                        : isSel ? 'bg-red-100 border-red-400 dark:bg-red-900/30' : 'border-slate-200 dark:border-slate-700'
                      : isSel ? 'border-[#004030] dark:border-[#D8C3A5] bg-[#004030]/5' : 'border-slate-200 dark:border-slate-700 hover:border-slate-400'}`}>
                    {q.opts[origIdx]}
                  </button>
                );
              })}
            </div>
            {isSub && (
              <p className={`mt-2 text-sm italic ${shuffledMaps[qi][selected[qi]] === _d(q.ans) ? 'text-green-600 dark:text-green-400' : 'text-red-500 dark:text-red-400'}`}>
                {shuffledMaps[qi][selected[qi]] === _d(q.ans) ? `✓ ${t.correct}` : `✗ ${t.incorrect}`} — {t.explanation}：{q.exp}
              </p>
            )}
          </div>
        );
      })}
      <div className="flex items-center gap-3 flex-wrap">
        {!submitted[groupIdx]
          ? <button onClick={handleGroupSubmit} disabled={!currentIndices.every((_,i) => selected[currentStart+i] !== undefined)}
              className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.submit}</button>
          : <>
              {groupIdx < totalGroups-1 && <button onClick={() => setGroupIdx(groupIdx+1)} className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg">{t.quiz_next}</button>}
              <button onClick={() => { setGroupIdx(0); setSelected({}); setSubmitted({}); }} className="px-6 py-2 border border-[#004030] dark:border-[#D8C3A5] text-[#004030] dark:text-[#D8C3A5] font-bold rounded-lg">{t.quiz_retry}</button>
            </>}
      </div>
    </div>
  );
};

/* ================= App ================= */
function App() {
  const LS_ANS = 'PMCS_W06_answers';
  const LS_ANA = 'PMCS_W06_analytics';
  const LS_STU = 'PMCS_W06_student';
  const loadLS = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } };

  const [lang, setLang] = useState('en');
  const [isDark, setIsDark] = useState(true);
  const [module, setModule] = useState(0);
  const [menuOpen, setMenuOpen] = useState(false);
  const [ttsState, setTtsState] = useState('idle');
  const [answers, setAnswers] = useState(() => loadLS(LS_ANS, {}));
  const [focus, setFocus] = useState(() => loadLS(LS_ANS + '_focus', {}));
  const [memberCount, setMemberCount] = useState(() => loadLS(LS_ANS + '_mc', DEFAULT_MEMBERS));
  const [sdl, setSdl] = useState(() => loadLS(LS_ANS + '_sdl', null));
  const [studentInfo, setStudentInfo] = useState(() => loadLS(LS_STU, { group:'', dept:'', id:'', nameEn:'', nameZh:'', compiler:'' }));
  const [analytics, setAnalytics] = useState(() => loadLS(LS_ANA, {
    time: Array(TOTAL).fill(0), clicks: Array(TOTAL).fill(0),
    quizCorrect: Array(TOTAL).fill(0), quizTotal: Array(TOTAL).fill(0),
    cardsRead: Array(TOTAL).fill(0), cardsTotal: Array(TOTAL).fill(0), wrongTopics: {}
  }));
  const menuRef = useRef(null);
  const t = dict[lang];

  useEffect(() => { document.documentElement.classList.toggle('dark', isDark); }, [isDark]);
  useEffect(() => { try { localStorage.setItem(LS_ANS, JSON.stringify(answers)); } catch {} }, [answers]);
  useEffect(() => { try { localStorage.setItem(LS_ANS + '_focus', JSON.stringify(focus)); } catch {} }, [focus]);
  useEffect(() => { try { localStorage.setItem(LS_ANS + '_mc', JSON.stringify(memberCount)); } catch {} }, [memberCount]);
  useEffect(() => { try { sdl ? localStorage.setItem(LS_ANS + '_sdl', JSON.stringify(sdl)) : localStorage.removeItem(LS_ANS + '_sdl'); } catch {} }, [sdl]);
  useEffect(() => { try { localStorage.setItem(LS_ANA, JSON.stringify(analytics)); } catch {} }, [analytics]);
  useEffect(() => { try { localStorage.setItem(LS_STU, JSON.stringify(studentInfo)); } catch {} }, [studentInfo]);
  useEffect(() => {
    const id = setInterval(() => setAnalytics(a => { const ti = [...a.time]; ti[module] += 5; return {...a, time: ti}; }), 5000);
    return () => clearInterval(id);
  }, [module]);
  useEffect(() => {
    const onDoc = e => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false); };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, []);

  const importSdl = (r) => {
    setSdl({ meta: r.meta, sections: r.sections });
    setStudentInfo(st => ({
      ...st,
      group: r.meta.group || st.group,
      id: (r.meta.student_id || st.id || '').replace(/[^0-9]/g, '').slice(0, 12),
      nameEn: /^[\x00-\x7F]+$/.test(r.meta.student || '') ? (r.meta.student || st.nameEn) : st.nameEn,
      nameZh: /^[\x00-\x7F]+$/.test(r.meta.student || '') ? st.nameZh : (r.meta.student || st.nameZh)
    }));
    if (r.meta.group) setA('g_group', r.meta.group);
    if (r.meta.date) setA('g_date', r.meta.date);
  };
  const sdlFileName = () => {
    if (!sdl) return '';
    const m = sdl.meta;
    const who = m.student || 'NA';
    return `${m.course || 'PMCS'}_${m.semester || SEMESTER_DEFAULT}${m.week || WEEK_CODE}_${(m.topic || TOPIC_CAMEL).replace(/\s+/g,'')}_${m.group || 'NA'}-${who}_${(m.date || '').replace(/-/g,'')}.md`;
  };
  const bump = () => setAnalytics(a => { const c = [...a.clicks]; c[module] += 1; return {...a, clicks: c}; });
  const setA = (id, val) => setAnswers(s => ({...s, [id]: val}));
  const handleQuizSubmit = (mid, correct, total, wrong) => setAnalytics(a => {
    const qc = [...a.quizCorrect], qt = [...a.quizTotal];
    qc[mid] = correct; qt[mid] = total;
    return {...a, quizCorrect: qc, quizTotal: qt, wrongTopics: {...a.wrongTopics, [mid]: wrong || []}};
  });
  const handleCardRead = (mid, r, s, tot) => setAnalytics(a => {
    const cr = [...a.cardsRead], ct = [...a.cardsTotal]; cr[mid] = r; ct[mid] = tot;
    return {...a, cardsRead: cr, cardsTotal: ct};
  });

  const filled = id => { const v = answers[id]; return v !== undefined && String(v).trim() !== ''; };
  const sectionPct = n => { const c = CORE[n]; return c && c.length ? Math.round(c.filter(filled).length / c.length * 100) : 100; };
  const pctPersonal = Math.round(PERSONAL_SECTIONS.reduce((s,n) => s + sectionPct(n), 0) / PERSONAL_SECTIONS.length);
  const pctGroup = Math.round(GROUP_SECTIONS.reduce((s,n) => s + sectionPct(n), 0) / GROUP_SECTIONS.length);

  const modulesList = [
    { id:0, num:'0', icon:'📋', title:t.m0_nav, kind:null },
    { id:1, num:'1', icon:'👥', title:t.m1_nav, kind:'G' },
    { id:2, num:'2', icon:'🚦', title:t.m2_nav, kind:'P' },
    { id:3, num:'3', icon:'🧭', title:t.m3_nav, kind:'P' },
    { id:4, num:'4', icon:'🗣️', title:t.m4_nav, kind:'P' },
    { id:5, num:'5', icon:'🔍', title:t.m5_nav, kind:'G' },
    { id:6, num:'6', icon:'🎯', title:t.m6_nav, kind:'G' },
    { id:7, num:'7', icon:'🎤', title:t.m7_nav, kind:'G' },
    { id:IDX_LAB, num:String(IDX_LAB), icon:'⚡', title:t.mlab_nav, kind:null },
    { id:IDX_RES, num:String(IDX_RES), icon:'🌐', title:t.mres_nav, kind:null },
    { id:IDX_ANA, num:String(IDX_ANA), icon:'📊', title:t.analytics_title, kind:null }
  ];
  const go = m => { setModule(m); setMenuOpen(false); window.scrollTo({top:0,behavior:'smooth'}); };

  /* ---------- TTS ---------- */
  const handleTTS = (action) => {
    if (!('speechSynthesis' in window)) return;
    if (action === 'stop') { speechSynthesis.cancel(); setTtsState('idle'); return; }
    if (action === 'pause') { speechSynthesis.pause(); setTtsState('paused'); return; }
    if (ttsState === 'paused') { speechSynthesis.resume(); setTtsState('playing'); return; }
    speechSynthesis.cancel();
    const sep = lang === 'zh' ? '。 ' : '. ';
    let texts = [];
    if (module === 0) {
      texts = [t.m0_title, t.m0_intro, t.m0_why, t.m0_why_desc, ...t.m0_stats.map(s => `${s.label}: ${s.val}`), ...t.m0_modules.map(m => `${m.title}. ${m.desc}`)];
    } else if (module >= 1 && module <= NUM_LEARN) {
      const k = `m${module}`;
      texts = [t[`${k}_title`], t[`${k}_overview`], ...(t[`${k}_highlights`]||[]), t[`${k}_deep`], t[`${k}_wrapup`]];
      if (module === 2) texts.push(...t.stages.map(s => `${s.n}. ${s.unit}`), ...t.m2_terms.flatMap(x => [x.front, x.back]));
      if (module === 3) texts.push(...CASES.map(c => c[lang].title));
    } else if (module === IDX_LAB) {
      texts = [t.mlab_title, t.mlab_desc, t.lab1_title, t.lab1_desc, t.lab2_title, t.lab2_desc, t.lab3_title, t.lab3_desc, t.lab4_title, t.lab4_desc, t.lab5_title, t.lab5_desc];
    } else if (module === IDX_RES) {
      texts = [t.mres_title, t.mres_desc, ...t.res_req.map(r => `${r.label}. ${r.desc}`), ...t.res_opt.map(r => `${r.label}. ${r.desc}`)];
    } else {
      texts = [t.analytics_title, t.analytics_desc, `${t.analytics_pct_personal}: ${pctPersonal}%`, `${t.analytics_pct_group}: ${pctGroup}%`];
      const weak = [1,2,3,4,5,6,7].filter(n => sectionPct(n) < 100);
      if (weak.length) { texts.push(t.analytics_wp_tts_intro); weak.forEach(n => texts.push(t.analytics_wp_tts_module.replace('{name}', t[`m${n}_nav`]).replace('{acc}', sectionPct(n)))); }
      else texts.push(t.analytics_wp_tts_allpass);
    }
    const utt = new SpeechSynthesisUtterance(texts.filter(Boolean).join(sep));

          {modulesList.map(m => (
            <button key={m.id} onClick={() => go(m.id)}
              className={`w-full flex items-center gap-2 px-3 py-2.5 rounded-lg text-sm mb-1 transition ${module === m.id ? 'bg-[#004030]/10 dark:bg-[#D8C3A5]/10 text-[#004030] dark:text-[#D8C3A5] font-bold' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}`}>
              <span className="ui-decoration shrink-0">{m.icon}</span>
              <span className="truncate text-left flex-1">{m.title}</span>
              {m.kind && <span className={`text-[10px] font-bold px-1 rounded shrink-0 ${m.kind === 'P' ? 'text-sky-700 dark:text-sky-300' : 'text-[#004030] dark:text-[#D8C3A5]'}`}>{m.kind}</span>}
            </button>
          ))}
          <div className="mt-6 px-3 space-y-3">
            <div>
              <p className="text-xs text-slate-400 mb-1">{t.analytics_pct_personal}</p>
              <div className="h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden"><div className={`h-full ${pctPersonal === 100 ? 'bg-green-500' : 'bg-sky-600 dark:bg-sky-400'}`} style={{width: pctPersonal + '%'}}></div></div>
              <p className="text-xs font-bold text-sky-700 dark:text-sky-300 mt-1">{pctPersonal}%</p>
            </div>
            <div>
              <p className="text-xs text-slate-400 mb-1">{t.analytics_pct_group}</p>
              <div className="h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden"><div className={`h-full ${pctGroup === 100 ? 'bg-green-500' : 'bg-[#004030] dark:bg-[#D8C3A5]'}`} style={{width: pctGroup + '%'}}></div></div>
              <p className="text-xs font-bold text-[#004030] dark:text-[#D8C3A5] mt-1">{pctGroup}%</p>
            </div>
          </div>
        </aside>

        <main className="flex-1 min-w-0 py-8 px-4 sm:px-6">
          <div key={`${module}-${lang}`} className="space-y-6 text-lg leading-relaxed text-slate-700 dark:text-slate-300 animate-fade-in">
            {module !== 0 && (
              <div>
                <H2 icon={cur.icon} number={cur.num}>{module <= NUM_LEARN ? t[`m${module}_title`] : module === IDX_LAB ? t.mlab_title : module === IDX_RES ? t.mres_title : t.analytics_title}</H2>
                {cur.kind && <Badge kind={cur.kind} t={t} />}
              </div>
            )}
            {body()}
            <div className="mt-12 flex justify-between items-center pt-8 border-t border-slate-300 dark:border-slate-700 no-print">
              <button onClick={() => go(Math.max(0, module-1))} disabled={module === 0}
                className="px-5 py-2.5 border border-slate-300 dark:border-slate-600 rounded-lg text-sm font-bold hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-0">← {t.nav_prev}</button>
              <button onClick={() => go(Math.min(TOTAL-1, module+1))} disabled={module === TOTAL-1}
                className="px-5 py-2.5 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] rounded-lg text-sm font-bold disabled:opacity-0">{t.nav_next} →</button>
            </div>
          </div>
        </main>
      </div>

      <footer className="h-8 bg-[#004030] flex items-center justify-between px-4 shrink-0">
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs truncate">{t.date} · {t.copyright}</span>
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs flex items-center gap-3 shrink-0">
          <span className="hidden sm:inline">{t.architect_label}&nbsp;<a href={t.architect_url} target="_blank" rel="noopener noreferrer" className="text-[#D8C3A5] hover:text-white underline">Prof. Shihmin Lo</a></span>
          <button onClick={() => window.scrollTo({top:0,behavior:'smooth'})} className="text-[#D8C3A5] hover:text-white font-bold">Top ↑</button>
        </span>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
