    m3_nav: "3. 四象限與兩軸", m3_title: "四象限與兩軸判定",
    m3_overview: "把第 2 節抓到的態度詞拿來做兩件事。第一件：分進對上、對下、對內、對外四個象限，看清楚企業在意的是哪一種關係。第二件：回到工作內容，判定這則職缺在兩軸上的位置——管理對象是產品還是專案，層級落在哪一階——並且引用讓你這樣判的那一句原句。",
    m3_highlights: ["對上對下對內對外","管理責任欄位","依據引用原句","可觀察性"],
    m3_deep: "判定兩軸時有一條硬規定：依據一律引用工作內容的原句，不採信職稱。偏 PM 的詞是產品藍圖、產品生命週期、產品損益、市場需求、競品分析、定價、規格定義、EOL；偏 PjM 的詞是時程、里程碑、資源調配、風險管控、跨部門協調、進度追蹤、交付驗收、工作分解結構與甘特圖。層級則看三件事一起：工作經歷的年資、管理責任欄位、以及工作內容的動詞（執行協調 → 制定決策 → 帶領團隊）。判不出來就選無法判定，不要硬湊——這一週要你看見的正是判不出來有多常發生。",
    m3_quad_label: "把第 2 節抓到的態度詞分進四個象限",
    m3_quad_hint: "104 的「管理責任」欄位可以預測「對下」象限會不會有字——非主管職幾乎永遠是空的。這一格空白不是你漏填，是這則職缺本來就沒有。",
    m3_quad_ph: "填關鍵詞即可，用頓號分隔",
    m3_axis_label: "兩軸判定",
    m3_axis_obj_label: "軸一：管理對象",
    m3_axis_level_label: "軸二：層級",
    m3_axis_evi_label: "依據：引用工作內容的哪一句讓你這樣判？",
    m3_axis_evi_ph: "例：工作內容寫「建立並維護工作分解結構，逐週追蹤各單位交付進度」，這是專案的語言，不是產品的語言。",
    m3_critique_label: "批判題：你填的這些 A，有哪一個是可觀察、可驗證的？如果都不是，企業在哪一關才真正篩它？",
    m3_critique_ph: "例：抗壓性強、主動積極都無法從履歷驗證。企業真正篩 A 的關卡其實是面試與試用期，紙本階段篩的仍然是 K 與 S。",
    m3_count: "已填的象限數",
    m3_wrapup: "檢查點：四象限至少三格有字，且兩軸判定的依據引用的是工作內容的原句，不是職稱。",

    m4_nav: "4. 語言實驗室", m4_title: "EMI 語言實驗室",
    m4_overview: "本課程是全英授課。從本週必讀教材中挑出五個新的詞彙或片語，以及三個你唸起來不順的字。這一節取代原本的心智圖，產出直接用於課堂討論與加分作業。",
    m4_highlights: ["新詞五個","難發音三個","自己的話","例句"],
    m4_deep: "「用自己的話解釋」不要抄原文定義——抄定義只證明你找得到，改寫才證明你讀懂了。本週的詞彙可以從 competency、taxonomy、normalisation、attribute、credential 這一類職能語彙裡挑。例句請寫跟你的期末專案有關的句子，這樣同一份力氣可以用兩次。",
    m4_terms_label: "五個新詞彙或片語",
    m4_col_term: "詞彙／片語", m4_col_mean: "用自己的話解釋", m4_col_sent: "自己造一個句子",
    m4_pron_label: "三個唸起來不順的字",
    m4_col_word: "字", m4_col_hard: "難在哪裡", m4_col_tip: "你的記憶方法",
    m4_wrapup: "檢查點：五個詞的解釋沒有一句是直接抄教材原文。",

    m5_nav: "5. 小組綜整", m5_title: "小組綜整：六則 JD 只挑三則比對",
    m5_overview: "這一節才是小組討論真正的工作。六個人各自抓了一則真實職缺，不要輪流念，也不要六則全丟給 AI 叫它總結——只挑三則放在一起比對。同樣一份主教材、六則不同的職缺，K、S、A 哪一個構面的差異最大？那個構面就是抽取規則最難寫的地方。",
    m5_highlights: ["只挑三則","差異最大的構面","可貼進 KB","組內通則"],
    m5_deep: "只挑三則不是偷懶，是選取。上一次你們學過，把全部內容丟給模型正是「過量」與「污染」；這一週同樣的道理換成資料面——比對三則你們讀得完、講得出理由，比對六則就會變成請 AI 幫你們產生一段沒有人真正檢查過的結論。選哪三則要有理由：可以挑差異最大的三則，也可以挑同一個職稱但內容明顯不同的三則。最後那條組內通則要寫成可以直接貼進 KB/ksa_taxonomy.md 的規則句，不是感想。",
    m5_focus_label: "我們決定比對的三則 JD（勾選三則）",
    m5_focus_hint: "依第 1 節的組員順序列出。名字沒填的會顯示為 JD 編號。",
    m5_focus_why: "為什麼挑這三則？",
    m5_focus_why_ph: "例：這三則都掛 PM，但工作內容一則講產品損益、一則講里程碑、一則只講整理資料，差異最能看出問題。",
    m5_diff_label: "六人抓的 JD 裡，K／S／A 哪一個構面差異最大？",
    m5_evidence_label: "從三則裡舉兩個具體例子支持上面的判斷",
    m5_evidence_ph: "例：A 的 A 構面只有「抗壓性強」四個字，C 的其他條件寫了六個態度詞，同樣是 PM 職缺，A 構面的密度差了一個量級。",
    m5_case_label: "我們選來當範例的是哪一則？",
    m5_case_ph: "例：JD3 的「PM 專案管理師」，因為它是典型的掛 PM 實為 PjM。",
    m5_rule_label: "從這次比對，我們訂下一條組內通則",
    m5_rule_ph: "例：年資一律歸 S 並正規化為整數年；原文寫「3～5 年」取下界 3；寫「不拘」記為 0；沒有這一欄記為 null，不得記為 0。",
    m5_rule_note: "這條通則會累積到期末專案。W10 建 KB 時，它就是 KB/ksa_taxonomy.md 的第一批內容——所以請寫成規則句，可以直接貼過去的那種。",
    m5_wrapup: "檢查點：只比對了三則（不是全部丟給 AI），且訂出的通則可以直接貼進 KB／ksa_taxonomy.md。",

    m6_nav: "6. 抽取規則初版", m6_title: "抽取規則初版：三構面各一條，外加判不出來時怎麼辦",
    m6_overview: "每一份學習單都有接到期末專案的這一節。這一週要交出的是晨報的抽取規則初版：K、S、A 三個構面各寫一條規則，說清楚從哪一欄取、怎麼正規化。然後最重要的一格——判不出來時怎麼辦。",
    m6_highlights: ["從哪一欄取","怎麼正規化","無法判定比例","本週一件事"],
    m6_deep: "晨報必須顯示「無法判定」的比例，而不是把判不出來的資料悄悄丟掉或硬猜一個值。超過三成就代表關鍵詞表要修——這是 Loop Engineering 的實例：系統自己回報一個可觀察的指標，你依據那個指標去修規則，修完再看指標有沒有降。沒有這個回報，你永遠不知道自己的規則爛在哪裡；有了它，修規則就變成一件可以排進待辦的事。",
    m6_rule_k_label: "K 的抽取規則：從哪一欄取、怎麼正規化",
    m6_rule_k_ph: "例：取學歷要求與科系要求兩欄。學歷正規化為高中／專科／大學／碩士／博士五級；科系用同義詞表合併為電子／資訊／機械／商管／其他五類，原文一併保留。",
    m6_rule_s_label: "S 的抽取規則：從哪一欄取、怎麼正規化",
    m6_rule_s_ph: "例：取工作經歷、語文條件、擅長工具、工作技能四欄。年資轉為整數年並取下界；工具與技能以逗號與頓號切分後去重，再對照工具同義詞表。",
    m6_rule_a_label: "A 的抽取規則：從哪一欄取、怎麼正規化",
    m6_rule_a_ph: "例：取其他條件與工作內容兩欄，用態度關鍵詞表比對，命中才收；每個命中詞同時標記四象限，對下象限僅在管理責任欄位不為「不需負擔」時才允許。",
    m6_undecided_label: "判不出來時怎麼辦？",
    m6_undecided_ph: "例：兩軸任一軸命中詞數相同或都是零，就標記 undecided，寫入待審清單並保留原句；晨報首頁顯示 undecided 佔比，超過三成就在當日待辦裡開一條「修關鍵詞表」。",
    m6_undecided_note: "這一格是本節的重點。只寫判定成功的情況等於沒有規則——真實資料裡判不出來的比例，往往比你想的高很多。",
    m6_action_label: "針對抽取規則，我們這一週要做的一件事",
    m6_action_ph: "例：這週把六人的 JD 各手工跑一次規則，統計判不出來的比例，看看是不是真的超過三成。",
    m6_wrapup: "檢查點：抽取規則寫出了「判不出來時怎麼辦」，不是只寫判定成功的情況。",

    m0_intro: "This is the pre-class worksheet for W7 of PMCS. Two required materials this week: JDKS · Reading a Job Posting (the main one, and the direct basis for sections 2 and 3), and AICF · the AI Literacy Common Language Platform, to be read as a competency framework. Last week you separated PM and PjM into two independent axes; this week you take that ruler to a real document. Find a real job posting yourself on 104 or LinkedIn — PM or PjM, either is fine — break it into K knowledge, S skills and A attitude, sort the attitude terms into the upward, downward, inward and outward quadrants, and place the posting on both axes using a sentence quoted from the job description itself. The worksheet has an individual layer and a group layer: sections 2 to 4 are filled by each person and are not submitted; in section 5 the group compares only three postings, and that comparison is the real work of the discussion; sections 6 and 7 are decided together. Roughly forty minutes individually, forty minutes as a group.",

    m2_overview: "This week's individual core task. Go to 104 or LinkedIn and find a real posting yourself, PM or PjM, rather than using a synthetic example from the material. Then break it into the eight extraction fields across K, S and A, following the structure of the 104 posting page. Pick a posting whose fields are reasonably complete; a sloppy one gives you nothing to work with.",
    m2_highlights: ["K knowledge","S skills","A attitude","Summarise, never copy"],
    m2_deep: "Two mistakes dominate here. The first is filing years of experience under K; the second is dragging the whole job description into A. Years belong to S, because they evidence being able to do the job. The job description has to be read first, then mined for attitude adjectives — not pasted. If the posting simply does not state something, write \"not stated in the posting\": blank and \"not required\" are two different things, and you will need that distinction when you write the extraction rules.",
    m2_rule_note: "Enter summaries and keywords only. Never paste whole passages of the posting. This is the course rule — no full-text copying, derived summary plus original link — put into practice, and it is the same rule your Term Project has to follow: what enters your system is a summary and a traceable link, not somebody else's text.",
    m2_jd_title_label: "Job title (the title itself may be quoted as is)",
    m2_jd_title_ph: "e.g. Senior Product Manager",
    m2_jd_company_label: "Company or industry (industry alone is fine)",
    m2_jd_company_ph: "e.g. consumer electronics / networking equipment",
    m2_jd_url_label: "Posting link",
    m2_jd_url_ph: "e.g. https://www.104.com.tw/job/xxxxxxx",
    m2_svg_cap: "Extraction completeness by dimension: K and S come from structured fields and can be rule-extracted, while A comes from free text and can only be read for meaning",
    m2_progress: "Extraction completeness",
    m2_terms: [
      { front: "K Knowledge", back: "The knowledge base of a field. On 104 it maps to the education and major requirements: menu items or short phrases, extractable and normalisable by rule." },
      { front: "S Skills", back: "Ability sufficient to do the job, with evidence behind it. Maps to experience, languages, tools and work skills. Years of experience live here, not in knowledge." },
      { front: "A Attitude", back: "The behaviour an employer wants, with no evidence attached. Scattered through other requirements and the job description, readable only by meaning, and therefore the least reliable." },
      { front: "The S / A boundary", back: "The most useful ruler: S has evidence, A does not. Anything a third party could check goes to S; anything that rests on self-assertion goes to A." },
      { front: "The four quadrants of A", back: "Upward, downward, inward, outward. Sorting scattered attitude terms into these four cells is what reveals which relationship the employer actually cares about." },
      { front: "Management duty field", back: "One of the structured 104 fields, and a direct predictor of whether the downward quadrant carries anything. For non-managerial roles it is almost always empty — a very usable prior." },
      { front: "Derived summary", back: "Keywords and short phrases rewritten after reading the original, with the source link kept. Full-text copying is banned; this is what is required instead." },
      { front: "Undecidable", back: "The most important cell in an extraction rule. Flagging a case as undecidable and queueing it for review is more honest than guessing, and far easier to fix later." }
    ],
    m2_q: [
      { q: "Under this week's operational definition, where does \"3 years of experience or more\" belong?", opts: ["K knowledge, since years accumulate field knowledge","S skills, since years evidence being able to do it","A attitude, since years indicate personal stability","Nowhere, since years are only an administrative filter"], ans: _A1, exp: "Years belong to S. They are not knowledge in themselves; they are the evidence that somebody can do the job." },
      { q: "What is the most useful ruler for separating S from A?", opts: ["S carries verifiable evidence and A carries none","S sits in requirements and A sits in the benefits","S is filled by employers and A only by applicants","S means hard skills and A always means software"], ans: _A0, exp: "S has evidence, A does not. Employers are precise in structured fields and retreat into free text on attitude — that is the evidence A is unobservable." },
      { q: "When deciding whether a posting leans PM or PjM, what does this week require you to rely on?", opts: ["The job title, since it names the role directly","A sentence quoted from the job description itself","The job category field, since it is a structured one","The salary band, since pay reflects role weight"], ans: _A1, exp: "Title misuse is one-directional and widespread — most postings say PM while describing PjM work — so the evidence must always be a sentence from the job description." },
      { q: "Which statement about the 104 \"management duty\" field is correct?", opts: ["It predicts whether the downward quadrant has words","It decides whether K should include education needs","It replaces experience as the only signal of level","It sits under benefits and says nothing about ability"], ans: _A0, exp: "The management duty field predicts the downward quadrant directly. Non-managerial roles state no direct reports, so that quadrant is naturally empty." }
    ],
    m2_wrapup: "Checkpoint: all eight extraction fields carry a summary or keywords, and not one of them is a passage copied from the posting.",

    m3_nav: "3. Quadrants & Two Axes", m3_title: "Four Quadrants and the Two-Axis Judgement",
    m3_overview: "Take the attitude terms from section 2 and do two things with them. First, sort them into the upward, downward, inward and outward quadrants, so you can see which relationship the employer cares about. Second, go back to the job description and place the posting on both axes — is the thing being managed a product or a project, and which rung of the ladder is this — quoting the sentence that made you decide.",
    m3_highlights: ["Up, down, in, out","Management duty field","Quote the sentence","Observability"],
    m3_deep: "One rule is fixed here: the evidence must be a sentence from the job description, never the title. Words leaning PM are roadmap, product life cycle, product P&L, market requirement, competitor analysis, pricing, specification definition, EOL. Words leaning PjM are schedule, milestone, resource allocation, risk control, cross-functional coordination, progress tracking, delivery acceptance, work breakdown structure and Gantt chart. Level is read from three things together: years of experience, the management duty field, and the verbs in the description (execute and coordinate → define and decide → lead a team). If you cannot tell, choose Cannot tell — how often that happens is exactly what this week wants you to see.",
    m3_quad_label: "Sort the attitude terms from section 2 into the four quadrants",
    m3_quad_hint: "The 104 \"management duty\" field predicts whether the downward quadrant carries anything — for non-managerial roles it is almost always empty. A blank there is not something you missed; the posting never had it.",
    m3_quad_ph: "Keywords only, separated by commas",
    m3_axis_label: "Two-axis judgement",
    m3_axis_obj_label: "Axis one: what is managed",
    m3_axis_level_label: "Axis two: level",
    m3_axis_evi_label: "Evidence: which sentence from the job description made you decide?",
    m3_axis_evi_ph: "e.g. The description says it maintains the work breakdown structure and tracks weekly delivery from each unit — that is the language of projects, not products.",
    m3_critique_label: "Critique: which of the A items you wrote is observable and verifiable? If none are, at which stage does the employer actually screen for them?",
    m3_critique_ph: "e.g. Neither resilience nor initiative can be verified from a CV. The employer really screens A at interview and during probation; on paper only K and S are screened.",
    m3_count: "Quadrants filled",
    m3_wrapup: "Checkpoint: at least three of the four quadrants carry words, and the two-axis evidence quotes the job description rather than the title.",

    m4_nav: "4. Language Lab", m4_title: "EMI Language Lab",
    m4_overview: "This course is taught in English. Pick five new words or phrases from this week's required materials, plus three words you stumble over. This section replaces the former mindmap requirement; its output feeds class discussion and bonus work directly.",
    m4_highlights: ["Five new terms","Three hard words","In your own words","Example sentences"],
    m4_deep: "Do not copy the source definition into the \"in your own words\" column — copying proves only that you found it; rewriting proves you understood it. This week's vocabulary can come from the competency register: competency, taxonomy, normalisation, attribute, credential. Write the example sentences about your own Term Project so one effort does two jobs.",
    m4_terms_label: "Five new words or phrases",
    m4_col_term: "Term / phrase", m4_col_mean: "In your own words", m4_col_sent: "Your own sentence",
    m4_pron_label: "Three words you stumble over",
    m4_col_word: "Word", m4_col_hard: "What makes it hard", m4_col_tip: "Your memory trick",
    m4_wrapup: "Checkpoint: not one of the five explanations is copied verbatim from the source.",

    m5_nav: "5. Group Synthesis", m5_title: "Group Synthesis: Compare Only Three of the Six Postings",
    m5_overview: "This section is the real work of the group discussion. Six people brought six real postings. Do not read them out one by one, and do not dump all six into an AI for a summary — put exactly three side by side. Same main material, six different postings: which of K, S and A varies most? That dimension is where the extraction rule will be hardest to write.",
    m5_highlights: ["Only three","Widest gap","Paste-ready for the KB","A group rule"],
    m5_deep: "Choosing three is selection, not laziness. You already learned that dumping everything into a model is exactly the \"excess\" and \"contamination\" case; this week the same logic applies to your data. Three postings you can actually read and argue about; six turns into a conclusion generated by an AI that nobody checked. Have a reason for the three you pick: the three that differ most, or three that share a title while describing obviously different work. The final group rule has to be written as a rule sentence that can be pasted straight into KB/ksa_taxonomy.md — not as a reflection.",
    m5_focus_label: "The three postings we chose to compare (tick three)",
    m5_focus_hint: "Listed in the member order from section 1. Members with no name entered show as a JD number.",
    m5_focus_why: "Why these three?",
    m5_focus_why_ph: "e.g. All three are titled PM, but one talks about product P&L, one about milestones and one only about compiling data — the contrast is where the problem shows.",
    m5_diff_label: "Across the six postings, which of K, S and A varies most?",
    m5_evidence_label: "Two concrete examples from the three that support the judgement above",
    m5_evidence_ph: "e.g. A's attitude column holds four characters; C's other-requirements field lists six attitude terms. Same PM role, an order of magnitude apart in A density.",
    m5_case_label: "Which one did we pick as the worked example?",
    m5_case_ph: "e.g. JD3, the \"PM project management specialist\", because it is a textbook case of a PM title over PjM work.",
    m5_rule_label: "From this comparison, our group sets one rule",
    m5_rule_ph: "e.g. Years of experience always go to S and are normalised to whole years; a range such as 3-5 takes the lower bound 3; \"unspecified\" records as 0; a missing field records as null and never as 0.",
    m5_rule_note: "These rules accumulate towards the Term Project. When you build the KB in W10 this becomes the first content of KB/ksa_taxonomy.md — so write it as a rule sentence, the kind you can paste straight across.",
    m5_wrapup: "Checkpoint: only three postings were compared (nothing was dumped wholesale into an AI), and the rule you set can be pasted straight into KB/ksa_taxonomy.md.",

    m6_nav: "6. First Extraction Rules", m6_title: "First Extraction Rules: One per Dimension, Plus the Undecidable Case",
    m6_overview: "Every worksheet carries a bridge to the Term Project. This week you hand in the first version of your morning brief's extraction rules: one rule each for K, S and A, saying which field it reads and how it normalises. Then the cell that matters most — what happens when the posting cannot be classified.",
    m6_highlights: ["Which field","How to normalise","Undecidable ratio","One action this week"],
    m6_deep: "The morning brief has to display the share of cases it could not classify, rather than quietly dropping them or guessing. Above thirty per cent means the keyword list needs work — this is Loop Engineering in miniature: the system reports an observable indicator, you fix the rules against that indicator, then watch whether it falls. Without the report you never learn where your rules are weak; with it, fixing rules becomes a task you can schedule.",
    m6_rule_k_label: "K extraction rule: which field, and how normalised",
    m6_rule_k_ph: "e.g. Read education and major. Education normalises to five levels: high school, junior college, bachelor, master, doctorate. Major merges through a synonym table into electronics / information / mechanical / business / other, with the original text kept.",
    m6_rule_s_label: "S extraction rule: which field, and how normalised",
    m6_rule_s_ph: "e.g. Read experience, languages, tools and work skills. Years convert to whole years at the lower bound; tools and skills split on commas and line breaks, deduplicate, then map through a tool synonym table.",
    m6_rule_a_label: "A extraction rule: which field, and how normalised",
    m6_rule_a_ph: "e.g. Read other requirements and the job description, matching against an attitude keyword list and keeping only hits. Each hit is tagged with a quadrant, and the downward quadrant is allowed only when the management duty field is not \"no direct reports\".",
    m6_undecided_label: "What do we do when it cannot be classified?",
    m6_undecided_ph: "e.g. If either axis has an equal number of hits on both sides, or zero on both, flag it undecided, queue it for review and keep the original sentence. The brief shows the undecided share on its front page, and above thirty per cent it opens a task to revise the keyword list.",
    m6_undecided_note: "This cell is the point of the section. Rules that only cover successful classification are not rules — in real data the share you cannot classify is usually far higher than you expect.",
    m6_action_label: "One action we will take this week on the extraction rules",
    m6_action_ph: "e.g. Run the rules by hand over all six of our postings this week and count how often they fail, to see whether it really is above thirty per cent.",
    m6_wrapup: "Checkpoint: the extraction rules state what to do when a posting cannot be classified, not only the successful cases.",

    m7_nav: "7. Presentation Plan", m7_title: "Presentation Plan and Question",
    m7_overview: "Turn section 1's split into a runnable script, and prepare one question to put to the class. The 10-minute Q&A is carried entirely by the questions each group brings.",
    m7_highlights: ["Opening line","Segment script","Menti question","10 minutes"],
    m7_deep: "Write the opening line as a complete English sentence, not as keywords — the first sentence is always the one that jams. Avoid yes-or-no questions for the class; a good question forces a judgement first, for example: if every attitude requirement in a posting is unverifiable, at which stage does the employer actually screen for it?",
    m7_open_label: "English opening line (one complete sentence)",
    m7_open_ph: "e.g. We pulled six real postings from 104, and the same word appeared in five of them without ever being verifiable.",
    m7_script_label: "Segment script (one sentence per speaker on the point they will make)",
    m7_col_who: "Speaker", m7_col_point: "The point of this segment",
    m7_question_label: "One question for the class (for Menti)",
    m7_question_ph: "e.g. If none of the attitude requirements in a posting can be verified on paper, at which stage does the employer actually screen for them?",
    m7_wrapup: "Checkpoint: the opening line is a complete English sentence, and the question cannot be answered with yes or no.",

const parseSdlKb = (text) => {
  try {
    const t = String(text || '').replace(/\r\n/g, '\n').trim();
    if (!t) return { ok: false, error: 'empty' };
    const fm = t.match(/^---\n([\s\S]*?)\n---/);
    const meta = {};
    if (fm) {
      fm[1].split('\n').forEach(line => {
        if (/^\s/.test(line)) return;               // skip nested (sources / interaction)
        const m = line.match(/^([A-Za-z_]+):\s*(.*)$/);
        if (m) meta[m[1]] = m[2].replace(/^["']|["']$/g, '').trim();
      });
    }
    const sections = {};
    const parts = t.split(/^##\s*§/m);
    parts.shift();
    parts.forEach(part => {
      const n = part.match(/^(\d)/);
      if (!n) return;
      sections['s' + n[1]] = part.replace(/^\d[^\n]*\n?/, '').trim();
    });
    const hasAny = Object.keys(meta).length > 0 || Object.keys(sections).length > 0;
    if (!hasAny) return { ok: false, error: 'format' };
    return { ok: true, meta, sections, raw: t };
  } catch (e) { return { ok: false, error: 'format' }; }
};

const SdlImport = ({ t, sdl, onImport, onClear }) => {
  const [text, setText] = useState('');
  const [msg, setMsg] = useState(null);
  const fileRef = useRef(null);
  const doParse = (raw) => {
    const r = parseSdlKb(raw);
    if (!r.ok) { setMsg({ ok: false, text: r.error === 'empty' ? t.sdl_err_empty : t.sdl_err_format }); return; }
    onImport(r);
    setMsg({ ok: true, text: t.sdl_ok });
    setText('');
  };
  const onFile = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => doParse(rd.result);
    rd.readAsText(f);
    e.target.value = '';
  };
  return (
    <div className="rounded-xl border-2 border-sky-200 dark:border-sky-800/60 bg-sky-50/50 dark:bg-sky-900/10 p-5">
      <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5]">{t.sdl_title}</h3>
      <p className="text-sm text-slate-500 dark:text-slate-400 mt-1 mb-3 leading-relaxed">{t.sdl_desc}</p>

            {[sdl.meta.course, sdl.meta.semester, sdl.meta.week, sdl.meta.topic].filter(Boolean).join(' · ')}

          </p>
          <button onClick={onClear} className="mt-3 px-3 py-1.5 text-xs border border-red-400 text-red-600 dark:text-red-400 rounded-lg">{t.sdl_clear}</button>
        </div>
      ) : (

            <button onClick={() => fileRef.current && fileRef.current.click()} className="px-4 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg">{t.sdl_file}</button>
            <input ref={fileRef} type="file" accept=".md,.markdown,.txt" onChange={onFile} className="hidden" />
          </div>

/* ================= FlipCardDeck ================= */
const FlipCardDeck = ({ terms, t, moduleId, onCardRead }) => {
  const [groupIdx, setGroupIdx] = useState(0);
  const [flipped, setFlipped] = useState({});
  const [readSet, setReadSet] = useState(new Set());
  const [shownSet, setShownSet] = useState(new Set());
  const [shuffledOrder] = useState(() => [...Array(terms.length).keys()].sort(() => Math.random() - 0.5));
  const groupSize = 2;
  const totalGroups = Math.ceil(terms.length / groupSize);
  const currentCardIndices = shuffledOrder.slice(groupIdx*groupSize, groupIdx*groupSize + groupSize);
  useEffect(() => {
    const ns = new Set(shownSet); currentCardIndices.forEach(i => ns.add(i));
    if (ns.size !== shownSet.size) setShownSet(ns);
  }, [groupIdx]);
  const handleFlip = (i) => {
    setFlipped(f => ({...f, [i]: !f[i]}));
    if (!readSet.has(i)) { const nr = new Set(readSet); nr.add(i); setReadSet(nr); onCardRead && onCardRead(moduleId, nr.size, shownSet.size, terms.length); }
  };
  const statusText = t.flip_status.replace('{read}', readSet.size).replace('{shown}', shownSet.size).replace('{total}', terms.length);
  return (
    <div className="mt-8">
      <h3 className="text-lg font-bold uppercase tracking-wider text-slate-500 mb-2">{t.key_terms}</h3>
      <p className="text-sm text-slate-400 mb-4">{statusText}</p>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        {currentCardIndices.map(i => (
          <div key={i} className="perspective cursor-pointer h-44" onClick={() => handleFlip(i)}>
            <div className={`transform-style-3d relative w-full h-full transition-transform duration-500 ${flipped[i] ? 'rotate-y-180' : ''}`}>
              <div className="backface-hidden absolute inset-0 bg-white dark:bg-slate-800 rounded-xl p-4 flex flex-col items-center justify-center border border-slate-200 dark:border-slate-700 shadow-sm">
                <p className="font-serif font-bold text-center text-[#004030] dark:text-[#D8C3A5]">{terms[i].front}</p>
                <p className="text-xs text-slate-400 mt-2">{t.flip_prompt}</p>
              </div>
              <div className="backface-hidden rotate-y-180 absolute inset-0 bg-[#004030] dark:bg-slate-700 rounded-xl p-4 flex items-center justify-center overflow-y-auto">
                <p className="text-sm text-center text-[#D8C3A5] dark:text-slate-200 leading-relaxed">{terms[i].back}</p>
              </div>
            </div>
          </div>
        ))}
      </div>
      <div className="flex items-center gap-3 mt-4">
        <button onClick={() => { setGroupIdx(0); setFlipped({}); }} className="px-4 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">{t.flip_retry}</button>
        <button onClick={() => groupIdx < totalGroups-1 && setGroupIdx(groupIdx+1)} disabled={groupIdx >= totalGroups-1}
          className="px-4 py-2 text-sm bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.flip_next}</button>
      </div>
    </div>
  );
};

/* ================= ModuleQuiz ================= */
const ModuleQuiz = ({ questions, t, moduleId, onQuizSubmit }) => {
  const [selected, setSelected] = useState({});
  const [submitted, setSubmitted] = useState({});
  const [groupIdx, setGroupIdx] = useState(0);
  const groupSize = 2;
  const [quizIndices] = useState(() => [...Array(questions.length).keys()].sort(() => Math.random() - 0.5));
  const totalGroups = Math.ceil(quizIndices.length / groupSize);
  const [shuffledMaps] = useState(() => quizIndices.map(qi => [...Array(questions[qi].opts.length).keys()].sort(() => Math.random() - 0.5)));
  const computeCorrect = () => { let c = 0; quizIndices.forEach((qIdx, qi) => { if (selected[qi] !== undefined && shuffledMaps[qi][selected[qi]] === _d(questions[qIdx].ans)) c++; }); return c; };
  const statusText = t.quiz_status.replace('{correct}', computeCorrect()).replace('{answered}', Object.keys(selected).length).replace('{total}', quizIndices.length);
  const currentStart = groupIdx * groupSize;
  const currentIndices = quizIndices.slice(currentStart, currentStart + groupSize);
  const handleGroupSubmit = () => {
    if (!currentIndices.every((_, i) => selected[currentStart+i] !== undefined)) return;
    setSubmitted(s => ({...s, [groupIdx]: true}));
    if (groupIdx === totalGroups - 1 || Object.keys(submitted).length + 1 === totalGroups) {
      const wrong = []; let correct = 0;
      quizIndices.forEach((qIdx, qi) => {
        if (selected[qi] === undefined) return;
        if (shuffledMaps[qi][selected[qi]] === _d(questions[qIdx].ans)) correct++; else wrong.push(questions[qIdx].q);
      });
      onQuizSubmit(moduleId, correct, quizIndices.length, wrong);
    }
  };
  return (
    <div className="mt-8 bg-slate-50 dark:bg-slate-900/50 rounded-2xl p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="text-lg font-bold font-serif text-[#004030] dark:text-[#D8C3A5] mb-2">{t.quiz_title}</h3>
      <p className="text-sm text-slate-400 mb-6">{statusText}</p>
      {currentIndices.map((qIdx, localI) => {
        const qi = currentStart + localI, q = questions[qIdx], sMap = shuffledMaps[qi], isSub = !!submitted[groupIdx];
        return (
          <div key={qIdx} className="mb-6">
            <p className="font-bold mb-3">{qi+1}. {q.q}</p>
            <div className="space-y-2">
              {sMap.map((origIdx, dIdx) => {
                const isCorrect = origIdx === _d(q.ans), isSel = selected[qi] === dIdx;
                return (
                  <button key={dIdx} onClick={() => !isSub && setSelected(s => ({...s, [qi]: dIdx}))}
                    className={`w-full text-left px-4 py-3 rounded-lg border transition-all text-sm ${isSub
                      ? isCorrect ? 'bg-green-100 border-green-500 dark:bg-green-900/30'
                        : isSel ? 'bg-red-100 border-red-400 dark:bg-red-900/30' : 'border-slate-200 dark:border-slate-700'
                      : isSel ? 'border-[#004030] dark:border-[#D8C3A5] bg-[#004030]/5' : 'border-slate-200 dark:border-slate-700 hover:border-slate-400'}`}>
                    {q.opts[origIdx]}
                  </button>
                );
              })}
            </div>
            {isSub && (
              <p className={`mt-2 text-sm italic ${shuffledMaps[qi][selected[qi]] === _d(q.ans) ? 'text-green-600 dark:text-green-400' : 'text-red-500 dark:text-red-400'}`}>
                {shuffledMaps[qi][selected[qi]] === _d(q.ans) ? `✓ ${t.correct}` : `✗ ${t.incorrect}`} — {t.explanation}：{q.exp}
              </p>
            )}
          </div>
        );
      })}
      <div className="flex items-center gap-3 flex-wrap">
        {!submitted[groupIdx]
          ? <button onClick={handleGroupSubmit} disabled={!currentIndices.every((_,i) => selected[currentStart+i] !== undefined)}
              className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.submit}</button>
          : <>
              {groupIdx < totalGroups-1 && <button onClick={() => setGroupIdx(groupIdx+1)} className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg">{t.quiz_next}</button>}
              <button onClick={() => { setGroupIdx(0); setSelected({}); setSubmitted({}); }} className="px-6 py-2 border border-[#004030] dark:border-[#D8C3A5] text-[#004030] dark:text-[#D8C3A5] font-bold rounded-lg">{t.quiz_retry}</button>
            </>}
      </div>
    </div>
  );
};

const LabSelfCheck = ({ t, state, setState, onTouch }) => {
  const v = state || {};

  const title = (v.title || '').trim();
  const echoesTitle = s => {
    const c = s.trim();
    if (!c || !title) return false;
    return c === title || (c.length <= title.length + 4 && (c.indexOf(title) >= 0 || title.indexOf(c) >= 0));
  };
  const c1 = !cells.some(looksCopied);
  const c2 = !cells.some(echoesTitle);
  const c3 = cells.every(s => s.trim() !== '');
  const rows = [

          </div>

const LabRuleGen = ({ t, state, setState, onTouch, lang }) => {
  const v = state || {};
  const [copied, setCopied] = useState(false);
  const toggle = (k) => { setState({ ...v, [k]: !v[k] }); setCopied(false); onTouch && onTouch(); };
  const picked = arr => arr.filter(it => v[it.k]);
  const srcs = picked(t.lab4_srcs), norms = picked(t.lab4_norms), undecs = picked(t.lab4_undecs);
  const usePm = !!v.term_pm, usePjm = !!v.term_pjm;
  const any = srcs.length || norms.length || undecs.length || usePm || usePjm;
  const md = (() => {
    if (!any) return '';
    const L = [];
    L.push('# ksa_taxonomy.md');
    L.push('');
    L.push(lang === 'zh' ? '> 由 PMCS W7 學習單的抽取規則產生器產出的草稿，請再依本組實際資料修訂。' : '> Draft generated by the extraction rule generator in the PMCS W7 worksheet. Revise against your own data.');
    L.push('');
    KSA_IDS.forEach(d => {
      const fs = srcs.filter(s => s.d === d);
      if (!fs.length) return;
      L.push(`## ${d}`);
      L.push((lang === 'zh' ? '- 來源欄位：' : '- Source fields: ') + fs.map(f => f.n).join(lang === 'zh' ? '、' : ', '));
      L.push('');
    });
    if (norms.length) {
      L.push(lang === 'zh' ? '## 正規化' : '## Normalisation');
      norms.forEach(x => L.push('- ' + x.n));
      L.push('');
    }
    if (usePm || usePjm) {
      L.push(lang === 'zh' ? '## 兩軸判準詞' : '## Two-axis decision terms');
      if (usePm) L.push('- PM: ' + t.lab4_terms_pm.join(', '));
      if (usePjm) L.push('- PjM: ' + t.lab4_terms_pjm.join(', '));
      L.push(lang === 'zh' ? '- 依據一律引用工作內容原句，不採信職稱。' : '- Evidence is always a sentence from the job description, never the title.');
      L.push('');
    }
    if (undecs.length) {
      L.push(lang === 'zh' ? '## 無法判定' : '## Undecidable');
      undecs.forEach(x => L.push('- ' + x.n));
      L.push('');
    }
    return L.join('\n');
  })();
  const doCopy = () => {
    if (!md) return;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(md); }
      else {
        const ta = document.createElement('textarea');
        ta.value = md; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
      }
      setCopied(true); setTimeout(() => setCopied(false), 1800);
    } catch (e) {}
    onTouch && onTouch();
  };
  const Box = ({ items }) => (
    <div className="space-y-1.5">
      {items.map(it => (
        <label key={it.k} className="flex items-start gap-2.5 p-2 rounded-lg border border-slate-200 dark:border-slate-700 cursor-pointer hover:border-[#004030] dark:hover:border-[#D8C3A5] transition">
          <input type="checkbox" className="w-4 h-4 mt-0.5 accent-[#004030] dark:accent-[#D8C3A5] shrink-0" checked={!!v[it.k]} onChange={() => toggle(it.k)} />
          <span className="text-xs leading-relaxed">{it.d ? <span className="font-bold text-[#004030] dark:text-[#D8C3A5]">{it.d} · </span> : null}{it.n}</span>
        </label>
      ))}
    </div>
  );
  return (
    <div className="bg-white dark:bg-slate-800 rounded-xl p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-1">{t.lab4_title}</h3>
      <p className="text-sm text-slate-500 dark:text-slate-400 mb-4">{t.lab4_desc}</p>
      <div className="space-y-4">
        <div>
          <p className="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">{t.lab4_src_label}</p>
          <Box items={t.lab4_srcs} />
        </div>
        <div>
          <p className="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">{t.lab4_norm_label}</p>
          <Box items={t.lab4_norms} />
        </div>
        <div>
          <p className="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">{t.lab4_term_label}</p>
          <Box items={[{ k:'term_pm', n:'PM: ' + t.lab4_terms_pm.join(', ') }, { k:'term_pjm', n:'PjM: ' + t.lab4_terms_pjm.join(', ') }]} />
        </div>
        <div>
          <p className="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">{t.lab4_undec_label}</p>
          <Box items={t.lab4_undecs} />
        </div>
      </div>
      <div className="mt-5">
        <div className="flex items-center justify-between gap-3 mb-2">
          <p className="text-xs font-bold uppercase tracking-wider text-slate-500">{t.lab4_out_label}</p>
          <button onClick={doCopy} disabled={!md} className="px-3 py-1.5 text-xs bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40 shrink-0">{copied ? t.lab4_copied : t.lab4_copy}</button>
        </div>
        <pre className="text-xs whitespace-pre-wrap font-mono bg-slate-50 dark:bg-slate-900/50 rounded-lg p-3 max-h-72 overflow-y-auto text-slate-700 dark:text-slate-300 leading-relaxed">{md || t.lab4_empty}</pre>
      </div>
    </div>
  );
};

function App() {
  const LS_ANS = 'PMCS_W07_answers';
  const LS_ANA = 'PMCS_W07_analytics';
  const LS_STU = 'PMCS_W07_student';
  const LS_LAB = 'PMCS_W07_lab';
  const loadLS = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } };

  const [lang, setLang] = useState('en');
  const [isDark, setIsDark] = useState(true);
  const [module, setModule] = useState(0);
  const [menuOpen, setMenuOpen] = useState(false);
  const [ttsState, setTtsState] = useState('idle');
  const [answers, setAnswers] = useState(() => loadLS(LS_ANS, {}));
  const [focus, setFocus] = useState(() => loadLS(LS_ANS + '_focus', {}));
  const [memberCount, setMemberCount] = useState(() => loadLS(LS_ANS + '_mc', DEFAULT_MEMBERS));
  const [sdl, setSdl] = useState(() => loadLS(LS_ANS + '_sdl', null));
  const [lab, setLab] = useState(() => loadLS(LS_LAB, {}));
  const [labNonce, setLabNonce] = useState(0);
  const [studentInfo, setStudentInfo] = useState(() => loadLS(LS_STU, { group:'', dept:'', id:'', nameEn:'', nameZh:'', compiler:'' }));
  const [analytics, setAnalytics] = useState(() => loadLS(LS_ANA, {
    time: Array(TOTAL).fill(0), clicks: Array(TOTAL).fill(0),
    quizCorrect: Array(TOTAL).fill(0), quizTotal: Array(TOTAL).fill(0),
    cardsRead: Array(TOTAL).fill(0), cardsTotal: Array(TOTAL).fill(0), wrongTopics: {}
  }));
  const menuRef = useRef(null);
  const t = dict[lang];

  useEffect(() => { document.documentElement.classList.toggle('dark', isDark); }, [isDark]);
  useEffect(() => { try { localStorage.setItem(LS_ANS, JSON.stringify(answers)); } catch {} }, [answers]);
  useEffect(() => { try { localStorage.setItem(LS_ANS + '_focus', JSON.stringify(focus)); } catch {} }, [focus]);
  useEffect(() => { try { localStorage.setItem(LS_ANS + '_mc', JSON.stringify(memberCount)); } catch {} }, [memberCount]);
  useEffect(() => { try { sdl ? localStorage.setItem(LS_ANS + '_sdl', JSON.stringify(sdl)) : localStorage.removeItem(LS_ANS + '_sdl'); } catch {} }, [sdl]);
  useEffect(() => { try { localStorage.setItem(LS_LAB, JSON.stringify(lab)); } catch {} }, [lab]);
  useEffect(() => { try { localStorage.setItem(LS_ANA, JSON.stringify(analytics)); } catch {} }, [analytics]);
  useEffect(() => { try { localStorage.setItem(LS_STU, JSON.stringify(studentInfo)); } catch {} }, [studentInfo]);
  useEffect(() => {
    const id = setInterval(() => setAnalytics(a => { const ti = [...a.time]; ti[module] += 5; return {...a, time: ti}; }), 5000);
    return () => clearInterval(id);
  }, [module]);
  useEffect(() => {
    const onDoc = e => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false); };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, []);

  const importSdl = (r) => {
    setSdl({ meta: r.meta, sections: r.sections });
    setStudentInfo(st => ({
      ...st,
      group: r.meta.group || st.group,
      id: (r.meta.student_id || st.id || '').replace(/[^0-9]/g, '').slice(0, 12),
      nameEn: /^[\x00-\x7F]+$/.test(r.meta.student || '') ? (r.meta.student || st.nameEn) : st.nameEn,
      nameZh: /^[\x00-\x7F]+$/.test(r.meta.student || '') ? st.nameZh : (r.meta.student || st.nameZh)
    }));
    if (r.meta.group) setA('g_group', r.meta.group);
    if (r.meta.date) setA('g_date', r.meta.date);
  };
  const sdlFileName = () => {
    if (!sdl) return '';
    const m = sdl.meta;
    const who = m.student || 'NA';
    return `${m.course || 'PMCS'}_${m.semester || SEMESTER_DEFAULT}${m.week || WEEK_CODE}_${(m.topic || TOPIC_CAMEL).replace(/\s+/g,'')}_${m.group || 'NA'}-${who}_${(m.date || '').replace(/-/g,'')}.md`;
  };
  const bump = () => setAnalytics(a => { const c = [...a.clicks]; c[module] += 1; return {...a, clicks: c}; });
  const setA = (id, val) => setAnswers(s => ({...s, [id]: val}));

            <InfoInput id="dept" label={t.analytics_dept} ph={t.analytics_dept_ph} value={studentInfo.dept} onChange={setInfo} />
          </div>
          <button onClick={exportPersonal} disabled={!okPersonal}
            className="mt-4 px-5 py-2.5 bg-sky-700 dark:bg-sky-300 text-white dark:text-sky-950 font-bold rounded-lg disabled:opacity-40">{t.analytics_export_personal}</button>
          {!okPersonal && <p className="text-xs text-amber-600 dark:text-amber-400 mt-2">{t.analytics_need_personal}</p>}
        </div>

        <div className="mt-5 rounded-xl border-2 border-[#D8C3A5] dark:border-[#D8C3A5]/50 bg-[#D8C3A5]/10 p-5">
          <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5]">{t.analytics_group_title}</h3>
          <p className="text-sm text-slate-500 dark:text-slate-400 mt-1 mb-4">{t.analytics_group_desc}</p>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div><label className="block text-xs font-bold text-slate-500 mb-1">{t.analytics_group}</label>
              <select className={inputCls} value={studentInfo.group} onChange={e => setStudentInfo(s => ({...s, group: e.target.value}))}>
                <option value="">{t.select_ph}</option>{t.group_options.map(g => <option key={g} value={g}>{g}</option>)}
              </select></div>
            <InfoInput id="compiler" label={t.analytics_compiler} ph={t.analytics_compiler_ph} value={studentInfo.compiler} onChange={setInfo} />
          </div>
          <div className="flex flex-wrap gap-3 mt-4">
            <button onClick={exportGroupCSV} disabled={!okGroup} className="px-5 py-2.5 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.analytics_export_csv}</button>
            <button onClick={exportGroupMD} disabled={!okGroup} className="px-5 py-2.5 border-2 border-[#004030] dark:border-[#D8C3A5] text-[#004030] dark:text-[#D8C3A5] font-bold rounded-lg disabled:opacity-40">{t.analytics_export_md}</button>
          </div>
          {!okGroup && <p className="text-xs text-amber-600 dark:text-amber-400 mt-2">{t.analytics_need_group}</p>}
        </div>

        <div className="mt-6 flex items-center gap-3 flex-wrap">
          <button onClick={clearAll} className="px-5 py-2.5 border border-red-400 text-red-600 dark:text-red-400 font-bold rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20">{t.analytics_wp_clear}</button>
          <span className="text-xs text-slate-400">💾 {t.analytics_wp_saved}</span>
        </div>
      </>
    );
  };

  const body = () => {
    if (module === 0) return renderM0();
    if (module === 1) return renderM1();
    if (module === 2) return renderM2();
    if (module === 3) return renderM3();
    if (module === 4) return renderM4();
    if (module === 5) return renderM5();
    if (module === 6) return renderM6();
    if (module === 7) return renderM7();
    if (module === IDX_LAB) return renderLab();
    if (module === IDX_RES) return renderRes();
    return renderAna();
  };
  const cur = modulesList[module];

  return (
    <div className="min-h-screen flex flex-col pt-16 overflow-x-hidden">
      <header className="fixed top-0 left-0 right-0 h-16 bg-[#004030] dark:bg-slate-900 text-white z-50 shadow-lg border-b border-[#D8C3A5]/30">
        <div className="max-w-7xl mx-auto px-3 sm:px-4 h-16 flex items-center justify-between">
          <div className="flex items-center gap-1 sm:gap-2 min-w-0">
            <div className="relative" ref={menuRef}>
              <button onClick={() => setMenuOpen(!menuOpen)} className="p-2 hover:bg-white/10 rounded-lg" aria-label={t.nav_modules}>{menuOpen ? <IconX/> : <IconMenu/>}</button>
              {menuOpen && (
                <div className="absolute top-full left-0 mt-1 w-72 max-w-[calc(100vw-2rem)] max-h-[calc(100vh-5rem)] overflow-y-auto bg-white dark:bg-slate-800 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 z-[100]">
                  {modulesList.map(m => (
                    <button key={m.id} onClick={() => go(m.id)}
                      className={`w-full flex items-center gap-3 px-4 py-3 text-sm transition ${module === m.id ? 'bg-[#004030]/10 dark:bg-[#D8C3A5]/10 text-[#004030] dark:text-[#D8C3A5] font-bold' : 'text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700'}`}>
                      <span className="ui-decoration">{m.icon}</span><span className="truncate flex-1 text-left">{m.title}</span>
                      {m.kind && <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded shrink-0 ${m.kind === 'P' ? 'bg-sky-100 text-sky-800 dark:bg-sky-900/40 dark:text-sky-200' : 'bg-[#D8C3A5]/40 text-[#004030] dark:bg-[#D8C3A5]/20 dark:text-[#D8C3A5]'}`}>{m.kind}</span>}
                    </button>
                  ))}
                </div>
              )}
            </div>
            <button onClick={() => go(0)} className="p-2 hover:bg-white/10 rounded-lg" aria-label={t.nav_home}><IconHome size={18}/></button>
            <button onClick={() => window.scrollTo({top:0,behavior:'smooth'})} className="flex items-center gap-2 min-w-0">
              <span className="font-serif font-black text-[#D8C3A5] text-lg tracking-widest">{t.brand}</span>
              <span className="hidden sm:inline font-serif font-bold text-sm md:text-base truncate">{t.title}</span>
            </button>
          </div>
          <div className="flex items-center gap-1 sm:gap-2">
            <button onClick={() => handleTTS(ttsState === 'playing' ? 'pause' : 'play')} className="p-2 hover:bg-white/10 rounded-lg" aria-label={t.audio_read}>{ttsState === 'playing' ? <IconPause size={18}/> : <IconPlay size={18}/>}</button>
            <button onClick={() => handleTTS('stop')} className="p-2 hover:bg-white/10 rounded-lg" aria-label="Stop"><IconSquare size={18}/></button>
            <button onClick={() => setLang(lang === 'en' ? 'zh' : 'en')} className="px-2 py-2 hover:bg-white/10 rounded-lg flex items-center gap-1"><IconGlobe size={18}/><span className="text-xs font-bold">{lang === 'en' ? '中' : 'EN'}</span></button>
            <button onClick={() => setIsDark(!isDark)} className="p-2 hover:bg-white/10 rounded-lg" aria-label="Theme">{isDark ? <IconSun size={18}/> : <IconMoon size={18}/>}</button>
          </div>
        </div>
      </header>

      <div className="flex-1 w-full max-w-7xl mx-auto flex">
        <aside className="hidden md:block w-64 shrink-0 border-r border-slate-200 dark:border-slate-700 py-8 px-3">
          <p className="text-xs font-bold uppercase tracking-wider text-slate-400 px-3 mb-3">{t.nav_modules}</p>
          {modulesList.map(m => (
            <button key={m.id} onClick={() => go(m.id)}
              className={`w-full flex items-center gap-2 px-3 py-2.5 rounded-lg text-sm mb-1 transition ${module === m.id ? 'bg-[#004030]/10 dark:bg-[#D8C3A5]/10 text-[#004030] dark:text-[#D8C3A5] font-bold' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}`}>
              <span className="ui-decoration shrink-0">{m.icon}</span>
              <span className="truncate text-left flex-1">{m.title}</span>
              {m.kind && <span className={`text-[10px] font-bold px-1 rounded shrink-0 ${m.kind === 'P' ? 'text-sky-700 dark:text-sky-300' : 'text-[#004030] dark:text-[#D8C3A5]'}`}>{m.kind}</span>}
            </button>
          ))}
          <div className="mt-6 px-3 space-y-3">
            <div>
              <p className="text-xs text-slate-400 mb-1">{t.analytics_pct_personal}</p>
              <div className="h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden"><div className={`h-full ${pctPersonal === 100 ? 'bg-green-500' : 'bg-sky-600 dark:bg-sky-400'}`} style={{width: pctPersonal + '%'}}></div></div>
              <p className="text-xs font-bold text-sky-700 dark:text-sky-300 mt-1">{pctPersonal}%</p>
            </div>
            <div>
              <p className="text-xs text-slate-400 mb-1">{t.analytics_pct_group}</p>
              <div className="h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden"><div className={`h-full ${pctGroup === 100 ? 'bg-green-500' : 'bg-[#004030] dark:bg-[#D8C3A5]'}`} style={{width: pctGroup + '%'}}></div></div>
              <p className="text-xs font-bold text-[#004030] dark:text-[#D8C3A5] mt-1">{pctGroup}%</p>
            </div>
          </div>
        </aside>

        <main className="flex-1 min-w-0 py-8 px-4 sm:px-6">
          <div key={`${module}-${lang}`} className="space-y-6 text-lg leading-relaxed text-slate-700 dark:text-slate-300 animate-fade-in">
            {module !== 0 && (
              <div>
                <H2 icon={cur.icon} number={cur.num}>{module <= NUM_LEARN ? t[`m${module}_title`] : module === IDX_LAB ? t.mlab_title : module === IDX_RES ? t.mres_title : t.analytics_title}</H2>
                {cur.kind && <Badge kind={cur.kind} t={t} />}
              </div>
            )}
            {body()}
            <div className="mt-12 flex justify-between items-center pt-8 border-t border-slate-300 dark:border-slate-700 no-print">
              <button onClick={() => go(Math.max(0, module-1))} disabled={module === 0}
                className="px-5 py-2.5 border border-slate-300 dark:border-slate-600 rounded-lg text-sm font-bold hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-0">← {t.nav_prev}</button>
              <button onClick={() => go(Math.min(TOTAL-1, module+1))} disabled={module === TOTAL-1}
                className="px-5 py-2.5 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] rounded-lg text-sm font-bold disabled:opacity-0">{t.nav_next} →</button>
            </div>
          </div>
        </main>
      </div>

      <footer className="h-8 bg-[#004030] flex items-center justify-between px-4 shrink-0">
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs truncate">{t.date} · {t.copyright}</span>
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs flex items-center gap-3 shrink-0">
          <span className="hidden sm:inline">{t.architect_label}&nbsp;<a href={t.architect_url} target="_blank" rel="noopener noreferrer" className="text-[#D8C3A5] hover:text-white underline">Prof. Shihmin Lo</a></span>
          <button onClick={() => window.scrollTo({top:0,behavior:'smooth'})} className="text-[#D8C3A5] hover:text-white font-bold">Top ↑</button>
        </span>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
