    m5_nav: "5. 小組綜整", m5_title: "小組綜整：六個人的落差放在一起",
    m5_overview: "這一節才是小組討論真正的工作。不是輪流念自己的落差，而是把六份放在一起比對——同樣一份教材、六個人拆的是不同的 JD，哪一個構面全組都缺得最兇？那通常就是你們共同的處境，而它會決定第 6 節你們最關心哪一個構面。",
    m5_highlights: ["五項挑三項","最集中的構面","證據","組內通則"],
    m5_deep: "彙整方式有一條硬性規定：本週彙整人不得把六份個人匯出檔全部丟給 AI 叫它總結。可以比對的有五項——K 知識落差、S 技能落差、A 態度落差、帳號狀態、履歷的空欄位——你們只准挑三項。選取而不是全丟，是 W4 就講過的 Context Engineering 的核心；把六份全丟進去，正是教材裡列為風險的過量與污染。先決定比對哪三項，再只取那三項的六人份內容。",
    m5_focus_label: "我們決定比對的三項（勾選三項）",
    m5_focus_why: "為什麼略過另外兩項？",
    m5_focus_why_ph: "例：帳號狀態六個人幾乎都是「已開但未填」，差異太小；A 態度落差大家寫得都很虛，比對不出可以行動的東西。",
    m5_common_label: "六個人落差最集中的是哪一個構面",
    m5_evidence_label: "從六份裡舉兩個具體例子支持上面的判斷",
    m5_evidence_ph: "例：A 的 S 缺口寫「沒有任何正式年資」，C 寫「工具只會 Excel」，兩人的 JD 都要求兩年經驗與一種資料工具，缺的是同一種東西。",
    m5_case_label: "我們選來當代表案例的是誰的落差？為什麼選它？",
    m5_case_ph: "例：選 B 的 S 缺口。因為 B 的 JD 是六則裡層級最低的一則，連它都要求兩年經驗，代表這是整個階梯的入場門檻，不是個人問題。",
    m5_rule_label: "從這次比對，我們訂下一條組內通則",

    m6_nav: "6. TP 題目定案", m6_title: "TP 題目定案：把職涯目標變成一句需求",
    m6_overview: "這是本週最重要的一節，也是各組正式敲定期末專案題目的地方。下面五格填完，你們的題目就定了。前四格是範圍，第五格是驗收基準——它們合起來就是 W9 線上提案的第 1、2 項素材，下週直接拿這一頁上台。",
    m6_note: "⚠ 這五格就是 W9 提案的第 1、2 項素材，下週線上提案直接用。請當成正式文件寫，不要寫「之後再說」。",
    m6_highlights: ["產業清單","PM＋PjM","層級全收","一句話需求"],
    m6_deep: "四個容易踩的坑。第一，產業或企業清單不要一次開到十個，先給一個可以做完的數量，但要同時寫清楚之後要加要減的機制——是誰決定、依什麼判準、什麼時候檢討。第二，職務關鍵字必須同時涵蓋 PM 與 PjM 兩類，因為職稱混用是單向的：絕大多數是名義上叫 PM、實際做 PjM，只搜一邊會漏掉一大片。第三，層級本課要求全收不過濾，你們要寫的不是「要不要全收」，而是「全收對你們的讀者有什麼用」。第四，那一句需求請寫成完整句子，主詞、時間、內容、判準都要在裡面；一句寫不出來，通常代表讀者還沒選定。",
    m6_industry_label: "目標產業或企業清單（1 至 N 個），以及之後可增可減的機制",
    m6_industry_ph: "例：先做半導體封測與消費性電子兩個產業，各鎖三家（日月光、力成、京元電／華碩、宏碁、廣達）。增減機制：每週三小組會議由本週彙整人提案，需兩人以上同意；判準是該產業近四週是否有新增職缺，連續兩週掛零就換掉。",
    m6_keywords_label: "職務關鍵字（必須同時涵蓋 PM 與 PjM 兩類）",
    m6_keywords_hint: "職稱混用是單向的：絕大多數是名義上叫 PM、實際做 PjM，反之很少。只搜一類會漏掉一大片。",
    m6_keywords_ph: "例：PM 類——產品經理、產品管理師、產品企劃、Product Manager、PdM；PjM 類——專案經理、專案管理師、專案管理工程師、Project Manager、PMO。兩類都收，收進來之後再依工作內容原句判定實際偏哪一邊。",

      { front: "Gap analysis", back: "Putting the requirement and the current state on one table and reading off the difference. Its value is not in learning that you fall short, but in cutting that shortfall into items you can work through." },
      { front: "Evidence", back: "Something a third party can verify: a link to your work, a project record, a transcript, a certificate, a duty you were assigned. Self-assessment and adjectives are not evidence." },
      { front: "Career ladder", back: "PM Specialist → PM Engineer → Junior PM → Senior PM → PM Director → VP / SVP of PM → CPO. This course collects every level without filtering, so the reader sees the whole path." },
      { front: "One-sentence requirement", back: "\"What I want to know every morning\", written as one complete sentence. It fixes the reader, the industry, the job family, the facet and the frequency at once, and it is the acceptance criterion for the whole Term Project." }
    ],
    m2_q: [
      { q: "What does the column \"What makes you say you have it?\" ask you to write?", opts: ["Evidence someone else can verify","An honest overall self-assessment","The grade your teacher gave you","A recommendation drafted by an AI"], ans: _A0, exp: "\"Having it\" has to rest on work, project records, transcripts or certificates — things a third party can check. Adjectives and self-assessment do not count." },
      { q: "Why must the job keywords cover both PM and PjM?", opts: ["Title misuse runs one way: many roles named PM actually do PjM work","Their pay structures and promotion tracks are identical, so they merge","The job-category field on 104 accepts only one keyword at a time, never two","Product managers and project managers sit in the same unit of the syllabus"], ans: _A0, exp: "Almost all of the mixing runs in one direction — called PM, doing PjM — and rarely the other way. Searching only one side drops a large share of genuinely relevant postings." },
      { q: "Why does this course require collecting every seniority level without filtering?", opts: ["So readers see the whole career ladder and what the next rung demands","Because filtering by level is technically impossible, so everything is kept","Because 104 search results cannot be sorted by seniority level at all","To inflate the record count so the dataset looks more substantial"], ans: _A0, exp: "Only the full set shows the ladder from Specialist to CPO. Readers need to judge not just what they can apply for now, but what the next rung asks for." },
      { q: "Under the W7 mapping, which facet does \"work experience (years)\" on a posting belong to?", opts: ["K, because years of service accumulate domain knowledge","S, because years of service evidence being able to do the job","A, because years of service reflect commitment and stability","None of them; years of service form a separate fourth facet"], ans: _A1, exp: "Years of service go to S. They are not knowledge in themselves but evidence of being able to complete the task — which is exactly the line between S and K." }
    ],
    m2_wrapup: "Checkpoint: all three facets have a gap written, and the \"what makes you say you have it\" column holds evidence rather than a self-assessment.",

    m3_nav: "3. Accounts & Résumé", m3_title: "Accounts and Résumé Fields",
    m3_overview: "A job search does not begin when you press Apply; it begins when someone can find you. This section does two small things that stop a surprising number of people: state where your 104 and LinkedIn accounts actually stand, and, against the 104 résumé fields, name which of yours are still empty. An empty field is not shameful. Not knowing you have one is.",
    m3_highlights: ["104 account","LinkedIn","Empty fields","Filled within three months"],
    m3_deep: "The main 104 résumé fields are: basic details and photo, desired title, desired job category, desired industry, desired location, desired pay, work experience, education, professional skills, languages, certificates, a portfolio or personal site link, and the personal statement. In the third and fourth year the two fields most often empty are the portfolio link and professional skills — not because there is nothing to write, but because what you did was never put anywhere anyone can click. Write the \"how\" down to something you could put in a calendar: \"build a portfolio\" does not count; \"this month, turn the SMMC final report into a one-page GitHub Pages site and paste the link into the personal-site field on 104\" does.",
    m3_acct_104_label: "104 account status",
    m3_acct_li_label: "LinkedIn account status",
    m3_acct_why_label: "Why you are not opening it",
    m3_acct_why_ph: "e.g. I would rather finish the portfolio first; an empty account seen by a recruiter costs more than no account. (State your reasoning, not an excuse.)",
    acct_opts: [
      { v:"done", n:"Opened and fully filled in" },
      { v:"empty", n:"Opened but not filled in" },
      { v:"today", n:"Opening it today" },
      { v:"no", n:"Not planning to (state why)" }
    ],
    m3_gap_label: "Which fields of your résumé are empty right now? (against the 104 résumé fields)",
    m3_gap_ph: "e.g. Portfolio or personal site link (entirely empty), professional skills (only says Office), languages (no test score), personal statement (still the version I wrote in first year).",
    m3_plan_label: "Which field will you fill within three months? How, concretely?",
    m3_plan_ph: "e.g. The portfolio link. September: turn the SMMC final report into a one-page GitHub Pages site. October: add the W7 job-posting breakdown as a second page. November: paste the link into the personal-site field on both 104 and LinkedIn.",
    m3_evidence_label: "Once it is filled, where would someone else see that you really did it?",
    m3_evidence_hint: "Same ruler as section 2: it counts only if it can be opened and checked. A screenshot on your own laptop does not count.",
    m3_evidence_ph: "e.g. The personal-site field on my 104 résumé will show a clickable address; behind it are three pages of work, each with a date and my name at the bottom.",
    m3_wrapup: "Checkpoint: both accounts are dealt with, and at least one currently empty résumé field is named together with a concrete way to fill it.",

    m4_overview: "This course is taught in English. Pick five new words or phrases from this week's required materials, plus three words you stumble over. This section replaces the former mindmap requirement; its output feeds class discussion and bonus work directly.",

    m4_deep: "Do not copy the source definition into the \"in your own words\" column — copying proves only that you found it; rewriting proves you understood it. This week, take terms you will actually need for the sentence in section 6 — career ladder, seniority level, job family, requirement and the like — so one effort does two jobs.",

    m5_nav: "5. Group Synthesis", m5_title: "Group Synthesis: Six Gap Analyses Side by Side",
    m5_overview: "This section is the real work of the group discussion. Not taking turns reading out your own gaps, but putting all six side by side. Same material, six different postings — which facet came out thinnest across the whole group? That is usually your shared situation, and it will decide which facet you care about most in section 6.",
    m5_highlights: ["Three of five","The densest facet","Evidence","A group rule"],
    m5_deep: "One rule is mandatory: this week's compiler must NOT dump all six individual exports into an AI and ask for a summary. There are five aspects you could compare — the K, S and A gaps, account status, and empty résumé fields — and you may pick only three. Selecting rather than dumping is the core of the Context Engineering idea from W4; feeding all six in is precisely the excess and contamination the material lists as risks. Decide the three first, then take only those three from each member.",
    m5_focus_label: "The three aspects we chose to compare (tick three)",
    m5_focus_why: "Why did we skip the other two?",
    m5_focus_why_ph: "e.g. Account status was \"opened but not filled in\" for almost everyone, so there was nothing to learn; the A gaps were all written vaguely and produced nothing actionable.",
    m5_common_label: "The facet where the six gaps cluster most",
    m5_evidence_label: "Two concrete examples from the six that support the judgement above",
    m5_evidence_ph: "e.g. A's S gap says \"no formal service years at all\" and C's says \"Excel is the only tool I know\". Both postings asked for two years and one data tool, so the same thing is missing in both.",
    m5_case_label: "Whose gap did we take as the representative case, and why that one?",
    m5_case_ph: "e.g. B's S gap. B's posting is the most junior of the six, and even that one asks for two years — which makes this the entry threshold of the whole ladder rather than one person's problem.",
    m5_rule_label: "From this comparison, our group sets one rule",
    m5_rule_ph: "e.g. By the end of October every member turns at least one thing they have done into a link that opens, and pastes it into the personal-site field on 104; we check each other's links at the month-end meeting.",
    m5_rule_note: "These rules accumulate towards the Term Project. When you build the KB in W10, they become the first entries of business_rules.md.",
    m5_wrapup: "Checkpoint: only three aspects were compared (nothing was dumped wholesale into an AI), and the rule you set is checkable rather than \"everyone should improve themselves\".",

    m6_nav: "6. TP Topic Settled", m6_title: "Settling the TP Topic: A Career Goal as One Requirement",
    m6_overview: "This is the most important section of the week, and the place where each group formally settles its Term Project topic. Fill the five cells below and your topic is fixed. The first four set the scope; the fifth sets the acceptance criterion. Together they are items 1 and 2 of the W9 online proposal — next week you present straight from this page.",
    m6_note: "⚠ These five cells are items 1 and 2 of the W9 proposal and go straight into next week's online presentation. Write them as a real document, not as \"we will decide later\".",
    m6_highlights: ["Industry list","PM and PjM","Every level","One-sentence requirement"],
    m6_deep: "Four traps. First, do not open the industry or company list at ten straight away — start with a number you can finish, but state the mechanism for adding and removing later: who decides, on what criterion, and when it is reviewed. Second, the job keywords must cover both PM and PjM, because title misuse runs one way: most are called PM while doing PjM, and searching one side alone drops a large share. Third, this course requires every seniority level with no filtering, so what you write is not whether to take them all but what taking them all does for your reader. Fourth, write the sentence as a complete sentence with a subject, a time, a content and a criterion; if you cannot get it into one sentence, the reader is usually still undecided.",
    m6_industry_label: "Target industries or companies (1 to N), and the mechanism for adding and removing later",
    m6_industry_ph: "e.g. Start with semiconductor packaging-and-test and consumer electronics, three firms each (ASE, PTI, KYEC / ASUS, Acer, Quanta). Mechanism: the weekly compiler proposes changes at the Wednesday meeting and needs two supporters; the criterion is whether the industry produced new postings in the last four weeks, and two consecutive empty weeks means it is swapped out.",
    m6_keywords_label: "Job keywords (must cover both the PM and the PjM families)",
    m6_keywords_hint: "Title misuse runs one way: most postings are called PM while the work is PjM, and rarely the reverse. Searching one family alone drops a large share.",
    m6_keywords_ph: "e.g. PM family — product manager, product management specialist, product planner, Product Manager, PdM. PjM family — project manager, project management specialist, project management engineer, Project Manager, PMO. Collect both, then decide which side a posting really sits on from sentences in the job description itself.",
    m6_levels_label: "Which seniority levels will you collect? The course requires all of them — write why taking them all is useful to your reader",
    m6_levels_hint: "Seven levels: PM Specialist → PM Engineer → Junior PM → Senior PM → PM Director → VP / SVP of PM → CPO.",
    m6_levels_ph: "e.g. All seven. Our reader is a final-year student sending out applications; today he can only reach the first two, but he needs to see what the third and fourth ask for to know which cell to work on now. Showing only the rung he can reach is removing the ladder and leaving one step.",
    m6_focus_label: "The facet we care about most",
    m6_focus_hint: "This cell decides what your morning brief pulls out each day. Pick one; do not pick all three.",
    m6_sentence_label: "\"What I want to know every morning\" — written as one complete sentence",
    m6_sentence_hint: "A complete sentence has a subject, a time, a content and a criterion. Build a first version with the sentence generator in section 8, then rewrite it in your own words.",
    m6_sentence_ph: "e.g. Every morning I want to know which new skill requirements appeared yesterday in the PM and PjM postings of these six packaging and consumer-electronics firms that my own résumé does not yet carry, and to be told in one line what changed since the day before.",
    m6_wrapup: "Checkpoint: the sentence \"what I want to know every morning\" is a complete sentence, and the job keywords cover both the PM and the PjM families.",

const SEMESTER_DEFAULT = '1151';
const WEEK_CODE = 'W08';
const TOPIC_CAMEL = 'CareerStrategy';

const parseSdlKb = (text) => {
  try {
    const t = String(text || '').replace(/\r\n/g, '\n').trim();
    if (!t) return { ok: false, error: 'empty' };
    const fm = t.match(/^---\n([\s\S]*?)\n---/);
    const meta = {};
    if (fm) {
      fm[1].split('\n').forEach(line => {
        if (/^\s/.test(line)) return;               // skip nested (sources / interaction)
        const m = line.match(/^([A-Za-z_]+):\s*(.*)$/);
        if (m) meta[m[1]] = m[2].replace(/^["']|["']$/g, '').trim();
      });
    }
    const sections = {};
    const parts = t.split(/^##\s*§/m);
    parts.shift();
    parts.forEach(part => {
      const n = part.match(/^(\d)/);
      if (!n) return;
      sections['s' + n[1]] = part.replace(/^\d[^\n]*\n?/, '').trim();
    });
    const hasAny = Object.keys(meta).length > 0 || Object.keys(sections).length > 0;
    if (!hasAny) return { ok: false, error: 'format' };
    return { ok: true, meta, sections, raw: t };
  } catch (e) { return { ok: false, error: 'format' }; }
};

const SdlImport = ({ t, sdl, onImport, onClear }) => {
  const [text, setText] = useState('');
  const [msg, setMsg] = useState(null);
  const fileRef = useRef(null);
  const doParse = (raw) => {
    const r = parseSdlKb(raw);
    if (!r.ok) { setMsg({ ok: false, text: r.error === 'empty' ? t.sdl_err_empty : t.sdl_err_format }); return; }
    onImport(r);
    setMsg({ ok: true, text: t.sdl_ok });
    setText('');
  };
  const onFile = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => doParse(rd.result);
    rd.readAsText(f);
    e.target.value = '';
  };
  return (
    <div className="rounded-xl border-2 border-sky-200 dark:border-sky-800/60 bg-sky-50/50 dark:bg-sky-900/10 p-5">
      <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5]">{t.sdl_title}</h3>
      <p className="text-sm text-slate-500 dark:text-slate-400 mt-1 mb-3 leading-relaxed">{t.sdl_desc}</p>

            {[sdl.meta.course, sdl.meta.semester, sdl.meta.week, sdl.meta.topic].filter(Boolean).join(' · ')}

          </p>
          <button onClick={onClear} className="mt-3 px-3 py-1.5 text-xs border border-red-400 text-red-600 dark:text-red-400 rounded-lg">{t.sdl_clear}</button>
        </div>
      ) : (

            <button onClick={() => fileRef.current && fileRef.current.click()} className="px-4 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg">{t.sdl_file}</button>
            <input ref={fileRef} type="file" accept=".md,.markdown,.txt" onChange={onFile} className="hidden" />

const FlipCardDeck = ({ terms, t, moduleId, onCardRead }) => {
  const [groupIdx, setGroupIdx] = useState(0);
  const [flipped, setFlipped] = useState({});
  const [readSet, setReadSet] = useState(new Set());
  const [shownSet, setShownSet] = useState(new Set());
  const [shuffledOrder] = useState(() => [...Array(terms.length).keys()].sort(() => Math.random() - 0.5));
  const groupSize = 2;
  const totalGroups = Math.ceil(terms.length / groupSize);
  const currentCardIndices = shuffledOrder.slice(groupIdx*groupSize, groupIdx*groupSize + groupSize);
  useEffect(() => {
    const ns = new Set(shownSet); currentCardIndices.forEach(i => ns.add(i));
    if (ns.size !== shownSet.size) setShownSet(ns);
  }, [groupIdx]);
  const handleFlip = (i) => {
    setFlipped(f => ({...f, [i]: !f[i]}));
    if (!readSet.has(i)) { const nr = new Set(readSet); nr.add(i); setReadSet(nr); onCardRead && onCardRead(moduleId, nr.size, shownSet.size, terms.length); }
  };
  const statusText = t.flip_status.replace('{read}', readSet.size).replace('{shown}', shownSet.size).replace('{total}', terms.length);
  return (
    <div className="mt-8">
      <h3 className="text-lg font-bold uppercase tracking-wider text-slate-500 mb-2">{t.key_terms}</h3>
      <p className="text-sm text-slate-400 mb-4">{statusText}</p>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        {currentCardIndices.map(i => (
          <div key={i} className="perspective cursor-pointer h-44" onClick={() => handleFlip(i)}>
            <div className={`transform-style-3d relative w-full h-full transition-transform duration-500 ${flipped[i] ? 'rotate-y-180' : ''}`}>
              <div className="backface-hidden absolute inset-0 bg-white dark:bg-slate-800 rounded-xl p-4 flex flex-col items-center justify-center border border-slate-200 dark:border-slate-700 shadow-sm">
                <p className="font-serif font-bold text-center text-[#004030] dark:text-[#D8C3A5]">{terms[i].front}</p>
                <p className="text-xs text-slate-400 mt-2">{t.flip_prompt}</p>
              </div>
              <div className="backface-hidden rotate-y-180 absolute inset-0 bg-[#004030] dark:bg-slate-700 rounded-xl p-4 flex items-center justify-center overflow-y-auto">
                <p className="text-sm text-center text-[#D8C3A5] dark:text-slate-200 leading-relaxed">{terms[i].back}</p>
              </div>
            </div>
          </div>
        ))}
      </div>
      <div className="flex items-center gap-3 mt-4">
        <button onClick={() => { setGroupIdx(0); setFlipped({}); }} className="px-4 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">{t.flip_retry}</button>
        <button onClick={() => groupIdx < totalGroups-1 && setGroupIdx(groupIdx+1)} disabled={groupIdx >= totalGroups-1}
          className="px-4 py-2 text-sm bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.flip_next}</button>
      </div>
    </div>
  );
};

/* ================= ModuleQuiz ================= */
const ModuleQuiz = ({ questions, t, moduleId, onQuizSubmit }) => {
  const [selected, setSelected] = useState({});
  const [submitted, setSubmitted] = useState({});
  const [groupIdx, setGroupIdx] = useState(0);
  const groupSize = 2;
  const [quizIndices] = useState(() => [...Array(questions.length).keys()].sort(() => Math.random() - 0.5));
  const totalGroups = Math.ceil(quizIndices.length / groupSize);
  const [shuffledMaps] = useState(() => quizIndices.map(qi => [...Array(questions[qi].opts.length).keys()].sort(() => Math.random() - 0.5)));
  const computeCorrect = () => { let c = 0; quizIndices.forEach((qIdx, qi) => { if (selected[qi] !== undefined && shuffledMaps[qi][selected[qi]] === _d(questions[qIdx].ans)) c++; }); return c; };
  const statusText = t.quiz_status.replace('{correct}', computeCorrect()).replace('{answered}', Object.keys(selected).length).replace('{total}', quizIndices.length);
  const currentStart = groupIdx * groupSize;
  const currentIndices = quizIndices.slice(currentStart, currentStart + groupSize);
  const handleGroupSubmit = () => {
    if (!currentIndices.every((_, i) => selected[currentStart+i] !== undefined)) return;
    setSubmitted(s => ({...s, [groupIdx]: true}));
    if (groupIdx === totalGroups - 1 || Object.keys(submitted).length + 1 === totalGroups) {
      const wrong = []; let correct = 0;
      quizIndices.forEach((qIdx, qi) => {
        if (selected[qi] === undefined) return;
        if (shuffledMaps[qi][selected[qi]] === _d(questions[qIdx].ans)) correct++; else wrong.push(questions[qIdx].q);
      });
      onQuizSubmit(moduleId, correct, quizIndices.length, wrong);
    }
  };
  return (
    <div className="mt-8 bg-slate-50 dark:bg-slate-900/50 rounded-2xl p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="text-lg font-bold font-serif text-[#004030] dark:text-[#D8C3A5] mb-2">{t.quiz_title}</h3>
      <p className="text-sm text-slate-400 mb-6">{statusText}</p>
      {currentIndices.map((qIdx, localI) => {
        const qi = currentStart + localI, q = questions[qIdx], sMap = shuffledMaps[qi], isSub = !!submitted[groupIdx];
        return (
          <div key={qIdx} className="mb-6">
            <p className="font-bold mb-3">{qi+1}. {q.q}</p>
            <div className="space-y-2">
              {sMap.map((origIdx, dIdx) => {
                const isCorrect = origIdx === _d(q.ans), isSel = selected[qi] === dIdx;
                return (
                  <button key={dIdx} onClick={() => !isSub && setSelected(s => ({...s, [qi]: dIdx}))}
                    className={`w-full text-left px-4 py-3 rounded-lg border transition-all text-sm ${isSub
                      ? isCorrect ? 'bg-green-100 border-green-500 dark:bg-green-900/30'
                        : isSel ? 'bg-red-100 border-red-400 dark:bg-red-900/30' : 'border-slate-200 dark:border-slate-700'
                      : isSel ? 'border-[#004030] dark:border-[#D8C3A5] bg-[#004030]/5' : 'border-slate-200 dark:border-slate-700 hover:border-slate-400'}`}>
                    {q.opts[origIdx]}
                  </button>
                );
              })}
            </div>
            {isSub && (
              <p className={`mt-2 text-sm italic ${shuffledMaps[qi][selected[qi]] === _d(q.ans) ? 'text-green-600 dark:text-green-400' : 'text-red-500 dark:text-red-400'}`}>
                {shuffledMaps[qi][selected[qi]] === _d(q.ans) ? `✓ ${t.correct}` : `✗ ${t.incorrect}`} — {t.explanation}：{q.exp}
              </p>
            )}
          </div>
        );
      })}
      <div className="flex items-center gap-3 flex-wrap">
        {!submitted[groupIdx]
          ? <button onClick={handleGroupSubmit} disabled={!currentIndices.every((_,i) => selected[currentStart+i] !== undefined)}
              className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.submit}</button>
          : <>
              {groupIdx < totalGroups-1 && <button onClick={() => setGroupIdx(groupIdx+1)} className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg">{t.quiz_next}</button>}
              <button onClick={() => { setGroupIdx(0); setSelected({}); setSubmitted({}); }} className="px-6 py-2 border border-[#004030] dark:border-[#D8C3A5] text-[#004030] dark:text-[#D8C3A5] font-bold rounded-lg">{t.quiz_retry}</button>
            </>}
      </div>
    </div>
  );
};

/* ================= K/S/A gap radar (section 2) ================= */
const KSA_COLORS = { K:"#5B5BD6", S:"#0E9F6E", A:"#D97706" };
const radarPts = (cx, cy, R, frac) => KSA_IDS.map((d, i) => {
  const ang = (-90 + i * 120) * Math.PI / 180;
  const r = R * frac[d];
  return `${(cx + r * Math.cos(ang)).toFixed(1)},${(cy + r * Math.sin(ang)).toFixed(1)}`;
}).join(' ');

const GapRadar = ({ t, scores }) => {
  const cx = 175, cy = 165, R = 108;
  const frac = {}; KSA_IDS.forEach(d => { frac[d] = 0.16 + 0.42 * (scores[d] || 0); });
  const outer = {}; KSA_IDS.forEach(d => { outer[d] = 1; });
  const worst = KSA_IDS.reduce((a, b) => (scores[a] <= scores[b] ? a : b));
  const allDone = KSA_IDS.every(d => scores[d] >= 2);
  const labelPos = KSA_IDS.map((d, i) => {
    const ang = (-90 + i * 120) * Math.PI / 180;
    return { d, x: cx + (R + 30) * Math.cos(ang), y: cy + (R + 30) * Math.sin(ang) + 4 };
  });
  return (
    <div className="w-full overflow-x-auto" onContextMenu={e => { e.preventDefault(); window.showCopyrightToast && window.showCopyrightToast(); }}>
      <svg viewBox="0 0 350 330" className="w-full max-w-md mx-auto" draggable="false" role="img" aria-label={t.m2_svg_cap}>
        {[0.33, 0.66, 1].map((k, i) => (
          <polygon key={i} points={radarPts(cx, cy, R * k, outer)} fill="none" stroke="#94a3b8" strokeWidth="1" strokeDasharray={i === 2 ? "0" : "4 4"} opacity={i === 2 ? 0.9 : 0.45}/>
        ))}
        {KSA_IDS.map((d, i) => {
          const ang = (-90 + i * 120) * Math.PI / 180;
          return <line key={d} x1={cx} y1={cy} x2={cx + R * Math.cos(ang)} y2={cy + R * Math.sin(ang)} stroke="#94a3b8" strokeWidth="1" opacity="0.5"/>;
        })}
        <polygon points={radarPts(cx, cy, R, frac)} fill="#004030" fillOpacity="0.28" stroke="#004030" strokeWidth="2.5"/>
        {KSA_IDS.map((d, i) => {
          const ang = (-90 + i * 120) * Math.PI / 180;
          return <circle key={d} cx={cx + R * frac[d] * Math.cos(ang)} cy={cy + R * frac[d] * Math.sin(ang)} r="5" fill={KSA_COLORS[d]}/>;
        })}
        {labelPos.map(p => (
          <text key={p.d} x={p.x} y={p.y} fontSize="15" fontWeight="700" textAnchor="middle" fill={KSA_COLORS[p.d]} fontFamily="Inter, sans-serif">{p.d}</text>
        ))}
        <g fontFamily="Inter, sans-serif" fontSize="10.5" fill="#64748b">
          <line x1="24" y1="308" x2="46" y2="308" stroke="#94a3b8" strokeWidth="1.5"/>
          <text x="52" y="312">{t.m2_svg_legend_req}</text>
          <line x1="180" y1="308" x2="202" y2="308" stroke="#004030" strokeWidth="2.5"/>
          <text x="208" y="312">{t.m2_svg_legend_now}</text>
        </g>
      </svg>
      <p className={`text-center text-sm font-bold mt-1 ${allDone ? 'text-green-600 dark:text-green-400' : 'text-amber-600 dark:text-amber-400'}`}>
        {allDone ? t.m2_svg_done : t.m2_svg_worst.replace('{d}', worst)}
      </p>
      <p className="text-center text-xs text-slate-500 dark:text-slate-400 mt-2 italic">{t.m2_svg_cap}</p>
    </div>
  );
};

  KSA_IDS.forEach(d => { const g = get(d,'goal') - get(d,'now'); if (g > worstN) { worstN = g; worst = d; } });
  const nameOf = d => (t.ksa.find(x => x.id === d) || {}).name || d;
  return (
    <div className="bg-white dark:bg-slate-800 rounded-xl p-6 border border-slate-200 dark:border-slate-700">

      <p className="text-xs text-slate-500 dark:text-slate-400 mb-4 leading-relaxed">{t.lab1_hint}</p>
      <div className="overflow-x-auto">
        <svg viewBox="0 0 330 310" className="w-full max-w-sm mx-auto" role="img" aria-label={t.lab1_title}>
          {[0.25, 0.5, 0.75, 1].map((k, i) => (
            <polygon key={i} points={radarPts(cx, cy, R * k, {K:1,S:1,A:1})} fill="none" stroke="#94a3b8" strokeWidth="1" opacity={i === 3 ? 0.8 : 0.35}/>
          ))}
          {KSA_IDS.map((d, i) => {
            const ang = (-90 + i * 120) * Math.PI / 180;
            return <line key={d} x1={cx} y1={cy} x2={cx + R * Math.cos(ang)} y2={cy + R * Math.sin(ang)} stroke="#94a3b8" strokeWidth="1" opacity="0.45"/>;

          <polygon points={radarPts(cx, cy, R, goal)} fill="#D8C3A5" fillOpacity="0.30" stroke="#B08D57" strokeWidth="2" strokeDasharray="6 4"/>
          <polygon points={radarPts(cx, cy, R, now)} fill="#004030" fillOpacity="0.32" stroke="#004030" strokeWidth="2.5"/>
          {KSA_IDS.map((d, i) => {
            const ang = (-90 + i * 120) * Math.PI / 180;
            return <text key={d} x={cx + (R + 24) * Math.cos(ang)} y={cy + (R + 24) * Math.sin(ang) + 5} fontSize="15" fontWeight="700" textAnchor="middle" fill={KSA_COLORS[d]} fontFamily="Inter, sans-serif">{d}</text>;
          })}
          <g fontFamily="Inter, sans-serif" fontSize="10.5" fill="#64748b">
            <line x1="20" y1="292" x2="42" y2="292" stroke="#004030" strokeWidth="2.5"/>
            <text x="48" y="296">{t.lab1_legend_now}</text>
            <line x1="160" y1="292" x2="182" y2="292" stroke="#B08D57" strokeWidth="2" strokeDasharray="6 4"/>
            <text x="188" y="296">{t.lab1_legend_goal}</text>
          </g>
        </svg>
      </div>
      <div className="space-y-4 mt-4">
        {t.ksa.map(f => (
          <div key={f.id} className="border-t border-slate-100 dark:border-slate-700 pt-3">
            <p className="text-sm font-bold text-[#004030] dark:text-[#D8C3A5] mb-2">{f.name}</p>
            {['now','goal'].map(k => (
              <div key={k} className="flex items-center gap-3 mb-1.5">
                <span className="text-xs w-12 shrink-0 text-slate-500">{k === 'now' ? t.lab1_now : t.lab1_goal}</span>
                <input type="range" min="0" max="10" step="1" value={get(f.id, k)} onChange={e => set(f.id, k, parseInt(e.target.value, 10))}
                  className="flex-1 accent-[#004030] dark:accent-[#D8C3A5]" />

        {worst
          ? <p className="font-bold text-amber-700 dark:text-amber-300">{t.lab1_gap.replace('{d}', nameOf(worst)).replace('{n}', worstN)}</p>
          : <p className="font-bold text-green-600 dark:text-green-400">{t.lab1_none}</p>}
      </div>
    </div>
  );
};

const LabResumeMeter = ({ t, state, setState, onTouch }) => {
  const v = state || {};
  const toggle = (k) => { setState({ ...v, [k]: !v[k] }); onTouch && onTouch(); };
  const items = t.lab2_items;
  const doneN = items.filter(it => v[it.k]).length;
  const totalW = items.reduce((s, it) => s + it.w, 0);
  const gotW = items.filter(it => v[it.k]).reduce((s, it) => s + it.w, 0);
  const pct = Math.round(gotW / totalW * 100);
  const top = items.filter(it => !v[it.k]).sort((a, b) => b.w - a.w).slice(0, 3);
  return (
    <div className="bg-white dark:bg-slate-800 rounded-xl p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-1">{t.lab2_title}</h3>
      <p className="text-sm text-slate-500 dark:text-slate-400 mb-4">{t.lab2_desc}</p>
      <div className="space-y-1.5">
        {items.map(it => (
          <label key={it.k} className="flex items-center justify-between gap-3 p-2.5 rounded-lg border border-slate-200 dark:border-slate-700 cursor-pointer hover:border-[#004030] dark:hover:border-[#D8C3A5] transition">
            <span className="flex items-center gap-3 min-w-0">
              <input type="checkbox" className="w-4 h-4 accent-[#004030] dark:accent-[#D8C3A5] shrink-0" checked={!!v[it.k]} onChange={() => toggle(it.k)} />
              <span className="text-sm">{it.n}</span>
            </span>
            <span className="text-xs text-slate-400 shrink-0">{it.w}</span>
          </label>
        ))}
      </div>
      <div className="mt-4">
        <div className="h-3 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
          <div className={`h-full transition-all ${pct === 100 ? 'bg-green-500' : 'bg-[#004030] dark:bg-[#D8C3A5]'}`} style={{width: pct + '%'}}></div>
        </div>
        <p className="font-bold mt-3">{t.lab2_result.replace('{n}', doneN).replace('{t}', items.length).replace('{p}', pct)}</p>
        {top.length > 0
          ? <>
              <p className="text-xs font-bold uppercase tracking-wider text-slate-500 mt-3 mb-1">{t.lab2_top}</p>
              <ul className="text-sm space-y-1">{top.map(it => <li key={it.k} className="text-amber-700 dark:text-amber-300">· {it.n}</li>)}</ul>
            </>
          : <p className="text-sm text-green-600 dark:text-green-400 mt-2">{t.lab2_full}</p>}
      </div>
    </div>
  );
};

const LabSentenceGen = ({ t, state, setState, onTouch, lang }) => {
  const v = state || {};
  const [copied, setCopied] = useState(false);
  const set = (k, val) => { setState({ ...v, [k]: val }); setCopied(false); onTouch && onTouch(); };
  const nameIn = (arr, k) => { const x = arr.find(o => o.k === k); return x ? x.n : ''; };
  const ready = !!(v.reader && v.ind && v.role && v.facet && v.freq);
  const sentence = (() => {
    if (!ready) return '';
    const reader = nameIn(t.lab3_readers, v.reader);
    const ind = nameIn(t.lab3_inds, v.ind);
    const role = nameIn(t.lab3_roles, v.role);
    const facet = nameIn(t.lab3_facets, v.facet);
    const freq = nameIn(t.lab3_freqs, v.freq);
    if (lang === 'zh') {
      return `我希望${freq}知道，在 ${ind} 的 ${role} 職缺裡，昨天新增或改動了哪些 ${facet}，並且用 ${reader} 看得懂的話，一句話說清楚它跟前一天差在哪裡。`;
    }
    return `${freq.charAt(0).toUpperCase() + freq.slice(1)} I want to know which ${facet} appeared or changed yesterday in postings from ${role} in ${ind}, explained in one line that ${reader} can follow, including what is different from the day before.`;
  })();
  const doCopy = () => {
    if (!sentence) return;
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) { navigator.clipboard.writeText(sentence); }
      else {
        const ta = document.createElement('textarea');
        ta.value = sentence; document.body.appendChild(ta); ta.select();
        document.execCommand('copy'); document.body.removeChild(ta);
      }
      setCopied(true); setTimeout(() => setCopied(false), 1800);
    } catch (e) {}
    onTouch && onTouch();
  };
  const Row = ({ label, k, opts }) => (
    <div>
      <label className="block text-xs font-bold text-slate-500 mb-1">{label}</label>
      <select className={inputCls} value={v[k] || ''} onChange={e => set(k, e.target.value)}>
        <option value="">{t.select_ph}</option>
        {opts.map(o => <option key={o.k} value={o.k}>{o.n}</option>)}
      </select>
    </div>
  );
  return (
    <div className="bg-white dark:bg-slate-800 rounded-xl p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-1">{t.lab3_title}</h3>
      <p className="text-sm text-slate-500 dark:text-slate-400 mb-4">{t.lab3_desc}</p>
      <div className="space-y-3">
        <Row label={t.lab3_l_reader} k="reader" opts={t.lab3_readers} />
        <Row label={t.lab3_l_ind} k="ind" opts={t.lab3_inds} />
        <Row label={t.lab3_l_role} k="role" opts={t.lab3_roles} />
        <Row label={t.lab3_l_facet} k="facet" opts={t.lab3_facets} />
        <Row label={t.lab3_l_freq} k="freq" opts={t.lab3_freqs} />
      </div>
      <div className="mt-5">
        <div className="flex items-center justify-between gap-3 mb-2">
          <p className="text-xs font-bold uppercase tracking-wider text-slate-500">{t.lab3_out_label}</p>
          <button onClick={doCopy} disabled={!sentence} className="px-3 py-1.5 text-xs bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40 shrink-0">{copied ? t.lab3_copied : t.lab3_copy}</button>
        </div>
        <p className="text-sm bg-slate-50 dark:bg-slate-900/50 rounded-lg p-3 leading-relaxed text-slate-700 dark:text-slate-300 min-h-[4rem]">{sentence || t.lab3_empty}</p>
        <p className="text-xs text-slate-500 dark:text-slate-400 mt-2 italic">{t.lab3_note}</p>
      </div>
    </div>
  );
};

const LabLadder = ({ t, state, setState, onTouch }) => {
  const v = state || {};
  const years = v.years === undefined ? '' : v.years;
  const yrs = parseFloat(years || '0') || 0;
  const setYears = (val) => { setState({ ...v, years: val }); onTouch && onTouch(); };
  const toggle = (k) => { setState({ ...v, [k]: !v[k] }); onTouch && onTouch(); };
  const checked = t.lab4_exps.filter(e => v[e.k]).length;
  const base = yrs < 1 ? 0 : yrs < 3 ? 1 : yrs < 5 ? 2 : yrs < 8 ? 3 : yrs < 12 ? 4 : yrs < 18 ? 5 : 6;
  const idx = Math.min(6, base + Math.floor(checked / 2));
  const cur = t.lab4_levels[idx];
  const next = idx < 6 ? t.lab4_levels[idx + 1] : null;
  return (
    <div className="bg-white dark:bg-slate-800 rounded-xl p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-1">{t.lab4_title}</h3>
      <p className="text-sm text-slate-500 dark:text-slate-400 mb-4">{t.lab4_desc}</p>
      <div className="mb-4">
        <label className="block text-xs font-bold text-slate-500 mb-1">{t.lab4_years}</label>
        <input className={inputCls} type="number" min="0" max="50" step="0.5" value={years} onChange={e => setYears(e.target.value.replace(/[^0-9.]/g,'').slice(0,4))} />
      </div>
      <p className="text-xs font-bold uppercase tracking-wider text-slate-500 mb-2">{t.lab4_exp_label}</p>
      <div className="space-y-1.5">
        {t.lab4_exps.map(e => (
          <label key={e.k} className="flex items-start gap-2.5 p-2 rounded-lg border border-slate-200 dark:border-slate-700 cursor-pointer hover:border-[#004030] dark:hover:border-[#D8C3A5] transition">
            <input type="checkbox" className="w-4 h-4 mt-0.5 accent-[#004030] dark:accent-[#D8C3A5] shrink-0" checked={!!v[e.k]} onChange={() => toggle(e.k)} />
            <span className="text-xs leading-relaxed">{e.n}</span>
          </label>
        ))}
      </div>
      <div className="mt-5 space-y-1">
        {t.lab4_levels.map((lv, i) => (
          <div key={lv.id} className={`flex items-center gap-3 px-3 py-2 rounded-lg border text-sm transition ${i === idx
            ? 'bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] border-transparent font-bold'
            : i < idx ? 'border-slate-200 dark:border-slate-700 opacity-55' : 'border-slate-200 dark:border-slate-700'}`}
            style={{ marginLeft: (i * 6) + 'px' }}>
            <span className="text-xs font-bold w-6 shrink-0">{i + 1}</span>
            <span className="truncate">{lv.n}</span>
          </div>
        ))}
      </div>
      <div className="mt-4 p-4 rounded-lg bg-slate-50 dark:bg-slate-900/50">
        <p className="font-bold text-[#004030] dark:text-[#D8C3A5]">{t.lab4_result.replace('{n}', cur.n)}</p>
        {next
          ? <>
              <p className="text-xs font-bold uppercase tracking-wider text-slate-500 mt-3 mb-1">{t.lab4_next.replace('{n}', next.n)}</p>
              <p className="text-sm text-slate-600 dark:text-slate-300 leading-relaxed">{next.req}</p>
            </>
          : <p className="text-sm text-amber-700 dark:text-amber-300 mt-2">{t.lab4_top}</p>}
        <p className="text-xs text-slate-500 dark:text-slate-400 mt-3 italic">{t.lab4_note}</p>
      </div>
    </div>
  );
};

/* ================= App ================= */
function App() {
  const LS_ANS = 'PMCS_W08_answers';
  const LS_ANA = 'PMCS_W08_analytics';
  const LS_STU = 'PMCS_W08_student';
  const LS_LAB = 'PMCS_W08_lab';
  const loadLS = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } };

  const [lang, setLang] = useState('en');
  const [isDark, setIsDark] = useState(true);
  const [module, setModule] = useState(0);
  const [menuOpen, setMenuOpen] = useState(false);
  const [ttsState, setTtsState] = useState('idle');
  const [answers, setAnswers] = useState(() => loadLS(LS_ANS, {}));
  const [focus, setFocus] = useState(() => loadLS(LS_ANS + '_focus', {}));
  const [memberCount, setMemberCount] = useState(() => loadLS(LS_ANS + '_mc', DEFAULT_MEMBERS));
  const [sdl, setSdl] = useState(() => loadLS(LS_ANS + '_sdl', null));
  const [lab, setLab] = useState(() => loadLS(LS_LAB, {}));
  const [labNonce, setLabNonce] = useState(0);
  const [studentInfo, setStudentInfo] = useState(() => loadLS(LS_STU, { group:'', dept:'', id:'', nameEn:'', nameZh:'', compiler:'' }));
  const [analytics, setAnalytics] = useState(() => loadLS(LS_ANA, {
    time: Array(TOTAL).fill(0), clicks: Array(TOTAL).fill(0),
    quizCorrect: Array(TOTAL).fill(0), quizTotal: Array(TOTAL).fill(0),
    cardsRead: Array(TOTAL).fill(0), cardsTotal: Array(TOTAL).fill(0), wrongTopics: {}
  }));
  const menuRef = useRef(null);
  const t = dict[lang];

  useEffect(() => { document.documentElement.classList.toggle('dark', isDark); }, [isDark]);
  useEffect(() => { try { localStorage.setItem(LS_ANS, JSON.stringify(answers)); } catch {} }, [answers]);
  useEffect(() => { try { localStorage.setItem(LS_ANS + '_focus', JSON.stringify(focus)); } catch {} }, [focus]);
  useEffect(() => { try { localStorage.setItem(LS_ANS + '_mc', JSON.stringify(memberCount)); } catch {} }, [memberCount]);
  useEffect(() => { try { sdl ? localStorage.setItem(LS_ANS + '_sdl', JSON.stringify(sdl)) : localStorage.removeItem(LS_ANS + '_sdl'); } catch {} }, [sdl]);
  useEffect(() => { try { localStorage.setItem(LS_LAB, JSON.stringify(lab)); } catch {} }, [lab]);
  useEffect(() => { try { localStorage.setItem(LS_ANA, JSON.stringify(analytics)); } catch {} }, [analytics]);
  useEffect(() => { try { localStorage.setItem(LS_STU, JSON.stringify(studentInfo)); } catch {} }, [studentInfo]);
  useEffect(() => {
    const id = setInterval(() => setAnalytics(a => { const ti = [...a.time]; ti[module] += 5; return {...a, time: ti}; }), 5000);
    return () => clearInterval(id);
  }, [module]);
  useEffect(() => {
    const onDoc = e => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false); };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, []);

  const importSdl = (r) => {
    setSdl({ meta: r.meta, sections: r.sections });
    setStudentInfo(st => ({
      ...st,
      group: r.meta.group || st.group,
      id: (r.meta.student_id || st.id || '').replace(/[^0-9]/g, '').slice(0, 12),
      nameEn: /^[\x00-\x7F]+$/.test(r.meta.student || '') ? (r.meta.student || st.nameEn) : st.nameEn,
      nameZh: /^[\x00-\x7F]+$/.test(r.meta.student || '') ? st.nameZh : (r.meta.student || st.nameZh)
    }));
    if (r.meta.group) setA('g_group', r.meta.group);
    if (r.meta.date) setA('g_date', r.meta.date);
  };
  const sdlFileName = () => {
    if (!sdl) return '';
    const m = sdl.meta;
    const who = m.student || 'NA';
    return `${m.course || 'PMCS'}_${m.semester || SEMESTER_DEFAULT}${m.week || WEEK_CODE}_${(m.topic || TOPIC_CAMEL).replace(/\s+/g,'')}_${m.group || 'NA'}-${who}_${(m.date || '').replace(/-/g,'')}.md`;
  };
  const bump = () => setAnalytics(a => { const c = [...a.clicks]; c[module] += 1; return {...a, clicks: c}; });
  const setA = (id, val) => setAnswers(s => ({...s, [id]: val}));
  const setLabPart = (k) => (val) => setLab(s => ({...s, [k]: val}));
  const handleQuizSubmit = (mid, correct, total, wrong) => setAnalytics(a => {
    const qc = [...a.quizCorrect], qt = [...a.quizTotal];
    qc[mid] = correct; qt[mid] = total;
    return {...a, quizCorrect: qc, quizTotal: qt, wrongTopics: {...a.wrongTopics, [mid]: wrong || []}};
  });
  const handleCardRead = (mid, r, s, tot) => setAnalytics(a => {
    const cr = [...a.cardsRead], ct = [...a.cardsTotal]; cr[mid] = r; ct[mid] = tot;
    return {...a, cardsRead: cr, cardsTotal: ct};
  });

  const filled = id => { const v = answers[id]; return v !== undefined && String(v).trim() !== ''; };
  const sectionPct = n => { const c = CORE[n]; return c && c.length ? Math.round(c.filter(filled).length / c.length * 100) : 100; };
  const pctPersonal = Math.round(PERSONAL_SECTIONS.reduce((s,n) => s + sectionPct(n), 0) / PERSONAL_SECTIONS.length);
  const pctGroup = Math.round(GROUP_SECTIONS.reduce((s,n) => s + sectionPct(n), 0) / GROUP_SECTIONS.length);
  const acctLabel = (v) => { const o = t.acct_opts.find(x => x.v === v); return o ? o.n : ''; };
  const acctLabelZh = (v) => { const o = dict.zh.acct_opts.find(x => x.v === v); return o ? o.n : ''; };
  const ksaName = (id) => { const o = t.ksa.find(x => x.id === id); return o ? o.name : ''; };
  const ksaNameZh = (id) => { const o = dict.zh.ksa.find(x => x.id === id); return o ? o.name : ''; };
  const aspectNameZh = (id) => { const o = dict.zh.aspects.find(x => x.id === id); return o ? o.name : id; };

  const modulesList = [
    { id:0, num:'0', icon:'📋', title:t.m0_nav, kind:null },
    { id:1, num:'1', icon:'👥', title:t.m1_nav, kind:'G' },
    { id:2, num:'2', icon:'📐', title:t.m2_nav, kind:'P' },
    { id:3, num:'3', icon:'🗂️', title:t.m3_nav, kind:'P' },
    { id:4, num:'4', icon:'🗣️', title:t.m4_nav, kind:'P' },
    { id:5, num:'5', icon:'🔍', title:t.m5_nav, kind:'G' },
    { id:6, num:'6', icon:'🎯', title:t.m6_nav, kind:'G' },
    { id:7, num:'7', icon:'🎤', title:t.m7_nav, kind:'G' },
    { id:IDX_LAB, num:String(IDX_LAB), icon:'⚡', title:t.mlab_nav, kind:null },
    { id:IDX_RES, num:String(IDX_RES), icon:'🌐', title:t.mres_nav, kind:null },
    { id:IDX_ANA, num:String(IDX_ANA), icon:'📊', title:t.analytics_title, kind:null }
  ];
  const go = m => { setModule(m); setMenuOpen(false); window.scrollTo({top:0,behavior:'smooth'}); };

  /* ---------- TTS ---------- */
  const handleTTS = (action) => {
    if (!('speechSynthesis' in window)) return;
    if (action === 'stop') { speechSynthesis.cancel(); setTtsState('idle'); return; }
    if (action === 'pause') { speechSynthesis.pause(); setTtsState('paused'); return; }
    if (ttsState === 'paused') { speechSynthesis.resume(); setTtsState('playing'); return; }
    speechSynthesis.cancel();
    const sep = lang === 'zh' ? '。 ' : '. ';
    let texts = [];
    if (module === 0) {
      texts = [t.m0_title, t.m0_intro, t.m0_why, t.m0_why_desc, ...t.m0_stats.map(s => `${s.label}: ${s.val}`), ...t.m0_modules.map(m => `${m.title}. ${m.desc}`)];
    } else if (module >= 1 && module <= NUM_LEARN) {
      const k = `m${module}`;
      texts = [t[`${k}_title`], t[`${k}_overview`], ...(t[`${k}_highlights`]||[]), t[`${k}_deep`], t[`${k}_wrapup`]];
      if (module === 2) texts.push(...t.ksa.map(d => `${d.name}. ${d.q} ${d.src}`), ...t.m2_terms.flatMap(x => [x.front, x.back]));
      if (module === 6) texts.push(t.m6_note);
    } else if (module === IDX_LAB) {

            <button onClick={() => go(0)} className="p-2 hover:bg-white/10 rounded-lg" aria-label={t.nav_home}><IconHome size={18}/></button>
            <button onClick={() => window.scrollTo({top:0,behavior:'smooth'})} className="flex items-center gap-2 min-w-0">
              <span className="font-serif font-black text-[#D8C3A5] text-lg tracking-widest">{t.brand}</span>
              <span className="hidden sm:inline font-serif font-bold text-sm md:text-base truncate">{t.title}</span>
            </button>
          </div>
          <div className="flex items-center gap-1 sm:gap-2">
            <button onClick={() => handleTTS(ttsState === 'playing' ? 'pause' : 'play')} className="p-2 hover:bg-white/10 rounded-lg" aria-label={t.audio_read}>{ttsState === 'playing' ? <IconPause size={18}/> : <IconPlay size={18}/>}</button>
            <button onClick={() => handleTTS('stop')} className="p-2 hover:bg-white/10 rounded-lg" aria-label="Stop"><IconSquare size={18}/></button>
            <button onClick={() => setLang(lang === 'en' ? 'zh' : 'en')} className="px-2 py-2 hover:bg-white/10 rounded-lg flex items-center gap-1"><IconGlobe size={18}/><span className="text-xs font-bold">{lang === 'en' ? '中' : 'EN'}</span></button>
            <button onClick={() => setIsDark(!isDark)} className="p-2 hover:bg-white/10 rounded-lg" aria-label="Theme">{isDark ? <IconSun size={18}/> : <IconMoon size={18}/>}</button>
          </div>
        </div>
      </header>

      <div className="flex-1 w-full max-w-7xl mx-auto flex">
        <aside className="hidden md:block w-64 shrink-0 border-r border-slate-200 dark:border-slate-700 py-8 px-3">
          <p className="text-xs font-bold uppercase tracking-wider text-slate-400 px-3 mb-3">{t.nav_modules}</p>
          {modulesList.map(m => (
            <button key={m.id} onClick={() => go(m.id)}
              className={`w-full flex items-center gap-2 px-3 py-2.5 rounded-lg text-sm mb-1 transition ${module === m.id ? 'bg-[#004030]/10 dark:bg-[#D8C3A5]/10 text-[#004030] dark:text-[#D8C3A5] font-bold' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}`}>
              <span className="ui-decoration shrink-0">{m.icon}</span>
              <span className="truncate text-left flex-1">{m.title}</span>
              {m.kind && <span className={`text-[10px] font-bold px-1 rounded shrink-0 ${m.kind === 'P' ? 'text-sky-700 dark:text-sky-300' : 'text-[#004030] dark:text-[#D8C3A5]'}`}>{m.kind}</span>}
            </button>
          ))}
          <div className="mt-6 px-3 space-y-3">
            <div>
              <p className="text-xs text-slate-400 mb-1">{t.analytics_pct_personal}</p>
              <div className="h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden"><div className={`h-full ${pctPersonal === 100 ? 'bg-green-500' : 'bg-sky-600 dark:bg-sky-400'}`} style={{width: pctPersonal + '%'}}></div></div>
              <p className="text-xs font-bold text-sky-700 dark:text-sky-300 mt-1">{pctPersonal}%</p>
            </div>
            <div>
              <p className="text-xs text-slate-400 mb-1">{t.analytics_pct_group}</p>
              <div className="h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden"><div className={`h-full ${pctGroup === 100 ? 'bg-green-500' : 'bg-[#004030] dark:bg-[#D8C3A5]'}`} style={{width: pctGroup + '%'}}></div></div>
              <p className="text-xs font-bold text-[#004030] dark:text-[#D8C3A5] mt-1">{pctGroup}%</p>
            </div>
          </div>
        </aside>

        <main className="flex-1 min-w-0 py-8 px-4 sm:px-6">
          <div key={`${module}-${lang}`} className="space-y-6 text-lg leading-relaxed text-slate-700 dark:text-slate-300 animate-fade-in">
            {module !== 0 && (
              <div>
                <H2 icon={cur.icon} number={cur.num}>{module <= NUM_LEARN ? t[`m${module}_title`] : module === IDX_LAB ? t.mlab_title : module === IDX_RES ? t.mres_title : t.analytics_title}</H2>
                {cur.kind && <Badge kind={cur.kind} t={t} />}
              </div>
            )}
            {body()}
            <div className="mt-12 flex justify-between items-center pt-8 border-t border-slate-300 dark:border-slate-700 no-print">
              <button onClick={() => go(Math.max(0, module-1))} disabled={module === 0}
                className="px-5 py-2.5 border border-slate-300 dark:border-slate-600 rounded-lg text-sm font-bold hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-0">← {t.nav_prev}</button>
              <button onClick={() => go(Math.min(TOTAL-1, module+1))} disabled={module === TOTAL-1}
                className="px-5 py-2.5 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] rounded-lg text-sm font-bold disabled:opacity-0">{t.nav_next} →</button>
            </div>
          </div>
        </main>
      </div>

      <footer className="h-8 bg-[#004030] flex items-center justify-between px-4 shrink-0">
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs truncate">{t.date} · {t.copyright}</span>
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs flex items-center gap-3 shrink-0">
          <span className="hidden sm:inline">{t.architect_label}&nbsp;<a href={t.architect_url} target="_blank" rel="noopener noreferrer" className="text-[#D8C3A5] hover:text-white underline">Prof. Shihmin Lo</a></span>
          <button onClick={() => window.scrollTo({top:0,behavior:'smooth'})} className="text-[#D8C3A5] hover:text-white font-bold">Top ↑</button>
        </span>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
