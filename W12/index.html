    m0_intro: "This is the pre-class worksheet for W12 of PMCS, and the last week of the second pass over the three diagrams. Weeks 10 to 12 are the implementation layer: in the first pass, W3 to W5, you absorbed the map; in this pass you revisit it standing on the real sore points of your own Term Project. The main material this week is IPOB, the systematic three-axis blueprint for Vibe Coding AI agents, read for the second time — and this time only the Output & Loop column and the governance layer. The theme is Output & Loop: heartbeat, self-correction and deployment. How the schedule is set, how the time zone converts, who hears about a failure, when the loop must stop, how a failing output is sent back for a rewrite, and finally the last step: putting it on a public address. Note the role of the classroom: the 50 minutes in class hold only three things — a teacher demonstration, two group presentations, and blocker diagnosis. The building happens outside class in your SDL time; the classroom is a debugging clinic. Most important of all: W12 is the course milestone, and the runnable version must go live. The public address in section 3 is this week's evidence. After this pass, W13 to W15 turn to project management — planning, control, delivery — with D day no later than W15. Sections 2 to 4 are filled by each person and are not submitted; sections 5 to 7 are decided together and submitted with the group file.",

    m2_stop_hint: "Numbers required. Use the stop-condition calculator in section 8 to work out the monthly cost and the days to quota first, then come back.",
    m2_stop_ph: "e.g. Each item may be rewritten at most 3 times; one run may call the model at most 12 times; the daily ceiling is USD 0.5, above which it stops and alerts.",
    m2_qc_label: "QC feedback: what rule sends an output back for a rewrite when the format or the length fails",
    m2_qc_hint: "The rule has to be machine-decidable. \"Not good enough\" is not a rule; \"fewer than 3 items\" or \"any item missing a source link\" is.",
    m2_qc_ph: "e.g. Fewer than 3 items in total, any item over 120 words, or any item without an http source link — any one of the three sends it back, up to 3 times.",
    m2_svg_layer: "LOOP · the heartbeat cycle",
    m2_svg_cap: "The more of the five cells you complete, the more of the heartbeat cycle lights up; the stop condition decides whether hitting the cap degrades or retries forever",
    m2_terms: [
      { front: "cron expression", back: "Five fields in order: minute, hour, day of month, month, day of week. An asterisk means every one and a slash means a step, so */15 is every fifteen minutes and 0 23 * * * is daily at 23:00." },
      { front: "UTC and offset", back: "Scheduling platforms almost all count in UTC. Taipei is fixed at UTC+8, so the UTC hour equals the Taipei hour minus 8; if that goes below zero, add 24 and move the date back a day." },
      { front: "Heartbeat", back: "The liveness signal a system emits on its own schedule. With a heartbeat you know it is alive; without one, a failed run and a run that never happened look exactly the same from outside." },
      { front: "ReAct loop", back: "Think, act, observe, repeated: one thought, one tool call, one look at what came back, then the next decision. Every turn counts against the retry cap and the budget." },
      { front: "Stop condition", back: "The rule that ends the loop: a retry cap, a cost ceiling, a time limit, a run of consecutive failures. Without one, a loop either never finishes or spends the whole quota." },
      { front: "QC feedback", back: "Acceptance criteria written as rules a machine can decide, so a failing output is sent back automatically. It moves \"what counts as passing\" out of somebody's head and into the process." },
      { front: "Degradation mode", back: "When a source dies, the quota runs out or a key expires, the system still ships — but only the part it has, with an explicit note about what is missing. A degradation mode never tested does not exist." },
      { front: "Idempotency", back: "Firing the same scheduled job twice does not double-count or double-send. Whether a catch-up run or a retry produces two briefs comes down to this one property." }
    ],
    m2_q: [
      { q: "Your brief must arrive at 07:00 Taipei time and the scheduler counts in UTC. What goes in the hour field?", opts: ["23, on the previous UTC day","07, on the very same UTC day","15, on the very same UTC day","19, on the previous UTC day"], ans: _A0, exp: "Taipei 07 minus 8 is minus 1, which is below zero, so add 24 to get 23 and move the UTC date back one day: 0 23 * * *." },
      { q: "How often does the cron expression */15 * * * * actually run?", opts: ["Once every fifteen hours","Once on the fifteenth day","Once every fifteen minutes","Once a day at fifteen past"], ans: _A2, exp: "The first field is minutes and the slash is a step, so it fires at 0, 15, 30 and 45 past every hour — 96 times a day." },
      { q: "Which statement about a degradation mode is correct?", opts: ["Documenting the design is enough","It counts only once truly fired","A try block in the code covers it","Telling the team makes it tested"], ans: _A1, exp: "A degradation mode is worth something only if it really runs during a failure. Break the key or exhaust the quota, then check the brief still ships and says what is missing." },
      { q: "Your deployed page opens completely blank. Which cause is the most likely one?", opts: ["An unpinned CDN shipped a breaking release","The local browser lacks a required font file","The title tag holds a string that is too long","The server clock was set to the UTC+0 zone"], ans: _A0, exp: "A single-file SPA loads its libraries from a CDN; with no pinned version an upstream release can take the whole page down. Read the browser console first." }
    ],
    m2_wrapup: "Checkpoint: the time-zone answer shows the arithmetic rather than a bare time, and the stop conditions carry concrete numbers.",

    m3_nav: "3. Deploy & Degrade", m3_title: "Deployment and the Degradation Test: This Week's Milestone",
    m3_overview: "The second half of this week's individual core task, and the W12 milestone. The runnable version must go live, with a public address that opens. Once it is up, one more thing is compulsory: break it on purpose and see whether the degradation mode actually works.",
    m3_highlights: ["Public address","Stack","Blank-screen hunt","Degradation test","Three days"],
    m3_deep: "Two sentences to keep. First: a degradation mode never tested does not exist — break the API key, or burn the day's quota, then check whether the brief still ships and whether it says clearly which fields are missing. That is what tested means. Second: W16 checks three consecutive days of output, D, D+1 and D+2, all three present, so a day you do not accumulate today can never be recovered. The blank screen is this week's most common distress call: read the browser console first, then check in order whether the CDN versions are pinned, whether the cache refreshed, and whether the same identifier is declared in two script blocks.",
    m3_url_label: "The public address of your runnable version (this week's milestone)",
    m3_url_hint: "Paste the full address starting with http or https. Open it once in a private window to confirm other people can reach it, rather than testing only while logged in.",
    m3_url_ph: "e.g. https://your-team.github.io/pmcs-daily-brief/",
    m3_url_bad: "⚠ That does not look like a full address. Check that it starts with https:// and that other people can open it.",
    m3_url_ok: "✓ The address is well formed. Now open it once more in a private window.",
    m3_stack_label: "Stack",
    m3_stack_hint: "Option A leans static and free, option B leans flexible and function-based; if you pick Other, explain it in the next cell.",
    m3_blank_label: "Did you hit a blank screen? How did you track it down?",
    m3_blank_hint: "Hints: are the CDN versions pinned, did the cache refresh, does the browser console show an error. If you never hit one, say so and explain how you confirmed the page renders.",
    m3_blank_ph: "e.g. The first deployment was completely white; the console said Identifier 'App' has already been declared because two script blocks both declared App. Removing the duplicate fixed it, and we pinned react to 18.3.1.",
    m3_degrade_label: "Did you actually test degradation? Break the key or burn the quota — what happened?",
    m3_degrade_hint: "Write how you broke it, whether the brief still shipped, and whether it flagged the gap. If you have not tested it, say so honestly — but a blank cell here is exactly where W16 will take marks off.",
    m3_degrade_ph: "e.g. We changed the last character of the API key and fired the job by hand. The brief still went out, the source block read \"source A failed today, results below come from source B\", it carried 2 items instead of 3, and the title was marked as partial.",
    m3_days_label: "W16 shows three days of output — D, D+1 and D+2. How many days have you accumulated so far?",
    m3_days_hint: "Three consecutive days is the W16 bar and it cannot be back-filled, so the earlier you start accumulating, the safer you are.",
    m3_days_warn: "⚠ Not three days yet. W16 looks for three consecutive days of output and it cannot be back-filled, so get it running daily as soon as you can.",
    m3_days_ok: "✓ Three days or more — you meet the W16 bar.",
    m3_wrapup: "Checkpoint: the public address opens, and degradation was actually tested rather than merely designed.",

    m4_nav: "4. Language Lab", m4_title: "EMI Language Lab",
    m4_overview: "This course is taught in English. Pick five new words or phrases from this week's required materials, plus three words you stumble over. What you produce here feeds class discussion and bonus work directly.",
    m4_highlights: ["Five new terms","Three hard words","In your own words","Example sentences"],
    m4_deep: "Do not copy the source definition into the \"in your own words\" column — copying proves only that you found it; rewriting proves you understood it. Write the example sentences about your own Term Project — your schedule, your stop condition, your degradation mode — so one effort does two jobs.",
    m4_terms_label: "Five new words or phrases",
    m4_col_term: "Term / phrase", m4_col_mean: "In your own words", m4_col_sent: "Your own sentence",
    m4_pron_label: "Three words you stumble over",
    m4_col_word: "Word", m4_col_hard: "What makes it hard", m4_col_tip: "Your memory trick",
    m4_wrapup: "Checkpoint: not one of the five explanations is copied verbatim from the source.",

    m5_nav: "5. Group Synthesis", m5_title: "Group Synthesis: Comparing Six Heartbeat Settings",
    m5_overview: "This section is the real work of the group discussion. Six people each set their own schedule, time zone, alerting, stop conditions, QC rule and degradation test. Put them side by side and the widest gap is usually the item your group agrees on least — and the one most likely to break on D day.",
    m5_highlights: ["Three of six","The widest gap","Select, do not dump","A group rule"],
    m5_deep: "One rule is mandatory here: this week's compiler must NOT dump all six individual exports into an AI and ask for a summary. The core of Context Engineering is selection, not dumping. The comparison set has six items — schedule setting, time-zone conversion, failure alerting, stop conditions, QC rule, degradation test — and you may pick only three, then take only those three from each member. Choosing which three is itself the judgement: the three everyone wrote identically teach you nothing, while the three that diverge most are what force a rule out of you.",
    m5_focus_label: "The three items we chose to compare (tick three)",
    m5_focus_why: "Why did we skip the other three?",
    m5_focus_why_ph: "e.g. Almost all six wrote 0 23 * * * for the schedule, so there was nothing to compare; the real argument was about stop conditions and the degradation test, so we took those two plus alerting.",
    m5_gap_label: "After comparing the six, which item diverged most, and how?",
    m5_gap_ph: "e.g. Stop conditions. Three people wrote no numbers at all, one wrote a cap of 10 retries, one wrote 3, and one wrote only \"stop on failure\". Within one group, the idea of when to give up varied by more than a factor of three.",
    m5_evidence_label: "Two concrete examples from the six that support the judgement above",
    m5_evidence_ph: "e.g. A's stop condition is \"retry until it succeeds\" with no cap at all; D's reads \"USD 0.5 a day, 3 retries\". For the same brief, one ceiling is unbounded and the other is fifty cents.",
    m5_case_label: "Whose setting did we adopt as the group template, and why?",
    m5_case_ph: "e.g. D's stop condition, because it carries both a retry cap and a money cap, and both numbers were actually computed rather than guessed.",
    m5_rule_label: "From this comparison, our group sets one rule",
    m5_rule_ph: "e.g. Every scheduled job in this group states a retry cap and a daily cost ceiling as explicit numbers; anything missing either one is not merged into the main branch.",
    m5_rule_note: "These rules accumulate towards the Term Project. Somebody else should be able to check your repo against this rule, so it must not read as an aspiration.",
    m5_wrapup: "Checkpoint: only three items were compared (nothing was dumped wholesale into an AI), and the rule you set is checkable.",

    m6_nav: "6. Build by the Table", m6_title: "Build by the Table: Heartbeat, Alerts, Stop Conditions and the Milestone",
    m6_overview: "Turn the consensus from section 5 into one shared configuration for the whole group. What you write here is the working specification between now and D day, and it doubles as your registration slip for the debugging clinic.",
    m6_highlights: ["Final schedule","Alert channel","Cost ceiling","Milestone rating","D day"],
    m6_deep: "W12 is milestone week, and tp_status is your milestone self-rating — the aggregator plots it as a class-wide distribution, so answer honestly. Choosing \"not live yet\" costs you nothing; hiding it costs you the one diagnosis this week can give you. The stop-conditions cell must carry numbers: a stop condition without numbers cannot be diagnosed in the clinic. And write only one thing in the last cell — the single most critical action before D day. Three things means no priority at all.",
    m6_schedule_label: "Final schedule time (with the time zone)",
    m6_schedule_hint: "State both the Taipei time and the UTC cron, and make sure the two agree.",
    m6_schedule_ph: "e.g. Delivered at 07:00 Taipei time daily, scheduled at 23:00 UTC the previous day, cron 0 23 * * *.",
    m6_notify_label: "Failure alert channel and recipients",
    m6_notify_hint: "Both the channel and the recipients. \"Someone gets notified\" does not count; name a mailbox or a channel.",
    m6_notify_ph: "e.g. The built-in GitHub Actions failure email goes to all three collaborators on the repo, a webhook pushes to the #alerts channel in our Discord, and the member on duty confirms it before 08:00 each morning.",
    m6_stop_label: "Stop conditions and the cost ceiling (numbers required)",
    m6_stop_hint: "At least two numbers: the retry cap, and a daily or monthly cost ceiling.",
    m6_stop_ph: "e.g. Each item rewritten at most 3 times; at most 12 model calls per run; a ceiling of USD 0.5 a day and USD 10 a month, at which point it stops and alerts.",
    m6_status_label: "Live-version status (this week's milestone self-rating)",
    m6_status_hint: "Answer honestly. The aggregator plots this as a class-wide distribution and uses it to allocate clinic time.",
    m6_status_note: "W12 is milestone week, and this cell is your milestone self-rating.",
    m6_status_ok: "✓ Live and running for three days — milestone met.",
    m6_status_warn: "This week's milestone is the runnable version going live. Use the next cell for the single most critical action before D day.",
    m6_next_label: "The one most critical action before D day",
    m6_next_hint: "Only one. D day falls no later than W15, and W13 to W15 turn to project management: planning, control, delivery.",
    m6_next_ph: "e.g. Get it running by itself for three consecutive days first and worry about the content later — without three days there is nothing to show in W16.",
    m6_wrapup: "Checkpoint: the stop conditions and the cost ceiling both carry numbers, and the failure alert names both a channel and a recipient.",

    m7_nav: "7. Presentation Plan", m7_title: "Presentation Plan and Question",
    m7_overview: "Turn section 1's split into a runnable script, and prepare one question to put to the class. The 10-minute Q&A is carried entirely by the questions each group brings.",
    m7_highlights: ["Opening line","Segment script","Menti question","10 minutes"],
    m7_deep: "This week, put the public address and today's real output on the first slide — in milestone week the most persuasive sentence available to you is \"nobody wrote this; it sent itself at seven this morning.\" Write the opening line as a complete English sentence rather than keywords. Avoid yes-or-no questions for the class; a good one forces a judgement first, for example: when the quota runs out, would you rather it stopped, or shipped a shorter brief that names what is missing?",
    m7_open_label: "English opening line (one complete sentence)",
    m7_open_ph: "e.g. This page was written by nobody this morning — the schedule fired at seven and the brief was already there.",
    m7_script_label: "Segment script (one sentence per speaker on the point they will make)",
    m7_col_who: "Speaker", m7_col_point: "The point of this segment",
    m7_question_label: "One question for the class (for Menti)",
    m7_question_ph: "e.g. When the quota runs out, would you rather let the agent stop, or let it ship a shorter brief that says what is missing?",
    m7_wrapup: "Checkpoint: the opening line is a complete English sentence, and the question cannot be answered with yes or no.",

/* ================= SDL KB import ================= */
const SEMESTER_DEFAULT = '1151';
const WEEK_CODE = 'W12';
const TOPIC_CAMEL = 'OutputAndLoop';

const parseSdlKb = (text) => {
  try {
    const t = String(text || '').replace(/\r\n/g, '\n').trim();
    if (!t) return { ok: false, error: 'empty' };
    const fm = t.match(/^---\n([\s\S]*?)\n---/);
    const meta = {};
    if (fm) {
      fm[1].split('\n').forEach(line => {
        if (/^\s/.test(line)) return;               // skip nested (sources / interaction)
        const m = line.match(/^([A-Za-z_]+):\s*(.*)$/);
        if (m) meta[m[1]] = m[2].replace(/^["']|["']$/g, '').trim();
      });
    }
    const sections = {};
    const parts = t.split(/^##\s*§/m);
    parts.shift();
    parts.forEach(part => {
      const n = part.match(/^(\d)/);
      if (!n) return;
      sections['s' + n[1]] = part.replace(/^\d[^\n]*\n?/, '').trim();
    });
    const hasAny = Object.keys(meta).length > 0 || Object.keys(sections).length > 0;
    if (!hasAny) return { ok: false, error: 'format' };
    return { ok: true, meta, sections, raw: t };
  } catch (e) { return { ok: false, error: 'format' }; }
};

const SdlImport = ({ t, sdl, onImport, onClear }) => {
  const [text, setText] = useState('');
  const [msg, setMsg] = useState(null);
  const fileRef = useRef(null);
  const doParse = (raw) => {
    const r = parseSdlKb(raw);
    if (!r.ok) { setMsg({ ok: false, text: r.error === 'empty' ? t.sdl_err_empty : t.sdl_err_format }); return; }
    onImport(r);
    setMsg({ ok: true, text: t.sdl_ok });
    setText('');
  };
  const onFile = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => doParse(rd.result);
    rd.readAsText(f);
    e.target.value = '';
  };
  return (
    <div className="rounded-xl border-2 border-sky-200 dark:border-sky-800/60 bg-sky-50/50 dark:bg-sky-900/10 p-5">
      <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5]">{t.sdl_title}</h3>

/* ================= FlipCardDeck ================= */
const FlipCardDeck = ({ terms, t, moduleId, onCardRead }) => {
  const [groupIdx, setGroupIdx] = useState(0);
  const [flipped, setFlipped] = useState({});
  const [readSet, setReadSet] = useState(new Set());
  const [shownSet, setShownSet] = useState(new Set());
  const [shuffledOrder] = useState(() => [...Array(terms.length).keys()].sort(() => Math.random() - 0.5));
  const groupSize = 2;
  const totalGroups = Math.ceil(terms.length / groupSize);
  const currentCardIndices = shuffledOrder.slice(groupIdx*groupSize, groupIdx*groupSize + groupSize);
  useEffect(() => {
    const ns = new Set(shownSet); currentCardIndices.forEach(i => ns.add(i));
    if (ns.size !== shownSet.size) setShownSet(ns);
  }, [groupIdx]);
  const handleFlip = (i) => {
    setFlipped(f => ({...f, [i]: !f[i]}));
    if (!readSet.has(i)) { const nr = new Set(readSet); nr.add(i); setReadSet(nr); onCardRead && onCardRead(moduleId, nr.size, shownSet.size, terms.length); }
  };
  const statusText = t.flip_status.replace('{read}', readSet.size).replace('{shown}', shownSet.size).replace('{total}', terms.length);
  return (
    <div className="mt-8">
      <h3 className="text-lg font-bold uppercase tracking-wider text-slate-500 mb-2">{t.key_terms}</h3>
      <p className="text-sm text-slate-400 mb-4">{statusText}</p>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        {currentCardIndices.map(i => (
          <div key={i} className="perspective cursor-pointer h-44" onClick={() => handleFlip(i)}>
            <div className={`transform-style-3d relative w-full h-full transition-transform duration-500 ${flipped[i] ? 'rotate-y-180' : ''}`}>
              <div className="backface-hidden absolute inset-0 bg-white dark:bg-slate-800 rounded-xl p-4 flex flex-col items-center justify-center border border-slate-200 dark:border-slate-700 shadow-sm">
                <p className="font-serif font-bold text-center text-[#004030] dark:text-[#D8C3A5]">{terms[i].front}</p>
                <p className="text-xs text-slate-400 mt-2">{t.flip_prompt}</p>
              </div>
              <div className="backface-hidden rotate-y-180 absolute inset-0 bg-[#004030] dark:bg-slate-700 rounded-xl p-4 flex items-center justify-center overflow-y-auto">
                <p className="text-sm text-center text-[#D8C3A5] dark:text-slate-200 leading-relaxed">{terms[i].back}</p>
              </div>
            </div>
          </div>
        ))}
      </div>
      <div className="flex items-center gap-3 mt-4">
        <button onClick={() => { setGroupIdx(0); setFlipped({}); }} className="px-4 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">{t.flip_retry}</button>
        <button onClick={() => groupIdx < totalGroups-1 && setGroupIdx(groupIdx+1)} disabled={groupIdx >= totalGroups-1}
          className="px-4 py-2 text-sm bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.flip_next}</button>
      </div>
    </div>
  );
};

/* ================= ModuleQuiz ================= */
const ModuleQuiz = ({ questions, t, moduleId, onQuizSubmit }) => {
  const [selected, setSelected] = useState({});
  const [submitted, setSubmitted] = useState({});
  const [groupIdx, setGroupIdx] = useState(0);
  const groupSize = 2;
  const [quizIndices] = useState(() => [...Array(questions.length).keys()].sort(() => Math.random() - 0.5));
  const totalGroups = Math.ceil(quizIndices.length / groupSize);
  const [shuffledMaps] = useState(() => quizIndices.map(qi => [...Array(questions[qi].opts.length).keys()].sort(() => Math.random() - 0.5)));
  const computeCorrect = () => { let c = 0; quizIndices.forEach((qIdx, qi) => { if (selected[qi] !== undefined && shuffledMaps[qi][selected[qi]] === _d(questions[qIdx].ans)) c++; }); return c; };
  const statusText = t.quiz_status.replace('{correct}', computeCorrect()).replace('{answered}', Object.keys(selected).length).replace('{total}', quizIndices.length);
  const currentStart = groupIdx * groupSize;
  const currentIndices = quizIndices.slice(currentStart, currentStart + groupSize);
  const handleGroupSubmit = () => {
    if (!currentIndices.every((_, i) => selected[currentStart+i] !== undefined)) return;
    setSubmitted(s => ({...s, [groupIdx]: true}));
    if (groupIdx === totalGroups - 1 || Object.keys(submitted).length + 1 === totalGroups) {
      const wrong = []; let correct = 0;
      quizIndices.forEach((qIdx, qi) => {
        if (selected[qi] === undefined) return;
        if (shuffledMaps[qi][selected[qi]] === _d(questions[qIdx].ans)) correct++; else wrong.push(questions[qIdx].q);
      });
      onQuizSubmit(moduleId, correct, quizIndices.length, wrong);
    }
  };
  return (
    <div className="mt-8 bg-slate-50 dark:bg-slate-900/50 rounded-2xl p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="text-lg font-bold font-serif text-[#004030] dark:text-[#D8C3A5] mb-2">{t.quiz_title}</h3>
      <p className="text-sm text-slate-400 mb-6">{statusText}</p>
      {currentIndices.map((qIdx, localI) => {
        const qi = currentStart + localI, q = questions[qIdx], sMap = shuffledMaps[qi], isSub = !!submitted[groupIdx];
        return (
          <div key={qIdx} className="mb-6">
            <p className="font-bold mb-3">{qi+1}. {q.q}</p>
            <div className="space-y-2">
              {sMap.map((origIdx, dIdx) => {
                const isCorrect = origIdx === _d(q.ans), isSel = selected[qi] === dIdx;
                return (
                  <button key={dIdx} onClick={() => !isSub && setSelected(s => ({...s, [qi]: dIdx}))}
                    className={`w-full text-left px-4 py-3 rounded-lg border transition-all text-sm ${isSub
                      ? isCorrect ? 'bg-green-100 border-green-500 dark:bg-green-900/30'
                        : isSel ? 'bg-red-100 border-red-400 dark:bg-red-900/30' : 'border-slate-200 dark:border-slate-700'
                      : isSel ? 'border-[#004030] dark:border-[#D8C3A5] bg-[#004030]/5' : 'border-slate-200 dark:border-slate-700 hover:border-slate-400'}`}>
                    {q.opts[origIdx]}
                  </button>
                );
              })}
            </div>
            {isSub && (
              <p className={`mt-2 text-sm italic ${shuffledMaps[qi][selected[qi]] === _d(q.ans) ? 'text-green-600 dark:text-green-400' : 'text-red-500 dark:text-red-400'}`}>
                {shuffledMaps[qi][selected[qi]] === _d(q.ans) ? `✓ ${t.correct}` : `✗ ${t.incorrect}`} — {t.explanation}：{q.exp}
              </p>
            )}
          </div>
        );
      })}
      <div className="flex items-center gap-3 flex-wrap">
        {!submitted[groupIdx]
          ? <button onClick={handleGroupSubmit} disabled={!currentIndices.every((_,i) => selected[currentStart+i] !== undefined)}
              className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.submit}</button>
          : <>
              {groupIdx < totalGroups-1 && <button onClick={() => setGroupIdx(groupIdx+1)} className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg">{t.quiz_next}</button>}
              <button onClick={() => { setGroupIdx(0); setSelected({}); setSubmitted({}); }} className="px-6 py-2 border border-[#004030] dark:border-[#D8C3A5] text-[#004030] dark:text-[#D8C3A5] font-bold rounded-lg">{t.quiz_retry}</button>
            </>}
      </div>
    </div>
  );
};

const LabTimeZone = ({ t, state, setState, onTouch }) => {

  const hh = v.hh === undefined ? 7 : Math.max(0, Math.min(23, Math.round(num(v.hh, 7))));
  const mm = v.mm === undefined ? 0 : Math.max(0, Math.min(59, Math.round(num(v.mm, 0))));
  const set = (k, val) => { setState({ ...v, [k]: val }); onTouch && onTouch(); };
  const raw = hh - 8;
  const prev = raw < 0;
  const uh = (raw + 24) % 24;
  return (
    <div className="bg-white dark:bg-slate-800 rounded-xl p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-1">{t.lab1_title}</h3>
      <p className="text-sm text-slate-500 dark:text-slate-400 mb-4">{t.lab1_desc}</p>
      <div className="grid grid-cols-2 gap-3">
        <div>
          <label className="block text-xs font-bold text-slate-500 mb-1">{t.lab1_hh}</label>
          <input type="number" min="0" max="23" className={inputCls} value={v.hh === undefined ? 7 : v.hh} onChange={e => set('hh', e.target.value)} />
        </div>
        <div>
          <label className="block text-xs font-bold text-slate-500 mb-1">{t.lab1_mm}</label>
          <input type="number" min="0" max="59" className={inputCls} value={v.mm === undefined ? 0 : v.mm} onChange={e => set('mm', e.target.value)} />
        </div>
      </div>
      <div className="mt-4 p-4 rounded-lg bg-slate-50 dark:bg-slate-900/50 space-y-2">
        <p className="text-sm">{t.lab1_utc}: <strong className="font-mono">{pad2(uh)}:{pad2(mm)}</strong></p>
        <p className="text-sm">{t.lab1_cron}: <strong className="font-mono text-[#004030] dark:text-[#D8C3A5]">{mm} {uh} * * *</strong></p>
        <p className={`text-xs font-bold ${prev ? 'text-amber-600 dark:text-amber-400' : 'text-green-600 dark:text-green-400'}`}>{prev ? t.lab1_prev : t.lab1_same}</p>
      </div>
      <div className="flex items-center gap-3 mt-3 flex-wrap">
        <button onClick={() => { setState({ hh: 7, mm: 0 }); onTouch && onTouch(); }}
          className="px-4 py-2 text-sm bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg">{t.lab1_preset}</button>
        <button onClick={() => { setState({}); onTouch && onTouch(); }} className="px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg text-sm">{t.lab1_reset}</button>
      </div>
      <p className="text-xs text-slate-500 dark:text-slate-400 mt-3 leading-relaxed">{t.lab1_formula}</p>
      <p className="text-xs text-amber-600 dark:text-amber-400 mt-2 leading-relaxed">{t.lab1_dateline}</p>
      <p className="text-xs text-slate-500 dark:text-slate-400 mt-2 leading-relaxed">{t.lab1_dst}</p>
    </div>
  );
};

const LabCronReader = ({ t, state, setState, onTouch }) => {
  const v = state || {};
  const items = t.lab2_items;
  const pick = (k, val) => { setState({ ...v, [k]: val }); onTouch && onTouch(); };
  const answered = items.filter(it => v[it.k] !== undefined).length;
  const n = items.filter(it => v[it.k] !== undefined && v[it.k] === it.a).length;
  return (
    <div className="bg-white dark:bg-slate-800 rounded-xl p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-1">{t.lab2_title}</h3>
      <p className="text-sm text-slate-500 dark:text-slate-400 mb-2">{t.lab2_desc}</p>
      <p className="text-xs text-slate-400 mb-4">{t.lab2_hint}</p>
      <div className="space-y-4">
        {items.map((it, i) => {
          const chosen = v[it.k], done = chosen !== undefined;
          return (
            <div key={it.k} className="border-b border-slate-100 dark:border-slate-700 pb-4 last:border-0">
              <p className="text-sm mb-2">{i+1}. <span className="font-mono bg-slate-100 dark:bg-slate-900/60 px-2 py-1 rounded">{it.expr}</span></p>
              <div className="space-y-2">
                {it.opts.map((o, oi) => {
                  const sel = chosen === oi;
                  const cls = !done ? (sel ? 'border-[#004030] dark:border-[#D8C3A5] bg-[#004030]/5' : 'border-slate-200 dark:border-slate-700 hover:border-slate-400')
                    : oi === it.a ? 'bg-green-100 border-green-500 dark:bg-green-900/30'
                    : sel ? 'bg-red-100 border-red-400 dark:bg-red-900/30' : 'border-slate-200 dark:border-slate-700 opacity-60';
                  return <button key={oi} onClick={() => !done && pick(it.k, oi)}
                    className={`w-full text-left px-4 py-2.5 rounded-lg border transition-all text-sm ${cls}`}>{o}</button>;
                })}
              </div>
              {done && <p className={`text-xs italic mt-2 ${chosen === it.a ? 'text-slate-500 dark:text-slate-400' : 'text-red-500 dark:text-red-400'}`}>{it.why}</p>}
            </div>
          );
        })}
      </div>
      <div className="flex items-center gap-3 mt-4 flex-wrap">
        <span className="font-bold text-[#004030] dark:text-[#D8C3A5]">{t.lab2_score.replace('{n}', n).replace('{t}', items.length)}</span>
        {answered > 0 && <button onClick={() => { setState({}); onTouch && onTouch(); }} className="px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg text-sm">{t.lab2_reset}</button>}
      </div>
    </div>
  );
};

const LabStopCalc = ({ t, state, setState, onTouch }) => {
  const v = state || {};
  const cost = Math.max(0, num(v.cost, 0.01));
  const runs = Math.max(1, Math.round(num(v.runs, 1)));
  const retry = Math.max(0, Math.round(num(v.retry, 3)));
  const quota = Math.max(0, num(v.quota, 5));
  const set = (k, val) => { setState({ ...v, [k]: val }); onTouch && onTouch(); };
  const calls = runs * (1 + retry);
  const daily = calls * cost;
  const monthly = daily * 30;
  const days = daily > 0 ? quota / daily : Infinity;
  const perRunDay = runs * cost;
  const safeRetry = perRunDay > 0 ? Math.max(0, Math.floor(quota / (30 * perRunDay)) - 1) : 0;
  const over = monthly > quota;
  const fmt = (x) => (Math.round(x * 10000) / 10000).toString();
  return (
    <div className="bg-white dark:bg-slate-800 rounded-xl p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-1">{t.lab3_title}</h3>
      <p className="text-sm text-slate-500 dark:text-slate-400 mb-4">{t.lab3_desc}</p>
      <div className="grid grid-cols-2 gap-3">
        <div><label className="block text-xs font-bold text-slate-500 mb-1">{t.lab3_cost}</label>
          <input type="number" min="0" step="0.001" className={inputCls} value={v.cost === undefined ? 0.01 : v.cost} onChange={e => set('cost', e.target.value)} /></div>
        <div><label className="block text-xs font-bold text-slate-500 mb-1">{t.lab3_runs}</label>
          <input type="number" min="1" className={inputCls} value={v.runs === undefined ? 1 : v.runs} onChange={e => set('runs', e.target.value)} /></div>
        <div><label className="block text-xs font-bold text-slate-500 mb-1">{t.lab3_retry}</label>
          <input type="number" min="0" className={inputCls} value={v.retry === undefined ? 3 : v.retry} onChange={e => set('retry', e.target.value)} /></div>
        <div><label className="block text-xs font-bold text-slate-500 mb-1">{t.lab3_quota}</label>
          <input type="number" min="0" step="0.1" className={inputCls} value={v.quota === undefined ? 5 : v.quota} onChange={e => set('quota', e.target.value)} /></div>
      </div>
      <div className="mt-4 p-4 rounded-lg bg-slate-50 dark:bg-slate-900/50 space-y-1.5 text-sm">
        <p>{t.lab3_calls}: <strong>{calls}</strong> {t.lab3_times}</p>
        <p>{t.lab3_daily}: <strong>{fmt(daily)}</strong></p>
        <p>{t.lab3_monthly}: <strong className={over ? 'text-red-500' : 'text-[#004030] dark:text-[#D8C3A5]'}>{fmt(monthly)}</strong></p>
        <p>{t.lab3_days}: <strong>{isFinite(days) ? fmt(Math.floor(days)) + ' ' + t.lab3_daysunit : t.lab3_never}</strong></p>
        <p>{t.lab3_safe}: <strong className="text-[#004030] dark:text-[#D8C3A5]">{safeRetry}</strong></p>
        <p className={`pt-1 ${over ? 'text-red-500 dark:text-red-400' : 'text-green-600 dark:text-green-400'}`}>{over ? t.lab3_over : t.lab3_ok}</p>
      </div>
      <div className="mt-3 h-3 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
        <div className={`h-full transition-all ${over ? 'bg-red-500' : 'bg-[#004030] dark:bg-[#D8C3A5]'}`} style={{width: Math.min(100, quota > 0 ? monthly/quota*100 : 100) + '%'}}></div>
      </div>
      <div className="flex items-center gap-3 mt-3 flex-wrap">
        <button onClick={() => { setState({ cost: 0.02, runs: 3, retry: 3, quota: 5 }); onTouch && onTouch(); }}
          className="px-4 py-2 text-sm bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg">{t.lab3_preset}</button>
        <button onClick={() => { setState({}); onTouch && onTouch(); }} className="px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg text-sm">{t.lab3_reset}</button>
      </div>
      <p className="text-xs text-slate-500 dark:text-slate-400 mt-3 leading-relaxed">{t.lab3_note}</p>
    </div>
  );
};

const LabGoLive = ({ t, state, setState, onTouch }) => {
  const v = state || {};
  const items = t.lab4_items;
  const n = items.filter(it => v[it.k]).length;
  const pct = Math.round(n / items.length * 100);
  const top3 = items.filter(it => !v[it.k]).slice(0, 3);
  return (
    <div className="bg-white dark:bg-slate-800 rounded-xl p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-1">{t.lab4_title}</h3>
      <p className="text-sm text-slate-500 dark:text-slate-400 mb-4">{t.lab4_desc}</p>
      <div className="space-y-2">
        {items.map(it => (
          <label key={it.k} className="flex items-start gap-3 p-2.5 rounded-lg border border-slate-200 dark:border-slate-700 cursor-pointer hover:border-[#004030] dark:hover:border-[#D8C3A5] transition">
            <input type="checkbox" className="w-4 h-4 mt-0.5 shrink-0 accent-[#004030] dark:accent-[#D8C3A5]" checked={!!v[it.k]}
              onChange={e => { setState({ ...v, [it.k]: e.target.checked }); onTouch && onTouch(); }} />
            <span className="text-sm leading-relaxed">{it.n}</span>
          </label>
        ))}
      </div>
      <div className="mt-4 p-4 rounded-lg bg-slate-50 dark:bg-slate-900/50">
        <p className="font-bold text-[#004030] dark:text-[#D8C3A5]">{t.lab4_pct.replace('{n}', n).replace('{p}', pct)}</p>
        <div className="mt-2 h-3 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
          <div className={`h-full transition-all ${pct === 100 ? 'bg-green-500' : 'bg-[#004030] dark:bg-[#D8C3A5]'}`} style={{width: pct + '%'}}></div>
        </div>
        {top3.length === 0
          ? <p className="text-sm text-green-600 dark:text-green-400 mt-3">{t.lab4_done}</p>
          : <>
              <p className="text-xs font-bold uppercase tracking-wider text-slate-500 mt-3 mb-1">{t.lab4_top3}</p>
              <ul className="text-sm space-y-1">{top3.map(it => <li key={it.k} className="text-amber-700 dark:text-amber-300">· {it.n}</li>)}</ul>
            </>}
      </div>
      <div className="flex items-center gap-3 mt-3 flex-wrap">
        {n > 0 && <button onClick={() => { setState({}); onTouch && onTouch(); }} className="px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg text-sm">{t.lab4_reset}</button>}
      </div>
    </div>
  );
};

/* ================= App ================= */
function App() {
  const LS_ANS = 'PMCS_W12_answers';
  const LS_ANA = 'PMCS_W12_analytics';
  const LS_STU = 'PMCS_W12_student';
  const LS_LAB = 'PMCS_W12_lab';
  const loadLS = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } };

  const [lang, setLang] = useState('en');
  const [isDark, setIsDark] = useState(true);
  const [module, setModule] = useState(0);
  const [menuOpen, setMenuOpen] = useState(false);
  const [ttsState, setTtsState] = useState('idle');
  const [answers, setAnswers] = useState(() => loadLS(LS_ANS, {}));
  const [focus, setFocus] = useState(() => loadLS(LS_ANS + '_focus', {}));
  const [memberCount, setMemberCount] = useState(() => loadLS(LS_ANS + '_mc', DEFAULT_MEMBERS));
  const [sdl, setSdl] = useState(() => loadLS(LS_ANS + '_sdl', null));
  const [lab, setLab] = useState(() => loadLS(LS_LAB, {}));
  const [labNonce, setLabNonce] = useState(0);
  const [studentInfo, setStudentInfo] = useState(() => loadLS(LS_STU, { group:'', dept:'', id:'', nameEn:'', nameZh:'', compiler:'' }));
  const [analytics, setAnalytics] = useState(() => loadLS(LS_ANA, {
    time: Array(TOTAL).fill(0), clicks: Array(TOTAL).fill(0),
    quizCorrect: Array(TOTAL).fill(0), quizTotal: Array(TOTAL).fill(0),
    cardsRead: Array(TOTAL).fill(0), cardsTotal: Array(TOTAL).fill(0), wrongTopics: {}
  }));
  const menuRef = useRef(null);
  const t = dict[lang];

  useEffect(() => { document.documentElement.classList.toggle('dark', isDark); }, [isDark]);
  useEffect(() => { try { localStorage.setItem(LS_ANS, JSON.stringify(answers)); } catch {} }, [answers]);
  useEffect(() => { try { localStorage.setItem(LS_ANS + '_focus', JSON.stringify(focus)); } catch {} }, [focus]);
  useEffect(() => { try { localStorage.setItem(LS_ANS + '_mc', JSON.stringify(memberCount)); } catch {} }, [memberCount]);
  useEffect(() => { try { sdl ? localStorage.setItem(LS_ANS + '_sdl', JSON.stringify(sdl)) : localStorage.removeItem(LS_ANS + '_sdl'); } catch {} }, [sdl]);
  useEffect(() => { try { localStorage.setItem(LS_LAB, JSON.stringify(lab)); } catch {} }, [lab]);
  useEffect(() => { try { localStorage.setItem(LS_ANA, JSON.stringify(analytics)); } catch {} }, [analytics]);
  useEffect(() => { try { localStorage.setItem(LS_STU, JSON.stringify(studentInfo)); } catch {} }, [studentInfo]);
  useEffect(() => {
    const id = setInterval(() => setAnalytics(a => { const ti = [...a.time]; ti[module] += 5; return {...a, time: ti}; }), 5000);
    return () => clearInterval(id);
  }, [module]);
  useEffect(() => {
    const onDoc = e => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false); };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, []);

  const importSdl = (r) => {
    setSdl({ meta: r.meta, sections: r.sections });
    setStudentInfo(st => ({
      ...st,
      group: r.meta.group || st.group,
      id: (r.meta.student_id || st.id || '').replace(/[^0-9]/g, '').slice(0, 12),
      nameEn: /^[\x00-\x7F]+$/.test(r.meta.student || '') ? (r.meta.student || st.nameEn) : st.nameEn,
      nameZh: /^[\x00-\x7F]+$/.test(r.meta.student || '') ? st.nameZh : (r.meta.student || st.nameZh)
    }));
    if (r.meta.group) setA('g_group', r.meta.group);
    if (r.meta.date) setA('g_date', r.meta.date);
  };
  const sdlFileName = () => {
    if (!sdl) return '';
    const m = sdl.meta;
    const who = m.student || 'NA';
    return `${m.course || 'PMCS'}_${m.semester || SEMESTER_DEFAULT}${m.week || WEEK_CODE}_${(m.topic || TOPIC_CAMEL).replace(/\s+/g,'')}_${m.group || 'NA'}-${who}_${(m.date || '').replace(/-/g,'')}.md`;
  };
  const bump = () => setAnalytics(a => { const c = [...a.clicks]; c[module] += 1; return {...a, clicks: c}; });
  const setA = (id, val) => setAnswers(s => ({...s, [id]: val}));
  const setLabPart = (k) => (val) => setLab(s => ({...s, [k]: val}));
  const handleQuizSubmit = (mid, correct, total, wrong) => setAnalytics(a => {
    const qc = [...a.quizCorrect], qt = [...a.quizTotal];
    qc[mid] = correct; qt[mid] = total;
    return {...a, quizCorrect: qc, quizTotal: qt, wrongTopics: {...a.wrongTopics, [mid]: wrong || []}};
  });
  const handleCardRead = (mid, r, s, tot) => setAnalytics(a => {
    const cr = [...a.cardsRead], ct = [...a.cardsTotal]; cr[mid] = r; ct[mid] = tot;
    return {...a, cardsRead: cr, cardsTotal: ct};
  });

  const filled = id => { const v = answers[id]; return v !== undefined && String(v).trim() !== ''; };
  const sectionPct = n => { const c = CORE[n]; return c && c.length ? Math.round(c.filter(filled).length / c.length * 100) : 100; };
  const pctPersonal = Math.round(PERSONAL_SECTIONS.reduce((s,n) => s + sectionPct(n), 0) / PERSONAL_SECTIONS.length);
  const pctGroup = Math.round(GROUP_SECTIONS.reduce((s,n) => s + sectionPct(n), 0) / GROUP_SECTIONS.length);
  const optName = (list, v) => { const o = (list || []).find(x => x.v === v); return o ? o.name : (v || ''); };
  const setName = (id, d) => { const s = (d || t).settings.find(x => x.id === id); return s ? s.name : id; };

  const modulesList = [
    { id:0, num:'0', icon:'📋', title:t.m0_nav, kind:null },
    { id:1, num:'1', icon:'👥', title:t.m1_nav, kind:'G' },
    { id:2, num:'2', icon:'💓', title:t.m2_nav, kind:'P' },
    { id:3, num:'3', icon:'🚀', title:t.m3_nav, kind:'P' },
    { id:4, num:'4', icon:'🗣️', title:t.m4_nav, kind:'P' },
    { id:5, num:'5', icon:'🔍', title:t.m5_nav, kind:'G' },
    { id:6, num:'6', icon:'🩺', title:t.m6_nav, kind:'G' },
    { id:7, num:'7', icon:'🎤', title:t.m7_nav, kind:'G' },
    { id:IDX_LAB, num:String(IDX_LAB), icon:'⚡', title:t.mlab_nav, kind:null },
    { id:IDX_RES, num:String(IDX_RES), icon:'🌐', title:t.mres_nav, kind:null },
    { id:IDX_ANA, num:String(IDX_ANA), icon:'📊', title:t.analytics_title, kind:null }
  ];
  const go = m => { setModule(m); setMenuOpen(false); window.scrollTo({top:0,behavior:'smooth'}); };

  /* ---------- TTS ---------- */
  const handleTTS = (action) => {
    if (!('speechSynthesis' in window)) return;
    if (action === 'stop') { speechSynthesis.cancel(); setTtsState('idle'); return; }
    if (action === 'pause') { speechSynthesis.pause(); setTtsState('paused'); return; }
    if (ttsState === 'paused') { speechSynthesis.resume(); setTtsState('playing'); return; }
    speechSynthesis.cancel();
    const sep = lang === 'zh' ? '。 ' : '. ';
    let texts = [];
    if (module === 0) {
      texts = [t.m0_title, t.m0_intro, t.m0_why, t.m0_why_desc, ...t.m0_stats.map(s => `${s.label}: ${s.val}`), ...t.m0_modules.map(m => `${m.title}. ${m.desc}`)];
    } else if (module >= 1 && module <= NUM_LEARN) {
      const k = `m${module}`;
      texts = [t[`${k}_title`], t[`${k}_overview`], ...(t[`${k}_highlights`]||[]), t[`${k}_deep`], t[`${k}_wrapup`]];
      if (module === 2) texts.push(...t.loop.map(f => `${f.name}. ${f.sub}`), t.loop_note, ...t.m2_terms.flatMap(x => [x.front, x.back]));
    } else if (module === IDX_LAB) {
      texts = [t.mlab_title, t.mlab_desc, t.lab1_title, t.lab1_desc, t.lab2_title, t.lab2_desc, t.lab3_title, t.lab3_desc, t.lab4_title, t.lab4_desc, t.lab5_title, t.lab5_desc];
    } else if (module === IDX_RES) {
      texts = [t.mres_title, t.mres_desc, ...t.res_req.map(r => `${r.label}. ${r.desc}`), ...t.res_opt.map(r => `${r.label}. ${r.desc}`)];
    } else {
      texts = [t.analytics_title, t.analytics_desc, `${t.analytics_pct_personal}: ${pctPersonal}%`, `${t.analytics_pct_group}: ${pctGroup}%`];
      const weak = [1,2,3,4,5,6,7].filter(n => sectionPct(n) < 100);
      if (weak.length) { texts.push(t.analytics_wp_tts_intro); weak.forEach(n => texts.push(t.analytics_wp_tts_module.replace('{name}', t[`m${n}_nav`]).replace('{acc}', sectionPct(n)))); }
      else texts.push(t.analytics_wp_tts_allpass);
    }
    const utt = new SpeechSynthesisUtterance(texts.filter(Boolean).join(sep));
    utt.rate = 0.95;
    const voices = speechSynthesis.getVoices();
    if (lang === 'zh') {
      const v = voices.find(v=>v.lang==='zh-TW'&&v.name.includes('Yating')) || voices.find(v=>v.lang==='zh-TW') || voices.find(v=>v.lang.startsWith('zh'));
      if (v) utt.voice = v; utt.lang = 'zh-TW';
    } else {
      const v = voices.find(v=>v.lang==='en-GB'&&(v.name.includes('Male')||v.name.includes('Daniel'))) || voices.find(v=>v.lang==='en-GB') || voices.find(v=>v.lang.startsWith('en'));
      if (v) utt.voice = v; utt.lang = 'en-GB';
    }
    utt.onend = () => setTtsState('idle'); utt.onerror = () => setTtsState('idle');
    speechSynthesis.speak(utt); setTtsState('playing');
  };

  /* ---------- Export ---------- */
  const dstamp = () => { const d = new Date(), p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`; };
  const download = (content, filename, mime) => {
    const blob = new Blob([content], {type: mime}); const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };

            <button onClick={() => handleTTS('stop')} className="p-2 hover:bg-white/10 rounded-lg" aria-label="Stop"><IconSquare size={18}/></button>
            <button onClick={() => setLang(lang === 'en' ? 'zh' : 'en')} className="px-2 py-2 hover:bg-white/10 rounded-lg flex items-center gap-1"><IconGlobe size={18}/><span className="text-xs font-bold">{lang === 'en' ? '中' : 'EN'}</span></button>
            <button onClick={() => setIsDark(!isDark)} className="p-2 hover:bg-white/10 rounded-lg" aria-label="Theme">{isDark ? <IconSun size={18}/> : <IconMoon size={18}/>}</button>
          </div>
        </div>
      </header>

      <div className="flex-1 w-full max-w-7xl mx-auto flex">
        <aside className="hidden md:block w-64 shrink-0 border-r border-slate-200 dark:border-slate-700 py-8 px-3">
          <p className="text-xs font-bold uppercase tracking-wider text-slate-400 px-3 mb-3">{t.nav_modules}</p>
          {modulesList.map(m => (
            <button key={m.id} onClick={() => go(m.id)}
              className={`w-full flex items-center gap-2 px-3 py-2.5 rounded-lg text-sm mb-1 transition ${module === m.id ? 'bg-[#004030]/10 dark:bg-[#D8C3A5]/10 text-[#004030] dark:text-[#D8C3A5] font-bold' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}`}>
              <span className="ui-decoration shrink-0">{m.icon}</span>
              <span className="truncate text-left flex-1">{m.title}</span>
              {m.kind && <span className={`text-[10px] font-bold px-1 rounded shrink-0 ${m.kind === 'P' ? 'text-sky-700 dark:text-sky-300' : 'text-[#004030] dark:text-[#D8C3A5]'}`}>{m.kind}</span>}
            </button>
          ))}
          <div className="mt-6 px-3 space-y-3">
            <div>
              <p className="text-xs text-slate-400 mb-1">{t.analytics_pct_personal}</p>
              <div className="h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden"><div className={`h-full ${pctPersonal === 100 ? 'bg-green-500' : 'bg-sky-600 dark:bg-sky-400'}`} style={{width: pctPersonal + '%'}}></div></div>
              <p className="text-xs font-bold text-sky-700 dark:text-sky-300 mt-1">{pctPersonal}%</p>
            </div>
            <div>
              <p className="text-xs text-slate-400 mb-1">{t.analytics_pct_group}</p>
              <div className="h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden"><div className={`h-full ${pctGroup === 100 ? 'bg-green-500' : 'bg-[#004030] dark:bg-[#D8C3A5]'}`} style={{width: pctGroup + '%'}}></div></div>
              <p className="text-xs font-bold text-[#004030] dark:text-[#D8C3A5] mt-1">{pctGroup}%</p>
            </div>
          </div>
        </aside>

        <main className="flex-1 min-w-0 py-8 px-4 sm:px-6">
          <div key={`${module}-${lang}`} className="space-y-6 text-lg leading-relaxed text-slate-700 dark:text-slate-300 animate-fade-in">
            {module !== 0 && (
              <div>
                <H2 icon={cur.icon} number={cur.num}>{module <= NUM_LEARN ? t[`m${module}_title`] : module === IDX_LAB ? t.mlab_title : module === IDX_RES ? t.mres_title : t.analytics_title}</H2>
                {cur.kind && <Badge kind={cur.kind} t={t} />}
              </div>
            )}
            {body()}
            <div className="mt-12 flex justify-between items-center pt-8 border-t border-slate-300 dark:border-slate-700 no-print">
              <button onClick={() => go(Math.max(0, module-1))} disabled={module === 0}
                className="px-5 py-2.5 border border-slate-300 dark:border-slate-600 rounded-lg text-sm font-bold hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-0">← {t.nav_prev}</button>
              <button onClick={() => go(Math.min(TOTAL-1, module+1))} disabled={module === TOTAL-1}
                className="px-5 py-2.5 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] rounded-lg text-sm font-bold disabled:opacity-0">{t.nav_next} →</button>
            </div>
          </div>
        </main>
      </div>

      <footer className="h-8 bg-[#004030] flex items-center justify-between px-4 shrink-0">
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs truncate">{t.date} · {t.copyright}</span>
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs flex items-center gap-3 shrink-0">
          <span className="hidden sm:inline">{t.architect_label}&nbsp;<a href={t.architect_url} target="_blank" rel="noopener noreferrer" className="text-[#D8C3A5] hover:text-white underline">Prof. Shihmin Lo</a></span>
          <button onClick={() => window.scrollTo({top:0,behavior:'smooth'})} className="text-[#D8C3A5] hover:text-white font-bold">Top ↑</button>
        </span>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
