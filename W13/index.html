    m3_nav: "3. 工作包拆解", m3_title: "個人負責範圍的工作包拆解",
    m3_overview: "本週個人核心任務的後半，讀完 T5 M4 之後填。把你在組內負責的那一塊拆到第三層工作包，每一個都跑一次工作包三檢查——可指派給一個人？可估出工時？有明確的完成判準？沒通過的要寫出還缺什麼。",
    m3_highlights: ["第三層","編號 1.1.1","三檢查","缺什麼","工時估計"],
    m3_deep: "編號不是裝飾。1、1.1、1.1.1 是後面所有表格的主鍵——第 6 節的關鍵路徑用它排序，W14 的風險登記表用它定位。沒有編號的分解結構，過兩週就會退化成一張純文字清單。三檢查裡最常掉的是第三項：「做好知識庫」不是判準，「KB 目錄下三個檔案各寫滿並通過格式檢查」才是；差別在於前者要由人來認定，後者任何人拿去看都會得到同一個答案。另外請注意反向的錯誤——如果一個工作包只需要半小時，把它獨立成一列的管理成本會高於它本身，那是過度分解。最後一格的工時總和請誠實估，第 8 節的 D day 倒數盤點會拿它跟你們實際可用的工時預算對照。",
    m3_scope_label: "我在組內負責的那一塊（第二層名稱與編號）",
    m3_scope_hint: "依 T5 M4「工作分解結構 WBS」，第一層是專案本身或主要可交付成果，第二層是子系統或工作階段。請寫出你負責的第二層，例如 1.2 資料抓取與清洗。",
    m3_scope_ph: "例：1.2 資料抓取與清洗——包含來源清單、抓取腳本、失敗重試與原始檔留存。",
    m3_list_label: "第三層工作包清單（至少四個，每個附編號與工時估計）",
    m3_list_hint: "一行一個。格式建議：編號 空格 名稱 空格 括號裡填工時。例：1.2.1 撰寫來源清單與抓取規則（4 小時）。",
    m3_list_ph: "例：\n1.2.1 撰寫來源清單與抓取規則（4 小時）\n1.2.2 寫出抓取腳本並跑通三個來源（6 小時）\n1.2.3 加上失敗重試與原始檔留存（3 小時）\n1.2.4 寫一份來源異動的檢查清單（2 小時）",

    m3_check_hint: "每一個工作包都要跑三檢查：可指派給一個人？可估出工時？有明確的完成判準？寫出哪些三項全過、哪些沒過。可以先用第 8 節的三檢查清單跑一次再回來填。",
    m3_check_ph: "例：1.2.1、1.2.3 三項全過。1.2.2 第一項沒過，因為三個來源實際上要兩個人分頭做。1.2.4 第三項沒過，判準只寫了「整理好」。",
    m3_gap_label: "沒通過的那幾個還缺什麼",
    m3_gap_hint: "缺什麼要寫得出下一步。「還要再想想」不算，「拆成 1.2.2a 與 1.2.2b 兩個工作包各指派一人」才算。",
    m3_gap_ph: "例：1.2.2 拆成 1.2.2a（A、B 兩個來源）與 1.2.2b（C 來源）各指派一人。1.2.4 的完成判準改寫成「清單至少八項，每項附一個可觀察的判斷條件」。",
    m3_hours_label: "我這一塊的工時估計總和（小時）",
    m3_hours_hint: "把上面所有工作包的工時加起來。這個數字會被第 8 節的 D day 倒數盤點拿來對照可用工時預算。",
    m3_hours_ph: "例：15",

    m4_nav: "4. 語言實驗室", m4_title: "EMI 語言實驗室",

    m5_nav: "5. 小組綜整", m5_title: "小組綜整：只挑三個工作包做並排比對",
    m5_overview: "這一節才是小組討論真正的工作。六個人各自帶來自己那一塊的工作包清單，全部攤開會有三、四十個。你們只挑三個做並排比對，比三件事：工期估計的差距、相依關係的認定差異、完成判準寫得夠不夠硬。最後訂出一條全組通用的工作包書寫通則。",
    m5_highlights: ["六人清單挑三個","工期差距","相依關係","完成判準","組內通則"],
    m5_deep: "彙整方式有一條硬性規定：本週彙整人不得把六份個人匯出檔全部丟給 AI 叫它總結。Context Engineering 的核心是選取，不是全丟。比對集合有六個領域——資料抓取、分析與抽取、部署與排程、內容與呈現、簡報與驗收、知識庫與文件——你們只能挑三個，再只取那三個領域的六人份工作包。挑哪三個本身就是判斷：挑六個人寫得都差不多的三個，比對不出東西；挑跨兩個人以上、而且大家對「誰要等誰」講不清楚的那三個，才會逼出通則。",
    m5_focus_label: "我們決定比對的三個領域（勾選三項）",
    m5_focus_why: "為什麼略過另外三個？",
    m5_focus_why_ph: "例：內容與呈現、簡報與驗收兩個領域目前只有一個人碰，比不出差異；知識庫與文件大家寫得都一樣。真正吵起來的是資料抓取與部署排程的相依關係，所以我們挑那兩個加上分析與抽取。",
    m5_gap_label: "工期估計的差距：同一類工作，六個人估出來差多少",
    m5_gap_ph: "例：同樣是「寫一個來源的抓取腳本」，A 估 2 小時，D 估 8 小時。追問之後發現 A 沒有把反爬蟲與重試算進去，D 算了。四倍的差距不是能力差距，是範圍認定的差距。",
    m5_dep_label: "相依關係的認定差異：誰認為要等誰，分歧在哪裡",
    m5_dep_ph: "例：B 認為抽取規則要等抓取腳本跑通才能寫，C 認為可以拿三筆手動貼上的樣本先開工。這兩種認定會讓關鍵路徑差三天，我們採用 C 的版本並補一句「樣本至少三筆且涵蓋兩個來源」。",
    m5_criteria_label: "完成判準寫得夠不夠硬：最鬆的那一個是哪一個，鬆在哪裡",
    m5_criteria_ph: "例：最鬆的是「知識庫整理好」。它要由人來認定，兩個人看同一份檔案會給出不同答案。改寫成「KB 目錄下三個檔案各寫滿並通過格式檢查」之後，任何人拿去看都會得到同一個答案。",
    m5_rule_label: "從這次比對，我們訂下一條工作包書寫通則",
    m5_rule_ph: "例：本組每一個第三層工作包一律寫成「編號＋動詞開頭的名稱＋（工時）＋前置工作包編號＋一句可觀察的完成判準」，五項缺任何一項就不准放進第 6 節的關鍵路徑。",
    m5_rule_note: "這條通則會累積到期末專案。它應該可以被別人拿去檢查你們的工作分解結構，而不是一句期許。",
    m5_wrapup: "檢查點：只比對了三項（不是全部丟給 AI），且訂出的通則是可以檢查的。",

    m6_nav: "6. 依演化表建置", m6_title: "依演化表建置：到 D day 的 WBS 與關鍵路徑",

    m6_highlights: ["第一層分解","關鍵路徑","總工期","最脆弱的一段","浮時調度"],
    m6_deep: "第一層寫三到五項就好，寫十項代表你們把第二層混進來了。關鍵路徑要寫成活動代號串，例如 A→C→D→G，而不是一段描述；總工期要寫出天數，因為它會被拿來跟剩下的週數對照。tp_cp_weak 是本週的分類欄位，彙整台會直接把全班的答案畫成分布圖，所以請照實選——選出來之後，下一格的浮時調度就是你們的解法：浮時最多的那一段可以先緩，把人力調到浮時為零的那一段上。最後提醒一件事：浮時是共享的，同一條分支上的三項活動如果各有三天浮時，那通常是同一個三天，用掉了就沒了。",

    m6_wbs_ph: "例：\n1.1 資料來源與抓取\n1.2 分析與抽取規則\n1.3 部署與排程\n1.4 內容呈現與驗收",

    m6_path_ph: "例：A→B→D→E→F",
    m6_days_label: "關鍵路徑總工期（天）",
    m6_days_hint: "只填數字。這個數字要跟上一格的代號串對得起來，也要跟你們距離 D day 的實際天數對照。",
    m6_days_ph: "例：15",
    m6_cp_ok: "✓ 關鍵路徑寫成了代號串，總工期也有數字，可以拿去對照 D day 了。",
    m6_cp_warn: "⚠ 關鍵路徑要寫成活動代號串（例如 A→B→D），總工期要填數字。缺任何一項，這條路徑就無法被檢查。",

    m1_sec_warn: "Over 600 seconds (10 minutes) — trim it down.",
    m1_sec_ok: "Within 10 minutes. Workable.",
    m1_wrapup: "Checkpoint: every attending member has an assigned part, and the total stays under 600 seconds.",

    m2_nav: "2. Triple Constraint", m2_title: "Locating Yourself in the Triple Constraint",
    m2_overview: "The first half of this week's individual core task, to be filled in after reading T5 module 2. Scope is how much work there is, schedule is how much time, cost is how much resource, and the three pull on each other. Decide which side of your term project an outside force has already pinned, write down evidence somebody else could check, and then write what the other two sides have paid so far.",
    m2_highlights: ["Iron triangle","The locked side","Price already paid","Quality is area","Slack"],
    m2_deep: "Two common mistakes. The first is saying all three feel a bit tight — that is a mood, not a position. Locked means the side is decided by an outside force and you cannot move it yourselves: the D day is set by the course calendar, the feature list is set by a plan already promised in writing. Usually only one of the three is genuinely locked. The second mistake is writing the price as an adjective. Everyone is exhausted is not a price; we cut the planned two industries down to one and three of us each spent four extra hours rewriting the extraction rules are prices, because they carry numbers and name something concrete that was given up. In the last cell, be honest about quality: quality is not a fourth corner but the area of the triangle, and when you cut both time and resource while refusing to cut scope, quality is what gets spent.",
    m2_locked_label: "Which side of your project is locked right now?",
    m2_locked_hint: "Pick exactly one. Locked means an outside force decided it and you cannot move it yourselves.",
    m2_locked_warn: "⚠ Nothing selected yet. All three feeling tight is not a position — name the side an outside force has actually pinned.",
    m2_evidence_label: "Evidence that it is locked (something somebody else can check)",
    m2_evidence_hint: "Say who decided it, when, and which document it is written in. We all feel short of time is not evidence.",
    m2_evidence_ph: "e.g. The D day is set by the course calendar at the W15 class, printed in the milestone table on page 1 of our plan; it is the same for the whole class and we cannot move it.",
    m2_give1_label: "What one of the other two sides has already paid (first item)",
    m2_give1_hint: "Use a number or name something concrete that was given up. Not adjectives.",
    m2_give1_ph: "e.g. Scope has already given way: the three industries we planned are down to one, and the keyword tables for the second and third moved wholesale onto the not this time list.",
    m2_give2_label: "What the other of the two sides has already paid (second item)",
    m2_give2_hint: "Write the other side too. If you believe it has not given way at all, explain why it is still holding.",
    m2_give2_ph: "e.g. Cost gave way as well: three of us each put in four extra hours rewriting the extraction rules last week and three more each on deployment this week — twenty-one extra person-hours across the group.",
    m2_quality_label: "Where is the area — quality — shrinking right now?",
    m2_quality_hint: "T5 module 2: quality is not a fourth corner but the area of the triangle. Compress all three sides and the area shrinks, usually without anyone saying so.",
    m2_quality_ph: "e.g. Each item dropped from 120 words to 80, source links moved from one per item to one per issue, and the format check is switched off for now — three quality cuts we never announced.",
    m2_svg_layer: "PLAN · the iron triangle",
    m2_svg_cap: "The more you complete, the brighter the triangle; the locked side is marked in red and the enclosed area stands for quality",
    m2_terms: [
      { front: "Triple constraint", back: "Scope, schedule and cost pull on each other. Squeeze one side and the other two must give way; you may only turn two dials." },
      { front: "Quality as area", back: "Quality is not a fourth corner but the area the triangle encloses. Compress all three sides and the area shrinks, usually quietly." },
      { front: "Risk outside the triangle", back: "An uncertain event that may affect project objectives positively or negatively — a force acting on the constraint. W14 gives it a full week." },
      { front: "Slack", back: "Space left at the three corners during planning. Slack is what you pay for risk in advance." },
      { front: "Work package", back: "The bottom unit of the breakdown: assignable to one person, estimable in hours, with a clear completion criterion." },
      { front: "The three checks", back: "Assignable to one person? Hours estimable? Completion criterion clear? All three yes, or cut one layer deeper." },
      { front: "Critical path method (CPM)", back: "Four steps: identify critical activities, determine the shortest completion time, optimise the schedule, assess schedule risk. Forward pass gives ES and EF, backward pass LS and LF." },
      { front: "Total float (TF)", back: "Equals LS minus ES, and also LF minus EF. Activities with zero float form the critical path: a day late there is a day late for the project." }
    ],
    m2_q: [
      { q: "With the D day locked and the group wanting one more feature, what freedom is left?", opts: ["Only cost and quality; if cost cannot rise, quality gives way","Only schedule and risk, and the two cancel each other out","Both scope and schedule can still be eased at the same time","Only quality remains, since cost can never be adjusted at all"], ans: _A0, exp: "Schedule locked and scope up leaves cost; when cost cannot rise either, what gives way is the area of the triangle — quality." },
      { q: "What are the three work-package checks in T5?", opts: ["It has a number, an owner and a due date","Assignable to one person, hours estimable, completion criterion clear","It is testable, traceable and can be automated","It has a budget, a tool and a backup person"], ans: _A1, exp: "All three must be yes before you stop; any no means cut one layer deeper." },
      { q: "In the forward pass, how is the early start ES calculated?", opts: ["Take the smallest late start among all successor activities","Take the average early start of all predecessor activities","Take the largest early finish among all predecessor activities","It always equals the project duration minus the activity duration"], ans: _A2, exp: "ES is the largest EF among predecessors and EF is ES plus duration; taking the smallest LS among successors is the backward pass for LF." },
      { q: "If only one extra person is available, where should they go?", opts: ["Onto the activity that carries the longest duration of all","Onto the activity that is scheduled to start latest of all","Onto the piece of work complained about most in meetings","Onto the smallest total float — that is, onto the critical path"], ans: _A3, exp: "An activity with zero float slips the whole project by a day for every day it slips, with no buffer to absorb it." }
    ],
    m2_wrapup: "Checkpoint: the locked side carries evidence somebody else could check, and the price on the other two sides is written as numbers or concrete things given up rather than adjectives.",

    m3_nav: "3. Work Packages", m3_title: "Decomposing Your Own Slice into Work Packages",
    m3_overview: "The second half of this week's individual core task, to be filled in after reading T5 module 4. Decompose the slice you own inside the group down to third-layer work packages, and run the three checks on every one of them — assignable to one person? hours estimable? completion criterion clear? For any that fail, write what is still missing.",
    m3_highlights: ["Third layer","Numbering 1.1.1","Three checks","What is missing","Hour estimate"],
    m3_deep: "The numbering is not decoration. 1, 1.1, 1.1.1 is the primary key every later table shares — section 6 sorts the critical path by it and the W14 risk register locates by it. A breakdown with no numbering decays into a plain text list within a fortnight. The check that fails most often is the third: finish the knowledge base is not a criterion, three files under KB each filled out and passing the format check is. The difference is that the first needs a human to judge and the second gives every reader the same answer. Watch the opposite failure too: if a package takes half an hour, tracking it as its own row costs more than the work, and that is over-decomposition. Estimate the total hours in the last cell honestly — the D day countdown in section 8 will hold it against the hours you actually have.",
    m3_scope_label: "The slice I own inside the group (second-layer name and number)",
    m3_scope_hint: "The first layer is the project or its major deliverables and the second is a subsystem or work stage. Write the second layer you own, for example 1.2 data fetching and cleaning.",
    m3_scope_ph: "e.g. 1.2 Data fetching and cleaning — the source list, the fetch script, retry on failure and keeping the raw files.",
    m3_list_label: "Third-layer work packages (at least four, each with a number and an hour estimate)",
    m3_list_hint: "One per line. Suggested format: number, space, name, then the hours in brackets. e.g. 1.2.1 Write the source list and fetch rules (4 h).",
    m3_list_ph: "e.g.\n1.2.1 Write the source list and fetch rules (4 h)\n1.2.2 Write the fetch script and get three sources working (6 h)\n1.2.3 Add retry on failure and keep the raw files (3 h)\n1.2.4 Write a checklist for source changes (2 h)",
    m3_check_label: "Results of the three checks, package by package",
    m3_check_hint: "Run all three on every package: assignable to one person? hours estimable? completion criterion clear? Say which pass all three and which do not. You can run the checklist in section 8 first and come back.",
    m3_check_ph: "e.g. 1.2.1 and 1.2.3 pass all three. 1.2.2 fails the first, because three sources really need two people working separately. 1.2.4 fails the third, because the criterion only says tidy it up.",
    m3_gap_label: "What is still missing on the ones that failed",
    m3_gap_hint: "Missing has to name a next step. Needs more thought does not count; split 1.2.2 into 1.2.2a and 1.2.2b and assign one person each does.",
    m3_gap_ph: "e.g. Split 1.2.2 into 1.2.2a (sources A and B) and 1.2.2b (source C), one person each. Rewrite the criterion for 1.2.4 as at least eight items, each carrying one observable condition.",
    m3_hours_label: "Total hour estimate for my slice (hours)",
    m3_hours_hint: "Add up the hours of every package above. Section 8's D day countdown uses this number against the hours you actually have.",
    m3_hours_ph: "e.g. 15",
    m3_hours_warn: "⚠ No total yet. Without this number the D day countdown cannot tell you whether you are over budget.",
    m3_hours_ok: "✓ Total hours recorded — you can run the D day countdown in section 8 now.",
    m3_wrapup: "Checkpoint: at least four numbered third-layer work packages, and every one that failed a check says concretely what is still missing.",

    m4_nav: "4. Language Lab", m4_title: "EMI Language Lab",
    m4_overview: "This course is taught in English. Pick five new words or phrases from this week's required materials, plus three words you stumble over. What you produce here feeds class discussion and bonus work directly.",
    m4_highlights: ["Five new terms","Three hard words","In your own words","Example sentences"],
    m4_deep: "Do not copy the source definition into the in your own words column — copying proves only that you found it; rewriting proves you understood it. Write the example sentences about your own term project: your critical path, the completion criterion of one work package, or the feature you plan to cut. That way one effort does two jobs.",
    m4_corpus_label: "Suggested corpus this week (project planning)",
    m4_corpus: ["critical path","float / slack","work package","deliverable","milestone","baseline","trade-off","de-scope"],
    m4_corpus_note: "You do not need all eight — take the five you will genuinely say in the presentation. Note that this course treats float and slack as the same idea, and that de-scope is a verb: formally moving something already inside the scope back out of it.",
    m4_terms_label: "Five new words or phrases",
    m4_col_term: "Term / phrase", m4_col_mean: "In your own words", m4_col_sent: "Your own sentence",
    m4_pron_label: "Three words you stumble over",
    m4_col_word: "Word", m4_col_hard: "What makes it hard", m4_col_tip: "Your memory trick",
    m4_wrapup: "Checkpoint: not one of the five explanations is copied verbatim from the source.",

    m5_nav: "5. Group Synthesis", m5_title: "Group Synthesis: Compare Only Three Work Packages",
    m5_overview: "This section is the real work of the group discussion. Six people each bring the work packages for their own slice, and laid out together there will be thirty or forty of them. You pick only three to compare side by side, on three things: how far the duration estimates diverge, how differently people read the dependencies, and how hard the completion criteria actually are. Then you set one group-wide rule for writing a work package.",
    m5_highlights: ["Three from six lists","Duration gaps","Dependencies","Completion criteria","A group rule"],
    m5_deep: "One rule is mandatory here: this week's compiler must NOT dump all six individual exports into an AI and ask for a summary. The core of Context Engineering is selection, not dumping. The comparison set has six domains — data fetching, analysis and extraction, deployment and scheduling, content and presentation, pitch and acceptance, knowledge base and documents — and you may pick only three, then take only those three domains from each member. Choosing which three is itself the judgement: the three everyone wrote almost identically teach you nothing, while the three that cross two or more people and where nobody is sure who waits for whom are the ones that force a rule out of you.",
    m5_focus_label: "The three domains we chose to compare (tick three)",
    m5_focus_why: "Why did we skip the other three?",
    m5_focus_why_ph: "e.g. Content and presentation and pitch and acceptance are each touched by one person only, so there was nothing to compare, and everybody wrote the knowledge base the same way. The real argument was about the dependency between fetching and deployment, so we took those two plus extraction.",
    m5_gap_label: "Duration estimates: for the same kind of work, how far apart are the six?",
    m5_gap_ph: "e.g. For write the fetch script for one source, A estimated 2 hours and D estimated 8. Asking why showed that A had left out anti-scraping and retries while D had counted them. A factor of four is not a gap in ability, it is a gap in what the task was taken to include.",
    m5_dep_label: "Dependencies: who thinks they must wait for whom, and where do you disagree?",
    m5_dep_ph: "e.g. B thinks the extraction rules must wait for a working fetch script; C thinks three hand-pasted samples are enough to start. The two readings put the critical path three days apart. We took C's version and added at least three samples covering two sources.",
    m5_criteria_label: "Completion criteria: which is the loosest, and how is it loose?",
    m5_criteria_ph: "e.g. The loosest is knowledge base tidied up. It needs a human to judge, and two people reading the same folder disagree. Rewritten as three files under KB each filled out and passing the format check, every reader now gets the same answer.",
    m5_rule_label: "From this comparison, our group sets one rule for writing a work package",
    m5_rule_ph: "e.g. Every third-layer work package in this group is written as number + a name starting with a verb + (hours) + the numbers of its predecessors + one observable completion criterion. Missing any of the five keeps it out of the critical path in section 6.",
    m5_rule_note: "These rules accumulate towards the Term Project. Somebody else should be able to check your breakdown against this rule, so it must not read as an aspiration.",
    m5_wrapup: "Checkpoint: only three items were compared (nothing was dumped wholesale into an AI), and the rule you set is checkable.",

    m6_nav: "6. Build by the Table", m6_title: "Build by the Table: the WBS and the Critical Path to D Day",
    m6_overview: "Turn the consensus from section 5 into one plan the whole group shares. What you write here is the schedule you actually work to between now and D day, and it doubles as your registration slip for diagnosis in class. Run the three critical-path cells through the estimator in section 8 before filling them in.",
    m6_highlights: ["First layer","Critical path","Total duration","Weakest link","Moving the float"],
    m6_deep: "Three to five items is enough for the first layer; ten means the second layer has crept in. Write the critical path as a chain of activity codes, for example A→C→D→G, not as a paragraph, and give the total duration in days, because it will be held against the weeks you have left. tp_cp_weak is this week's categorical field and the aggregator plots the whole class as a distribution, so answer honestly — and once you have named the weakest link, the next cell is your remedy: the segment with the most float can wait while people move onto the one with zero float. One last warning: float is shared. If three activities on one branch each show three days, that is usually the same three days, and spending it once spends it for all.",
    m6_wbs_label: "First-layer work breakdown (three to five items)",
    m6_wbs_hint: "The first layer is the project itself or its major deliverables. One per line, three to five of them; more than five usually means the second layer has crept in.",
    m6_wbs_ph: "e.g.\n1.1 Sources and fetching\n1.2 Analysis and extraction rules\n1.3 Deployment and scheduling\n1.4 Presentation and acceptance",
    m6_path_label: "Critical path (chain of activity codes)",
    m6_path_hint: "Write it as a chain of codes, for example A→C→D→G. Use the same codes as the estimator in section 8.",
    m6_path_ph: "e.g. A→B→D→E→F",
    m6_days_label: "Total duration of the critical path (days)",
    m6_days_hint: "Numbers only. It has to agree with the chain above, and it has to be held against the real number of days left before D day.",
    m6_days_ph: "e.g. 15",
    m6_cp_ok: "✓ The critical path is written as a chain of codes and the duration is a number — you can hold it against D day now.",
    m6_cp_warn: "⚠ The critical path has to be a chain of activity codes (for example A→B→D) and the duration has to be a number. Without both, the path cannot be checked.",
    m6_weak_label: "The weakest link on the critical path",
    m6_weak_hint: "Answer honestly. The aggregator plots this as a class-wide distribution and uses it to allocate diagnosis time in class.",
    m6_weak_note: "Once you have chosen it, use the next cell to say how you will shore it up — a weak link with no reallocation behind it is just an admission of risk.",
    m6_weak_why_label: "Why this one (your reasoning)",
    m6_weak_why_hint: "Say why it is weaker than the rest: does it depend on something outside, does only one person know it, has it never been tested?",
    m6_float_label: "The segment with the most float, and where you will move people",
    m6_float_hint: "Say which segment has the most float and how many days, then say which activity you are moving people onto. The answer is usually the one with the least float.",
    m6_float_ph: "e.g. Content and presentation (C) has 2 days of float, the most of any activity. We are moving one of the people on C over to B, analysis and extraction, because B has zero total float and every day B slips the project slips.",
    m6_wrapup: "Checkpoint: the critical path gives a concrete chain of activities and a number of days, and the weakest link named comes with a reason.",

    m7_nav: "7. Presentation Plan", m7_title: "Presentation Plan and Question",
    m7_overview: "Turn section 1's split into a runnable script, and prepare one question to put to the class. The 10-minute Q&A is carried entirely by the questions each group brings.",
    m7_highlights: ["Opening line","Segment script","Menti question","10 minutes"],
    m7_deep: "This week, give the triangle and the critical path a slide each — in planning week the most persuasive sentence available to you is our D day cannot move, so we cut this. Write the opening line as a complete English sentence rather than keywords. Avoid yes-or-no questions for the class; a good one forces a judgement first, for example: if you could add exactly one person, would you put them on the zero-float activity or on the one nobody in the group understands yet?",
    m7_open_label: "English opening line (one complete sentence)",
    m7_open_ph: "e.g. Our D-day cannot move, so this week we cut the second industry rather than pretend the schedule would hold.",
    m7_script_label: "Segment script (one sentence per speaker on the point they will make)",
    m7_col_who: "Speaker", m7_col_point: "The point of this segment",
    m7_question_label: "One question for the class (for Menti)",
    m7_question_ph: "e.g. If you could add exactly one person this week, would you put them on the zero-float activity or on the one nobody in the group understands yet?",
    m7_wrapup: "Checkpoint: the opening line is a complete English sentence, and the question cannot be answered with yes or no.",

const parseSdlKb = (text) => {
  try {
    const t = String(text || '').replace(/\r\n/g, '\n').trim();
    if (!t) return { ok: false, error: 'empty' };
    const fm = t.match(/^---\n([\s\S]*?)\n---/);
    const meta = {};
    if (fm) {
      fm[1].split('\n').forEach(line => {
        if (/^\s/.test(line)) return;               // skip nested (sources / interaction)
        const m = line.match(/^([A-Za-z_]+):\s*(.*)$/);
        if (m) meta[m[1]] = m[2].replace(/^["']|["']$/g, '').trim();
      });
    }
    const sections = {};
    const parts = t.split(/^##\s*§/m);
    parts.shift();
    parts.forEach(part => {
      const n = part.match(/^(\d)/);
      if (!n) return;
      sections['s' + n[1]] = part.replace(/^\d[^\n]*\n?/, '').trim();
    });
    const hasAny = Object.keys(meta).length > 0 || Object.keys(sections).length > 0;
    if (!hasAny) return { ok: false, error: 'format' };
    return { ok: true, meta, sections, raw: t };
  } catch (e) { return { ok: false, error: 'format' }; }
};

const SdlImport = ({ t, sdl, onImport, onClear }) => {
  const [text, setText] = useState('');
  const [msg, setMsg] = useState(null);
  const fileRef = useRef(null);
  const doParse = (raw) => {
    const r = parseSdlKb(raw);
    if (!r.ok) { setMsg({ ok: false, text: r.error === 'empty' ? t.sdl_err_empty : t.sdl_err_format }); return; }
    onImport(r);
    setMsg({ ok: true, text: t.sdl_ok });
    setText('');
  };
  const onFile = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => doParse(rd.result);
    rd.readAsText(f);
    e.target.value = '';
  };
  return (
    <div className="rounded-xl border-2 border-sky-200 dark:border-sky-800/60 bg-sky-50/50 dark:bg-sky-900/10 p-5">
      <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5]">{t.sdl_title}</h3>
      <p className="text-sm text-slate-500 dark:text-slate-400 mt-1 mb-3 leading-relaxed">{t.sdl_desc}</p>

            {[sdl.meta.course, sdl.meta.semester, sdl.meta.week, sdl.meta.topic].filter(Boolean).join(' · ')}
            {sdl.meta.student ? ' · ' + sdl.meta.student : ''}{sdl.meta.group ? ' · ' + sdl.meta.group : ''}
          </p>
          <button onClick={onClear} className="mt-3 px-3 py-1.5 text-xs border border-red-400 text-red-600 dark:text-red-400 rounded-lg">{t.sdl_clear}</button>

/* ================= FlipCardDeck ================= */
const FlipCardDeck = ({ terms, t, moduleId, onCardRead }) => {
  const [groupIdx, setGroupIdx] = useState(0);
  const [flipped, setFlipped] = useState({});
  const [readSet, setReadSet] = useState(new Set());
  const [shownSet, setShownSet] = useState(new Set());
  const [shuffledOrder] = useState(() => [...Array(terms.length).keys()].sort(() => Math.random() - 0.5));
  const groupSize = 2;
  const totalGroups = Math.ceil(terms.length / groupSize);
  const currentCardIndices = shuffledOrder.slice(groupIdx*groupSize, groupIdx*groupSize + groupSize);
  useEffect(() => {
    const ns = new Set(shownSet); currentCardIndices.forEach(i => ns.add(i));
    if (ns.size !== shownSet.size) setShownSet(ns);
  }, [groupIdx]);
  const handleFlip = (i) => {
    setFlipped(f => ({...f, [i]: !f[i]}));
    if (!readSet.has(i)) { const nr = new Set(readSet); nr.add(i); setReadSet(nr); onCardRead && onCardRead(moduleId, nr.size, shownSet.size, terms.length); }
  };
  const statusText = t.flip_status.replace('{read}', readSet.size).replace('{shown}', shownSet.size).replace('{total}', terms.length);
  return (
    <div className="mt-8">
      <h3 className="text-lg font-bold uppercase tracking-wider text-slate-500 mb-2">{t.key_terms}</h3>
      <p className="text-sm text-slate-400 mb-4">{statusText}</p>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        {currentCardIndices.map(i => (
          <div key={i} className="perspective cursor-pointer h-44" onClick={() => handleFlip(i)}>
            <div className={`transform-style-3d relative w-full h-full transition-transform duration-500 ${flipped[i] ? 'rotate-y-180' : ''}`}>
              <div className="backface-hidden absolute inset-0 bg-white dark:bg-slate-800 rounded-xl p-4 flex flex-col items-center justify-center border border-slate-200 dark:border-slate-700 shadow-sm">
                <p className="font-serif font-bold text-center text-[#004030] dark:text-[#D8C3A5]">{terms[i].front}</p>
                <p className="text-xs text-slate-400 mt-2">{t.flip_prompt}</p>
              </div>
              <div className="backface-hidden rotate-y-180 absolute inset-0 bg-[#004030] dark:bg-slate-700 rounded-xl p-4 flex items-center justify-center overflow-y-auto">
                <p className="text-sm text-center text-[#D8C3A5] dark:text-slate-200 leading-relaxed">{terms[i].back}</p>
              </div>
            </div>
          </div>
        ))}
      </div>
      <div className="flex items-center gap-3 mt-4">
        <button onClick={() => { setGroupIdx(0); setFlipped({}); }} className="px-4 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">{t.flip_retry}</button>
        <button onClick={() => groupIdx < totalGroups-1 && setGroupIdx(groupIdx+1)} disabled={groupIdx >= totalGroups-1}
          className="px-4 py-2 text-sm bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.flip_next}</button>
      </div>
    </div>
  );
};

/* ================= ModuleQuiz ================= */
const ModuleQuiz = ({ questions, t, moduleId, onQuizSubmit }) => {
  const [selected, setSelected] = useState({});
  const [submitted, setSubmitted] = useState({});
  const [groupIdx, setGroupIdx] = useState(0);
  const groupSize = 2;
  const [quizIndices] = useState(() => [...Array(questions.length).keys()].sort(() => Math.random() - 0.5));
  const totalGroups = Math.ceil(quizIndices.length / groupSize);
  const [shuffledMaps] = useState(() => quizIndices.map(qi => [...Array(questions[qi].opts.length).keys()].sort(() => Math.random() - 0.5)));
  const computeCorrect = () => { let c = 0; quizIndices.forEach((qIdx, qi) => { if (selected[qi] !== undefined && shuffledMaps[qi][selected[qi]] === _d(questions[qIdx].ans)) c++; }); return c; };
  const statusText = t.quiz_status.replace('{correct}', computeCorrect()).replace('{answered}', Object.keys(selected).length).replace('{total}', quizIndices.length);
  const currentStart = groupIdx * groupSize;
  const currentIndices = quizIndices.slice(currentStart, currentStart + groupSize);
  const handleGroupSubmit = () => {
    if (!currentIndices.every((_, i) => selected[currentStart+i] !== undefined)) return;
    setSubmitted(s => ({...s, [groupIdx]: true}));
    if (groupIdx === totalGroups - 1 || Object.keys(submitted).length + 1 === totalGroups) {
      const wrong = []; let correct = 0;
      quizIndices.forEach((qIdx, qi) => {
        if (selected[qi] === undefined) return;
        if (shuffledMaps[qi][selected[qi]] === _d(questions[qIdx].ans)) correct++; else wrong.push(questions[qIdx].q);
      });
      onQuizSubmit(moduleId, correct, quizIndices.length, wrong);
    }
  };
  return (
    <div className="mt-8 bg-slate-50 dark:bg-slate-900/50 rounded-2xl p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="text-lg font-bold font-serif text-[#004030] dark:text-[#D8C3A5] mb-2">{t.quiz_title}</h3>
      <p className="text-sm text-slate-400 mb-6">{statusText}</p>
      {currentIndices.map((qIdx, localI) => {
        const qi = currentStart + localI, q = questions[qIdx], sMap = shuffledMaps[qi], isSub = !!submitted[groupIdx];
        return (
          <div key={qIdx} className="mb-6">
            <p className="font-bold mb-3">{qi+1}. {q.q}</p>
            <div className="space-y-2">
              {sMap.map((origIdx, dIdx) => {
                const isCorrect = origIdx === _d(q.ans), isSel = selected[qi] === dIdx;
                return (
                  <button key={dIdx} onClick={() => !isSub && setSelected(s => ({...s, [qi]: dIdx}))}
                    className={`w-full text-left px-4 py-3 rounded-lg border transition-all text-sm ${isSub
                      ? isCorrect ? 'bg-green-100 border-green-500 dark:bg-green-900/30'
                        : isSel ? 'bg-red-100 border-red-400 dark:bg-red-900/30' : 'border-slate-200 dark:border-slate-700'
                      : isSel ? 'border-[#004030] dark:border-[#D8C3A5] bg-[#004030]/5' : 'border-slate-200 dark:border-slate-700 hover:border-slate-400'}`}>
                    {q.opts[origIdx]}
                  </button>
                );
              })}
            </div>
            {isSub && (
              <p className={`mt-2 text-sm italic ${shuffledMaps[qi][selected[qi]] === _d(q.ans) ? 'text-green-600 dark:text-green-400' : 'text-red-500 dark:text-red-400'}`}>
                {shuffledMaps[qi][selected[qi]] === _d(q.ans) ? `✓ ${t.correct}` : `✗ ${t.incorrect}`} — {t.explanation}：{q.exp}
              </p>
            )}
          </div>
        );
      })}
      <div className="flex items-center gap-3 flex-wrap">
        {!submitted[groupIdx]
          ? <button onClick={handleGroupSubmit} disabled={!currentIndices.every((_,i) => selected[currentStart+i] !== undefined)}
              className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.submit}</button>
          : <>
              {groupIdx < totalGroups-1 && <button onClick={() => setGroupIdx(groupIdx+1)} className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg">{t.quiz_next}</button>}
              <button onClick={() => { setGroupIdx(0); setSelected({}); setSubmitted({}); }} className="px-6 py-2 border border-[#004030] dark:border-[#D8C3A5] text-[#004030] dark:text-[#D8C3A5] font-bold rounded-lg">{t.quiz_retry}</button>
            </>}
      </div>
    </div>
  );
};

/* ================= Labs ================= */
const num = (v, fb) => { const n = parseFloat(v); return isFinite(n) ? n : fb; };

/* 種子範例：只在「該格從未被學生編輯過」時作為顯示值使用，
   絕不寫進 state，因此語言切換會跟著換，而學生的輸入與 localStorage 還原的內容永遠不會被覆蓋。 */
const CP_SEED = [
  { code:'A', dur:'3', pred:'' },
  { code:'B', dur:'4', pred:'A' },
  { code:'C', dur:'2', pred:'A' },
  { code:'D', dur:'3', pred:'B,C' },
  { code:'E', dur:'3', pred:'D' },
  { code:'F', dur:'2', pred:'E' }
];
const CP_SEED_NAME = {
  zh: ['資料抓取原型','知識庫與抽取規則','內容與呈現版型','部署與排程','三日心跳觀測','簡報與驗收準備'],
  en: ['Fetch prototype','KB and extraction rules','Content and layout','Deploy and schedule','Three-day heartbeat watch','Pitch and acceptance prep']
};

/* 關鍵路徑：真正的往前推與往後推（Kahn 拓樸排序 + forward/backward pass） */
const cpCompute = (acts) => {
  const list = acts.filter(a => a.code && isFinite(a.dur) && a.dur > 0);
  if (list.length < 2) return { ok:false, few:true, cyclic:false, rows:[], total:0, path:[] };
  const byCode = {}; list.forEach(a => { byCode[a.code] = a; });
  const preds = {}; list.forEach(a => { preds[a.code] = a.preds.filter((p,i,arr) => p !== a.code && byCode[p] && arr.indexOf(p) === i); });
  const succ = {}; list.forEach(a => { succ[a.code] = []; });
  list.forEach(a => preds[a.code].forEach(p => succ[p].push(a.code)));
  const indeg = {}; list.forEach(a => { indeg[a.code] = preds[a.code].length; });
  const q = list.filter(a => indeg[a.code] === 0).map(a => a.code);
  const order = [];
  while (q.length) {
    const c = q.shift(); order.push(c);
    succ[c].forEach(s => { indeg[s] -= 1; if (indeg[s] === 0) q.push(s); });
  }
  if (order.length !== list.length) return { ok:false, few:false, cyclic:true, rows:[], total:0, path:[] };
  const ES = {}, EF = {};
  order.forEach(c => {
    const ps = preds[c];
    ES[c] = ps.length ? Math.max(...ps.map(p => EF[p])) : 0;
    EF[c] = ES[c] + byCode[c].dur;
  });
  const total = Math.max(...order.map(c => EF[c]));
  const LF = {}, LS = {};
  order.slice().reverse().forEach(c => {
    const ss = succ[c];
    LF[c] = ss.length ? Math.min(...ss.map(s => LS[s])) : total;
    LS[c] = LF[c] - byCode[c].dur;
  });
  const rows = order.map(c => ({
    code: c, name: byCode[c].name, dur: byCode[c].dur,
    es: ES[c], ef: EF[c], ls: LS[c], lf: LF[c], tf: Math.round((LS[c] - ES[c]) * 1000) / 1000
  }));
  const path = rows.filter(r => r.tf === 0).map(r => r.code);
  const sorted = rows.slice().sort((a,b) => a.code < b.code ? -1 : a.code > b.code ? 1 : 0);
  let maxFloat = null;
  rows.forEach(r => { if (!maxFloat || r.tf > maxFloat.tf) maxFloat = r; });
  return { ok:true, few:false, cyclic:false, rows: sorted, total, path, maxFloat };
};

const LabDday = ({ t, state, setState, onTouch, wpHours }) => {
  const v = state || {};
  const set = (k, val) => { setState({ ...v, [k]: val }); onTouch && onTouch(); };
  const seedNeed = (() => { const x = num(wpHours, NaN); return isFinite(x) && x > 0 ? String(x) : '40'; })();
  const weeksV = v.weeks === undefined ? '3' : v.weeks;
  const hoursV = v.hours === undefined ? '6' : v.hours;
  const membersV = v.members === undefined ? '6' : v.members;
  const needV = v.need === undefined ? seedNeed : v.need;
  const weeks = Math.max(0, num(weeksV, 0));
  const hours = Math.max(0, num(hoursV, 0));
  const members = Math.max(0, Math.round(num(membersV, 0)));
  const need = Math.max(0, num(needV, 0));
  const budget = weeks * hours * members;
  const diff = budget - need;
  const over = diff < 0;
  const tight = !over && budget > 0 && diff / budget < 0.05;
  const perWeek = (weeks > 0 && members > 0) ? Math.abs(diff) / (weeks * members) : 0;
  const fmt = (x) => (Math.round(x * 100) / 100).toString();
  const pct = budget > 0 ? Math.min(100, Math.round(need / budget * 100)) : 100;
  return (
    <div className="bg-white dark:bg-slate-800 rounded-xl p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-1">{t.lab4_title}</h3>

      <div className="grid grid-cols-2 gap-3">
        <div><label className="block text-xs font-bold text-slate-500 mb-1">{t.lab4_weeks}</label>

        <div><label className="block text-xs font-bold text-slate-500 mb-1">{t.lab4_hours}</label>
          <input type="number" min="0" step="0.5" className={inputCls} value={hoursV} onChange={e => set('hours', e.target.value)} /></div>
        <div><label className="block text-xs font-bold text-slate-500 mb-1">{t.lab4_members}</label>
          <input type="number" min="1" className={inputCls} value={membersV} onChange={e => set('members', e.target.value)} /></div>
        <div><label className="block text-xs font-bold text-slate-500 mb-1">{t.lab4_need}</label>
          <input type="number" min="0" className={inputCls} value={needV} onChange={e => set('need', e.target.value)} /></div>
      </div>
      <p className="text-xs text-slate-500 dark:text-slate-400 mt-2">{t.lab4_need_hint}</p>
      <div className="mt-4 p-4 rounded-lg bg-slate-50 dark:bg-slate-900/50 space-y-1.5 text-sm">
        <p>{t.lab4_budget}: <strong className="font-mono">{fmt(budget)}</strong> {t.lab4_unit}</p>
        <p>{t.lab4_need}: <strong className="font-mono">{fmt(need)}</strong> {t.lab4_unit}</p>
        <p>{over ? t.lab4_gap : t.lab4_surplus}: <strong className={`font-mono ${over ? 'text-red-500' : 'text-[#004030] dark:text-[#D8C3A5]'}`}>{fmt(Math.abs(diff))}</strong> {t.lab4_unit}</p>
        {over && <p>{t.lab4_perweek}: <strong className="font-mono text-red-500">{fmt(perWeek)}</strong> {t.lab4_unit}</p>}
      </div>
      <div className="mt-3 h-3 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
        <div className={`h-full transition-all ${over ? 'bg-red-500' : tight ? 'bg-amber-500' : 'bg-[#004030] dark:bg-[#D8C3A5]'}`} style={{width: pct + '%'}}></div>
      </div>
      <p className={`mt-3 p-3 rounded-lg text-sm leading-relaxed ${over
        ? 'bg-red-50 dark:bg-red-900/20 text-red-600 dark:text-red-300'
        : tight ? 'bg-amber-50 dark:bg-amber-900/20 text-amber-700 dark:text-amber-300'
        : 'bg-green-50 dark:bg-green-900/20 text-green-700 dark:text-green-300'}`}>{over ? t.lab4_over : tight ? t.lab4_tight : t.lab4_ok}</p>
      <div className="flex items-center gap-3 mt-3 flex-wrap">
        <button onClick={() => { setState({}); onTouch && onTouch(); }} className="px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg text-sm">{t.lab4_reset}</button>
      </div>
      <p className="text-xs text-slate-500 dark:text-slate-400 mt-3 leading-relaxed">{t.lab4_note}</p>
    </div>
  );
};

/* ================= App ================= */
function App() {
  const LS_ANS = 'PMCS_W13_answers';
  const LS_ANA = 'PMCS_W13_analytics';
  const LS_STU = 'PMCS_W13_student';
  const LS_LAB = 'PMCS_W13_lab';
  const loadLS = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } };

  const [lang, setLang] = useState('en');
  const [isDark, setIsDark] = useState(true);
  const [module, setModule] = useState(0);
  const [menuOpen, setMenuOpen] = useState(false);
  const [ttsState, setTtsState] = useState('idle');
  const [answers, setAnswers] = useState(() => loadLS(LS_ANS, {}));

  const [memberCount, setMemberCount] = useState(() => loadLS(LS_ANS + '_mc', DEFAULT_MEMBERS));
  const [sdl, setSdl] = useState(() => loadLS(LS_ANS + '_sdl', null));
  const [lab, setLab] = useState(() => loadLS(LS_LAB, {}));
  const [labNonce, setLabNonce] = useState(0);
  const [studentInfo, setStudentInfo] = useState(() => loadLS(LS_STU, { group:'', dept:'', id:'', nameEn:'', nameZh:'', compiler:'' }));
  const [analytics, setAnalytics] = useState(() => loadLS(LS_ANA, {
    time: Array(TOTAL).fill(0), clicks: Array(TOTAL).fill(0),
    quizCorrect: Array(TOTAL).fill(0), quizTotal: Array(TOTAL).fill(0),
    cardsRead: Array(TOTAL).fill(0), cardsTotal: Array(TOTAL).fill(0), wrongTopics: {}

  const menuRef = useRef(null);
  const ttsRun = useRef(0);
  const t = dict[lang];

  useEffect(() => { document.documentElement.classList.toggle('dark', isDark); }, [isDark]);
  useEffect(() => { try { localStorage.setItem(LS_ANS, JSON.stringify(answers)); } catch {} }, [answers]);
  useEffect(() => { try { localStorage.setItem(LS_ANS + '_focus', JSON.stringify(focus)); } catch {} }, [focus]);
  useEffect(() => { try { localStorage.setItem(LS_ANS + '_mc', JSON.stringify(memberCount)); } catch {} }, [memberCount]);
  useEffect(() => { try { sdl ? localStorage.setItem(LS_ANS + '_sdl', JSON.stringify(sdl)) : localStorage.removeItem(LS_ANS + '_sdl'); } catch {} }, [sdl]);
  useEffect(() => { try { localStorage.setItem(LS_LAB, JSON.stringify(lab)); } catch {} }, [lab]);
  useEffect(() => { try { localStorage.setItem(LS_ANA, JSON.stringify(analytics)); } catch {} }, [analytics]);
  useEffect(() => { try { localStorage.setItem(LS_STU, JSON.stringify(studentInfo)); } catch {} }, [studentInfo]);
  useEffect(() => {
    const id = setInterval(() => setAnalytics(a => { const ti = [...a.time]; ti[module] += 5; return {...a, time: ti}; }), 5000);
    return () => clearInterval(id);
  }, [module]);
  useEffect(() => {
    const onDoc = e => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false); };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, []);
  useEffect(() => { try { ttsRun.current += 1; speechSynthesis.cancel(); } catch (e) {} setTtsState('idle'); }, [module, lang]);

  const importSdl = (r) => {
    setSdl({ meta: r.meta, sections: r.sections });
    setStudentInfo(st => ({
      ...st,
      group: r.meta.group || st.group,
      id: (r.meta.student_id || st.id || '').replace(/[^0-9]/g, '').slice(0, 12),
      nameEn: /^[\x00-\x7F]+$/.test(r.meta.student || '') ? (r.meta.student || st.nameEn) : st.nameEn,
      nameZh: /^[\x00-\x7F]+$/.test(r.meta.student || '') ? st.nameZh : (r.meta.student || st.nameZh)
    }));
    if (r.meta.group) setA('g_group', r.meta.group);
    if (r.meta.date) setA('g_date', r.meta.date);
  };
  const sdlFileName = () => {
    if (!sdl) return '';
    const m = sdl.meta;
    const who = m.student || 'NA';
    return `${m.course || 'PMCS'}_${m.semester || SEMESTER_DEFAULT}${m.week || WEEK_CODE}_${(m.topic || TOPIC_CAMEL).replace(/\s+/g,'')}_${m.group || 'NA'}-${who}_${(m.date || '').replace(/-/g,'')}.md`;
  };
  const bump = () => setAnalytics(a => { const c = [...a.clicks]; c[module] += 1; return {...a, clicks: c}; });
  const setA = (id, val) => setAnswers(s => ({...s, [id]: val}));
  const setLabPart = (k) => (val) => setLab(s => ({...s, [k]: val}));
  const handleQuizSubmit = (mid, correct, total, wrong) => setAnalytics(a => {
    const qc = [...a.quizCorrect], qt = [...a.quizTotal];
    qc[mid] = correct; qt[mid] = total;
    return {...a, quizCorrect: qc, quizTotal: qt, wrongTopics: {...a.wrongTopics, [mid]: wrong || []}};
  });
  const handleCardRead = (mid, r, s, tot) => setAnalytics(a => {
    const cr = [...a.cardsRead], ct = [...a.cardsTotal]; cr[mid] = r; ct[mid] = tot;
    return {...a, cardsRead: cr, cardsTotal: ct};
  });

  const filled = id => { const v = answers[id]; return v !== undefined && String(v).trim() !== ''; };
  const sectionPct = n => { const c = CORE[n]; return c && c.length ? Math.round(c.filter(filled).length / c.length * 100) : 100; };
  const pctPersonal = Math.round(PERSONAL_SECTIONS.reduce((s,n) => s + sectionPct(n), 0) / PERSONAL_SECTIONS.length);
  const pctGroup = Math.round(GROUP_SECTIONS.reduce((s,n) => s + sectionPct(n), 0) / GROUP_SECTIONS.length);
  const optName = (list, v) => { const o = (list || []).find(x => x.v === v); return o ? o.name : (v || ''); };
  const actName = (id, d) => { const s = (d || t).activities.find(x => x.id === id); return s ? s.name : id; };

  const modulesList = [
    { id:0, num:'0', icon:'📋', title:t.m0_nav, kind:null },
    { id:1, num:'1', icon:'👥', title:t.m1_nav, kind:'G' },
    { id:2, num:'2', icon:'🔺', title:t.m2_nav, kind:'P' },
    { id:3, num:'3', icon:'🧱', title:t.m3_nav, kind:'P' },
    { id:4, num:'4', icon:'🗣️', title:t.m4_nav, kind:'P' },
    { id:5, num:'5', icon:'🔍', title:t.m5_nav, kind:'G' },
    { id:6, num:'6', icon:'🗺️', title:t.m6_nav, kind:'G' },
    { id:7, num:'7', icon:'🎤', title:t.m7_nav, kind:'G' },
    { id:IDX_LAB, num:String(IDX_LAB), icon:'⚡', title:t.mlab_nav, kind:null },
    { id:IDX_RES, num:String(IDX_RES), icon:'🌐', title:t.mres_nav, kind:null },
    { id:IDX_ANA, num:String(IDX_ANA), icon:'📊', title:t.analytics_title, kind:null }
  ];
  const go = m => { setModule(m); setMenuOpen(false); window.scrollTo({top:0,behavior:'smooth'}); };

  /* ---------- TTS ---------- */
  const handleTTS = (action) => {
    if (!('speechSynthesis' in window)) return;
    if (action === 'stop') { ttsRun.current += 1; speechSynthesis.cancel(); setTtsState('idle'); return; }
    if (action === 'pause') { speechSynthesis.pause(); setTtsState('paused'); return; }
    if (ttsState === 'paused') { speechSynthesis.resume(); setTtsState('playing'); return; }
    speechSynthesis.cancel();
    const sep = lang === 'zh' ? '。 ' : '. ';
    let texts = [];
    if (module === 0) {
      texts = [t.m0_title, t.m0_intro, t.m0_why, t.m0_why_desc, ...t.m0_stats.map(s => `${s.label}: ${s.val}`), ...t.m0_modules.map(m => `${m.title}. ${m.desc}`)];
    } else if (module >= 1 && module <= NUM_LEARN) {
      const k = `m${module}`;
      texts = [t[`${k}_title`], t[`${k}_overview`], ...(t[`${k}_highlights`]||[]), t[`${k}_deep`], t[`${k}_wrapup`]];
      if (module === 2) texts.push(...t.tri_sides.map(f => `${f.name}. ${f.sub}`), `${t.tri_area.name}. ${t.tri_area.sub}`, t.tri_note, ...t.m2_terms.flatMap(x => [x.front, x.back]));
    } else if (module === IDX_LAB) {
      texts = [t.mlab_title, t.mlab_desc, t.lab1_title, t.lab1_desc, t.lab2_title, t.lab2_desc, t.lab3_title, t.lab3_desc, t.lab4_title, t.lab4_desc, t.lab5_title, t.lab5_desc];
    } else if (module === IDX_RES) {
      texts = [t.mres_title, t.mres_desc, ...t.res_req.map(r => `${r.label}. ${r.desc}`), ...t.res_opt.map(r => `${r.label}. ${r.desc}`)];
    } else {
      texts = [t.analytics_title, t.analytics_desc, `${t.analytics_pct_personal}: ${pctPersonal}%`, `${t.analytics_pct_group}: ${pctGroup}%`];
      const weak = [1,2,3,4,5,6,7].filter(n => sectionPct(n) < 100);
      if (weak.length) { texts.push(t.analytics_wp_tts_intro); weak.forEach(n => texts.push(t.analytics_wp_tts_module.replace('{name}', t[`m${n}_nav`]).replace('{acc}', sectionPct(n)))); }
      else texts.push(t.analytics_wp_tts_allpass);
    }
    texts = texts.filter(Boolean);
    const voices = speechSynthesis.getVoices();
    let voice = null, code = 'en-GB';
    if (lang === 'zh') {
      voice = voices.find(v=>v.lang==='zh-TW'&&v.name.includes('Yating')) || voices.find(v=>v.lang==='zh-TW') || voices.find(v=>v.lang.startsWith('zh')) || null;
      code = 'zh-TW';
    } else {
      voice = voices.find(v=>v.lang==='en-GB'&&(v.name.includes('Male')||v.name.includes('Daniel'))) || voices.find(v=>v.lang==='en-GB') || voices.find(v=>v.lang.startsWith('en')) || null;
      code = 'en-GB';
    }

    /* Chrome 對單一長 utterance 會靜默失敗（網路語音尤其明顯），因此切成短句依序播放 */
    const CHUNK = lang === 'zh' ? 140 : 190;
    const full = texts.join(sep);
    const sentences = (() => {
      const out = []; let cur = '';
      for (let i = 0; i < full.length; i++) {
        cur += full[i];
        const c = full[i];
        if ('。！？；!?;'.indexOf(c) >= 0 || (c === '.' && /\s|$/.test(full[i + 1] || ''))) { out.push(cur); cur = ''; }
      }
      if (cur.trim()) out.push(cur);
      return out;
    })();
    const packed = []; let acc = '';
    sentences.forEach(sent0 => {
      let sent = sent0;
      while (sent.length > CHUNK) {
        let cut = sent.lastIndexOf(' ', CHUNK);
        if (cut < CHUNK * 0.5) cut = CHUNK;
        if (acc) { packed.push(acc); acc = ''; }
        packed.push(sent.slice(0, cut));
        sent = sent.slice(cut);
      }
      if ((acc + sent).length > CHUNK) { if (acc) packed.push(acc); acc = sent; }
      else acc += sent;
    });
    if (acc.trim()) packed.push(acc);

    ttsRun.current += 1;
    const myRun = ttsRun.current;
    let qi = 0;
    const speakNext = () => {
      if (myRun !== ttsRun.current) return;
      if (qi >= packed.length) { setTtsState('idle'); return; }
      const u = new SpeechSynthesisUtterance(packed[qi++]);
      u.rate = 0.95;
      if (voice) u.voice = voice;
      u.lang = code;
      u.onend = speakNext;
      u.onerror = () => { if (myRun === ttsRun.current) speakNext(); };
      speechSynthesis.speak(u);
    };
    setTtsState('playing');
    setTimeout(speakNext, 60);
  };

  /* ---------- Export ---------- */
  const dstamp = () => { const d = new Date(), p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`; };

    L.push('');
    L.push('## 2. 三重限制自我定位');

    L.push(`- 另一邊已付出的代價（二）：${answers.tc_give2 || '_(未填)_'}`);
    L.push(`- 品質（三角形面積）縮在哪裡：${answers.tc_quality || '_(未填)_'}`);
    L.push('');
    L.push('## 3. 個人負責範圍的工作包拆解');
    L.push(`- 我負責的第二層：${answers.wp_scope || '_(未填)_'}`);
    L.push('**第三層工作包清單**：');
    L.push('```');
    L.push(answers.wp_list || '(未填)');
    L.push('```');
    L.push('');
    L.push(`- 工作包三檢查逐項結果：${answers.wp_check || '_(未填)_'}`);
    L.push(`- 沒通過的還缺什麼：${answers.wp_gap || '_(未填)_'}`);
    L.push(`- 工時估計總和（小時）：${answers.wp_hours || '_(未填)_'}`);
    L.push('');
    L.push('## 4. 語言實驗室');
    L.push('| 詞彙 | 自己的話 | 例句 |'); L.push('|---|---|---|');
    [0,1,2,3,4].forEach(i => { if (filled(`t_term_${i}`)) L.push(`| ${answers[`t_term_${i}`]||''} | ${answers[`t_mean_${i}`]||''} | ${answers[`t_sent_${i}`]||''} |`); });
    L.push('');
    L.push('| 難發音 | 難在哪 | 記憶方法 |'); L.push('|---|---|---|');
    [0,1,2].forEach(i => { if (filled(`p_word_${i}`)) L.push(`| ${answers[`p_word_${i}`]||''} | ${answers[`p_hard_${i}`]||''} | ${answers[`p_tip_${i}`]||''} |`); });
    L.push(''); L.push('---');
    L.push('_本檔為個人學習歷程檔案，不繳交。可直接放進 repo 的 docs／資料夾當作本週歷程紀錄。_');
    const who = (sanitizeName(studentInfo.nameEn).replace(/\s+/g,'') || studentInfo.id || 'me').replace(/[^\w-]/g,'') || 'me';

  };

  const groupRows = () => {

    rows.push(['Info','Compiler', studentInfo.compiler]);

    rows.push(['S5','ComparedActivities', ACT_IDS.filter(k => focus[k]).join(' ')]);
    /* --- 自我描述欄位：讓教師端彙整台無需內建設定即可正確顯示本週的檢查點措辭 --- */
    rows.push(['Meta','WeekTitleZH', dict.zh.subtitle]);
    rows.push(['Meta','WeekTitleEN', dict.en.subtitle]);
    rows.push(['Meta','CompareKey', 'ComparedActivities']);
    rows.push(['Meta','CompareN', '3']);
    rows.push(['Meta','S6Fields', "[{\"id\": \"tp_wbs_top\", \"zh\": \"第一層工作分解（三到五項）\", \"en\": \"First-layer work breakdown, three to five items\"}, {\"id\": \"tp_cp_path\", \"zh\": \"關鍵路徑（活動代號串）\", \"en\": \"Critical path as a chain of activity codes\"}, {\"id\": \"tp_cp_days\", \"zh\": \"關鍵路徑總工期（天）\", \"en\": \"Total duration of the critical path in days\"}, {\"id\": \"tp_cp_weak\", \"zh\": \"關鍵路徑上最脆弱的一段\", \"en\": \"The weakest link on the critical path\"}, {\"id\": \"tp_float\", \"zh\": \"浮時最多的一段，以及打算把人力調去哪裡\", \"en\": \"The segment with the most float and where people will be moved\"}]"]);
    rows.push(['Meta','Categorical', 'tp_cp_weak']);

    rows.push(['Meta','CategoricalEN', 'Weakest link on the critical path by group']);

    const qc = analytics.quizCorrect.reduce((a,b)=>a+b,0), qt = analytics.quizTotal.reduce((a,b)=>a+b,0);
    rows.push(['Meta','SelfCheck', `${qc}/${qt}`]);
    return rows;
  };
  const exportGroupCSV = () => {
    if (!okGroup) return;
    const esc = v => `"${String(v).replace(/"/g,'""')}"`;
    const csv = '﻿' + groupRows().map(r => r.map(esc).join(',')).join('\r\n');
    download(csv, `PMCS_${(sdl && sdl.meta.semester) || SEMESTER_DEFAULT}${WEEK_CODE}_${TOPIC_CAMEL}_${studentInfo.group}-ALL_${dstamp()}.csv`, 'text/csv;charset=utf-8;');
  };
  const exportGroupMD = () => {
    if (!okGroup) return;
    const L = [];

        )}
        <div className="mb-5">
          <label className="block text-sm font-bold text-[#004030] dark:text-[#D8C3A5] mb-1">{t.m6_weak_label}</label>
          <p className="text-xs text-slate-500 dark:text-slate-400 mb-2 leading-relaxed">{t.m6_weak_hint}</p>
          <select className={inputCls} value={wv} onChange={e => setA('tp_cp_weak', e.target.value)}>
            <option value="">{t.select_ph}</option>{t.weak_opts.map(o => <option key={o.v} value={o.v}>{o.name}</option>)}
          </select>
          <p className="mt-2 text-xs font-bold text-[#004030] dark:text-[#D8C3A5]">{t.m6_weak_note}</p>
        </div>
        <Field id="tp_cp_weak_why" label={t.m6_weak_why_label} hint={t.m6_weak_why_hint} rows={3} value={answers.tp_cp_weak_why} onChange={setA} />
        <Field id="tp_float" label={t.m6_float_label} hint={t.m6_float_hint} ph={t.m6_float_ph} rows={4} value={answers.tp_float} onChange={setA} />
        <Wrapup t={t} text={t.m6_wrapup} />
      </>
    );
  };

  const renderM7 = () => (
    <>
      <Overview t={t} text={t.m7_overview} /><Highlights t={t} items={t.m7_highlights} /><DeepDive t={t} text={t.m7_deep} /><SavedHint />
      <Field id="pr_open" label={t.m7_open_label} ph={t.m7_open_ph} rows={2} value={answers.pr_open} onChange={setA} />
      <div>
        <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 mb-3">{t.m7_script_label}</h3>
        <div className="space-y-3">
          {MEMBER_IDX.slice(0, memberCount).map(i => (
            <div key={i} className="grid grid-cols-1 md:grid-cols-4 gap-2">
              <div className="md:col-span-1 flex items-center px-3 py-2 rounded-lg bg-slate-100 dark:bg-slate-800 text-sm text-slate-600 dark:text-slate-300 truncate">
                {answers[`m_name_${i}`] || `${t.m7_col_who} ${i+1}`}
              </div>
              <input className={`${inputCls} md:col-span-3`} placeholder={t.m7_col_point} value={answers[`pr_point_${i}`]||''} onChange={e => setA(`pr_point_${i}`, sanitizeText(e.target.value))} />
            </div>
          ))}
        </div>
      </div>
      <div className="mt-5"><Field id="pr_question" label={t.m7_question_label} ph={t.m7_question_ph} rows={3} value={answers.pr_question} onChange={setA} /></div>
      <Wrapup t={t} text={t.m7_wrapup} />
    </>
  );

  const renderLab = () => (
    <>
      <p className="text-base text-slate-600 dark:text-slate-300">{t.mlab_desc}</p>
      <div className="flex items-center gap-3 flex-wrap">
        <button onClick={clearLab} className="px-4 py-2 border border-red-400 text-red-600 dark:text-red-400 font-bold rounded-lg text-sm hover:bg-red-50 dark:hover:bg-red-900/20">{t.mlab_clear}</button>
        <span className="text-xs text-slate-400">💾 {t.analytics_wp_saved}</span>
      </div>
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5 mt-4">
        <LabTriple key={`lab1-${labNonce}`} t={t} state={lab.l1} setState={setLabPart('l1')} onTouch={bump} />
        <LabWpChecks key={`lab2-${labNonce}`} t={t} state={lab.l2} setState={setLabPart('l2')} onTouch={bump} />
        <LabCriticalPath key={`lab3-${labNonce}`} t={t} lang={lang} state={lab.l3} setState={setLabPart('l3')} onTouch={bump} />
        <LabDday key={`lab4-${labNonce}`} t={t} state={lab.l4} setState={setLabPart('l4')} onTouch={bump} wpHours={answers.wp_hours} />
      </div>
      <div className="mt-6 bg-white dark:bg-slate-800 rounded-xl p-6 border border-slate-200 dark:border-slate-700">
        <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-1">{t.lab5_title}</h3>
        <p className="text-sm text-slate-500 dark:text-slate-400">{t.lab5_desc}</p>
        <ModuleQuiz key={`quiz-lab-${lang}`} questions={t.m2_q} t={t} moduleId={IDX_LAB} onQuizSubmit={handleQuizSubmit} />
      </div>
    </>
  );

  const renderRes = () => (
    <>
      <p className="text-base text-slate-600 dark:text-slate-300">{t.mres_desc}</p>
      <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 mt-6 mb-3">{t.required_label}</h3>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">{t.res_req.map((r,i) => <LinkCard key={i} {...r} />)}</div>
      <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 mt-8 mb-3">{t.optional_label}</h3>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">{t.res_opt.map((r,i) => <LinkCard key={i} {...r} />)}</div>
    </>
  );

  const renderAna = () => {
    const totalTime = analytics.time.reduce((a,b)=>a+b,0);
    const qc = analytics.quizCorrect.reduce((a,b)=>a+b,0), qt = analytics.quizTotal.reduce((a,b)=>a+b,0);
    const weak = [1,2,3,4,5,6,7].filter(n => sectionPct(n) < 100);
    const stats = [
      { val: pctPersonal + '%', label: t.analytics_pct_personal },
      { val: pctGroup + '%', label: t.analytics_pct_group },
      { val: totalTime + t.analytics_sec, label: t.analytics_total_time },
      { val: qt > 0 ? Math.round(qc/qt*100) + '%' : '—', label: t.analytics_overall_acc }
    ];
    const setInfo = (k, v) => setStudentInfo(s => ({ ...s, [k]: v }));
    return (
      <>
        <p className="text-base text-slate-600 dark:text-slate-300">{t.analytics_desc}</p>
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mt-5">
          {stats.map((s,i) => (
            <div key={i} className="bg-white dark:bg-slate-800 rounded-xl p-4 border border-slate-200 dark:border-slate-700 text-center">
              <p className="font-serif font-black text-2xl text-[#004030] dark:text-[#D8C3A5]">{s.val}</p>
              <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">{s.label}</p>
            </div>
          ))}
        </div>

        <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 mt-8 mb-3">{t.analytics_progress_title}</h3>
        <div className="space-y-2">
          {[1,2,3,4,5,6,7].map(n => {
            const pct = sectionPct(n), kind = modulesList[n].kind;
            return (
              <button key={n} onClick={() => go(n)} className="w-full flex items-center gap-3 text-left p-3 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-[#004030] dark:hover:border-[#D8C3A5] transition">
                <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded shrink-0 ${kind === 'P' ? 'bg-sky-100 text-sky-800 dark:bg-sky-900/40 dark:text-sky-200' : 'bg-[#D8C3A5]/30 text-[#004030] dark:bg-[#D8C3A5]/20 dark:text-[#D8C3A5]'}`}>{kind}</span>
                <span className="text-sm w-36 sm:w-52 truncate shrink-0">{t[`m${n}_nav`]}</span>
                <span className="flex-1 h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
                  <span className={`block h-full ${pct === 100 ? 'bg-green-500' : 'bg-[#004030] dark:bg-[#D8C3A5]'}`} style={{width: pct + '%'}}></span>
                </span>
                <span className="text-sm font-bold w-12 text-right shrink-0">{pct}%</span>
              </button>
            );
          })}
        </div>

        <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 mt-8 mb-3">{t.analytics_wp_title}</h3>
        {weak.length === 0
          ? <p className="p-4 rounded-lg bg-green-50 dark:bg-green-900/20 text-green-700 dark:text-green-300 text-sm">{t.analytics_wp_allpass}</p>
          : <div className="space-y-4">
              <div className="space-y-2">
                <p className="text-xs font-bold text-sky-700 dark:text-sky-300">{t.analytics_wp_personal_head}</p>
                {PERSONAL_SECTIONS.filter(n => sectionPct(n) < 100).length === 0
                  ? <p className="text-sm text-green-600 dark:text-green-400 pl-1">{t.analytics_wp_personal_done}</p>
                  : PERSONAL_SECTIONS.filter(n => sectionPct(n) < 100).map(n => (
                      <div key={n} className="p-3 rounded-lg bg-sky-50 dark:bg-sky-900/20 border border-sky-200 dark:border-sky-800/50 flex items-center justify-between gap-3">
                        <span className="text-sm">{t[`m${n}_nav`]} — {sectionPct(n)}%</span>
                        <button onClick={() => go(n)} className="text-xs font-bold text-sky-700 dark:text-sky-300 hover:underline shrink-0">{t.analytics_wp_goto}</button>
                      </div>))}
              </div>
              <div className="space-y-2">
                <p className="text-xs font-bold text-[#004030] dark:text-[#D8C3A5]">{t.analytics_wp_group_head}</p>
                <p className="text-xs text-slate-500 dark:text-slate-400 pl-1">{t.analytics_wp_group_note}</p>
                {GROUP_SECTIONS.filter(n => sectionPct(n) < 100).length === 0
                  ? <p className="text-sm text-green-600 dark:text-green-400 pl-1">{t.analytics_wp_group_done}</p>
                  : GROUP_SECTIONS.filter(n => sectionPct(n) < 100).map(n => (
                      <div key={n} className="p-3 rounded-lg bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800/50 flex items-center justify-between gap-3">
                        <span className="text-sm">{t[`m${n}_nav`]} — {sectionPct(n)}%</span>
                        <button onClick={() => go(n)} className="text-xs font-bold text-[#004030] dark:text-[#D8C3A5] hover:underline shrink-0">{t.analytics_wp_goto}</button>
                      </div>))}
              </div>
            </div>}

        <div className="mt-8 rounded-xl border-2 border-sky-200 dark:border-sky-800/60 bg-sky-50/50 dark:bg-sky-900/10 p-5">
          <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5]">{t.analytics_personal_title}</h3>
          <p className="text-sm text-slate-500 dark:text-slate-400 mt-1 mb-4">{t.analytics_personal_desc}</p>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
            <InfoInput id="nameEn" label={t.analytics_name_en} ph={t.analytics_name_en_ph} value={studentInfo.nameEn} onChange={setInfo} />
            <InfoInput id="nameZh" label={t.analytics_name_zh} ph={t.analytics_name_zh_ph} value={studentInfo.nameZh} onChange={setInfo} />
            <InfoInput id="id" label={t.analytics_id} ph={t.analytics_id_ph} value={studentInfo.id} onChange={setInfo} san={sanitizeStudentId} />
            <InfoInput id="dept" label={t.analytics_dept} ph={t.analytics_dept_ph} value={studentInfo.dept} onChange={setInfo} />
          </div>
          <button onClick={exportPersonal} disabled={!okPersonal}
            className="mt-4 px-5 py-2.5 bg-sky-700 dark:bg-sky-300 text-white dark:text-sky-950 font-bold rounded-lg disabled:opacity-40">{t.analytics_export_personal}</button>
          {!okPersonal && <p className="text-xs text-amber-600 dark:text-amber-400 mt-2">{t.analytics_need_personal}</p>}
        </div>

        <div className="mt-5 rounded-xl border-2 border-[#D8C3A5] dark:border-[#D8C3A5]/50 bg-[#D8C3A5]/10 p-5">
          <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5]">{t.analytics_group_title}</h3>
          <p className="text-sm text-slate-500 dark:text-slate-400 mt-1 mb-4">{t.analytics_group_desc}</p>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div><label className="block text-xs font-bold text-slate-500 mb-1">{t.analytics_group}</label>
              <select className={inputCls} value={studentInfo.group} onChange={e => setStudentInfo(s => ({...s, group: e.target.value}))}>
                <option value="">{t.select_ph}</option>{t.group_options.map(g => <option key={g} value={g}>{g}</option>)}
              </select></div>
            <InfoInput id="compiler" label={t.analytics_compiler} ph={t.analytics_compiler_ph} value={studentInfo.compiler} onChange={setInfo} />
          </div>
          <div className="flex flex-wrap gap-3 mt-4">
            <button onClick={exportGroupCSV} disabled={!okGroup} className="px-5 py-2.5 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.analytics_export_csv}</button>
            <button onClick={exportGroupMD} disabled={!okGroup} className="px-5 py-2.5 border-2 border-[#004030] dark:border-[#D8C3A5] text-[#004030] dark:text-[#D8C3A5] font-bold rounded-lg disabled:opacity-40">{t.analytics_export_md}</button>
          </div>
          {!okGroup && <p className="text-xs text-amber-600 dark:text-amber-400 mt-2">{t.analytics_need_group}</p>}
        </div>

        <div className="mt-6 flex items-center gap-3 flex-wrap">
          <button onClick={clearAll} className="px-5 py-2.5 border border-red-400 text-red-600 dark:text-red-400 font-bold rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20">{t.analytics_wp_clear}</button>
          <span className="text-xs text-slate-400">💾 {t.analytics_wp_saved}</span>
        </div>
      </>
    );
  };

  const body = () => {
    if (module === 0) return renderM0();
    if (module === 1) return renderM1();
    if (module === 2) return renderM2();
    if (module === 3) return renderM3();
    if (module === 4) return renderM4();
    if (module === 5) return renderM5();
    if (module === 6) return renderM6();
    if (module === 7) return renderM7();
    if (module === IDX_LAB) return renderLab();
    if (module === IDX_RES) return renderRes();
    return renderAna();
  };
  const cur = modulesList[module];

  return (
    <div className="min-h-screen flex flex-col pt-16 overflow-x-hidden">
      <header className="fixed top-0 left-0 right-0 h-16 bg-[#004030] dark:bg-slate-900 text-white z-50 shadow-lg border-b border-[#D8C3A5]/30">
        <div className="max-w-7xl mx-auto px-3 sm:px-4 h-16 flex items-center justify-between">
          <div className="flex items-center gap-1 sm:gap-2 min-w-0">
            <div className="relative" ref={menuRef}>
              <button onClick={() => setMenuOpen(!menuOpen)} className="p-2 hover:bg-white/10 rounded-lg" aria-label={t.nav_modules}>{menuOpen ? <IconX/> : <IconMenu/>}</button>
              {menuOpen && (
                <div className="absolute top-full left-0 mt-1 w-72 max-w-[calc(100vw-2rem)] max-h-[calc(100vh-5rem)] overflow-y-auto bg-white dark:bg-slate-800 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 z-[100]">
                  {modulesList.map(m => (
                    <button key={m.id} onClick={() => go(m.id)}
                      className={`w-full flex items-center gap-3 px-4 py-3 text-sm transition ${module === m.id ? 'bg-[#004030]/10 dark:bg-[#D8C3A5]/10 text-[#004030] dark:text-[#D8C3A5] font-bold' : 'text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700'}`}>
                      <span className="ui-decoration">{m.icon}</span><span className="truncate flex-1 text-left">{m.title}</span>
                      {m.kind && <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded shrink-0 ${m.kind === 'P' ? 'bg-sky-100 text-sky-800 dark:bg-sky-900/40 dark:text-sky-200' : 'bg-[#D8C3A5]/40 text-[#004030] dark:bg-[#D8C3A5]/20 dark:text-[#D8C3A5]'}`}>{m.kind}</span>}
                    </button>
                  ))}
                </div>
              )}
            </div>
            <button onClick={() => go(0)} className="p-2 hover:bg-white/10 rounded-lg" aria-label={t.nav_home}><IconHome size={18}/></button>
            <button onClick={() => window.scrollTo({top:0,behavior:'smooth'})} className="flex items-center gap-2 min-w-0">
              <span className="font-serif font-black text-[#D8C3A5] text-lg tracking-widest">{t.brand}</span>
              <span className="hidden sm:inline font-serif font-bold text-sm md:text-base truncate">{t.title}</span>
            </button>
          </div>
          <div className="flex items-center gap-1 sm:gap-2">
            <button onClick={() => handleTTS(ttsState === 'playing' ? 'pause' : 'play')} className="p-2 hover:bg-white/10 rounded-lg" aria-label={t.audio_read}>{ttsState === 'playing' ? <IconPause size={18}/> : <IconPlay size={18}/>}</button>
            <button onClick={() => handleTTS('stop')} className="p-2 hover:bg-white/10 rounded-lg" aria-label="Stop"><IconSquare size={18}/></button>
            <button onClick={() => setLang(lang === 'en' ? 'zh' : 'en')} className="px-2 py-2 hover:bg-white/10 rounded-lg flex items-center gap-1"><IconGlobe size={18}/><span className="text-xs font-bold">{lang === 'en' ? '中' : 'EN'}</span></button>
            <button onClick={() => setIsDark(!isDark)} className="p-2 hover:bg-white/10 rounded-lg" aria-label="Theme">{isDark ? <IconSun size={18}/> : <IconMoon size={18}/>}</button>
          </div>
        </div>
      </header>

      <div className="flex-1 w-full max-w-7xl mx-auto flex">
        <aside className="hidden md:block w-64 shrink-0 border-r border-slate-200 dark:border-slate-700 py-8 px-3">
          <p className="text-xs font-bold uppercase tracking-wider text-slate-400 px-3 mb-3">{t.nav_modules}</p>
          {modulesList.map(m => (
            <button key={m.id} onClick={() => go(m.id)}
              className={`w-full flex items-center gap-2 px-3 py-2.5 rounded-lg text-sm mb-1 transition ${module === m.id ? 'bg-[#004030]/10 dark:bg-[#D8C3A5]/10 text-[#004030] dark:text-[#D8C3A5] font-bold' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}`}>
              <span className="ui-decoration shrink-0">{m.icon}</span>
              <span className="truncate text-left flex-1">{m.title}</span>
              {m.kind && <span className={`text-[10px] font-bold px-1 rounded shrink-0 ${m.kind === 'P' ? 'text-sky-700 dark:text-sky-300' : 'text-[#004030] dark:text-[#D8C3A5]'}`}>{m.kind}</span>}
            </button>
          ))}
          <div className="mt-6 px-3 space-y-3">
            <div>
              <p className="text-xs text-slate-400 mb-1">{t.analytics_pct_personal}</p>
              <div className="h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden"><div className={`h-full ${pctPersonal === 100 ? 'bg-green-500' : 'bg-sky-600 dark:bg-sky-400'}`} style={{width: pctPersonal + '%'}}></div></div>
              <p className="text-xs font-bold text-sky-700 dark:text-sky-300 mt-1">{pctPersonal}%</p>
            </div>
            <div>
              <p className="text-xs text-slate-400 mb-1">{t.analytics_pct_group}</p>
              <div className="h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden"><div className={`h-full ${pctGroup === 100 ? 'bg-green-500' : 'bg-[#004030] dark:bg-[#D8C3A5]'}`} style={{width: pctGroup + '%'}}></div></div>
              <p className="text-xs font-bold text-[#004030] dark:text-[#D8C3A5] mt-1">{pctGroup}%</p>
            </div>
          </div>
        </aside>

        <main className="flex-1 min-w-0 py-8 px-4 sm:px-6">
          <div key={`${module}-${lang}`} className="space-y-6 text-lg leading-relaxed text-slate-700 dark:text-slate-300 animate-fade-in">
            {module !== 0 && (
              <div>
                <H2 icon={cur.icon} number={cur.num}>{module <= NUM_LEARN ? t[`m${module}_title`] : module === IDX_LAB ? t.mlab_title : module === IDX_RES ? t.mres_title : t.analytics_title}</H2>
                {cur.kind && <Badge kind={cur.kind} t={t} />}
              </div>
            )}
            {body()}
            <div className="mt-12 flex justify-between items-center pt-8 border-t border-slate-300 dark:border-slate-700 no-print">
              <button onClick={() => go(Math.max(0, module-1))} disabled={module === 0}
                className="px-5 py-2.5 border border-slate-300 dark:border-slate-600 rounded-lg text-sm font-bold hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-0">← {t.nav_prev}</button>
              <button onClick={() => go(Math.min(TOTAL-1, module+1))} disabled={module === TOTAL-1}
                className="px-5 py-2.5 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] rounded-lg text-sm font-bold disabled:opacity-0">{t.nav_next} →</button>
            </div>
          </div>
        </main>
      </div>

      <footer className="h-8 bg-[#004030] flex items-center justify-between px-4 shrink-0">
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs truncate">{t.date} · {t.copyright}</span>
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs flex items-center gap-3 shrink-0">
          <span className="hidden sm:inline">{t.architect_label}&nbsp;<a href={t.architect_url} target="_blank" rel="noopener noreferrer" className="text-[#D8C3A5] hover:text-white underline">Prof. Shihmin Lo</a></span>
          <button onClick={() => window.scrollTo({top:0,behavior:'smooth'})} className="text-[#D8C3A5] hover:text-white font-bold">Top ↑</button>
        </span>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
