const checkTrigger = (raw, lang) => {
  const text = String(raw || '').trim();
  const L = lang === 'zh' ? 'zh' : 'en';
  if (!text) return { state: 'empty', issues: [], hasNum: false, hasState: false };
  const low = text.toLowerCase();
  const issues = [];
  const seen = {};
  TRIG_VAGUE[L].forEach(v => {
    const hit = L === 'zh' ? text.indexOf(v.k) >= 0 : low.indexOf(v.k) >= 0;
    if (hit && !seen[v.why]) { seen[v.why] = 1; issues.push({ kind: 'vague', k: v.k, why: v.why }); }
  });
  TRIG_LATE[L].forEach(v => {
    const hit = L === 'zh' ? text.indexOf(v.k) >= 0 : low.indexOf(v.k) >= 0;
    if (hit && !seen[v.why]) { seen[v.why] = 1; issues.push({ kind: 'late', k: v.k, why: v.why }); }
  });
  const hasNum = TRIG_NUM[L].some(re => re.test(low));
  const hasState = TRIG_STATE[L].some(re => re.test(low));
  const tooShort = text.replace(/\s/g, '').length < (L === 'zh' ? 6 : 12);
  if (tooShort) issues.push({ kind: 'short', k: '', why: L === 'zh'
    ? '這句太短，看不出被觀察的對象是什麼。至少要寫出「觀察什麼」與「到什麼程度」兩件事。'
    : 'Too short to name both what is watched and how far it has to move.' });
  if (!hasNum && !hasState) issues.push({ kind: 'nonum', k: '', why: L === 'zh'
    ? '整句裡沒有任何數字，也沒有「連續／達到／低於／超過／未更新」這一類明確狀態，所以沒有人判得出來它成立了沒有。'
    : 'There is no number anywhere, and no explicit state such as reaches, falls below, exceeds or not updated, so nobody can decide whether it has fired.' });
  const softs = [];
  if (!hasNum && hasState && !tooShort) softs.push(L === 'zh'
    ? '有明確狀態但沒有數字。狀態可以判，但補上一個門檻數字會更硬，例如「連續兩次」「低於九成」。'
    : 'There is an explicit state but no number. Add a threshold such as "twice in a row" or "below ninety per cent" to make it harder.');
  return { state: issues.length ? 'fail' : 'pass', issues, softs, hasNum, hasState };
};

    m0_intro: "這是 PMCS 課程 W14 的課前學習單。W13 到 W15 是專案管理三週：W13 規劃、W14 控制、W15 交付，D day 最晚在 W15。本週的主教材是 T6 · CTRL 專案控制與交付，只讀 M0 到 M6 的控制段；M7 的交付段留到 W15 再讀，這一週先不要往後翻。主題是風險：風險是「可能對專案目標產生正面或負面影響的不確定事件」，已經發生的叫問題，不叫風險。本週你要做的事情有一條清楚的作業鏈——用至少兩種識別方法找出自己組的風險，把它們放進 5×5 矩陣排序，各選一種應對策略並說明為什麼不選另外三種，然後在小組討論時只挑三項並排比對，最後產出一張至少五項、每項都有觸發條件的風險登記表。第 2 到第 4 節每人各填自己的、不繳交；第 5 到第 7 節由小組共同決定，隨小組版繳交。",

    m3_nav: "3. 個人風險評估", m3_title: "個人風險評估：5×5 矩陣與應對策略",
    m3_overview: "本週個人核心任務的後半。把第 2 節找出來的兩項風險放進 5×5 矩陣：可能性與影響分開評分，交叉得到分數與等級。接著各選一種應對策略——規避、轉移、減輕、接受——寫出理由，並且特別要說明：為什麼不選另外三種。",
    m3_highlights: ["可能性 × 影響","等級自動判定","四選一","為什麼不選另外三種","成本效益"],
    m3_deep: "矩陣的價值不在精確，而在於它強迫你把兩個獨立的問題分開問：這件事多容易發生？真的發生了有多痛？很多人一開始會把兩個混在一起評，結果高分項全部集中在自己最害怕的那一類。至於「為什麼不選另外三種」這一格，它才是本節真正的考題。四種策略的選擇依據是評估結果加上成本效益：規避通常最貴，因為它往往要砍掉一部分範疇；轉移要有第三方可以接手；減輕降低的是可能性或影響，降級模式就是典型的減輕實作；接受用在應對成本高於期望損失的時候，而且接受不等於忽略，接受的項目仍然要監控。把四種都想過一遍再選，你選的那一種才站得住。",

    m5_nav: "5. 小組綜整", m5_title: "小組綜整：從十二項風險裡只挑三項",
    m5_overview: "這一節才是小組討論真正的工作。六個人各帶兩項風險過來，桌上一共十二項。你們只能挑三項做並排比對，比三件事：等級判定的落差、應對策略選擇的分歧、觸發條件寫得夠不夠可觀察。最後要訂出一條全組通用的觸發條件書寫通則。",
    m5_highlights: ["十二項挑三項","等級落差","策略分歧","觸發條件可觀察","組內通則"],
    m5_deep: "彙整方式有一條硬性規定：本週彙整人不得把六份個人匯出檔全部丟給 AI 叫它總結。Context Engineering 的核心是選取，不是全丟。挑哪三項本身就是判斷：六個人寫得都一樣的那三項，比對不出東西；等級判定差最多、或策略選得最分歧的那三項，才會逼出通則。下方的勾選是本課程要求的五項必含風險加上「其他」，先勾出你們比對的那三項，再說明為什麼略過其餘的。",
    m5_focus_label: "我們決定比對的三項（勾選三項）",
    m5_focus_why: "為什麼略過另外三項？",
    m5_focus_why_ph: "例：組員退選與衝堂六個人寫得幾乎一樣，沒有東西可比；真正吵起來的是排程失敗未察覺的等級，以及來源網站改版該不該規避，所以我們挑那兩項加上免費額度用盡。",
    m5_gap_label: "等級判定的落差：同一項風險，六個人給的等級差多少？差在哪裡",
    m5_gap_ph: "例：排程失敗未察覺，兩個人給 6（中），一個人給 20（極高）。差別在可能性的評分——給 20 的那位把「我們沒有心跳紀錄」也算進可能性，其他人只評了 cron 本身會不會壞。",
    m5_evidence_label: "應對策略選擇的分歧：從六份裡舉兩個具體例子",
    m5_evidence_ph: "例：同樣是來源網站改版，A 選規避（改用官方 API），D 選減輕（保留前一日快取）。A 沒算過重寫抓取層要花多久，D 算過快取只要兩小時，成本效益的判斷完全談不攏。",
    m5_case_label: "觸發條件比對：誰寫得最可觀察？全組採用誰的寫法，為什麼",
    m5_case_ph: "例：採用 D 的寫法「心跳紀錄超過二十六小時沒有更新」。它可觀察、出現在事件之前、而且帶一個數字；其他五份多半寫「排程壞掉的時候」，那是事件本身。",
    m5_rule_label: "從這次比對，我們訂下一條觸發條件的書寫通則",
    m5_rule_ph: "例：本組登記表的每一項觸發條件都必須寫成「當〔可觀察對象〕在〔時間範圍〕內〔達到／低於〕〔數字〕時」，三個括號缺任何一個就退回重寫。",
    m5_rule_note: "這條通則會累積到期末專案。它應該可以被別人拿去逐列檢查你們的登記表，而不是一句期許。",
    m5_wrapup: "檢查點：只比對了三項（不是全部丟給 AI），且訂出的通則是可以檢查的。",

    m6_nav: "6. 依演化表建置", m6_title: "依演化表建置：風險登記表",
    m6_overview: "把第 5 節的共識變成一張全組共用的風險登記表。本課程要求至少五項，而且必含這五項：來源網站改版、免費額度用盡、排程失敗未察覺、組員退選、期末其他課衝堂。每一項都要有觸發條件與負責人。",
    m6_highlights: ["五項必含","若…則…句型","觸發條件","應對方案","負責人"],
    m6_deep: "四個大格請一列一項、五列對齊：第一格寫五項風險的描述，第二格寫這五項各自的觸發條件，第三格寫這五項各自的應對策略與方案，第四格寫這五項各自的負責人。順序要一致，否則彙整台對不起來。觸發條件那一格下方會即時逐列檢查——它會抓出「隨時注意」「盡量」「如果有問題」這一類不可觀察的措辭，也會抓出寫在事件之後的措辭（例如「額度完全用完的時候」），並要求每一列都帶數字或明確狀態。第 8 節的第三個工具是同一個檢查器的單句版，可以先在那裡把句子磨好再貼回來。最後一格 tp_top_class 選的是等級最高那一項的類別，它會被彙整台直接畫成全班分布圖。",

    m6_risks_ph: "R01 若來源網站改版，則爬蟲取回的欄位會全部落空\nR02 若免費額度用盡，則當日之後的產出會直接中斷\nR03 若排程失敗而沒有人察覺，則會連續多日沒有產出\nR04 若有組員退選，則其負責的模組會沒有人接手\nR05 若期末其他課程衝堂，則最後兩週的工時會被壓縮",

      { q: "Why does the Delphi method rely on anonymity?", opts: ["To keep the expert opinions confidential","To shorten the time each round will take","To cut rank and volume out of judgement","To let the facilitator edit the responses"], ans: _A2, exp: "Anonymity is not secrecy; it makes the opinion rather than the speaker's standing the thing being weighed." },
      { q: "The degraded mode from W12 is an instance of which response strategy?", opts: ["Mitigate: the event happens, the damage shrinks","Avoid: the risk is removed from existence","Transfer: an outside supplier carries it","Accept: no action, but continued monitoring"], ans: _A0, exp: "Shipping a shorter brief when a source dies lets the event happen and squeezes the impact, which is textbook mitigation." },

    m3_nav: "3. Risk Assessment", m3_title: "Risk Assessment: The 5×5 Matrix and the Response",
    m3_overview: "The second half of this week's individual core task. Put the two risks from section 2 on the five-by-five matrix: score likelihood and impact separately and the crossing gives a score and a level. Then choose one response strategy for each — avoid, transfer, mitigate or accept — give your reason, and above all say why you rejected the other three.",
    m3_highlights: ["Likelihood × impact","Level derived","One of four","Why not the other three","Cost and benefit"],
    m3_deep: "The value of the matrix is not precision but the fact that it forces two separate questions apart: how easily could this happen, and how much would it hurt if it did? People who score them together end up with every high entry sitting in whatever category frightens them most. The cell that really examines you, though, is \"why not the other three\". The choice follows the assessment plus a cost-benefit judgement. Avoid is usually the most expensive because it normally cuts scope. Transfer needs a third party willing to carry it. Mitigate lowers likelihood or impact, and a degraded mode is the textbook implementation. Accept is right when the response costs more than the expected loss — and accepting is not ignoring, since accepted entries stay monitored. Think all four through, and the one you pick will hold.",
    m3_r_head: "Risk {n}",
    m3_r_from: "(from section 2)",
    m3_r_empty: "(not yet filled in section 2)",
    m3_p_label: "Likelihood (1 very low – 5 very high)",
    m3_i_label: "Impact (1 very low – 5 very high)",
    m3_score_label: "Score (likelihood × impact)",
    m3_level_label: "Level",
    m3_level_hint: "The level follows from the score: 1–4 low, 5–9 medium, 10–14 high, 15–25 critical.",
    m3_s_label: "Response strategy",
    m3_s_hint: "One of avoid, transfer, mitigate, accept. Choose on the assessment plus cost and benefit.",
    m3_why_label: "Why this one (connect it to the level and to cost-benefit)",
    m3_why_ph: "e.g. A score of 12 is high, and we mitigate. Moving to the official API would be avoidance, but it means rewriting the whole fetch layer, which costs more than this risk's expected loss; mitigation is one extra cache layer and takes two hours.",
    m3_not_label: "Why not the other three (one sentence for each of the three)",
    m3_not_hint: "This cell is the point of the section. All three must be addressed; \"not suitable\" does not count — say where it fails.",
    m3_not_ph: "e.g. Avoid = dropping this source cuts half our scope, too expensive. Transfer = no third party can fetch this site for us. Accept = if it fires the whole brief is blank, so the expected loss is far above the cost of responding.",
    m3_need_scale: "Choose likelihood and impact first and the level is calculated for you.",
    m3_wrapup: "Checkpoint: both entries carry a level, and \"why not the other three\" gives a concrete reason for each of the three rather than \"not suitable\".",

    m4_nav: "4. Language Lab", m4_title: "EMI Language Lab",
    m4_overview: "This course is taught in English. Pick five new words or phrases from this week's required materials, plus three words you stumble over. What you produce here feeds class discussion and bonus work directly.",
    m4_highlights: ["Five new terms","Three hard words","In your own words","Example sentences"],
    m4_deep: "Do not copy the source definition into the \"in your own words\" column — copying proves only that you found it; rewriting proves you understood it. Write the example sentences about your own Term Project: one of your risks, its trigger condition, or the response you chose. That way one effort does two jobs.",
    m4_corpus_label: "Suggested corpus for this week (take from here, or find your own in the materials)",
    m4_corpus: ["risk register","likelihood","impact","mitigate","contingency plan","trigger condition","residual risk","escalate"],
    m4_terms_label: "Five new words or phrases",

    m4_pron_label: "Three words you stumble over",

    m5_nav: "5. Group Synthesis", m5_title: "Group Synthesis: Three of Twelve Risks",
    m5_overview: "This section is the real work of the group discussion. Six people arrive with two risks each, so twelve are on the table. You may compare only three of them, along three lines: how far the level ratings diverge, how far the response choices diverge, and how observable the trigger conditions are. From that you set one rule for the whole group on how a trigger is written.",
    m5_highlights: ["Three of twelve","Level divergence","Response divergence","Observable triggers","A group rule"],
    m5_deep: "One rule is mandatory: this week's compiler must NOT dump all six individual exports into an AI and ask for a summary. The core of Context Engineering is selection, not dumping. Choosing which three is itself the judgement: the three everyone wrote identically teach you nothing, while the three where the levels diverge most, or where the responses split hardest, are what force a rule out of you. The tick list below carries the five risks this course requires plus \"other\"; mark the three you compared, then explain what you skipped and why.",
    m5_focus_label: "The three we chose to compare (tick three)",
    m5_focus_why: "Why did we skip the others?",
    m5_focus_why_ph: "e.g. Members dropping out and deadline collisions were written almost identically by all six, so there was nothing to compare; the real arguments were the level of the silent schedule failure and whether the site redesign deserved avoidance, so we took those two plus the quota.",
    m5_gap_label: "Level divergence: for the same risk, how far apart were the six ratings, and why?",
    m5_gap_ph: "e.g. For the silent schedule failure two people scored 6 (medium) and one scored 20 (critical). The gap sits in likelihood: the person who scored 20 folded \"we have no heartbeat log\" into likelihood, while the others only scored whether cron itself breaks.",
    m5_evidence_label: "Response divergence: two concrete examples from the six",
    m5_evidence_ph: "e.g. On the same site-redesign risk, A chose avoid (move to the official API) and D chose mitigate (keep yesterday's cache). A never costed the rewrite; D had costed the cache at two hours. The cost-benefit judgements were not aligned at all.",
    m5_case_label: "Trigger comparison: whose was the most observable, whose wording do we adopt, and why?",
    m5_case_ph: "e.g. We adopt D's wording, \"the heartbeat log has not updated for more than twenty-six hours\". It is observable, it appears before the event, and it carries a number; most of the other five wrote \"when the schedule breaks\", which is the event itself.",
    m5_rule_label: "From this comparison, our group sets one rule for writing triggers",
    m5_rule_ph: "e.g. Every trigger in this group's register reads \"when [observable thing] over [time window] reaches / falls below [number]\"; anything missing one of the three brackets is sent back.",
    m5_rule_note: "These rules accumulate towards the Term Project. Somebody else should be able to check your register row by row against it, so it must not read as an aspiration.",
    m5_wrapup: "Checkpoint: only three items were compared (nothing was dumped wholesale into an AI), and the rule you set is checkable.",

    m6_nav: "6. Build by the Table", m6_title: "Build by the Table: The Risk Register",
    m6_overview: "Turn the consensus from section 5 into one shared risk register. This course asks for at least five entries and requires these five: the source site being redesigned, the free quota running out, a schedule failing unnoticed, a member dropping the course, and other final deadlines colliding. Every entry needs a trigger condition and a named owner.",
    m6_highlights: ["Five required","If… then… shape","Trigger conditions","Response plans","Owners"],
    m6_deep: "Use one line per risk and keep the four boxes aligned five lines deep: descriptions in the first, the matching trigger conditions in the second, the matching response strategies and plans in the third, the matching owners in the fourth. The order must be the same in all four or the aggregator cannot line them up. Below the trigger box every line is checked live — it catches unobservable wording such as \"keep an eye on it\", \"try to\" or \"if there is a problem\", it catches wording that sits after the event (\"once the quota is completely gone\"), and it insists on a number or an explicit state in every line. Tool three in section 8 is the single-sentence version of the same checker, so sharpen a sentence there and paste it back. The last cell, tp_top_class, is the category of your highest-level entry, and the aggregator plots it as a class-wide distribution.",
    m6_risks_label: "One-sentence description of each of the five risks (one per line, in the if… then… shape)",
    m6_risks_hint: "Required: source site redesigned, free quota exhausted, schedule fails unnoticed, a member drops the course, other final deadlines collide. You may add more, but not fewer.",
    m6_risks_ph: "R01 If the source site is redesigned, every scraped field comes back empty\nR02 If the free quota runs out, everything after that day stops\nR03 If the schedule fails unnoticed, several days pass with no output\nR04 If a member drops the course, their module has no one to take it over\nR05 If other final deadlines collide, the last two weeks lose most working hours",
    m6_trig_label: "The trigger condition for each of the five (one per line, aligned with the box above)",
    m6_trig_hint: "Observable, ahead of the event, and carrying a definite number or state. Each line is checked below.",
    m6_trig_ph: "R01 Parse success rate below ninety per cent for two days running\nR02 Monthly usage reaches seventy per cent of the allowance\nR03 Heartbeat log not updated for more than twenty-six hours\nR04 Any member absent from meetings and commits for two weeks\nR05 Any member reports another final report due in the same week",
    m6_trig_head: "Line-by-line trigger check",
    m6_trig_none: "No trigger conditions yet. While this box is empty, section 6 is not complete.",
    m6_trig_pass: "✓ Observable, and it carries a number or an explicit state.",
    m6_trig_count: "{ok} of {n} lines pass",
    m6_trig_allok: "✓ Every line passes. This register can be used to check another group's, row by row.",
    m6_trig_bad: "{n} lines still fail. For those, nobody knows when the response plan should be opened.",
    m6_resp_label: "The response strategy and plan for each of the five (one per line)",
    m6_resp_hint: "State the strategy first (avoid / transfer / mitigate / accept), then the plan. High-level entries also need a contingency plan.",
    m6_resp_ph: "R01 Mitigate: isolate the parsing layer as its own module and keep yesterday's cache as degraded output\nR02 Mitigate: cut the tokens per call and switch to a short brief when the allowance tightens\nR03 Mitigate: add a heartbeat log and failure alerts, and check run records manually each week\nR04 Mitigate: keep settings and keys in the shared repository and name a deputy per module\nR05 Avoid: freeze the deliverable in week thirteen and use the last two weeks only for repairs",
    m6_class_label: "Category of the highest-level risk",
    m6_class_hint: "Place all five on the matrix in section 8 first; whichever category the highest-level entry belongs to is the one to select.",
    m6_class_note: "The aggregator plots this as a class-wide distribution and uses it to allocate diagnosis time in class. Answer honestly.",
    m6_owner_label: "The owner of each of the five (one per line)",
    m6_owner_hint: "Write a name, not \"everyone\". A risk with no name against it is a risk nobody is watching.",
    m6_owner_ph: "R01 Ah-Chi Wang\nR02 Hsiao-Mei Li\nR03 Ta-Tung Chen\nR04 Hsiao-Hua Lin\nR05 Chia-Hao Chang",
    m6_wrapup: "Checkpoint: every one of the five triggers states an observable number or state, and none is blank or reads \"keep an eye on it\".",

    m7_nav: "7. Presentation Plan", m7_title: "Presentation Plan and Question",
    m7_overview: "Turn section 1's split into a runnable script, and prepare one question to put to the class. The 10-minute Q&A is carried entirely by the questions each group brings.",
    m7_highlights: ["Opening line","Segment script","Menti question","10 minutes"],
    m7_deep: "This week, put the highest cell of your matrix on the first slide and read out that entry's trigger condition verbatim — one hard trigger persuades more than ten pages of risk list. Write the opening line as a complete English sentence rather than keywords. Avoid yes-or-no questions for the class; a good one forces a judgement first, for example: when the response clearly costs more than the expected loss, would your group honestly write \"accept\", or write a mitigation nobody intends to build so the table looks better?",
    m7_open_label: "English opening line (one complete sentence)",
    m7_open_ph: "e.g. Our highest-rated risk is not the one that hurts most, but the one we would not notice for three days.",
    m7_script_label: "Segment script (one sentence per speaker on the point they will make)",

    m7_question_label: "One question for the class (for Menti)",

/* ================= SDL KB import ================= */
const SEMESTER_DEFAULT = '1151';
const WEEK_CODE = 'W14';
const TOPIC_CAMEL = 'RiskAndControl';

const parseSdlKb = (text) => {
  try {
    const t = String(text || '').replace(/\r\n/g, '\n').trim();
    if (!t) return { ok: false, error: 'empty' };
    const fm = t.match(/^---\n([\s\S]*?)\n---/);
    const meta = {};
    if (fm) {
      fm[1].split('\n').forEach(line => {
        if (/^\s/.test(line)) return;               // skip nested (sources / interaction)
        const m = line.match(/^([A-Za-z_]+):\s*(.*)$/);
        if (m) meta[m[1]] = m[2].replace(/^["']|["']$/g, '').trim();
      });
    }
    const sections = {};
    const parts = t.split(/^##\s*§/m);
    parts.shift();
    parts.forEach(part => {
      const n = part.match(/^(\d)/);
      if (!n) return;
      sections['s' + n[1]] = part.replace(/^\d[^\n]*\n?/, '').trim();
    });
    const hasAny = Object.keys(meta).length > 0 || Object.keys(sections).length > 0;
    if (!hasAny) return { ok: false, error: 'format' };
    return { ok: true, meta, sections, raw: t };
  } catch (e) { return { ok: false, error: 'format' }; }
};

const SdlImport = ({ t, sdl, onImport, onClear }) => {
  const [text, setText] = useState('');
  const [msg, setMsg] = useState(null);
  const fileRef = useRef(null);
  const doParse = (raw) => {
    const r = parseSdlKb(raw);
    if (!r.ok) { setMsg({ ok: false, text: r.error === 'empty' ? t.sdl_err_empty : t.sdl_err_format }); return; }
    onImport(r);
    setMsg({ ok: true, text: t.sdl_ok });
    setText('');
  };
  const onFile = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => doParse(rd.result);
    rd.readAsText(f);
    e.target.value = '';
  };
  return (
    <div className="rounded-xl border-2 border-sky-200 dark:border-sky-800/60 bg-sky-50/50 dark:bg-sky-900/10 p-5">
      <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5]">{t.sdl_title}</h3>
      <p className="text-sm text-slate-500 dark:text-slate-400 mt-1 mb-3 leading-relaxed">{t.sdl_desc}</p>

            {[sdl.meta.course, sdl.meta.semester, sdl.meta.week, sdl.meta.topic].filter(Boolean).join(' · ')}

          </p>
          <button onClick={onClear} className="mt-3 px-3 py-1.5 text-xs border border-red-400 text-red-600 dark:text-red-400 rounded-lg">{t.sdl_clear}</button>

            <input ref={fileRef} type="file" accept=".md,.markdown,.txt" onChange={onFile} className="hidden" />

/* ================= FlipCardDeck ================= */
const FlipCardDeck = ({ terms, t, moduleId, onCardRead }) => {
  const [groupIdx, setGroupIdx] = useState(0);
  const [flipped, setFlipped] = useState({});
  const [readSet, setReadSet] = useState(new Set());
  const [shownSet, setShownSet] = useState(new Set());
  const [shuffledOrder] = useState(() => [...Array(terms.length).keys()].sort(() => Math.random() - 0.5));
  const groupSize = 2;
  const totalGroups = Math.ceil(terms.length / groupSize);
  const currentCardIndices = shuffledOrder.slice(groupIdx*groupSize, groupIdx*groupSize + groupSize);
  useEffect(() => {
    const ns = new Set(shownSet); currentCardIndices.forEach(i => ns.add(i));
    if (ns.size !== shownSet.size) setShownSet(ns);
  }, [groupIdx]);
  const handleFlip = (i) => {
    setFlipped(f => ({...f, [i]: !f[i]}));
    if (!readSet.has(i)) { const nr = new Set(readSet); nr.add(i); setReadSet(nr); onCardRead && onCardRead(moduleId, nr.size, shownSet.size, terms.length); }
  };
  const statusText = t.flip_status.replace('{read}', readSet.size).replace('{shown}', shownSet.size).replace('{total}', terms.length);
  return (
    <div className="mt-8">
      <h3 className="text-lg font-bold uppercase tracking-wider text-slate-500 mb-2">{t.key_terms}</h3>
      <p className="text-sm text-slate-400 mb-4">{statusText}</p>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        {currentCardIndices.map(i => (
          <div key={i} className="perspective cursor-pointer h-44" onClick={() => handleFlip(i)}>
            <div className={`transform-style-3d relative w-full h-full transition-transform duration-500 ${flipped[i] ? 'rotate-y-180' : ''}`}>
              <div className="backface-hidden absolute inset-0 bg-white dark:bg-slate-800 rounded-xl p-4 flex flex-col items-center justify-center border border-slate-200 dark:border-slate-700 shadow-sm">
                <p className="font-serif font-bold text-center text-[#004030] dark:text-[#D8C3A5]">{terms[i].front}</p>
                <p className="text-xs text-slate-400 mt-2">{t.flip_prompt}</p>
              </div>
              <div className="backface-hidden rotate-y-180 absolute inset-0 bg-[#004030] dark:bg-slate-700 rounded-xl p-4 flex items-center justify-center overflow-y-auto">
                <p className="text-sm text-center text-[#D8C3A5] dark:text-slate-200 leading-relaxed">{terms[i].back}</p>
              </div>
            </div>
          </div>
        ))}
      </div>
      <div className="flex items-center gap-3 mt-4">
        <button onClick={() => { setGroupIdx(0); setFlipped({}); }} className="px-4 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">{t.flip_retry}</button>
        <button onClick={() => groupIdx < totalGroups-1 && setGroupIdx(groupIdx+1)} disabled={groupIdx >= totalGroups-1}
          className="px-4 py-2 text-sm bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.flip_next}</button>
      </div>
    </div>
  );
};

/* ================= ModuleQuiz ================= */
const ModuleQuiz = ({ questions, t, moduleId, onQuizSubmit }) => {
  const [selected, setSelected] = useState({});
  const [submitted, setSubmitted] = useState({});
  const [groupIdx, setGroupIdx] = useState(0);
  const groupSize = 2;
  const [quizIndices] = useState(() => [...Array(questions.length).keys()].sort(() => Math.random() - 0.5));
  const totalGroups = Math.ceil(quizIndices.length / groupSize);
  const [shuffledMaps] = useState(() => quizIndices.map(qi => [...Array(questions[qi].opts.length).keys()].sort(() => Math.random() - 0.5)));
  const computeCorrect = () => { let c = 0; quizIndices.forEach((qIdx, qi) => { if (selected[qi] !== undefined && shuffledMaps[qi][selected[qi]] === _d(questions[qIdx].ans)) c++; }); return c; };
  const statusText = t.quiz_status.replace('{correct}', computeCorrect()).replace('{answered}', Object.keys(selected).length).replace('{total}', quizIndices.length);
  const currentStart = groupIdx * groupSize;
  const currentIndices = quizIndices.slice(currentStart, currentStart + groupSize);
  const handleGroupSubmit = () => {
    if (!currentIndices.every((_, i) => selected[currentStart+i] !== undefined)) return;
    setSubmitted(s => ({...s, [groupIdx]: true}));
    if (groupIdx === totalGroups - 1 || Object.keys(submitted).length + 1 === totalGroups) {
      const wrong = []; let correct = 0;
      quizIndices.forEach((qIdx, qi) => {
        if (selected[qi] === undefined) return;
        if (shuffledMaps[qi][selected[qi]] === _d(questions[qIdx].ans)) correct++; else wrong.push(questions[qIdx].q);
      });
      onQuizSubmit(moduleId, correct, quizIndices.length, wrong);
    }
  };
  return (
    <div className="mt-8 bg-slate-50 dark:bg-slate-900/50 rounded-2xl p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="text-lg font-bold font-serif text-[#004030] dark:text-[#D8C3A5] mb-2">{t.quiz_title}</h3>
      <p className="text-sm text-slate-400 mb-6">{statusText}</p>
      {currentIndices.map((qIdx, localI) => {
        const qi = currentStart + localI, q = questions[qIdx], sMap = shuffledMaps[qi], isSub = !!submitted[groupIdx];
        return (
          <div key={qIdx} className="mb-6">
            <p className="font-bold mb-3">{qi+1}. {q.q}</p>
            <div className="space-y-2">
              {sMap.map((origIdx, dIdx) => {
                const isCorrect = origIdx === _d(q.ans), isSel = selected[qi] === dIdx;
                return (
                  <button key={dIdx} onClick={() => !isSub && setSelected(s => ({...s, [qi]: dIdx}))}
                    className={`w-full text-left px-4 py-3 rounded-lg border transition-all text-sm ${isSub
                      ? isCorrect ? 'bg-green-100 border-green-500 dark:bg-green-900/30'
                        : isSel ? 'bg-red-100 border-red-400 dark:bg-red-900/30' : 'border-slate-200 dark:border-slate-700'
                      : isSel ? 'border-[#004030] dark:border-[#D8C3A5] bg-[#004030]/5' : 'border-slate-200 dark:border-slate-700 hover:border-slate-400'}`}>
                    {q.opts[origIdx]}
                  </button>
                );
              })}
            </div>
            {isSub && (
              <p className={`mt-2 text-sm italic ${shuffledMaps[qi][selected[qi]] === _d(q.ans) ? 'text-green-600 dark:text-green-400' : 'text-red-500 dark:text-red-400'}`}>
                {shuffledMaps[qi][selected[qi]] === _d(q.ans) ? `✓ ${t.correct}` : `✗ ${t.incorrect}`} — {t.explanation}：{q.exp}
              </p>
            )}
          </div>
        );
      })}
      <div className="flex items-center gap-3 flex-wrap">
        {!submitted[groupIdx]
          ? <button onClick={handleGroupSubmit} disabled={!currentIndices.every((_,i) => selected[currentStart+i] !== undefined)}
              className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.submit}</button>
          : <>
              {groupIdx < totalGroups-1 && <button onClick={() => setGroupIdx(groupIdx+1)} className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg">{t.quiz_next}</button>}
              <button onClick={() => { setGroupIdx(0); setSelected({}); setSubmitted({}); }} className="px-6 py-2 border border-[#004030] dark:border-[#D8C3A5] text-[#004030] dark:text-[#D8C3A5] font-bold rounded-lg">{t.quiz_retry}</button>
            </>}
      </div>
    </div>
  );
};

/* ================= Trigger verdict renderer ================= */
const TriggerVerdict = ({ t, res, lang }) => {
  if (!res || res.state === 'empty') return null;

    <div className={`rounded-lg p-3 text-sm leading-relaxed ${res.state === 'pass'

/* ---- Lab 2：5×5 風險矩陣定位 ---- */
const LabMatrix = ({ t, state, setState, onTouch }) => {
  const v = state || {};
  const placed = v.placed || {};
  const pick = v.pick === undefined ? null : v.pick;
  const cell = v.cell || null;
  const items = t.lab2_items;
  const unplaced = items.map((_, i) => i).filter(i => placed[i] === undefined);
  const clickCell = (p, i) => {
    const next = { ...v, cell: { p, i } };
    if (pick !== null) { next.placed = { ...placed, [pick]: { p, i } }; next.pick = null; }
    setState(next); onTouch && onTouch();
  };
  const score = cell ? cell.p * cell.i : 0;
  const lv = cell ? levelOf(score) : 0;
  return (
    <div className="bg-white dark:bg-slate-800 rounded-xl p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-1">{t.lab2_title}</h3>
      <p className="text-sm text-slate-500 dark:text-slate-400 mb-4">{t.lab2_desc}</p>
      <p className="text-xs font-bold text-slate-500 mb-2">{t.lab2_pool}（{unplaced.length}）</p>
      <div className="flex flex-wrap gap-2 mb-3">
        {unplaced.length === 0
          ? <p className="text-xs text-green-600 dark:text-green-400 font-bold leading-relaxed">{t.lab2_done}</p>
          : unplaced.map(i => (
              <button key={i} onClick={() => { setState({ ...v, pick: pick === i ? null : i }); onTouch && onTouch(); }}
                className={`px-3 py-1 rounded-full text-xs font-bold border transition ${pick === i
                  ? 'bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] border-[#004030] dark:border-[#D8C3A5]'
                  : 'border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300 hover:border-[#004030] dark:hover:border-[#D8C3A5]'}`}>{items[i]}</button>
            ))}
      </div>
      <p className="text-xs text-slate-500 mb-1">{t.lab2_pick}</p>
      {pick !== null && <p className="text-xs font-bold text-[#004030] dark:text-[#D8C3A5] mb-2">{t.lab2_selected}{items[pick]}</p>}
      <p className="text-[11px] font-bold text-slate-500 mt-3 mb-1">{t.lab2_axis_p}</p>
      <div className="w-full overflow-x-auto">
        <div className="min-w-[360px]">
          {[5,4,3,2,1].map(p => (
            <div key={p} className="flex items-stretch gap-1 mb-1">
              <div className="w-5 shrink-0 flex items-center justify-center text-[11px] font-bold text-slate-400">{p}</div>
              {[1,2,3,4,5].map(i => {
                const s = p * i;
                const here = Object.keys(placed).filter(k => placed[k].p === p && placed[k].i === i);
                const sel = cell && cell.p === p && cell.i === i;
                return (
                  <button key={i} onClick={() => clickCell(p, i)}
                    className={`flex-1 h-16 rounded-md border text-left px-1.5 py-1 transition-all ${LEVEL_BG[levelOf(s)]} ${sel ? 'ring-2 ring-[#004030] dark:ring-[#D8C3A5]' : ''}`}>
                    <span className="block text-[10px] font-bold opacity-70">{s}</span>
                    {here.map(k => <span key={k} className="block text-[9px] leading-tight font-bold truncate">{items[k].split(' ')[0]}</span>)}
                  </button>
                );
              })}
            </div>
          ))}
          <div className="flex items-center gap-1">
            <div className="w-5 shrink-0" />
            {[1,2,3,4,5].map(i => <div key={i} className="flex-1 text-center text-[11px] font-bold text-slate-400">{i}</div>)}
          </div>
        </div>
      </div>
      <p className="text-[11px] font-bold text-slate-500 mt-1 text-right">{t.lab2_axis_i}</p>
      {cell && (
        <div className="mt-4 rounded-xl border border-slate-200 dark:border-slate-700 p-4 bg-slate-50 dark:bg-slate-900/40">
          <p className="text-xs text-slate-500 mb-1">{t.lab2_score_label}{t.colon}<span className="font-bold">{cell.p} × {cell.i} = {score}</span>{' '}
            {t.lab2_level_label}{t.colon}<span className={`font-bold ${LEVEL_TXT[lv]}`}>{t.level_names[lv]}</span></p>
          <p className="text-xs font-bold text-slate-500 mt-2 mb-1">{t.lab2_advice_title}</p>
          <p className="text-sm leading-relaxed">{t.level_advice[lv]}</p>
        </div>
      )}
      <div className="flex items-center gap-3 mt-3 flex-wrap">
        <button onClick={() => { setState({}); onTouch && onTouch(); }} className="px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg text-sm">{t.lab2_reset}</button>
      </div>
    </div>
  );
};

/* ---- Lab 4：風險登記表草稿匯出 ----
   預載範例只在「學生一個字都沒動過」時存在於畫面上（由語言推導而來，不寫進 state）。
   任何編輯都會把整張表寫進 state，之後語言切換永不覆寫；
   從 localStorage 還原的內容同樣不會被覆寫。 */
const LAB4_TEXT_KEYS = ['id','desc','trig','owner'];
const lab4Seed = (t) => (t.lab4_rows || []).map(r => ({ ...r }));
const lab4SameAsSeed = (rows, d) => {
  const seed = d.lab4_rows || [];
  if (!Array.isArray(rows) || rows.length !== seed.length) return false;
  return rows.every((r, i) => r && LAB4_TEXT_KEYS.every(k => r[k] === seed[i][k]) && r.cls === seed[i].cls && r.st === seed[i].st);
};
const LabRegisterDraft = ({ t, lang, state, setState, onTouch }) => {
  const v = state || {};
  const stored = Array.isArray(v.rows) ? v.rows : null;
  /* pl：這份資料仍與哪一個語言的預載範例完全相同（一個字都沒被動過）；被動過就是 null */
  const pl = stored ? (['zh','en'].filter(lg => lab4SameAsSeed(stored, dict[lg]))[0] || null) : null;
  const rows = stored ? ((pl && pl !== lang) ? lab4Seed(t) : stored) : lab4Seed(t);
  const [msg, setMsg] = useState(null);
  useEffect(() => {
    /* 舊 session 存進 localStorage 的「原封不動的範例」→ 換成目前語言的版本；
       學生自己編輯過的內容 pl 為 null，永遠不會走到這裡 */
    if (stored && pl && pl !== lang) setState({ ...v, rows: lab4Seed(t) });
  }, [lang]);
  const commit = (next) => { setState({ ...v, rows: next }); setMsg(null); onTouch && onTouch(); };
  const upd = (idx, key, val) => commit(rows.map((r, i) => i === idx ? { ...r, [key]: val } : r));
  const del = (idx) => commit(rows.filter((_, i) => i !== idx));
  const add = () => commit([...rows, { id: 'R' + String(rows.length + 1).padStart(2,'0'), desc: '', cls: 0, st: 2, trig: '', owner: '' }]);
  const restore = () => { setState({ ...v, rows: undefined }); setMsg(null); onTouch && onTouch(); };
  const clearAll = () => {
    if (!window.confirm(t.lab4_clear_confirm)) return;
    commit([]);
  };
  const validate = () => {
    if (!rows.length) { setMsg({ ok:false, text: t.lab4_err_empty }); return null; }
    const blank = rows.filter(r => !String(r.trig || '').trim()).map(r => r.id || '(?)');
    if (blank.length) { setMsg({ ok:false, text: t.lab4_err_blank + ' ' + blank.join('、') }); return null; }
    const bad = rows.filter(r => checkTrigger(r.trig, lang).state !== 'pass').map(r => r.id || '(?)');
    if (bad.length) { setMsg({ ok:false, text: t.lab4_err_trigger + ' ' + bad.join('、') }); return null; }
    return rows;
  };
  const saveFile = (content, mime, ext) => {
    const d = new Date();
    const stamp = '' + d.getFullYear() + String(d.getMonth()+1).padStart(2,'0') + String(d.getDate()).padStart(2,'0');
    const blob = new Blob([content], { type: mime });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = `PMCS_W14_RiskRegisterDraft_${stamp}.${ext}`;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
    setMsg({ ok:true, text: t.lab4_ok });
  };
  const cellsOf = (r) => [r.id, r.desc, (t.class_opts[r.cls]||{}).name || '', (t.strategy_opts[r.st]||{}).name || '', r.trig, r.owner];
  const exportMD = () => {
    const ok = validate(); if (!ok) return;
    const esc = (x) => String(x == null ? '' : x).replace(/\|/g, '\\|');
    const L = [];
    L.push('# ' + t.lab4_md_title);
    L.push('');
    L.push('| ' + t.lab4_cols.join(' | ') + ' |');
    L.push('|' + t.lab4_cols.map(() => '---').join('|') + '|');
    ok.forEach(r => L.push('| ' + cellsOf(r).map(esc).join(' | ') + ' |'));
    L.push('');
    L.push('> ' + t.lab4_hint);
    saveFile(L.join('\n'), 'text/markdown;charset=utf-8;', 'md');
  };
  const exportCSV = () => {
    const ok = validate(); if (!ok) return;
    const esc = (x) => '"' + String(x == null ? '' : x).replace(/"/g,'""') + '"';
    const lines = [t.lab4_cols.map(esc).join(',')];
    ok.forEach(r => lines.push(cellsOf(r).map(esc).join(',')));
    saveFile('﻿' + lines.join('\r\n'), 'text/csv;charset=utf-8;', 'csv');
  };
  const cell = "w-full px-2 py-1 text-xs rounded border border-slate-300 dark:border-slate-600 bg-white dark:bg-slate-900";
  return (
    <div className="bg-white dark:bg-slate-800 rounded-xl p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-1">{t.lab4_title}</h3>
      <p className="text-sm text-slate-500 dark:text-slate-400 mb-4">{t.lab4_desc}</p>
      <div className="w-full overflow-x-auto">
        <table className="w-full text-xs min-w-[880px]">
          <thead>
            <tr className="text-left text-slate-500 border-b border-slate-200 dark:border-slate-700">
              {t.lab4_cols.map((c,i) => <th key={i} className="py-2 px-1 font-bold whitespace-nowrap">{c}</th>)}
              <th className="py-2 px-1" />
            </tr>
          </thead>
          <tbody>
            {rows.map((r, idx) => {
              const tr = checkTrigger(r.trig, lang);
              return (
                <tr key={idx} className="border-b border-slate-100 dark:border-slate-700/50 align-top">
                  <td className="py-2 px-1 w-14"><input className={cell} value={r.id} maxLength={8} onChange={e => upd(idx,'id', e.target.value.replace(/[<>"'&\\]/g,'').slice(0,8))} /></td>
                  <td className="py-2 px-1 min-w-[230px]"><textarea rows={2} className={cell} value={r.desc} onChange={e => upd(idx,'desc', sanitizeText(e.target.value))} /></td>
                  <td className="py-2 px-1 w-24"><select className={cell} value={r.cls} onChange={e => upd(idx,'cls', parseInt(e.target.value,10))}>
                    {t.class_opts.map((o,i) => <option key={o.v} value={i}>{o.name}</option>)}</select></td>
                  <td className="py-2 px-1 w-24"><select className={cell} value={r.st} onChange={e => upd(idx,'st', parseInt(e.target.value,10))}>
                    {t.strategy_opts.map((o,i) => <option key={o.v} value={i}>{o.name}</option>)}</select></td>
                  <td className="py-2 px-1 min-w-[220px]">
                    <textarea rows={2} value={r.trig} onChange={e => upd(idx,'trig', sanitizeText(e.target.value))}
                      className={`w-full px-2 py-1 text-xs rounded border bg-white dark:bg-slate-900 ${tr.state === 'pass' ? 'border-green-500' : 'border-red-500'}`} />
                    {tr.state === 'fail' && <p className="text-[10px] text-red-600 dark:text-red-400 mt-1 leading-tight">{tr.issues[0].why}</p>}
                  </td>
                  <td className="py-2 px-1 w-24"><input className={cell} value={r.owner} maxLength={20} onChange={e => upd(idx,'owner', sanitizeName(e.target.value))} /></td>
                  <td className="py-2 px-1"><button onClick={() => del(idx)} className="text-[11px] text-red-600 dark:text-red-400 hover:underline whitespace-nowrap">{t.lab4_del}</button></td>
                </tr>
              );
            })}
          </tbody>
        </table>
      </div>
      <p className="text-[11px] text-slate-500 mt-3 leading-relaxed">{t.lab4_hint}</p>
      <div className="flex items-center gap-3 mt-4 flex-wrap">
        <button onClick={add} className="px-4 py-2 text-sm rounded-lg border border-[#004030] dark:border-[#D8C3A5] text-[#004030] dark:text-[#D8C3A5] font-bold">{t.lab4_add}</button>
        <button onClick={exportMD} className="px-5 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg text-sm">{t.lab4_export_md}</button>
        <button onClick={exportCSV} className="px-5 py-2 border-2 border-[#004030] dark:border-[#D8C3A5] text-[#004030] dark:text-[#D8C3A5] font-bold rounded-lg text-sm">{t.lab4_export_csv}</button>
        <button onClick={restore} className="px-4 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-600">{t.lab4_restore}</button>
        <button onClick={clearAll} className="px-4 py-2 rounded-lg text-sm font-bold border border-red-500 text-red-600 dark:text-red-400 hover:bg-red-50 dark:hover:bg-red-900/20">{t.lab4_clear}</button>
      </div>
      {msg && <p className={`mt-3 text-sm font-bold ${msg.ok ? 'text-green-600 dark:text-green-400' : 'text-red-600 dark:text-red-400'}`}>{msg.text}</p>}
    </div>
  );
};

/* ================= App ================= */

  const [lang, setLang] = useState('en');
  const [isDark, setIsDark] = useState(true);
  const [module, setModule] = useState(0);
  const [menuOpen, setMenuOpen] = useState(false);
  const [ttsState, setTtsState] = useState('idle');
  const [answers, setAnswers] = useState(() => loadLS(LS_ANS, {}));
  const [focus, setFocus] = useState(() => loadLS(LS_ANS + '_focus', {}));
  const [memberCount, setMemberCount] = useState(() => loadLS(LS_ANS + '_mc', DEFAULT_MEMBERS));
  const [sdl, setSdl] = useState(() => loadLS(LS_ANS + '_sdl', null));

        </div>
      </div>
      <div className="mt-5"><Field id="pr_question" label={t.m7_question_label} ph={t.m7_question_ph} rows={3} value={answers.pr_question} onChange={setA} /></div>
      <Wrapup t={t} text={t.m7_wrapup} />
    </>
  );

  const renderLab = () => (
    <>
      <p className="text-base text-slate-600 dark:text-slate-300">{t.mlab_desc}</p>
      <div className="flex items-center gap-3 flex-wrap">
        <button onClick={clearLab} className="px-4 py-2 border border-red-400 text-red-600 dark:text-red-400 font-bold rounded-lg text-sm hover:bg-red-50 dark:hover:bg-red-900/20">{t.mlab_clear}</button>
        <span className="text-xs text-slate-400">💾 {t.analytics_wp_saved}</span>
      </div>
      <div className="grid grid-cols-1 lg:grid-cols-2 gap-5 mt-4">
        <LabMethodMatcher key={`lab1-${labNonce}-${lang}`} t={t} state={lab.l1} setState={setLabPart('l1')} onTouch={bump} />
        <LabMatrix key={`lab2-${labNonce}-${lang}`} t={t} state={lab.l2} setState={setLabPart('l2')} onTouch={bump} />
        <LabTriggerCheck key={`lab3-${labNonce}-${lang}`} t={t} lang={lang} state={lab.l3} setState={setLabPart('l3')} onTouch={bump} />
      </div>
      <div className="mt-5">
        <LabRegisterDraft key={`lab4-${labNonce}`} t={t} lang={lang} state={lab.l4} setState={setLabPart('l4')} onTouch={bump} />
      </div>
      <div className="mt-6 bg-white dark:bg-slate-800 rounded-xl p-6 border border-slate-200 dark:border-slate-700">
        <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-1">{t.lab5_title}</h3>
        <p className="text-sm text-slate-500 dark:text-slate-400">{t.lab5_desc}</p>
        <ModuleQuiz key={`quiz-lab-${lang}`} questions={t.m2_q} t={t} moduleId={IDX_LAB} onQuizSubmit={handleQuizSubmit} />
      </div>
    </>
  );

  const renderRes = () => (
    <>
      <p className="text-base text-slate-600 dark:text-slate-300">{t.mres_desc}</p>
      <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 mt-6 mb-3">{t.required_label}</h3>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">{t.res_req.map((r,i) => <LinkCard key={i} {...r} />)}</div>
      <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 mt-8 mb-3">{t.optional_label}</h3>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">{t.res_opt.map((r,i) => <LinkCard key={i} {...r} />)}</div>
    </>
  );

  const renderAna = () => {
    const totalTime = analytics.time.reduce((a,b)=>a+b,0);
    const qc = analytics.quizCorrect.reduce((a,b)=>a+b,0), qt = analytics.quizTotal.reduce((a,b)=>a+b,0);
    const weak = [1,2,3,4,5,6,7].filter(n => sectionPct(n) < 100);
    const stats = [
      { val: pctPersonal + '%', label: t.analytics_pct_personal },
      { val: pctGroup + '%', label: t.analytics_pct_group },
      { val: totalTime + t.analytics_sec, label: t.analytics_total_time },
      { val: qt > 0 ? Math.round(qc/qt*100) + '%' : '—', label: t.analytics_overall_acc }
    ];
    const setInfo = (k, v) => setStudentInfo(s => ({ ...s, [k]: v }));
    return (
      <>
        <p className="text-base text-slate-600 dark:text-slate-300">{t.analytics_desc}</p>
        <div className="grid grid-cols-2 lg:grid-cols-4 gap-3 mt-5">
          {stats.map((s,i) => (
            <div key={i} className="bg-white dark:bg-slate-800 rounded-xl p-4 border border-slate-200 dark:border-slate-700 text-center">
              <p className="font-serif font-black text-2xl text-[#004030] dark:text-[#D8C3A5]">{s.val}</p>
              <p className="text-xs text-slate-500 dark:text-slate-400 mt-1">{s.label}</p>
            </div>
          ))}
        </div>

        <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 mt-8 mb-3">{t.analytics_progress_title}</h3>
        <div className="space-y-2">
          {[1,2,3,4,5,6,7].map(n => {
            const pct = sectionPct(n), kind = modulesList[n].kind;
            return (
              <button key={n} onClick={() => go(n)} className="w-full flex items-center gap-3 text-left p-3 rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 hover:border-[#004030] dark:hover:border-[#D8C3A5] transition">
                <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded shrink-0 ${kind === 'P' ? 'bg-sky-100 text-sky-800 dark:bg-sky-900/40 dark:text-sky-200' : 'bg-[#D8C3A5]/30 text-[#004030] dark:bg-[#D8C3A5]/20 dark:text-[#D8C3A5]'}`}>{kind}</span>
                <span className="text-sm w-36 sm:w-52 truncate shrink-0">{t[`m${n}_nav`]}</span>
                <span className="flex-1 h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden">
                  <span className={`block h-full ${pct === 100 ? 'bg-green-500' : 'bg-[#004030] dark:bg-[#D8C3A5]'}`} style={{width: pct + '%'}}></span>
                </span>
                <span className="text-sm font-bold w-12 text-right shrink-0">{pct}%</span>
              </button>
            );
          })}
        </div>

        <h3 className="text-sm font-bold uppercase tracking-wider text-slate-500 mt-8 mb-3">{t.analytics_wp_title}</h3>
        {weak.length === 0
          ? <p className="p-4 rounded-lg bg-green-50 dark:bg-green-900/20 text-green-700 dark:text-green-300 text-sm">{t.analytics_wp_allpass}</p>
          : <div className="space-y-4">
              <div className="space-y-2">
                <p className="text-xs font-bold text-sky-700 dark:text-sky-300">{t.analytics_wp_personal_head}</p>
                {PERSONAL_SECTIONS.filter(n => sectionPct(n) < 100).length === 0
                  ? <p className="text-sm text-green-600 dark:text-green-400 pl-1">{t.analytics_wp_personal_done}</p>
                  : PERSONAL_SECTIONS.filter(n => sectionPct(n) < 100).map(n => (
                      <div key={n} className="p-3 rounded-lg bg-sky-50 dark:bg-sky-900/20 border border-sky-200 dark:border-sky-800/50 flex items-center justify-between gap-3">
                        <span className="text-sm">{t[`m${n}_nav`]} — {sectionPct(n)}%</span>
                        <button onClick={() => go(n)} className="text-xs font-bold text-sky-700 dark:text-sky-300 hover:underline shrink-0">{t.analytics_wp_goto}</button>
                      </div>))}
              </div>
              <div className="space-y-2">
                <p className="text-xs font-bold text-[#004030] dark:text-[#D8C3A5]">{t.analytics_wp_group_head}</p>
                <p className="text-xs text-slate-500 dark:text-slate-400 pl-1">{t.analytics_wp_group_note}</p>
                {GROUP_SECTIONS.filter(n => sectionPct(n) < 100).length === 0
                  ? <p className="text-sm text-green-600 dark:text-green-400 pl-1">{t.analytics_wp_group_done}</p>
                  : GROUP_SECTIONS.filter(n => sectionPct(n) < 100).map(n => (
                      <div key={n} className="p-3 rounded-lg bg-amber-50 dark:bg-amber-900/20 border border-amber-200 dark:border-amber-800/50 flex items-center justify-between gap-3">
                        <span className="text-sm">{t[`m${n}_nav`]} — {sectionPct(n)}%</span>
                        <button onClick={() => go(n)} className="text-xs font-bold text-[#004030] dark:text-[#D8C3A5] hover:underline shrink-0">{t.analytics_wp_goto}</button>
                      </div>))}
              </div>
            </div>}

        <div className="mt-8 rounded-xl border-2 border-sky-200 dark:border-sky-800/60 bg-sky-50/50 dark:bg-sky-900/10 p-5">
          <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5]">{t.analytics_personal_title}</h3>
          <p className="text-sm text-slate-500 dark:text-slate-400 mt-1 mb-4">{t.analytics_personal_desc}</p>
          <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
            <InfoInput id="nameEn" label={t.analytics_name_en} ph={t.analytics_name_en_ph} value={studentInfo.nameEn} onChange={setInfo} />
            <InfoInput id="nameZh" label={t.analytics_name_zh} ph={t.analytics_name_zh_ph} value={studentInfo.nameZh} onChange={setInfo} />
            <InfoInput id="id" label={t.analytics_id} ph={t.analytics_id_ph} value={studentInfo.id} onChange={setInfo} san={sanitizeStudentId} />
            <InfoInput id="dept" label={t.analytics_dept} ph={t.analytics_dept_ph} value={studentInfo.dept} onChange={setInfo} />
          </div>
          <button onClick={exportPersonal} disabled={!okPersonal}
            className="mt-4 px-5 py-2.5 bg-sky-700 dark:bg-sky-300 text-white dark:text-sky-950 font-bold rounded-lg disabled:opacity-40">{t.analytics_export_personal}</button>
          {!okPersonal && <p className="text-xs text-amber-600 dark:text-amber-400 mt-2">{t.analytics_need_personal}</p>}
        </div>

        <div className="mt-5 rounded-xl border-2 border-[#D8C3A5] dark:border-[#D8C3A5]/50 bg-[#D8C3A5]/10 p-5">
          <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5]">{t.analytics_group_title}</h3>
          <p className="text-sm text-slate-500 dark:text-slate-400 mt-1 mb-4">{t.analytics_group_desc}</p>
          <div className="grid grid-cols-1 sm:grid-cols-2 gap-3">
            <div><label className="block text-xs font-bold text-slate-500 mb-1">{t.analytics_group}</label>
              <select className={inputCls} value={studentInfo.group} onChange={e => setStudentInfo(s => ({...s, group: e.target.value}))}>
                <option value="">{t.select_ph}</option>{t.group_options.map(g => <option key={g} value={g}>{g}</option>)}
              </select></div>
            <InfoInput id="compiler" label={t.analytics_compiler} ph={t.analytics_compiler_ph} value={studentInfo.compiler} onChange={setInfo} />
          </div>
          <div className="flex flex-wrap gap-3 mt-4">
            <button onClick={exportGroupCSV} disabled={!okGroup} className="px-5 py-2.5 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.analytics_export_csv}</button>
            <button onClick={exportGroupMD} disabled={!okGroup} className="px-5 py-2.5 border-2 border-[#004030] dark:border-[#D8C3A5] text-[#004030] dark:text-[#D8C3A5] font-bold rounded-lg disabled:opacity-40">{t.analytics_export_md}</button>
          </div>
          {!okGroup && <p className="text-xs text-amber-600 dark:text-amber-400 mt-2">{t.analytics_need_group}</p>}
        </div>

        <div className="mt-6 flex items-center gap-3 flex-wrap">
          <button onClick={clearAll} className="px-5 py-2.5 border border-red-400 text-red-600 dark:text-red-400 font-bold rounded-lg hover:bg-red-50 dark:hover:bg-red-900/20">{t.analytics_wp_clear}</button>
          <span className="text-xs text-slate-400">💾 {t.analytics_wp_saved}</span>
        </div>
      </>
    );
  };

  const body = () => {
    if (module === 0) return renderM0();
    if (module === 1) return renderM1();
    if (module === 2) return renderM2();
    if (module === 3) return renderM3();
    if (module === 4) return renderM4();
    if (module === 5) return renderM5();
    if (module === 6) return renderM6();
    if (module === 7) return renderM7();
    if (module === IDX_LAB) return renderLab();
    if (module === IDX_RES) return renderRes();
    return renderAna();
  };
  const cur = modulesList[module];

  return (
    <div className="min-h-screen flex flex-col pt-16 overflow-x-hidden">
      <header className="fixed top-0 left-0 right-0 h-16 bg-[#004030] dark:bg-slate-900 text-white z-50 shadow-lg border-b border-[#D8C3A5]/30">
        <div className="max-w-7xl mx-auto px-3 sm:px-4 h-16 flex items-center justify-between">
          <div className="flex items-center gap-1 sm:gap-2 min-w-0">
            <div className="relative" ref={menuRef}>
              <button onClick={() => setMenuOpen(!menuOpen)} className="p-2 hover:bg-white/10 rounded-lg" aria-label={t.nav_modules}>{menuOpen ? <IconX/> : <IconMenu/>}</button>
              {menuOpen && (
                <div className="absolute top-full left-0 mt-1 w-72 max-w-[calc(100vw-2rem)] max-h-[calc(100vh-5rem)] overflow-y-auto bg-white dark:bg-slate-800 rounded-xl shadow-2xl border border-slate-200 dark:border-slate-700 z-[100]">
                  {modulesList.map(m => (
                    <button key={m.id} onClick={() => go(m.id)}
                      className={`w-full flex items-center gap-3 px-4 py-3 text-sm transition ${module === m.id ? 'bg-[#004030]/10 dark:bg-[#D8C3A5]/10 text-[#004030] dark:text-[#D8C3A5] font-bold' : 'text-slate-700 dark:text-slate-200 hover:bg-slate-100 dark:hover:bg-slate-700'}`}>
                      <span className="ui-decoration">{m.icon}</span><span className="truncate flex-1 text-left">{m.title}</span>
                      {m.kind && <span className={`text-[10px] font-bold px-1.5 py-0.5 rounded shrink-0 ${m.kind === 'P' ? 'bg-sky-100 text-sky-800 dark:bg-sky-900/40 dark:text-sky-200' : 'bg-[#D8C3A5]/40 text-[#004030] dark:bg-[#D8C3A5]/20 dark:text-[#D8C3A5]'}`}>{m.kind}</span>}
                    </button>
                  ))}
                </div>
              )}
            </div>
            <button onClick={() => go(0)} className="p-2 hover:bg-white/10 rounded-lg" aria-label={t.nav_home}><IconHome size={18}/></button>
            <button onClick={() => window.scrollTo({top:0,behavior:'smooth'})} className="flex items-center gap-2 min-w-0">
              <span className="font-serif font-black text-[#D8C3A5] text-lg tracking-widest">{t.brand}</span>
              <span className="hidden sm:inline font-serif font-bold text-sm md:text-base truncate">{t.title}</span>
            </button>
          </div>
          <div className="flex items-center gap-1 sm:gap-2">
            <button onClick={() => handleTTS(ttsState === 'playing' ? 'pause' : 'play')} className="p-2 hover:bg-white/10 rounded-lg" aria-label={t.audio_read}>{ttsState === 'playing' ? <IconPause size={18}/> : <IconPlay size={18}/>}</button>
            <button onClick={() => handleTTS('stop')} className="p-2 hover:bg-white/10 rounded-lg" aria-label="Stop"><IconSquare size={18}/></button>
            <button onClick={() => setLang(lang === 'en' ? 'zh' : 'en')} className="px-2 py-2 hover:bg-white/10 rounded-lg flex items-center gap-1"><IconGlobe size={18}/><span className="text-xs font-bold">{lang === 'en' ? '中' : 'EN'}</span></button>
            <button onClick={() => setIsDark(!isDark)} className="p-2 hover:bg-white/10 rounded-lg" aria-label="Theme">{isDark ? <IconSun size={18}/> : <IconMoon size={18}/>}</button>
          </div>
        </div>
      </header>

      <div className="flex-1 w-full max-w-7xl mx-auto flex">
        <aside className="hidden md:block w-64 shrink-0 border-r border-slate-200 dark:border-slate-700 py-8 px-3">
          <p className="text-xs font-bold uppercase tracking-wider text-slate-400 px-3 mb-3">{t.nav_modules}</p>
          {modulesList.map(m => (
            <button key={m.id} onClick={() => go(m.id)}
              className={`w-full flex items-center gap-2 px-3 py-2.5 rounded-lg text-sm mb-1 transition ${module === m.id ? 'bg-[#004030]/10 dark:bg-[#D8C3A5]/10 text-[#004030] dark:text-[#D8C3A5] font-bold' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}`}>
              <span className="ui-decoration shrink-0">{m.icon}</span>
              <span className="truncate text-left flex-1">{m.title}</span>
              {m.kind && <span className={`text-[10px] font-bold px-1 rounded shrink-0 ${m.kind === 'P' ? 'text-sky-700 dark:text-sky-300' : 'text-[#004030] dark:text-[#D8C3A5]'}`}>{m.kind}</span>}
            </button>
          ))}
          <div className="mt-6 px-3 space-y-3">
            <div>
              <p className="text-xs text-slate-400 mb-1">{t.analytics_pct_personal}</p>
              <div className="h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden"><div className={`h-full ${pctPersonal === 100 ? 'bg-green-500' : 'bg-sky-600 dark:bg-sky-400'}`} style={{width: pctPersonal + '%'}}></div></div>
              <p className="text-xs font-bold text-sky-700 dark:text-sky-300 mt-1">{pctPersonal}%</p>
            </div>
            <div>
              <p className="text-xs text-slate-400 mb-1">{t.analytics_pct_group}</p>
              <div className="h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden"><div className={`h-full ${pctGroup === 100 ? 'bg-green-500' : 'bg-[#004030] dark:bg-[#D8C3A5]'}`} style={{width: pctGroup + '%'}}></div></div>
              <p className="text-xs font-bold text-[#004030] dark:text-[#D8C3A5] mt-1">{pctGroup}%</p>
            </div>
          </div>
        </aside>

        <main className="flex-1 min-w-0 py-8 px-4 sm:px-6">
          <div key={`${module}-${lang}`} className="space-y-6 text-lg leading-relaxed text-slate-700 dark:text-slate-300 animate-fade-in">
            {module !== 0 && (
              <div>
                <H2 icon={cur.icon} number={cur.num}>{module <= NUM_LEARN ? t[`m${module}_title`] : module === IDX_LAB ? t.mlab_title : module === IDX_RES ? t.mres_title : t.analytics_title}</H2>
                {cur.kind && <Badge kind={cur.kind} t={t} />}
              </div>
            )}
            {body()}
            <div className="mt-12 flex justify-between items-center pt-8 border-t border-slate-300 dark:border-slate-700 no-print">
              <button onClick={() => go(Math.max(0, module-1))} disabled={module === 0}
                className="px-5 py-2.5 border border-slate-300 dark:border-slate-600 rounded-lg text-sm font-bold hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-0">← {t.nav_prev}</button>
              <button onClick={() => go(Math.min(TOTAL-1, module+1))} disabled={module === TOTAL-1}
                className="px-5 py-2.5 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] rounded-lg text-sm font-bold disabled:opacity-0">{t.nav_next} →</button>
            </div>
          </div>
        </main>
      </div>

      <footer className="h-8 bg-[#004030] flex items-center justify-between px-4 shrink-0">
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs truncate">{t.date} · {t.copyright}</span>
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs flex items-center gap-3 shrink-0">
          <span className="hidden sm:inline">{t.architect_label}&nbsp;<a href={t.architect_url} target="_blank" rel="noopener noreferrer" className="text-[#D8C3A5] hover:text-white underline">Prof. Shihmin Lo</a></span>
          <button onClick={() => window.scrollTo({top:0,behavior:'smooth'})} className="text-[#D8C3A5] hover:text-white font-bold">Top ↑</button>
        </span>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
