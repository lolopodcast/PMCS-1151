};

  const dec = atob(token); let r = '';
  for (let i = 0; i < dec.length; i++) r += String.fromCharCode(dec.charCodeAt(i) ^ ((i + 7) * 3 & 0xFF));

const BLAME_RE = {
  zh: [/某某/g, /沒有?做/g, /忘[了記]/g, /的錯/g, /怪(他|她|罪)/g, /推[卸諉]/g, /擺爛/g, /不配合/g,
       /沒(交|回|寫|跑|來|把)/g, /缺席/g, /遲到/g, /害(我們|我|大家)/g,
       /(他|她|組員|同學|學長|助教)[^，。；\n]{0,6}(沒|未|漏|忘)/g],
  en: [/\bdidn'?t\b/gi, /\bdid not\b/gi, /\bfailed to\b/gi, /\bblam\w+\b/gi,
       /\b(his|her|their|your) fault\b/gi, /\bforgot to\b/gi,
       /\bnever (did|bothered|sent|submitted|replied|showed up)\b/gi,
       /\blazy\b/gi, /\bnobody bothered\b/gi, /\bhe (never|didn'?t)\b/gi, /\bshe (never|didn'?t)\b/gi]
};
const detectBlame = (text, lang) => {
  const hits = [];
  const src = String(text || '');
  if (!src.trim()) return hits;
  (BLAME_RE[lang] || []).forEach(re => {
    const r = new RegExp(re.source, re.flags);
    let m;
    while ((m = r.exec(src)) !== null) {
      if (m[0] && hits.indexOf(m[0]) === -1) hits.push(m[0]);
      if (m.index === r.lastIndex) r.lastIndex++;
      if (hits.length > 8) break;
    }
  });
  return hits;
};

    m3_highlights: ["做對一件","做錯一件","下次會改","主詞是事件"],
    m3_deep: "改寫的方法很機械：把主詞從人換成事件。「某某忘記提交」要寫成「KB 更新後沒有提交步驟的檢查點」；「他都不回訊息」要寫成「沒有約定回覆時限，訊息平均隔一天以上才收到回應」。這不是客氣，是為了讓原因留得下來——一旦句子指名，剩下的時間會全部用在自我辯護上，真正的原因反而被藏起來。第三問請寫成一個可以執行的動作，寫得出「下一次在哪一步、加上什麼」，而不是「以後會更注意」。系統會即時標出可能的指名措辭，被標到不代表你錯了，代表那一句值得再讀一次。",

    m5_deep: "彙整方式有一條硬性規定：本週彙整人不得把六份個人匯出檔全部丟給 AI 叫它總結。Context Engineering 的核心是選取，不是全丟。比對集合有六項——公開網址、排程與時區、第一次心跳、失敗通知、金鑰治理、出處完整性——你們只能挑三項，而且要挑未通過或有疑慮的那三項；六個人都打勾的項目比對不出東西。判定「會不會擋住 W16 驗收」時請對著五項驗收看：D／D+1／D+3 三日成果、心跳確實在跑、可設定性、安全治理、出處完整性。補救分工那一格要寫出人名與時間點，因為 D+1 到 D+3 之間沒有課，沒有寫下來的事情就不會發生。",

    m0_title: "How to Use This Worksheet",
    m0_intro: "This is the W15 worksheet for PMCS, and it is unlike the ones before it: this week's class day is the whole cohort's D day, so it is not homework you complete afterwards but a live record of the day. Fill sections 2 and 3 in as you work, in the room — you are putting the system live right now, and what you write is the state at this moment. The main material is T6 · CTRL, Project Control and Delivery, read for the second time, and this time only module M7, the delivery stretch: delivery, acceptance and the retrospective. That module carries three toolsets: performance evaluation with its four purposes, two timings, four principles and six indicators; earned value management, turning planned value, earned value and actual cost into schedule variance, cost variance, the two indices and the estimate at completion; and the five-step post-project review with its four best practices. It ends in organisational knowledge management — when the executor is an agent, the schedule is resource allocation, QC feedback is quality control, the heartbeat log is acceptance evidence, and the knowledge base is knowledge management. The class runs like this: every group goes live and verifies a first heartbeat with the teacher watching, two groups present, and the rest is blocker diagnosis. Before you leave the room, sections 2, 3 and 6 must be complete. Sections 2 to 4 are filled by each person and are not submitted; sections 5 to 7 are decided together and submitted with the group file.",
    m0_why: "Why go live here today rather than at home afterwards?",

    m1_nav: "1. Group & Roles", m1_title: "Group and the W16 Pitch Split",
    m1_overview: "Fill in the administrative details first, then settle the W16 pitch split here in class. Each group gets 10 minutes and every member must speak for one to two minutes — this section pins down who covers what and for how long, so nobody is being volunteered at the podium next week.",

    m2_nav: "2. D Day Go-Live Check", m2_title: "D Day Go-Live Check: Verify Each Item Right Now",
    m2_overview: "Fill this in during class rather than at home. The six items are the minimum your own part has to clear today: the address opens, the schedule is set with the right time zone, a first heartbeat left a record, the failure alert reaches a person, no key sits in the front end or the repo, and every item of output carries its source. Check each one now; do not leave a failing item alone — write what is missing and the time by which you will fix it.",
    m2_highlights: ["Six checks","Verified in the room","A time for every gap","D day as it stands"],
    m2_deep: "\"I'll do it in a minute\" is the one thing this section exists to stop. Anything you do not verify today comes back on the Saturday of D+3 in the most expensive way available: nobody is at a computer, and a schedule that did not run simply did not run — that day cannot be recovered. So a failing item is not the problem; a failing item with no time attached is. Write the fix time as a point in time, such as \"before 21:00 tonight\", not \"as soon as possible\" — that is not a time, it is a wish. In the evidence cell write what you saw rather than what you believe: the run number in the log, the alert sitting in the inbox, the page actually opening in a private window.",
    m2_svg_layer: "D DAY · six go-live gates",
    m2_svg_cap: "All six gates pass and delivery stands; a gate that fails but carries a fix time makes it a delivery with known issues",
    m2_terms: [
      { front: "Go live", back: "The moment a system stops being a test and starts serving other people. One test decides it: somebody else can open it and it moves on its own. Anything that runs only when you press a button is not live." },
      { front: "Acceptance criteria", back: "A standard agreed in advance that somebody else can recompute or reproduce. \"I think it went fine\" is not one; \"three consecutive days of output, every item carrying a source link\" is." },
      { front: "Handover", back: "Passing the system to whoever takes it on. What you hand over is not somebody's memory but files — the README for deployment and scheduling, the knowledge base for sources and rules — so a different person can still change it." },
      { front: "Retrospective", back: "Five steps: preparation, the meeting, analysis, the report, and sharing. Four best practices go with it: an open atmosphere, facts and data, no blame, and conversion into an action plan." },
      { front: "Lessons learned", back: "The output of a retrospective and the input to knowledge management. Written as events and processes it survives; written as names it leaves only feeling, and next term nobody can use it." },
      { front: "Unattended run", back: "A run that completes while nobody is at a computer. D+3 falls on a Saturday precisely to test this — running by hand is not evidence that it runs by itself." },
      { front: "Rollback", back: "Returning the system to the last working version. Know how to go back before you go live, or the moment something breaks you will have nothing but panic." },
      { front: "Known issue", back: "A defect you know about at delivery and wrote down. A written defect is a managed risk; an unwritten one is a surprise on acceptance day. Having no known issues at all is itself a red flag." }
    ],
    m2_q: [
      { q: "W16 asks for output from D, D+1 and D+3. Why does D+3 deliberately fall on a Saturday?",
        opts: ["Nobody is at a computer, so the run is unattended","Weekend sources refresh more completely than weekdays","Saturday is exactly three days on and easier to recall","Cloud schedulers have shorter queues at the weekend"],
        ans: _A0, exp: "The common illusion is that a successful manual run proves it runs by itself. On Saturday nobody intervenes, so the output really was produced automatically." },
      { q: "What is the concrete way to \"avoid blame\" among the four review best practices?",
        opts: ["Publish the minutes without any names in them","Invite only members with no direct responsibility","Cap everyone's speaking time so arguments stay short","Make the subject an event or a process, not a person"],
        ans: _A3, exp: "Attend to the problem, not the person: rewrite \"he forgot to commit\" as \"there is no checkpoint for committing after a knowledge-base edit\"." },
      { q: "In organisational knowledge management, what is the core function of a retrospective?",
        opts: ["Turning explicit knowledge back into personal intuition","Filing the project documents in chronological order","Converting tacit knowledge into explicit, readable form","Splitting success and failure factors between two people"],
        ans: _A2, exp: "Tacit knowledge is personal experience and intuition; only once written into documents and processes does it survive, which is exactly what the knowledge base is for." },
      { q: "Which of these makes the best heartbeat evidence for W16?",
        opts: ["A screenshot of the page taken on launch day","The scheduler's run log or the commit log","A member's message in the group chat saying it worked","The slide that describes how the schedule is set"],
        ans: _A1, exp: "A screenshot cannot prove it runs by itself. A run log carries timestamps and outcomes and can be reopened by somebody else, which makes it reproducible." }
    ],
    m2_wrapup: "Checkpoint: all six items carry a verdict, and every failing one states what is missing and the time by which it will be fixed.",

    m3_nav: "3. Three Retro Questions", m3_title: "Three Retro Questions: Events as Subjects, Never Names",
    m3_overview: "This is your personal retrospective for the term, with the wording constrained by the four best practices from T6 module M7: an open atmosphere, facts and data, no blame, and conversion into an action plan. The three questions are short — one thing I got right this term, one thing I got wrong, one thing I will change next time — but one rule is absolute: the subject of every sentence must be an event or a process, never a person's name.",
    m3_highlights: ["One thing right","One thing wrong","One change","Events as subjects"],
    m3_deep: "The rewrite is mechanical: swap the person for the event. \"He forgot to commit\" becomes \"there is no checkpoint for committing after a knowledge-base edit\"; \"she never replies\" becomes \"no reply window was agreed, so messages averaged more than a day before an answer\". This is not politeness, it is how the cause survives — once a sentence names somebody, the rest of the time goes into self-defence and the real cause stays hidden. Write the third answer as an action you can actually take, naming the step and what gets added to it, rather than \"I will pay more attention next time\". The page flags possible naming language as you type; being flagged does not mean you are wrong, it means that sentence is worth reading once more.",
    m3_right_label: "1. One thing I got right this term (subject: an event or a process)",
    m3_right_ph: "e.g. Re-running the fetch test over the knowledge-base source list every Wednesday evening meant a source redesign surfaced on the Thursday instead of the day before submission.",
    m3_wrong_label: "2. One thing I got wrong this term (subject: an event or a process)",
    m3_wrong_ph: "e.g. Nobody opened the run log for three weeks after the schedule was set, and the failure alert went to a single mailbox that nobody was reading, so the whole period had no monitoring at all.",
    m3_next_label: "3. One thing I will change next time (write it as an action)",
    m3_next_ph: "e.g. Next time a second recipient goes on the failure alert on deployment day itself, and the run log gets a fixed Monday check written into the operations section of the README.",
    m3_blame_warn: "⚠ Possible naming or blame language detected: {hits}. Rewrite the sentence with an event or a process as its subject.",
    m3_blame_ok: "✓ No naming or blame pattern detected in this sentence.",
    m3_wrapup: "Checkpoint: all three sentences take an event or a process as their subject, none names a person, and the third is written as an action you can take.",

    m5_nav: "5. Group Synthesis", m5_title: "Group Synthesis: Comparing Six Go-Live Results",
    m5_overview: "Six people have each run the six checks from section 2. Put the results on the table. The work here is judgement: which of them would genuinely block acceptance in W16, and which merely look untidy. Then hand out the repair work for the stretch between D+1 and D+3, with an owner and a time for each item.",
    m5_highlights: ["Three of six","Blocking or not","Select, do not dump","Repair assignments"],
    m5_deep: "One rule is mandatory here: this week's compiler must NOT dump all six individual exports into an AI and ask for a summary. The core of Context Engineering is selection, not dumping. The comparison set has six items — public address, schedule and time zone, first heartbeat, failure alert, key governance, source integrity — and you may pick only three, which should be three that failed or that people are unsure about; items everyone ticked teach you nothing. When you judge what blocks W16, judge against the five acceptance items: three days of output at D, D+1 and D+3, a heartbeat that really runs, configurability, governance, and source integrity. The repair cell needs names and times, because there is no class between D+1 and D+3, and anything not written down will not happen.",
    m5_focus_label: "The three items we chose to compare (tick three)",
    m5_focus_why: "Why these three, and why did we skip the other three?",
    m5_focus_why_ph: "e.g. All six public addresses opened, so there was nothing to compare; the real spread was in the first heartbeat and the failure alert, plus key governance, where two people were unsure whether the commit history is clean.",
    m5_gap_label: "After comparing the three side by side, which one diverged most or left people least sure, and how?",
    m5_gap_ph: "e.g. The first heartbeat. Two people have a run number, three have only a screenshot, and one ran it by hand on his own laptop with nothing in the cloud scheduler at all. Inside one group, \"it ran\" means three different things.",
    m5_evidence_label: "Two concrete examples from the six that support the judgement above",
    m5_evidence_ph: "e.g. A pasted run #37 with a timestamp; C pasted a terminal screenshot from a laptop with no cloud record at all. Against the W16 bar, one passes and the other does not.",
    m5_block_label: "Which item would genuinely block acceptance in W16? Argue it against the five acceptance items",
    m5_block_ph: "e.g. The first heartbeat. W16 checks run logs for D, D+1 and D+3, above all the Saturday entry; with no cloud run log, three-day output and the heartbeat both fail at once, and no amount of quality in the other three makes that up.",
    m5_fix_label: "Repair assignments for D+1 to D+3 (who, what, by when)",
    m5_fix_ph: "e.g.\n1. Ah-Chi: move the schedule into the cloud and fire it once by hand before 21:00 today (D), then post the run number to the group chat.\n2. Mei: confirm before 09:00 on D+1 that the automatic run appeared, and report to the group if it did not.\n3. Ta-Ming: confirm the Saturday entry before 10:00 on D+3 and turn all three records into one slide for W16.",
    m5_fix_note: "There is no class between D+1 and D+3, so this cell is the group's only schedule. Write names and times; \"everyone keeps an eye on it\" is not an assignment.",
    m5_wrapup: "Checkpoint: only three items were compared (nothing was dumped wholesale into an AI), and the repair assignments name an owner and a time.",

    m6_nav: "6. Build by the Table", m6_title: "Build by the Table: The D Day Check and the Handover",
    m6_overview: "Register today's result as one shared record for the group. What you write here is the starting point for W16 acceptance and the basis of the teacher's on-the-spot witness. Complete it before you leave the room.",
    m6_highlights: ["Public address","Launch status","First heartbeat","Handover","Known issues"],
    m6_deep: "Three things deserve care. First, the public address must be a real address, and you should open it in a private window right now — this cell is the one entry point the whole class shares, and getting it wrong is the same as not submitting. Second, the launch status is plotted by the aggregator as a class-wide distribution, so answer honestly; choosing \"not live yet\" costs you nothing, hiding it costs you the one on-the-spot diagnosis today can give you. Third, the known-issue list needs at least one entry — no known issues is itself a red flag and usually means it has never really run. In the handover cell name both a person and the file they would rely on: a name alone does not count, because people graduate and files do not.",

const parseSdlKb = (text) => {
  try {
    const t = String(text || '').replace(/\r\n/g, '\n').trim();
    if (!t) return { ok: false, error: 'empty' };
    const fm = t.match(/^---\n([\s\S]*?)\n---/);
    const meta = {};
    if (fm) {
      fm[1].split('\n').forEach(line => {
        if (/^\s/.test(line)) return;               // skip nested (sources / interaction)
        const m = line.match(/^([A-Za-z_]+):\s*(.*)$/);
        if (m) meta[m[1]] = m[2].replace(/^["']|["']$/g, '').trim();
      });
    }
    const sections = {};
    const parts = t.split(/^##\s*§/m);
    parts.shift();
    parts.forEach(part => {
      const n = part.match(/^(\d)/);
      if (!n) return;
      sections['s' + n[1]] = part.replace(/^\d[^\n]*\n?/, '').trim();
    });
    const hasAny = Object.keys(meta).length > 0 || Object.keys(sections).length > 0;
    if (!hasAny) return { ok: false, error: 'format' };
    return { ok: true, meta, sections, raw: t };
  } catch (e) { return { ok: false, error: 'format' }; }
};

const SdlImport = ({ t, sdl, onImport, onClear }) => {
  const [text, setText] = useState('');
  const [msg, setMsg] = useState(null);
  const fileRef = useRef(null);
  const doParse = (raw) => {
    const r = parseSdlKb(raw);
    if (!r.ok) { setMsg({ ok: false, text: r.error === 'empty' ? t.sdl_err_empty : t.sdl_err_format }); return; }
    onImport(r);
    setMsg({ ok: true, text: t.sdl_ok });
    setText('');
  };
  const onFile = (e) => {
    const f = e.target.files && e.target.files[0];
    if (!f) return;
    const rd = new FileReader();
    rd.onload = () => doParse(rd.result);
    rd.readAsText(f);
    e.target.value = '';
  };
  return (
    <div className="rounded-xl border-2 border-sky-200 dark:border-sky-800/60 bg-sky-50/50 dark:bg-sky-900/10 p-5">
      <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5]">{t.sdl_title}</h3>
      <p className="text-sm text-slate-500 dark:text-slate-400 mt-1 mb-3 leading-relaxed">{t.sdl_desc}</p>
      {sdl ? (
        <div className="rounded-lg bg-white dark:bg-slate-800 border border-slate-200 dark:border-slate-700 p-4">
          <p className="text-sm font-bold text-green-700 dark:text-green-400">{t.sdl_loaded}</p>
          <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 break-all">
            {[sdl.meta.course, sdl.meta.semester, sdl.meta.week, sdl.meta.topic].filter(Boolean).join(' · ')}
            {sdl.meta.student ? ' · ' + sdl.meta.student : ''}{sdl.meta.group ? ' · ' + sdl.meta.group : ''}
          </p>
          <button onClick={onClear} className="mt-3 px-3 py-1.5 text-xs border border-red-400 text-red-600 dark:text-red-400 rounded-lg">{t.sdl_clear}</button>
        </div>
      ) : (
        <>
          <textarea rows={4} className={inputCls} placeholder={t.sdl_ph} value={text} onChange={e => setText(e.target.value)} />
          <div className="flex flex-wrap items-center gap-3 mt-3">
            <button onClick={() => doParse(text)} className="px-4 py-2 text-sm bg-sky-700 dark:bg-sky-300 text-white dark:text-sky-950 font-bold rounded-lg">{t.sdl_parse}</button>
            <button onClick={() => fileRef.current && fileRef.current.click()} className="px-4 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg">{t.sdl_file}</button>
            <input ref={fileRef} type="file" accept=".md,.markdown,.txt" onChange={onFile} className="hidden" />
          </div>
        </>
      )}
      {msg && <p className={`text-xs mt-2 ${msg.ok ? 'text-green-600 dark:text-green-400' : 'text-red-500 dark:text-red-400'}`}>{msg.text}</p>}
    </div>
  );
};

  const groupSize = 2;
  const totalGroups = Math.ceil(terms.length / groupSize);
  const currentCardIndices = shuffledOrder.slice(groupIdx*groupSize, groupIdx*groupSize + groupSize);
  useEffect(() => {
    const ns = new Set(shownSet); currentCardIndices.forEach(i => ns.add(i));
    if (ns.size !== shownSet.size) setShownSet(ns);
  }, [groupIdx]);
  const handleFlip = (i) => {
    setFlipped(f => ({...f, [i]: !f[i]}));
    if (!readSet.has(i)) { const nr = new Set(readSet); nr.add(i); setReadSet(nr); onCardRead && onCardRead(moduleId, nr.size, shownSet.size, terms.length); }
  };
  const statusText = t.flip_status.replace('{read}', readSet.size).replace('{shown}', shownSet.size).replace('{total}', terms.length);
  return (
    <div className="mt-8">
      <h3 className="text-lg font-bold uppercase tracking-wider text-slate-500 mb-2">{t.key_terms}</h3>
      <p className="text-sm text-slate-400 mb-4">{statusText}</p>
      <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
        {currentCardIndices.map(i => (
          <div key={i} className="perspective cursor-pointer h-44" onClick={() => handleFlip(i)}>
            <div className={`transform-style-3d relative w-full h-full transition-transform duration-500 ${flipped[i] ? 'rotate-y-180' : ''}`}>
              <div className="backface-hidden absolute inset-0 bg-white dark:bg-slate-800 rounded-xl p-4 flex flex-col items-center justify-center border border-slate-200 dark:border-slate-700 shadow-sm">
                <p className="font-serif font-bold text-center text-[#004030] dark:text-[#D8C3A5]">{terms[i].front}</p>
                <p className="text-xs text-slate-400 mt-2">{t.flip_prompt}</p>
              </div>
              <div className="backface-hidden rotate-y-180 absolute inset-0 bg-[#004030] dark:bg-slate-700 rounded-xl p-4 flex items-center justify-center overflow-y-auto">
                <p className="text-sm text-center text-[#D8C3A5] dark:text-slate-200 leading-relaxed">{terms[i].back}</p>
              </div>
            </div>
          </div>
        ))}
      </div>
      <div className="flex items-center gap-3 mt-4">
        <button onClick={() => { setGroupIdx(0); setFlipped({}); }} className="px-4 py-2 text-sm border border-slate-300 dark:border-slate-600 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-700">{t.flip_retry}</button>
        <button onClick={() => groupIdx < totalGroups-1 && setGroupIdx(groupIdx+1)} disabled={groupIdx >= totalGroups-1}
          className="px-4 py-2 text-sm bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.flip_next}</button>
      </div>
    </div>
  );
};

/* ================= ModuleQuiz ================= */
const ModuleQuiz = ({ questions, t, moduleId, onQuizSubmit }) => {
  const [selected, setSelected] = useState({});
  const [submitted, setSubmitted] = useState({});
  const [groupIdx, setGroupIdx] = useState(0);
  const groupSize = 2;
  const [quizIndices] = useState(() => [...Array(questions.length).keys()].sort(() => Math.random() - 0.5));
  const totalGroups = Math.ceil(quizIndices.length / groupSize);
  const [shuffledMaps] = useState(() => quizIndices.map(qi => [...Array(questions[qi].opts.length).keys()].sort(() => Math.random() - 0.5)));
  const computeCorrect = () => { let c = 0; quizIndices.forEach((qIdx, qi) => { if (selected[qi] !== undefined && shuffledMaps[qi][selected[qi]] === _d(questions[qIdx].ans)) c++; }); return c; };
  const statusText = t.quiz_status.replace('{correct}', computeCorrect()).replace('{answered}', Object.keys(selected).length).replace('{total}', quizIndices.length);
  const currentStart = groupIdx * groupSize;
  const currentIndices = quizIndices.slice(currentStart, currentStart + groupSize);
  const handleGroupSubmit = () => {
    if (!currentIndices.every((_, i) => selected[currentStart+i] !== undefined)) return;
    setSubmitted(s => ({...s, [groupIdx]: true}));
    if (groupIdx === totalGroups - 1 || Object.keys(submitted).length + 1 === totalGroups) {
      const wrong = []; let correct = 0;
      quizIndices.forEach((qIdx, qi) => {
        if (selected[qi] === undefined) return;
        if (shuffledMaps[qi][selected[qi]] === _d(questions[qIdx].ans)) correct++; else wrong.push(questions[qIdx].q);
      });
      onQuizSubmit(moduleId, correct, quizIndices.length, wrong);
    }
  };
  return (
    <div className="mt-8 bg-slate-50 dark:bg-slate-900/50 rounded-2xl p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="text-lg font-bold font-serif text-[#004030] dark:text-[#D8C3A5] mb-2">{t.quiz_title}</h3>
      <p className="text-sm text-slate-400 mb-6">{statusText}</p>
      {currentIndices.map((qIdx, localI) => {
        const qi = currentStart + localI, q = questions[qIdx], sMap = shuffledMaps[qi], isSub = !!submitted[groupIdx];
        return (
          <div key={qIdx} className="mb-6">
            <p className="font-bold mb-3">{qi+1}. {q.q}</p>
            <div className="space-y-2">
              {sMap.map((origIdx, dIdx) => {
                const isCorrect = origIdx === _d(q.ans), isSel = selected[qi] === dIdx;
                return (
                  <button key={dIdx} onClick={() => !isSub && setSelected(s => ({...s, [qi]: dIdx}))}
                    className={`w-full text-left px-4 py-3 rounded-lg border transition-all text-sm ${isSub
                      ? isCorrect ? 'bg-green-100 border-green-500 dark:bg-green-900/30'
                        : isSel ? 'bg-red-100 border-red-400 dark:bg-red-900/30' : 'border-slate-200 dark:border-slate-700'
                      : isSel ? 'border-[#004030] dark:border-[#D8C3A5] bg-[#004030]/5' : 'border-slate-200 dark:border-slate-700 hover:border-slate-400'}`}>
                    {q.opts[origIdx]}
                  </button>
                );
              })}
            </div>
            {isSub && (
              <p className={`mt-2 text-sm italic ${shuffledMaps[qi][selected[qi]] === _d(q.ans) ? 'text-green-600 dark:text-green-400' : 'text-red-500 dark:text-red-400'}`}>
                {shuffledMaps[qi][selected[qi]] === _d(q.ans) ? `✓ ${t.correct}` : `✗ ${t.incorrect}`} — {t.explanation}：{q.exp}
              </p>
            )}
          </div>
        );
      })}
      <div className="flex items-center gap-3 flex-wrap">
        {!submitted[groupIdx]
          ? <button onClick={handleGroupSubmit} disabled={!currentIndices.every((_,i) => selected[currentStart+i] !== undefined)}
              className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg disabled:opacity-40">{t.submit}</button>
          : <>
              {groupIdx < totalGroups-1 && <button onClick={() => setGroupIdx(groupIdx+1)} className="px-6 py-2 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] font-bold rounded-lg">{t.quiz_next}</button>}
              <button onClick={() => { setGroupIdx(0); setSelected({}); setSubmitted({}); }} className="px-6 py-2 border border-[#004030] dark:border-[#D8C3A5] text-[#004030] dark:text-[#D8C3A5] font-bold rounded-lg">{t.quiz_retry}</button>
            </>}
      </div>
    </div>
  );
};

/* ---- Lab 2：心跳紀錄貼板（跨週末判定） ----
   預載範例必須跟著語言切換，但只要學生動過任何一格就永不覆寫；
   localStorage 還原回來的內容也一律視為學生的作品。 */
const HB_KEYS = ['lbl','date','time','res','note'];
const HB_SEED = {
  zh: [
    { lbl:'D',   date:'2026-12-16', time:'14:12', res:0, note:'課堂現場手動觸發，輸出三則、皆含來源連結' },
    { lbl:'D+1', date:'2026-12-17', time:'07:00', res:1, note:'排程自動觸發，來源 B 逾時，降級為兩則並標註缺漏' },
    { lbl:'D+3', date:'2026-12-19', time:'07:00', res:3, note:'尚未執行——這一天沒有人在電腦前，是驗收的重點' }
  ],
  en: [
    { lbl:'D',   date:'2026-12-16', time:'14:12', res:0, note:'Fired by hand in class; three items, all with source links' },
    { lbl:'D+1', date:'2026-12-17', time:'07:00', res:1, note:'Fired by the schedule; source B timed out, degraded to two items with the gap flagged' },
    { lbl:'D+3', date:'2026-12-19', time:'07:00', res:3, note:'Not run yet — nobody is at a computer that day, which is the whole point' }
  ]
};
const hbSeed = (lg) => (HB_SEED[lg] || HB_SEED.en).map(r => ({ ...r }));
const hbIsPristine = (rs, lg) => {
  const s = HB_SEED[lg] || [];
  if (!Array.isArray(rs) || rs.length !== s.length) return false;
  return rs.every((r, i) => r && HB_KEYS.every(k => r[k] === s[i][k]));
};
const hbPristineLang = (rs) => ['zh','en'].filter(lg => hbIsPristine(rs, lg))[0] || null;
const hbParseDate = (s) => {
  const m = /^(\d{4})-(\d{1,2})-(\d{1,2})$/.exec(String(s || '').trim());
  if (!m) return null;
  const y = +m[1], mo = +m[2], d = +m[3];
  const dt = new Date(y, mo - 1, d);
  if (dt.getFullYear() !== y || dt.getMonth() !== mo - 1 || dt.getDate() !== d) return null;
  return dt;
};
const isoOf = (dt) => `${dt.getFullYear()}-${pad2(dt.getMonth()+1)}-${pad2(dt.getDate())}`;

const LabHeartbeat = ({ lang, t, state, setState, onTouch }) => {
  const stored = state && Array.isArray(state.rows) ? state.rows : null;
  const pl = stored ? hbPristineLang(stored) : null;
  /* 未存過 → 用目前語言的範例；存過但仍與某語言的原始範例一字不差 → 跟著語言走；
     只要動過任何一格（pl 為 null）→ 原樣保留，永不覆寫 */
  const rows = !stored ? hbSeed(lang) : (pl && pl !== lang ? hbSeed(lang) : stored);
  const write = (next) => { setState({ ...(state || {}), rows: next }); onTouch && onTouch(); };
  const upd = (i, k, val) => write(rows.map((r, j) => j === i ? { ...r, [k]: val } : r));
  const del = (i) => write(rows.filter((_, j) => j !== i));
  const add = () => write([...rows, { lbl:'', date:'', time:'', res:3, note:'' }]);

  const parsed = rows.map(r => ({ row: r, dt: hbParseDate(r.date) }));
  const good = parsed.filter(p => p.dt);
  const bad = parsed.length - good.length;
  const wdName = (dt) => t.lab2_weekday[dt.getDay()];
  const isWeekend = (dt) => dt.getDay() === 0 || dt.getDay() === 6;
  const dayLabel = (dt) => lang === 'zh' ? `${isoOf(dt)}（${wdName(dt)}）` : `${isoOf(dt)} (${wdName(dt)})`;
  const joiner = lang === 'zh' ? '、' : ', ';

  let panel = null;
  if (good.length < 2) {
    panel = <p className="text-sm text-slate-500 dark:text-slate-400">{t.lab2_need}</p>;
  } else {
    const times = good.map(p => p.dt.getTime());
    const min = new Date(Math.min(...times)), max = new Date(Math.max(...times));
    const spanDays = Math.round((max.getTime() - min.getTime()) / DAY_MS) + 1;
    const weekendInSpan = [];
    const cur = new Date(min.getFullYear(), min.getMonth(), min.getDate());
    for (let i = 0; i < spanDays && i < 400; i++) {
      if (isWeekend(cur)) weekendInSpan.push(dayLabel(cur));
      cur.setDate(cur.getDate() + 1);
    }
    const weekendRuns = good.filter(p => isWeekend(p.dt) && (p.row.res === 0 || p.row.res === 1));
    const spans = weekendInSpan.length > 0;
    const unattended = weekendRuns.length > 0;
    panel = (
      <div className="space-y-2">
        <p className="text-sm text-slate-600 dark:text-slate-300">
          {t.lab2_range.replace('{from}', isoOf(min)).replace('{to}', isoOf(max)).replace('{n}', spanDays).replace('{w}', weekendInSpan.length)}
        </p>
        <p className={`text-sm font-bold ${spans ? 'text-green-600 dark:text-green-400' : 'text-amber-600 dark:text-amber-400'}`}>
          {spans ? t.lab2_span_yes.replace('{days}', weekendInSpan.join(joiner)) : t.lab2_span_no}
        </p>
        <p className={`text-sm font-bold ${unattended ? 'text-green-600 dark:text-green-400' : 'text-red-500 dark:text-red-400'}`}>
          {unattended
            ? t.lab2_unattended_yes.replace('{days}', weekendRuns.map(p => dayLabel(p.dt)).join(joiner))
            : t.lab2_unattended_no}
        </p>
        {bad > 0 && <p className="text-xs text-amber-600 dark:text-amber-400">{t.lab2_baddate.replace('{n}', bad)}</p>}
      </div>
    );
  }

  return (
    <div className="bg-white dark:bg-slate-800 rounded-xl p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-1">{t.lab2_title}</h3>
      <p className="text-sm text-slate-500 dark:text-slate-400 mb-2">{t.lab2_desc}</p>
      <p className="text-xs text-amber-600 dark:text-amber-400 mb-4 leading-relaxed">{t.lab2_hint}</p>
      <div className="space-y-3">
        {rows.map((r, i) => {
          const dt = hbParseDate(r.date);
          return (
            <div key={i} className="rounded-lg border border-slate-200 dark:border-slate-700 p-3">
              <div className="grid grid-cols-2 gap-2">
                <div>
                  <label className="block text-[11px] font-bold text-slate-500 mb-1">{t.lab2_col_label}</label>
                  <input className={inputCls} placeholder={t.lab2_label_ph} value={r.lbl || ''} onChange={e => upd(i, 'lbl', sanitizeText(e.target.value))} />
                </div>
                <div>
                  <label className="block text-[11px] font-bold text-slate-500 mb-1">{t.lab2_col_date}</label>
                  <input type="date" className={inputCls} value={r.date || ''} onChange={e => upd(i, 'date', e.target.value)} />
                </div>
                <div>
                  <label className="block text-[11px] font-bold text-slate-500 mb-1">{t.lab2_col_time}</label>
                  <input type="time" className={inputCls} value={r.time || ''} onChange={e => upd(i, 'time', e.target.value)} />
                </div>
                <div>
                  <label className="block text-[11px] font-bold text-slate-500 mb-1">{t.lab2_col_res}</label>
                  <select className={inputCls} value={String(r.res === undefined ? 3 : r.res)} onChange={e => upd(i, 'res', parseInt(e.target.value, 10))}>
                    {t.lab2_res_opts.map((o, oi) => <option key={oi} value={String(oi)}>{o}</option>)}
                  </select>
                </div>
              </div>
              <div className="mt-2">
                <label className="block text-[11px] font-bold text-slate-500 mb-1">{t.lab2_col_note}</label>
                <input className={inputCls} placeholder={t.lab2_note_ph} value={r.note || ''} onChange={e => upd(i, 'note', sanitizeText(e.target.value))} />
              </div>
              <div className="flex items-center justify-between gap-3 mt-2 flex-wrap">

                  {dt ? `${wdName(dt)}${isWeekend(dt) ? ' · ' + t.lab2_weekend_tag : ''}` : '—'}
                </span>

};

/* ---- Lab 3：復盤措辭檢查（T6 指責語句偵測的輕量版） ---- */
const LabBlameCheck = ({ lang, t, state, setState, onTouch }) => {
  const seed = (lg) => dict[lg].lab3_seed;
  const stored = state && typeof state.text === 'string' ? state.text : null;
  const pl = stored === null ? null : (['zh','en'].filter(lg => seed(lg) === stored)[0] || null);
  const text = stored === null ? seed(lang) : (pl && pl !== lang ? seed(lang) : stored);
  const set = (val) => { setState({ ...(state || {}), text: val }); onTouch && onTouch(); };
  const hits = detectBlame(text, lang);
  return (
    <div className="bg-white dark:bg-slate-800 rounded-xl p-6 border border-slate-200 dark:border-slate-700">
      <h3 className="font-serif font-bold text-lg text-[#004030] dark:text-[#D8C3A5] mb-1">{t.lab3_title}</h3>
      <p className="text-sm text-slate-500 dark:text-slate-400 mb-4">{t.lab3_desc}</p>
      <label className="block text-sm font-bold text-[#004030] dark:text-[#D8C3A5] mb-1">{t.lab3_label}</label>

          : hits.length === 0
            ? <p className="text-sm font-bold text-green-600 dark:text-green-400">{t.lab3_ok}</p>
            : <>
                <p className="text-sm font-bold text-red-500 dark:text-red-400">{t.lab3_hits.replace('{n}', hits.length)}</p>
                <div className="flex flex-wrap gap-2 mt-2">
                  {hits.map((h, i) => <span key={i} className="px-2 py-1 rounded bg-red-100 dark:bg-red-900/30 text-red-700 dark:text-red-300 text-xs font-mono">{h}</span>)}

      <div className="flex items-center gap-3 mt-3 flex-wrap">

};

/* ---- Lab 4：W16 驗收自評 ---- */
const LabAcceptance = ({ t, state, setState, onTouch }) => {
  const v = state || {};
  const items = t.lab4_items;
  const rateOf = (k) => { const r = v['r_' + k]; return r === undefined ? 0 : r; };
  const a = items.filter(it => rateOf(it.k) === 2).length;
  const b = items.filter(it => rateOf(it.k) === 1).length;
  const c = items.filter(it => rateOf(it.k) === 0).length;
  return (
    <div className="bg-white dark:bg-slate-800 rounded-xl p-6 border border-slate-200 dark:border-slate-700">

      <div className="space-y-4">
        {items.map(it => {

          return (
            <div key={it.k} className="rounded-lg border border-slate-200 dark:border-slate-700 p-3">
              <p className="font-bold text-sm text-[#004030] dark:text-[#D8C3A5]">{it.n}</p>
              <p className="text-xs text-slate-500 dark:text-slate-400 mt-1 mb-2 leading-relaxed">{it.hint}</p>

              <textarea rows={2} className={inputCls} placeholder={it.ph} value={v['ev_' + it.k] || ''}
                onChange={e => { setState({ ...v, ['ev_' + it.k]: sanitizeText(e.target.value) }); onTouch && onTouch(); }} />
              <div className="flex items-center gap-2 mt-2 flex-wrap">
                <span className="text-[11px] font-bold text-slate-500">{t.lab4_rate}</span>
                {t.lab4_rate_opts.map((o, oi) => (
                  <button key={oi} onClick={() => { setState({ ...v, ['r_' + it.k]: oi }); onTouch && onTouch(); }}
                    className={`px-3 py-1 text-xs rounded-full border transition ${r === oi
                      ? (oi === 2 ? 'bg-green-600 border-green-600 text-white' : oi === 1 ? 'bg-amber-500 border-amber-500 text-white' : 'bg-slate-500 border-slate-500 text-white')
                      : 'border-slate-300 dark:border-slate-600 text-slate-600 dark:text-slate-300'}`}>{o}</button>
                ))}
              </div>
            </div>
          );
        })}
      </div>
      <div className="mt-4 p-4 rounded-lg bg-slate-50 dark:bg-slate-900/50">
        <p className="font-bold text-[#004030] dark:text-[#D8C3A5]">{t.lab4_score.replace('{a}', a).replace('{b}', b).replace('{c}', c)}</p>
        <div className="mt-2 h-3 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden flex">
          <div className="h-full bg-green-500" style={{width: (a / items.length * 100) + '%'}}></div>
          <div className="h-full bg-amber-500" style={{width: (b / items.length * 100) + '%'}}></div>
        </div>
        <p className={`text-sm mt-3 ${c === 0 ? 'text-green-600 dark:text-green-400' : 'text-amber-600 dark:text-amber-400'}`}>
          {c === 0 ? t.lab4_done : t.lab4_warn.replace('{n}', c)}
        </p>
      </div>
      <div className="flex items-center gap-3 mt-3 flex-wrap">
        {Object.keys(v).length > 0 && <button onClick={() => { setState({}); onTouch && onTouch(); }} className="px-4 py-2 border border-slate-300 dark:border-slate-600 rounded-lg text-sm">{t.lab4_reset}</button>}
      </div>
    </div>
  );
};

/* ================= App ================= */
function App() {
  const LS_ANS = 'PMCS_W15_answers';
  const LS_ANA = 'PMCS_W15_analytics';
  const LS_STU = 'PMCS_W15_student';
  const LS_LAB = 'PMCS_W15_lab';
  const loadLS = (k, fb) => { try { const v = localStorage.getItem(k); return v ? JSON.parse(v) : fb; } catch { return fb; } };

  const [lang, setLang] = useState('en');
  const [isDark, setIsDark] = useState(true);
  const [module, setModule] = useState(0);
  const [menuOpen, setMenuOpen] = useState(false);
  const [ttsState, setTtsState] = useState('idle');
  const [answers, setAnswers] = useState(() => loadLS(LS_ANS, {}));
  const [focus, setFocus] = useState(() => loadLS(LS_ANS + '_focus', {}));
  const [memberCount, setMemberCount] = useState(() => loadLS(LS_ANS + '_mc', DEFAULT_MEMBERS));
  const [sdl, setSdl] = useState(() => loadLS(LS_ANS + '_sdl', null));
  const [lab, setLab] = useState(() => loadLS(LS_LAB, {}));
  const [labNonce, setLabNonce] = useState(0);
  const [studentInfo, setStudentInfo] = useState(() => loadLS(LS_STU, { group:'', dept:'', id:'', nameEn:'', nameZh:'', compiler:'' }));
  const [analytics, setAnalytics] = useState(() => loadLS(LS_ANA, {
    time: Array(TOTAL).fill(0), clicks: Array(TOTAL).fill(0),
    quizCorrect: Array(TOTAL).fill(0), quizTotal: Array(TOTAL).fill(0),
    cardsRead: Array(TOTAL).fill(0), cardsTotal: Array(TOTAL).fill(0), wrongTopics: {}
  }));
  const menuRef = useRef(null);
  const ttsRun = useRef(0);
  const t = dict[lang];

  useEffect(() => { document.documentElement.classList.toggle('dark', isDark); }, [isDark]);
  useEffect(() => { try { localStorage.setItem(LS_ANS, JSON.stringify(answers)); } catch {} }, [answers]);
  useEffect(() => { try { localStorage.setItem(LS_ANS + '_focus', JSON.stringify(focus)); } catch {} }, [focus]);
  useEffect(() => { try { localStorage.setItem(LS_ANS + '_mc', JSON.stringify(memberCount)); } catch {} }, [memberCount]);
  useEffect(() => { try { sdl ? localStorage.setItem(LS_ANS + '_sdl', JSON.stringify(sdl)) : localStorage.removeItem(LS_ANS + '_sdl'); } catch {} }, [sdl]);
  useEffect(() => { try { localStorage.setItem(LS_LAB, JSON.stringify(lab)); } catch {} }, [lab]);
  useEffect(() => { try { localStorage.setItem(LS_ANA, JSON.stringify(analytics)); } catch {} }, [analytics]);
  useEffect(() => { try { localStorage.setItem(LS_STU, JSON.stringify(studentInfo)); } catch {} }, [studentInfo]);
  useEffect(() => {
    const id = setInterval(() => setAnalytics(a => { const ti = [...a.time]; ti[module] += 5; return {...a, time: ti}; }), 5000);
    return () => clearInterval(id);
  }, [module]);
  useEffect(() => {
    const onDoc = e => { if (menuRef.current && !menuRef.current.contains(e.target)) setMenuOpen(false); };
    document.addEventListener('mousedown', onDoc);
    return () => document.removeEventListener('mousedown', onDoc);
  }, []);
  useEffect(() => { try { ttsRun.current += 1; speechSynthesis.cancel(); } catch (e) {} setTtsState('idle'); }, [module, lang]);

  const importSdl = (r) => {
    setSdl({ meta: r.meta, sections: r.sections });
    setStudentInfo(st => ({
      ...st,
      group: r.meta.group || st.group,
      id: (r.meta.student_id || st.id || '').replace(/[^0-9]/g, '').slice(0, 12),
      nameEn: /^[\x00-\x7F]+$/.test(r.meta.student || '') ? (r.meta.student || st.nameEn) : st.nameEn,
      nameZh: /^[\x00-\x7F]+$/.test(r.meta.student || '') ? st.nameZh : (r.meta.student || st.nameZh)
    }));
    if (r.meta.group) setA('g_group', r.meta.group);
    if (r.meta.date) setA('g_date', r.meta.date);
  };
  const sdlFileName = () => {
    if (!sdl) return '';
    const m = sdl.meta;
    const who = m.student || 'NA';
    return `${m.course || 'PMCS'}_${m.semester || SEMESTER_DEFAULT}${m.week || WEEK_CODE}_${(m.topic || TOPIC_CAMEL).replace(/\s+/g,'')}_${m.group || 'NA'}-${who}_${(m.date || '').replace(/-/g,'')}.md`;
  };
  const bump = () => setAnalytics(a => { const c = [...a.clicks]; c[module] += 1; return {...a, clicks: c}; });
  const setA = (id, val) => setAnswers(s => ({...s, [id]: val}));
  const setLabPart = (k) => (val) => setLab(s => ({...s, [k]: val}));
  const handleQuizSubmit = (mid, correct, total, wrong) => setAnalytics(a => {
    const qc = [...a.quizCorrect], qt = [...a.quizTotal];
    qc[mid] = correct; qt[mid] = total;
    return {...a, quizCorrect: qc, quizTotal: qt, wrongTopics: {...a.wrongTopics, [mid]: wrong || []}};
  });
  const handleCardRead = (mid, r, s, tot) => setAnalytics(a => {
    const cr = [...a.cardsRead], ct = [...a.cardsTotal]; cr[mid] = r; ct[mid] = tot;
    return {...a, cardsRead: cr, cardsTotal: ct};
  });

  const filled = id => { const v = answers[id]; return v !== undefined && String(v).trim() !== ''; };
  const sectionPct = n => { const c = CORE[n]; return c && c.length ? Math.round(c.filter(filled).length / c.length * 100) : 100; };
  const pctPersonal = Math.round(PERSONAL_SECTIONS.reduce((s,n) => s + sectionPct(n), 0) / PERSONAL_SECTIONS.length);
  const pctGroup = Math.round(GROUP_SECTIONS.reduce((s,n) => s + sectionPct(n), 0) / GROUP_SECTIONS.length);
  const optName = (list, v) => { const o = (list || []).find(x => x.v === v); return o ? o.name : (v || ''); };
  const checkName = (id, d) => { const c = (d || t).check_items.find(x => x.id === id); return c ? c.name : id; };
  const statusName = (v, d) => { const dd = d || t; return v === 'pass' ? dd.check_pass : v === 'fail' ? dd.check_fail : dd.check_unset; };

  const modulesList = [
    { id:0, num:'0', icon:'📋', title:t.m0_nav, kind:null },
    { id:1, num:'1', icon:'👥', title:t.m1_nav, kind:'G' },
    { id:2, num:'2', icon:'🚦', title:t.m2_nav, kind:'P' },
    { id:3, num:'3', icon:'🪞', title:t.m3_nav, kind:'P' },
    { id:4, num:'4', icon:'🗣️', title:t.m4_nav, kind:'P' },
    { id:5, num:'5', icon:'🔍', title:t.m5_nav, kind:'G' },
    { id:6, num:'6', icon:'📦', title:t.m6_nav, kind:'G' },
    { id:7, num:'7', icon:'🎤', title:t.m7_nav, kind:'G' },
    { id:IDX_LAB, num:String(IDX_LAB), icon:'⚡', title:t.mlab_nav, kind:null },
    { id:IDX_RES, num:String(IDX_RES), icon:'🌐', title:t.mres_nav, kind:null },
    { id:IDX_ANA, num:String(IDX_ANA), icon:'📊', title:t.analytics_title, kind:null }
  ];
  const go = m => { setModule(m); setMenuOpen(false); window.scrollTo({top:0,behavior:'smooth'}); };

  /* ---------- TTS ---------- */
  const handleTTS = (action) => {
    if (!('speechSynthesis' in window)) return;
    if (action === 'stop') { ttsRun.current += 1; speechSynthesis.cancel(); setTtsState('idle'); return; }
    if (action === 'pause') { speechSynthesis.pause(); setTtsState('paused'); return; }
    if (ttsState === 'paused') { speechSynthesis.resume(); setTtsState('playing'); return; }
    speechSynthesis.cancel();
    const sep = lang === 'zh' ? '。 ' : '. ';
    let texts = [];
    if (module === 0) {
      texts = [t.m0_title, t.m0_intro, t.m0_why, t.m0_why_desc, ...t.m0_stats.map(s => `${s.label}: ${s.val}`), ...t.m0_modules.map(m => `${m.title}. ${m.desc}`)];
    } else if (module >= 1 && module <= NUM_LEARN) {
      const k = `m${module}`;
      texts = [t[`${k}_title`], t[`${k}_overview`], ...(t[`${k}_highlights`]||[]), t[`${k}_deep`], t[`${k}_wrapup`]];
      if (module === 2) texts.push(...t.check_items.map(c => `${c.name}. ${c.desc}`), ...t.deliver_out.map(o => `${o.name}. ${o.sub}`), t.deliver_note, ...t.m2_terms.flatMap(x => [x.front, x.back]));
    } else if (module === IDX_LAB) {
      texts = [t.mlab_title, t.mlab_desc, t.lab1_title, t.lab1_desc, t.lab2_title, t.lab2_desc, t.lab3_title, t.lab3_desc, t.lab4_title, t.lab4_desc, t.lab5_title, t.lab5_desc];
    } else if (module === IDX_RES) {
      texts = [t.mres_title, t.mres_desc, ...t.res_req.map(r => `${r.label}. ${r.desc}`), ...t.res_opt.map(r => `${r.label}. ${r.desc}`)];
    } else {
      texts = [t.analytics_title, t.analytics_desc, `${t.analytics_pct_personal}: ${pctPersonal}%`, `${t.analytics_pct_group}: ${pctGroup}%`];
      const weak = [1,2,3,4,5,6,7].filter(n => sectionPct(n) < 100);
      if (weak.length) { texts.push(t.analytics_wp_tts_intro); weak.forEach(n => texts.push(t.analytics_wp_tts_module.replace('{name}', t[`m${n}_nav`]).replace('{acc}', sectionPct(n)))); }
      else texts.push(t.analytics_wp_tts_allpass);
    }
    texts = texts.filter(Boolean);
    /* 語音挑選：與課程既有 SPA 完全一致，不做任何更動 */
    const voices = speechSynthesis.getVoices();
    let voice = null, code = 'en-GB';
    if (lang === 'zh') {
      voice = voices.find(v=>v.lang==='zh-TW'&&v.name.includes('Yating')) || voices.find(v=>v.lang==='zh-TW') || voices.find(v=>v.lang.startsWith('zh')) || null;
      code = 'zh-TW';
    } else {
      voice = voices.find(v=>v.lang==='en-GB'&&(v.name.includes('Male')||v.name.includes('Daniel'))) || voices.find(v=>v.lang==='en-GB') || voices.find(v=>v.lang.startsWith('en')) || null;
      code = 'en-GB';
    }

    /* Chrome 對單一長 utterance 會靜默失敗（網路語音尤其明顯），因此切成短句依序播放 */
    const CHUNK = lang === 'zh' ? 140 : 190;
    const full = texts.join(sep);
    const sentences = (() => {
      const out = []; let cur = '';
      for (let i = 0; i < full.length; i++) {
        cur += full[i];
        const c = full[i];
        if ('。！？；!?;'.indexOf(c) >= 0 || (c === '.' && /\s|$/.test(full[i + 1] || ''))) { out.push(cur); cur = ''; }
      }
      if (cur.trim()) out.push(cur);
      return out;
    })();
    const packed = []; let acc = '';
    sentences.forEach(sent0 => {
      let sent = sent0;
      while (sent.length > CHUNK) {
        let cut = sent.lastIndexOf(' ', CHUNK);
        if (cut < CHUNK * 0.5) cut = CHUNK;
        if (acc) { packed.push(acc); acc = ''; }
        packed.push(sent.slice(0, cut));
        sent = sent.slice(cut);
      }
      if ((acc + sent).length > CHUNK) { if (acc) packed.push(acc); acc = sent; }
      else acc += sent;
    });
    if (acc.trim()) packed.push(acc);

    ttsRun.current += 1;
    const myRun = ttsRun.current;
    let qi = 0;
    const speakNext = () => {
      if (myRun !== ttsRun.current) return;
      if (qi >= packed.length) { setTtsState('idle'); return; }
      const u = new SpeechSynthesisUtterance(packed[qi++]);
      u.rate = 0.95;
      if (voice) u.voice = voice;
      u.lang = code;
      u.onend = speakNext;
      u.onerror = () => { if (myRun === ttsRun.current) speakNext(); };
      speechSynthesis.speak(u);
    };
    setTtsState('playing');
    setTimeout(speakNext, 60);
  };

  /* ---------- Export ---------- */
  const dstamp = () => { const d = new Date(), p = n => String(n).padStart(2,'0'); return `${d.getFullYear()}${p(d.getMonth()+1)}${p(d.getDate())}`; };
  const download = (content, filename, mime) => {
    const blob = new Blob([content], {type: mime}); const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(() => URL.revokeObjectURL(url), 1000);
  };
  const okPersonal = !!(studentInfo.nameEn || studentInfo.nameZh);
  const okGroup = !!(studentInfo.group && studentInfo.compiler);

  const exportPersonal = () => {
    if (!okPersonal) return;
    const L = [];
    L.push(`# PMCS W15 個人學習單 — ${dict.zh.subtitle}`);
    L.push('');
    L.push(`- 姓名：${studentInfo.nameEn} ${studentInfo.nameZh}　學號：${studentInfo.id}　系級：${studentInfo.dept}`);
    L.push(`- 必讀：T6 · CTRL 專案控制與交付（M7 交付段） https://lolopodcast.github.io/Project-Control-and-Delivery/ ／ 具高執行績效的專案管理實務（2/2）· 控制與交付`);
    L.push(`- 本週上課日即為全班 D day，本檔為現場作戰紀錄。`);
    L.push(`- 個人完成度：${pctPersonal}%`);
    if (sdl) L.push(`- 來源 SDL KB：${sdlFileName()}`);
    L.push('');
    L.push('## 2. D day 上線檢查');
    L.push('| 檢查項目 | 結果 | 查證結果 | 還差什麼／何時補上 |');
    L.push('|---|---|---|---|');
    CHECK_IDS.forEach(id => {
      const one = (v) => String(v || '').replace(/\r?\n/g, '<br>').replace(/\|/g, '／');
      L.push(`| ${checkName(id, dict.zh)} | ${statusName(answers['ck_' + id], dict.zh)} | ${one(answers['ev_' + id]) || '_(未填)_'} | ${one(answers['gap_' + id]) || '—'} |`);
    });
    L.push('');
    L.push('## 3. 個人復盤三問（主詞為事件或流程）');
    L.push(`- 做對的一件事：${answers.rt_right || '_(未填)_'}`);
    L.push(`- 做錯的一件事：${answers.rt_wrong || '_(未填)_'}`);
    L.push(`- 下一次會改的一件事：${answers.rt_next || '_(未填)_'}`);
    L.push('');
    L.push('## 4. 語言實驗室');
    L.push('| 詞彙 | 自己的話 | 例句 |'); L.push('|---|---|---|');
    [0,1,2,3,4].forEach(i => { if (filled(`t_term_${i}`)) L.push(`| ${answers[`t_term_${i}`]||''} | ${answers[`t_mean_${i}`]||''} | ${answers[`t_sent_${i}`]||''} |`); });
    L.push('');
    L.push('| 難發音 | 難在哪 | 記憶方法 |'); L.push('|---|---|---|');
    [0,1,2].forEach(i => { if (filled(`p_word_${i}`)) L.push(`| ${answers[`p_word_${i}`]||''} | ${answers[`p_hard_${i}`]||''} | ${answers[`p_tip_${i}`]||''} |`); });
    L.push(''); L.push('---');
    L.push('_本檔為個人學習歷程檔案，不繳交。可直接放進 repo 的 docs／資料夾當作 D day 的現場紀錄。_');
    const who = (sanitizeName(studentInfo.nameEn).replace(/\s+/g,'') || studentInfo.id || 'me').replace(/[^\w-]/g,'') || 'me';

          {modulesList.map(m => (
            <button key={m.id} onClick={() => go(m.id)}
              className={`w-full flex items-center gap-2 px-3 py-2.5 rounded-lg text-sm mb-1 transition ${module === m.id ? 'bg-[#004030]/10 dark:bg-[#D8C3A5]/10 text-[#004030] dark:text-[#D8C3A5] font-bold' : 'text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-800'}`}>
              <span className="ui-decoration shrink-0">{m.icon}</span>
              <span className="truncate text-left flex-1">{m.title}</span>
              {m.kind && <span className={`text-[10px] font-bold px-1 rounded shrink-0 ${m.kind === 'P' ? 'text-sky-700 dark:text-sky-300' : 'text-[#004030] dark:text-[#D8C3A5]'}`}>{m.kind}</span>}
            </button>
          ))}
          <div className="mt-6 px-3 space-y-3">
            <div>
              <p className="text-xs text-slate-400 mb-1">{t.analytics_pct_personal}</p>
              <div className="h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden"><div className={`h-full ${pctPersonal === 100 ? 'bg-green-500' : 'bg-sky-600 dark:bg-sky-400'}`} style={{width: pctPersonal + '%'}}></div></div>
              <p className="text-xs font-bold text-sky-700 dark:text-sky-300 mt-1">{pctPersonal}%</p>
            </div>
            <div>
              <p className="text-xs text-slate-400 mb-1">{t.analytics_pct_group}</p>
              <div className="h-2 rounded-full bg-slate-200 dark:bg-slate-700 overflow-hidden"><div className={`h-full ${pctGroup === 100 ? 'bg-green-500' : 'bg-[#004030] dark:bg-[#D8C3A5]'}`} style={{width: pctGroup + '%'}}></div></div>
              <p className="text-xs font-bold text-[#004030] dark:text-[#D8C3A5] mt-1">{pctGroup}%</p>
            </div>
          </div>
        </aside>

        <main className="flex-1 min-w-0 py-8 px-4 sm:px-6">
          <div key={`${module}-${lang}`} className="space-y-6 text-lg leading-relaxed text-slate-700 dark:text-slate-300 animate-fade-in">
            {module !== 0 && (
              <div>
                <H2 icon={cur.icon} number={cur.num}>{module <= NUM_LEARN ? t[`m${module}_title`] : module === IDX_LAB ? t.mlab_title : module === IDX_RES ? t.mres_title : t.analytics_title}</H2>
                {cur.kind && <Badge kind={cur.kind} t={t} />}
              </div>
            )}
            {body()}
            <div className="mt-12 flex justify-between items-center pt-8 border-t border-slate-300 dark:border-slate-700 no-print">
              <button onClick={() => go(Math.max(0, module-1))} disabled={module === 0}
                className="px-5 py-2.5 border border-slate-300 dark:border-slate-600 rounded-lg text-sm font-bold hover:bg-slate-100 dark:hover:bg-slate-800 disabled:opacity-0">← {t.nav_prev}</button>
              <button onClick={() => go(Math.min(TOTAL-1, module+1))} disabled={module === TOTAL-1}
                className="px-5 py-2.5 bg-[#004030] dark:bg-[#D8C3A5] text-white dark:text-[#004030] rounded-lg text-sm font-bold disabled:opacity-0">{t.nav_next} →</button>
            </div>
          </div>
        </main>
      </div>

      <footer className="h-8 bg-[#004030] flex items-center justify-between px-4 shrink-0">
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs truncate">{t.date} · {t.copyright}</span>
        <span className="text-[#D8C3A5]/60 text-[10px] sm:text-xs flex items-center gap-3 shrink-0">
          <span className="hidden sm:inline">{t.architect_label}&nbsp;<a href={t.architect_url} target="_blank" rel="noopener noreferrer" className="text-[#D8C3A5] hover:text-white underline">Prof. Shihmin Lo</a></span>
          <button onClick={() => window.scrollTo({top:0,behavior:'smooth'})} className="text-[#D8C3A5] hover:text-white font-bold">Top ↑</button>
        </span>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
